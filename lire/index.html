<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lire au collège</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbf5ee; --sun:#f7cc73; --sun-bright:#ffcf71; --card:#fff; --card-soft:#fafbfb;
  --ink-navy:#373e56; --sage:#5f706e; --chalkboard:#6b8174; --wood:#94614b; --clay:#b27560;
  --coral:#e67660; --peach:#f19f81; --blush:#f7e4d5;
  --font-display: ui-rounded, "Arial Rounded MT Bold", "Fredoka", system-ui, sans-serif;
  --font-text: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius-card:24px; --radius-panel:12px; --radius-badge:8px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--paper);color:var(--ink-navy);font:17px/1.55 var(--font-text);min-height:100vh;display:flex;flex-direction:column}
a{color:inherit}
em{font-style:italic}
:focus-visible{outline:3px solid var(--ink-navy);outline-offset:3px;border-radius:6px}
.wrap{width:100%;max-width:960px;margin:0 auto;padding:0 20px}

/* ---------- en-tête */
header.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:2px solid var(--blush)}
header.top .wrap{display:flex;align-items:center;gap:12px;min-height:60px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.brand{font-family:var(--font-display);font-weight:600;font-size:23px;text-decoration:none;letter-spacing:.2px;display:flex;align-items:center;gap:10px;margin-right:auto}
.brand .logo{width:34px;height:34px;flex:none}
nav.main{display:flex;gap:4px;flex-wrap:wrap}
nav.main a{text-decoration:none;font-weight:600;font-size:15px;padding:7px 12px;border-radius:999px;color:var(--ink-navy)}
nav.main a:hover{background:var(--blush)}
nav.main a[aria-current="page"]{background:var(--ink-navy);color:#fff}
.count{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--sun-bright);color:var(--ink-navy);font-size:12px;line-height:20px;text-align:center}
nav.main a[aria-current="page"] .count{background:#fff}

main{flex:1;padding:28px 0 40px}
.floor{height:0;margin-top:auto;position:relative}
.floor::before{content:"";position:absolute;left:0;right:0;top:-10px;height:10px;background:var(--wood)}
footer.foot{background:var(--sun);font-size:14px;padding:26px 0 26px}
footer.foot .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}

/* ---------- cartes */
.card{background:var(--card);border:4px solid var(--clay);border-radius:var(--radius-card);padding:28px 30px;margin:0 0 22px}
.card.soft{border-color:var(--ink-navy);border-width:3px;background:var(--card-soft)}
h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.2;margin:0 0 .5em}
h1{font-size:clamp(30px,5vw,44px)}
h2{font-size:clamp(24px,3.6vw,30px)}
h3{font-size:21px}
.sub{color:var(--sage);font-size:18px;margin:-6px 0 18px}
p{margin:0 0 .9em}

/* ---------- accueil */
.hero{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:30px;align-items:center;margin-bottom:26px}
.hero .ill{border:4px solid var(--clay);border-radius:var(--radius-card);overflow:hidden;background:var(--chalkboard);aspect-ratio:1448/2048}
.hero .ill img{width:100%;height:100%;object-fit:cover;display:block}
.hero h1{font-size:clamp(36px,6vw,58px);margin-bottom:.15em}
.hero .lead{font-size:20px;max-width:34em}
.ways{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.way{display:flex;gap:14px;align-items:flex-start;text-decoration:none;background:var(--card);border:3px solid var(--clay);border-radius:20px;padding:18px;transition:transform .12s, box-shadow .12s}
.way:hover{transform:translateY(-2px)}
.way .ico{flex:none;width:46px;height:46px;border-radius:14px;background:var(--blush);display:grid;place-items:center}
.way .ico svg{width:28px;height:28px;stroke:var(--ink-navy);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.way b{font-family:var(--font-display);font-weight:600;font-size:19px;display:block;margin-bottom:2px}
.way span{color:var(--sage);font-size:15px;line-height:1.4;display:block}
.way.main{background:var(--sun-bright);border-color:var(--ink-navy)}
.way.main span{color:var(--ink-navy)}
.way.main .ico{background:#fff}

/* ---------- chapitre */
.chap-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.badge{font-family:var(--font-display);font-weight:600;background:var(--chalkboard);color:#fff;border-radius:14px;padding:8px 16px;font-size:20px;line-height:1.2;border-bottom:5px solid var(--wood)}
.tag{display:inline-block;border:2px solid var(--sage);color:var(--sage);border-radius:999px;padding:1px 10px;font-size:13px;font-weight:700;letter-spacing:.2px;margin-right:6px}
.tag.simple{border-color:var(--ink-navy);color:var(--ink-navy);background:var(--sun-bright)}
.tag.classique{border-color:var(--ink-navy);color:var(--ink-navy);background:var(--blush)}
.text p{font-size:18px}
.text .dial{padding-left:2px}
.serie h2{margin-bottom:.1em}
.book{display:grid;grid-template-columns:150px 1fr;gap:24px;align-items:start;padding:18px 0;border-top:2px dashed var(--blush)}
.text>.book:first-child,.serie+.text .book:first-child{border-top:0;padding-top:0}
.book h2{margin-bottom:.1em}
.book .by{color:var(--sage);font-weight:600;margin-bottom:12px}
.book .resume p{font-size:17px}
.cover{width:150px;aspect-ratio:2/3;border-radius:6px;overflow:hidden;background:var(--blush);box-shadow:0 0 0 1px rgba(55,62,86,.15)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover.duo{display:flex;flex-direction:column;gap:8px;aspect-ratio:auto;background:none;box-shadow:none;overflow:visible}
.cover.duo .cover{width:150px}
.ph{width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:14px 12px 12px 20px;border-left:10px solid var(--clay);background:var(--blush);font-family:var(--font-display);font-weight:600;color:var(--ink-navy);font-size:15px;line-height:1.15;text-align:left;overflow:hidden}
.ph small{font-family:var(--font-text);font-weight:600;font-size:11px;color:var(--ink-navy);opacity:.85}
.ph.c1{border-left-color:var(--chalkboard)}.ph.c2{border-left-color:var(--wood)}.ph.c3{border-left-color:var(--coral)}.ph.c4{border-left-color:var(--sage)}
.save{display:inline-flex;align-items:center;gap:8px;margin-top:4px;font:600 15px var(--font-text);color:var(--ink-navy);background:#fff;border:2px solid var(--ink-navy);border-radius:999px;padding:7px 14px;cursor:pointer}
.save[aria-pressed="true"]{background:var(--ink-navy);color:#fff}
.save svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.save[aria-pressed="true"] svg{fill:currentColor}
.alerte{background:var(--blush);border-left:8px solid var(--coral);border-radius:var(--radius-panel);padding:14px 18px;margin:8px 0 16px;font-size:16px}
.alerte b{display:block;font-family:var(--font-display);font-weight:600;font-size:18px}
a.renvoi{display:inline-block;white-space:nowrap;text-decoration:none;font-weight:700;background:var(--sun-bright);border-radius:999px;padding:0 10px;margin-left:4px;border:2px solid var(--ink-navy);font-size:15px;line-height:1.6}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.choices .q{font-family:var(--font-display);font-weight:600;font-size:20px;margin:6px 0 2px}
a.choice{display:flex;align-items:center;justify-content:space-between;gap:14px;text-decoration:none;background:#fff;border:3px solid var(--ink-navy);border-radius:16px;padding:12px 16px;font-size:17px;font-weight:600;line-height:1.35;transition:background .12s}
a.choice:hover{background:var(--sun-bright)}
a.choice .to{flex:none;font-family:var(--font-display);font-size:14px;font-weight:600;color:var(--sage);white-space:nowrap}
a.choice:hover .to{color:var(--ink-navy)}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font:600 15px var(--font-text);color:var(--ink-navy);background:#fff;border:2px solid var(--ink-navy);border-radius:999px;padding:8px 16px;cursor:pointer}
.btn:hover{background:var(--blush)}
.btn.primary{background:var(--sun-bright)}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.trail{font-size:14px;color:var(--sage);margin:0 0 14px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.trail a{text-decoration:none;font-weight:700;color:var(--sage);padding:0 4px;border-radius:6px}
.trail a:hover{background:var(--blush);color:var(--ink-navy)}
.trail .now{color:var(--ink-navy);font-weight:700;padding:0 4px}

/* ---------- calcul */
fieldset{border:0;margin:0 0 22px;padding:0}
legend{font-family:var(--font-display);font-weight:600;font-size:21px;margin-bottom:10px;padding:0}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0}
.opt label{display:flex;justify-content:space-between;gap:10px;height:100%;cursor:pointer;background:#fff;border:3px solid var(--blush);border-radius:16px;padding:12px 14px;font-weight:600;font-size:16px;line-height:1.35}
.opt label .pts{flex:none;font-family:var(--font-display);color:var(--sage)}
.opt input:checked+label{border-color:var(--ink-navy);background:var(--sun-bright)}
.opt input:checked+label .pts{color:var(--ink-navy)}
.opt input:focus-visible+label{outline:3px solid var(--ink-navy);outline-offset:2px}
.result{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--paper);border-radius:16px;padding:16px 18px;font-size:18px}
.result .sum{font-family:var(--font-display);font-weight:600;font-size:28px}

.ill-wrap{margin:0}.ill-wrap figcaption{font-size:13px;color:var(--sage);margin-top:6px;text-align:center}
footer.foot a{color:inherit;font-weight:600}
.credits dt{font-family:var(--font-display);font-weight:600;font-size:19px;margin-top:18px}.credits dd{margin:4px 0 0}.credits ul{margin:6px 0 0;padding-left:20px}
.audio{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font:700 14px var(--font-text);color:var(--ink-navy);background:var(--blush);border:2px solid var(--ink-navy);border-radius:999px;padding:3px 12px 3px 9px;margin:0 0 12px}
.audio:hover{background:var(--sun-bright)}
.audio svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile{position:relative}.tile .casque{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;background:#fff;border:2px solid var(--ink-navy);display:grid;place-items:center}
.tile .casque svg{width:17px;height:17px;stroke:var(--ink-navy);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cartouches{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}.cartouches .audio{margin:0}
.tile .badges{position:absolute;top:6px;right:6px;display:flex;gap:4px}.tile .badges .casque{position:static}
.stack{position:relative;display:block;width:150px;padding:0;margin:6px 18px 10px 0;border:0;background:none;cursor:pointer;aspect-ratio:2/3}
.stack .layer{position:absolute;inset:0;transition:opacity .25s ease;border-radius:6px}
.stack .layer .cover{display:block;width:100%;height:100%;border-radius:6px;overflow:hidden}
.stack .l-book{z-index:2;transform:none;opacity:1}
.stack .l-bd{z-index:1;transform:translate(16px,-12px) rotate(5deg);opacity:.45;filter:saturate(.7)}
.stack.flip .l-bd{z-index:2;transform:none;opacity:1;filter:none}
.stack.flip .l-book{z-index:1;transform:translate(16px,-12px) rotate(5deg);opacity:.45;filter:saturate(.7)}
.stack .tag-bd{position:absolute;z-index:3;left:6px;bottom:6px;font:700 11px var(--font-text);background:#fff;color:var(--ink-navy);border:2px solid var(--ink-navy);border-radius:999px;padding:1px 7px;pointer-events:none}
.stack:not(.flip):hover .l-bd{opacity:.65}.stack.flip:hover .l-book{opacity:.65}
@keyframes versDevant{0%{transform:translate(16px,-12px) rotate(5deg);opacity:.45;filter:saturate(.7);z-index:1}
45%{transform:translate(-38%,10px) rotate(-9deg);opacity:1;filter:none;z-index:1}
55%{z-index:3}
100%{transform:none;opacity:1;filter:none;z-index:3}}
@keyframes versDerriere{0%{transform:none;opacity:1;filter:none;z-index:2}
45%{transform:translate(48%,-8px) rotate(11deg);opacity:1;z-index:2}
55%{z-index:0}
100%{transform:translate(16px,-12px) rotate(5deg);opacity:.45;filter:saturate(.7);z-index:0}}
.stack.moved.flip .l-bd,.stack.moved:not(.flip) .l-book{animation:versDevant .6s cubic-bezier(.3,.7,.3,1)}
.stack.moved.flip .l-book,.stack.moved:not(.flip) .l-bd{animation:versDerriere .6s cubic-bezier(.3,.7,.3,1)}
.stack .tag-bd{transition:transform .3s}.stack.moved .tag-bd{animation:pastille .6s}
@keyframes pastille{0%,40%{transform:scale(.6);opacity:0}70%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.stack.moved .layer,.stack.moved .tag-bd{animation:none!important}}
@media (prefers-reduced-motion:reduce){.stack .layer{transition:none}}
/* ---------- catalogue */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px}
.search{flex:1 1 260px;font:17px var(--font-text);color:var(--ink-navy);padding:11px 16px;border:3px solid var(--ink-navy);border-radius:999px;background:#fff}
.chip{font:600 15px var(--font-text);color:var(--ink-navy);background:#fff;border:2px solid var(--ink-navy);border-radius:999px;padding:7px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink-navy);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 18px}
.tile{text-decoration:none;display:flex;flex-direction:column;gap:8px}
.tile .cover{width:100%;transition:transform .12s}
.tile:hover .cover{transform:translateY(-3px)}
.tile .t{font-weight:700;font-size:15px;line-height:1.25}
.tile .t em{font-style:italic}
.tile .a{font-size:13px;color:var(--sage);line-height:1.3}
.tile .n{font-family:var(--font-display);font-size:13px;color:var(--sage)}
.empty{color:var(--sage);font-size:18px;padding:30px 0;text-align:center}
.note{color:var(--sage);font-size:15px}
ul.list{list-style:none;padding:0;margin:0}
ul.list li{display:flex;gap:16px;align-items:center;padding:12px 0;border-top:2px dashed var(--blush)}
ul.list li:first-child{border-top:0}
ul.list .cover{width:64px;flex:none}
ul.list .ph{border-left-width:6px;padding:0}ul.list .ph span,ul.list .ph small{display:none}
ul.list .info{flex:1}
ul.list .info a{text-decoration:none;font-weight:700}
.x{background:none;border:0;cursor:pointer;color:var(--sage);font:600 14px var(--font-text);padding:6px 8px;border-radius:8px}
.x:hover{background:var(--blush);color:var(--ink-navy)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink-navy);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}

@media (max-width:700px){
  .hero .ill-wrap{max-width:220px;margin:0 auto}
  .hero .ill{max-width:none}
  body{font-size:16px}
  .card{padding:20px 18px;border-width:3px}
  .hero{grid-template-columns:1fr}
  .hero .ill{max-width:220px;margin:0 auto;aspect-ratio:3/4}
  .book{grid-template-columns:1fr;gap:14px}
  .book>.cover,.cover.duo .cover{width:120px}
  .cover.duo{flex-direction:row}
  .text p{font-size:17px}
  nav.main a{padding:6px 9px;font-size:14px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:18px 14px}
}
@media print{header.top,.floor,footer.foot,.tools,.save{display:none}body{background:#fff}.card{border-width:2px}}
</style>
</head>

  <div class="wrap">

    </a>

</header>

<script>
const DATA = {"chapters":{"0":[{"k":"p","h":"— Je t’ai longtemps observé déambuler dans les rayonnages. Cherches-tu un livre en particulier ?"},{"k":"p","h":"— Non… enfin… je cherche un livre qui me plaise… mais je suis déçu à chaque fois que je pioche un livre au hasard dans une étagère. C’est frustrant de savoir qu’il y a probablement des dizaines d’histoires qui peuvent me bouleverser et que je ne les lirai peut-être jamais…"},{"k":"p","h":"— Je vois ce que tu veux dire, c’est comme chercher une aiguille dans une botte de foin. Mais si tu as quelques minutes à me consacrer… nous pouvons chercher ensemble."},{"k":"p","h":"Que vas-tu répondre ?"},{"k":"choix","l":"« Je suis prêt à tenter l’expérience »","to":25},{"k":"choix","l":"« C’est-à-dire… en fait… j’aime pas trop lire »","to":43},{"k":"choix","l":"« Comment savoir si le livre que vous allez me conseiller va me plaire ? »","to":64},{"k":"choix","l":"« Vous m’intriguez… Expliquez-moi votre méthode pour me conseiller un livre »","to":6}],"1":[{"k":"livre","b":{"isbn":["9782278091843"],"p":["Le héros de cette histoire est un retraité qui coule des jours heureux dans sa maisonnette. Jusqu’au jour où son jardin, situé au-dessus d’un trafic aérien de cigognes, se retrouve envahi par… 226 bébés ! Adieu, calme et tranquillité. Ni une ni deux, il les installe dans une charrette et commence son périple. De village en bourgade, tous les moyens sont bons pour refourguer la marmaille : vente à la criée sur les marchés, adoptions par des princesses esseulées…"],"t":"226 bébés","a":"Flore Vesco"}}],"2":[{"k":"livre","b":{"isbn":["9782070630431"],"p":["Paris, 1934. Devant Notre-Dame une poursuite s’engage au milieu de la foule. Le jeune Vango doit fuir. Fuir la police qui l’accuse d’un crime qu’il ne connaît pas, fuir les forces mystérieuses qui le traquent. Vango ne sait pas qui il est. Son passé cache de lourds secrets. Des îles siciliennes aux brouillards de l’Écosse, tandis qu’enfle le bruit de la guerre, Vango cherche sa vérité."],"t":"Vango","a":"Timothée de Fombelle"}},{"k":"choix","l":"Pour découvrir un autre roman susceptible de te plaire","to":400}],"3":[{"k":"livre","b":{"isbn":["9782253937432"],"p":["Ce livre est composé à partir du journal intime tenu par Anne Frank, une jeune fille juive allemande exilée aux Pays-Bas, lorsqu’elle se cache à Amsterdam pendant deux ans avec sa famille et quatre amis, au cours de l’occupation des Pays-Bas par l’Allemagne nazie."],"t":"Le journal d’Anne Frank","a":"Anne Frank"}},{"k":"choix","l":"Pour découvrir un autre récit de vie","to":190}],"4":[{"k":"choix","l":"Si tu veux découvrir un livre engagé sur le thème de l’égalité filles-garçons","to":212},{"k":"choix","l":"Si tu veux un livre simple et engagé qui parle de la guerre et de l’exil","to":41},{"k":"choix","l":"Pour un livre simple et engagé sur l’apparition d’un régime politique extrême","to":233},{"k":"choix","l":"Pour découvrir un livre simple et engagé sur le thème du racisme","to":111}],"5":[{"k":"livre","b":{"isbn":["9782016265321"],"p":["Clay reçoit treize cassettes enregistrées par Hannah Baker avant qu’elle ne se suicide. Elle y parle de treize personnes qui sont impliquées dans sa vie : amies ou ennemies, chacune de ces personnes a compté dans sa décision. D’abord choqué, Clay écoute les cassettes en cheminant dans la ville. Puis, il se laisse porter par la voix d’Hannah. Hannah en colère, Hannah heureuse, Hannah blessée et peut-être amoureuse de lui. C’est une jeune fille plus vivante que jamais que découvre Clay. Une fille qui lui dit à l’oreille que la vie est dans les détails. Une phrase, un sourire, une méchanceté ou un baiser et tout peut basculer…"],"t":"Treize raisons","a":"Jay Asher"}}],"6":[{"k":"p","h":"Le guide que tu as entre les mains peut être utilisé de plusieurs manières différentes !"},{"k":"p","h":"La première ressemble assez au jeu « Qui est-ce ? ». Je te pose une question, tu y réponds, ce qui me permet d’éliminer certaines réponses. Puis, on répète l’opération jusqu’à ce que l’on trouve le livre qui correspond à tous tes critères. Pour tenter l’expérience, <a class=\"renvoi\" href=\"#c25\">→ Chapitre 25<\/a>"},{"k":"p","h":"Si tu es matheux, tu peux tester la deuxième méthode : le calcul. <a class=\"renvoi\" href=\"#c47\">→ Chapitre 47<\/a>"},{"k":"p","h":"La troisième méthode est très classique : une liste de thèmes. <a class=\"renvoi\" href=\"#c132\">→ Chapitre 132<\/a>"},{"k":"p","h":"La quatrième méthode te permet de filtrer mes recommandations en fonction du niveau de difficulté du roman <a class=\"renvoi\" href=\"#c93\">→ Chapitre 93<\/a>"},{"k":"p","h":"La cinquième méthode te permet de filtrer mes recommandations en fonction du type d’œuvre que tu souhaites lire : poésie, nouvelles, contes, etc. <a class=\"renvoi\" href=\"#c23\">→ Chapitre 23<\/a>"},{"k":"p","h":"Enfin, la sixième et dernière manière d’utiliser ce guide est de le feuilleter au petit bonheur la chance… La majorité des chapitres sont des petits textes pour te présenter une œuvre de littérature jeunesse, tu finiras bien par accrocher sur un titre ou un résumé."}],"7":[{"k":"livre","b":{"isbn":["9782266293730"],"p":["Ils sont six filles et six garçons, dans les deux compartiments séparés d’un même vaisseau spatial. Ils ont six minutes chaque semaine pour se séduire et se choisir, sous l’œil des caméras embarquées. Ils sont les prétendants du programme Genesis, l’émission de speed-dating la plus folle de l’Histoire, destinée à créer la première colonie humaine sur Mars."],"t":"Phobos","a":"Victor Dixen"}}],"8":[{"k":"p","h":"Essayons d’en savoir un peu plus sur le héros du livre que je dois te conseiller… De quelle manière souhaites-tu qu’il apprenne à canaliser ses pouvoirs ?"},{"k":"choix","l":"« Il va dans une école pour apprendre à utiliser ses pouvoirs »","to":302},{"k":"choix","l":"« Il a un mentor ou un tuteur pour le guider »","to":184},{"k":"choix","l":"« Il apprend à maîtriser ses pouvoirs grâce à ses amis »","to":313},{"k":"choix","l":"« Il est livré à lui-même et doit apprendre seul »","to":240}],"9":[{"k":"livre","b":{"isbn":["9782080252401"],"p":["En 1932, Max Eisenstein, juif américain, et Martin Schulse, sont amis de longue date et marchands de tableaux en Californie. Leur affaire marche bien et quand Martin décide de rentrer en Allemagne avec sa femme et ses trois garçons, Max ne peut que l’encourager tout en pleurant sa solitude. Leur correspondance commence alors et tandis que Martin découvre une Allemagne appauvrie et désabusée, Max, lui, s’inquiète de la montée du nazisme. Mais emporté par l’aveuglement patriotique, Martin ne fait qu’approuver la politique hitlérienne et refuse même son aide à Griselle, la sœur de Max, qui meurt sous ses yeux. Max met alors en place un plan machiavélique pour se venger…"],"t":"Inconnu à cette adresse","a":"Kathrine Kressmann Taylor"}},{"k":"choix","l":"Pour découvrir un autre texte susceptible de te plaire","to":124}],"10":[{"k":"livre","b":{"isbn":["9782747080569"],"p":["Tom est le « septième fils d’un septième fils » et possède un don particulier… Il a donc les qualités requises pour devenir l’apprenti de l’Épouvanteur. À treize ans, apprendre à chasser sorcières, gobelins, spectres et autres esprits malfaisants lui paraît autrement excitant que de soigner les cochons et épandre le fumier. Tom entame donc son apprentissage auprès de l’Épouvanteur, qui le teste dès la première nuit en l’enfermant, tout seul, dans une maison hantée… Mais le pire reste à venir."],"t":"L’Apprenti épouvanteur","a":"Joseph Delaney"}},{"k":"choix","l":"Pour découvrir un autre roman susceptible de te plaire","to":176}],"11":[{"k":"livre","b":{"isbn":["9782226436863"],"p":["Coraline vient d’emménager et explore sa nouvelle maison. Un étrange manoir qu’elle et ses parents partagent avec des voisins peu communs : deux anciennes actrices et un vieux toqué, éleveur de souris savantes. C’est alors qu’elle découvre une porte condamnée… derrière, une chose, qui dit être son autre mère, va tout faire pour la garder près d’elle."],"t":"Coraline","a":"Neil Gaiman"}},{"k":"choix","l":"Si tu veux découvrir un autre roman susceptible de te plaire","to":130},{"k":"choix","l":"Si tu veux découvrir un recueil de nouvelles horrifiques","to":42}],"12":[{"k":"livre","b":{"isbn":["9782017240242"],"p":["Tess, une jeune fille de 16 ans, a le don de voir les morts. Durant ses vacances avec son cousin Gabin, elle découvre un objet mystérieux qui décuple son pouvoir, la rendant capable de voir les souvenirs de ses ancêtres. Tess comprend que ses aïeuls essaient de lui transmettre un message concernant la malédiction qui fait mourir tous les hommes de sa famille à 33 ans."],"t":"Derrière toi : La malédiction des 33","a":"Évelyne Brisou-Pellen"}}],"13":[{"k":"livre","b":{"isbn":["9782266296045"],"p":["Alors qu’il rend visite à son ami peintre Basil Hallward, Lord Henry rencontre le jeune Dorian Gray. Emerveillé par sa jeune beauté et sa naïveté, il se lie rapidement d’amitié avec lui et dit, en plaisantant, qu’une fois le portrait terminé, seul celui-ci gardera à jamais cette beauté tandis que Dorian vieillira peu à peu. Le jeune homme déclare alors qu’il donnerait son âme pour que ce portrait vieillisse à sa place. À ces mots, tous rirent… sur le moment."],"t":"Le portrait de Dorian Gray","a":"Oscar Wilde"}}],"14":[{"k":"livre","b":{"isbn":["9782253149118"],"p":["Sur une île au large de Cherbourg, un vieil homme et une jeune femme vivent isolés, entourés de serviteurs et de gardes du corps, à l’abri de tout reflet ; en aucun cas Hazel ne doit voir son propre visage ! Engagée pour soigner la jeune femme, Françoise, une infirmière, va découvrir pourquoi Hazel se résigne à cette vie et aux caresses du vieillard. Elle comprendra au prix de quelle implacable machination ce dernier assouvit son amour fou !"],"t":"Mercure","a":"Amélie Nothomb"}}],"15":[{"k":"livre","b":{"isbn":["9782010120329"],"p":["Victor Frankenstein est un médecin fasciné par la vie et par la Création. Il décide de créer à son tour une créature vivante et de l’animer, afin d’essayer de comprendre comment fonctionne la vie et comment elle a été créée. Horrifié par le monstre qu’il vient de créer, il préfère l’abandonner… La créature, livrée à elle-même, comprend rapidement qu’il lui sera impossible de mener une existence normale et décide de poursuivre son créateur."],"t":"Frankenstein","a":"Mary Shelley"}},{"k":"choix","l":"Pour découvrir un roman jeunesse susceptible de te plaire","to":324}],"16":[{"k":"p","h":"Voyons voir… quel genre littéraire t’attire le plus ? Que peux-tu me dire du livre que tu recherches ?"},{"k":"choix","l":"« J’aimerais un livre d’aventure »","to":62},{"k":"choix","l":"« Je cherche un roman historique »","to":82},{"k":"choix","l":"« J’aimerais un roman policier »","to":138},{"k":"choix","l":"« J’aimerais un livre qui me fasse rire »","to":61},{"k":"choix","l":"« Une histoire d’amour »","to":202},{"k":"choix","l":"« Un drame ou une histoire triste »","to":116}],"17":[{"k":"livre","b":{"isbn":["9782075155441"],"p":["Jefferson est un jeune hérisson à la vie tranquille, partagée entre des activités innocentes et un meilleur ami, le cochon Gilbert. Un matin, il se rend chez le coiffeur et découvre ce dernier froidement assassiné. Jefferson est très vite accusé et décide de fuir pour mieux prouver son innocence. Gilbert et lui profitent alors d’un voyage organisé et se rendent chez les humains afin de mener leur enquête."],"t":"Jefferson","a":"Jean-Claude Mourlevat"}}],"18":[{"k":"p","h":"La réécriture de quel conte ?"},{"k":"choix","l":"« Le joueur de flûte de Hamelin »","to":335},{"k":"choix","l":"« Cendrillon »","to":271},{"k":"choix","l":"« Pinocchio »","to":325},{"k":"choix","l":"« Le Petit Poucet »","to":255},{"k":"choix","l":"« Un mashup de plusieurs contes »","to":153}],"19":[{"k":"livre","b":{"isbn":["9782011694775"],"p":["Tamango est un guerrier d’Afrique de l’ouest, il a pour habitude d’échanger des gens de son peuple contre de l’alcool et des armes. Le capitaine Ledoux, un ancien aide-timonier, qui a combattu aussi lors de la bataille de Trafalgar où il s’est fait amputer de la main gauche, vient pour la dernière fois de sa carrière chercher de précieux esclaves. La vente commence, mais sous l’effet de la colère et surtout de l’alcool, Tamango vend Ayché, sa femme, au négrier. Le lendemain, il réalise son erreur. Fou de douleur, il tente alors de rattraper le navire sur lequel sa femme a été embarquée. Lorsqu’il y parvient, il tombe entre les mains du capitaine Ledoux qui le réduit en esclavage."],"t":"Tamango","a":"Prosper Mérimée"}}],"20":[{"k":"p","h":"Les ouvrages ayant des animaux comme protagonistes sont légion ! Essayons de faire un peu de tri… Que peux-tu me dire du livre que tu recherches ?"},{"k":"choix","l":"« J’aimerais un recueil de contes où les animaux ont la part belle »","to":391},{"k":"choix","l":"« J’aimerais découvrir les aventures d’un animal qui se comporte comme un humain »","to":174},{"k":"choix","l":"« Un roman qui me fera réfléchir sur notre société »","to":158},{"k":"choix","l":"« Un roman épique avec des conflits homériques… mais où les héros sont des animaux »","to":110},{"k":"choix","l":"« J’aimerais un roman plus réaliste, où les animaux sont des animaux »","to":90}],"21":[{"k":"livre","b":{"isbn":["9782070601578"],"p":["Le métier de visseur de capuchons de tubes de dentifrice ne permettait pas à Mr Bucket de subvenir aux besoins de sa nombreuse famille : Mrs Bucket son épouse, grand-maman Joséphine et grand-papa Joe, grand-papa Georges et grand-maman Georgina. Sans oublier son fils Charlie dont le rêve le plus fou était de manger du chocolat ! Aussi, quelle ne fut pas l’émotion du jeune garçon en apprenant que Willy Wonka invitera dans sa merveilleuse chocolaterie les enfants qui découvriront les tickets d’or cachés dans les tablettes de chocolat Wonka…"],"t":"Charlie et la chocolaterie","a":"Roald Dahl"}}],"22":[{"k":"livre","b":{"isbn":["9782010023606"],"p":["En 177, pendant le règne de Marc Aurèle, une jeune fille de quinze ans arrive à Lyon. C’est le début de la persécution contre les chrétiens qui refusent le polythéisme et vénèrent un dieu unique. Toutilla est une de ces croyants persécutés. Son seul soutien est son amoureux, gladiateur et champion de course de chars ! Mais peut-elle lui faire confiance ?"],"t":"Le serment des catacombes","a":"Odile Weulersse"}},{"k":"choix","l":"Pour un roman, narrant la guerre entre Rome et sa rivale Carthage","to":196},{"k":"choix","l":"Pour une histoire se déroulant à Pompéi juste avant l’explosion du Vésuve","to":372}],"23":[{"k":"p","h":"Ce guide a été pensé pour promouvoir des romans jeunesse. Les mangas et les BD sont les grands absents de cet ouvrage… peut-être que je leur consacrerai un tome 2 ? Quoi qu’il en soit, dans ce guide, il y a bien des livres qui ne sont pas des romans à proprement parler. Par exemple :"},{"k":"choix","l":"Des recueils de nouvelles","to":78},{"k":"choix","l":"Ma sélection de contes","to":109},{"k":"choix","l":"Des œuvres poétiques","to":187},{"k":"choix","l":"Des biographies","to":100},{"k":"choix","l":"Des livres dont tu es le héros, pour être l’acteur de ta lecture","to":32},{"k":"choix","l":"Aucune de ces propositions ne me convient","to":25}],"24":[{"k":"livre","b":{"isbn":["9782075187343"],"p":["Timoti porte un nom de shampooing, écrit des poèmes et vit seul avec son père qui ne répond jamais à ses questions. Jusqu’à ce matin d’été où une fille drôlement espiègle surgit à sa fenêtre. Mais qui est cette inconnue qui adore grimper aux arbres et qui lui donne rendez-vous à minuit ?"],"t":"Les filles montent pas si haut d’habitude","a":"Alice Butaud"}},{"k":"choix","l":"Pour découvrir un autre roman susceptible de te plaire","to":323}],"25":[{"k":"p","h":"Je vais te poser plusieurs questions qui me permettront de mieux connaître tes goûts. Quand nous aurons terminé, je te proposerai quelques livres susceptibles de te plaire. Ce n’est pas une science exacte… et je ne fais que des propositions… tu es libre de lire ce roman ou d’en choisir un autre. Je ne me vexerai pas :)"},{"k":"p","h":"Quoi qu’il arrive, va chercher le livre que je te conseillerai et prends le temps de lire quelques pages. C’est le seul moyen de savoir si le livre te plaît."},{"k":"p","h":"Commençons ! Souhaites-tu que je te propose un livre qui se passe dans un monde imaginaire ou dans le monde réel ?"},{"k":"p","h":"Que vas-tu répondre ?"},{"k":"choix","l":"« J’aimerais mieux un monde imaginaire peuplé de dragons et de fantômes. Ou alors une aventure dans un futur lointain qui se passe à bord d’un vaisseau spatial… »","to":84},{"k":"choix","l":"« J’aime imaginer que ce que je lis est vrai alors pouvez-vous me proposer une histoire qui se passe dans le monde réel ou du moins qui ressemble au nôtre ? »","to":76}],"26":[{"k":"livre","b":{"isbn":["9782070661831"],"p":["Une terrible guerre divise les royaumes du monde de Pyrrhia. Selon une mystérieuse prophétie, seuls cinq jeunes dragons nés lors de la Nuit-la-plus-Claire pourront mettre fin aux combats et apporter la paix. Mais les élus, Argil, Tsunami, Gloria, Comète et Sunny, rêvent de voler de leurs propres ailes plutôt que d’accomplir leur destin…"],"t":"Les royaumes de feu","a":"Tui T. Sutherland"}}],"27":[{"k":"livre","b":{"isbn":["9782211233682"],"p":["Quatre amis partagent un catalogue de vente par correspondance, trois dollars à dépenser et un grand désir de découvrir le monde. Et quand, au lieu du revolver qu’ils ont commandé arrive une vieille montre qui ne fonctionne même pas, ils n’hésitent pas une seconde et partent vers Chicago pour récupérer leur revolver. Au cours de leur voyage, ils rencontreront des tricheurs professionnels, des flics véreux, des méchants qui semblent gentils et des gentils qui ne le sont pas du tout… un crime non résolu et beaucoup, beaucoup d’argent…"],"t":"Le célèbre catalogue Walker et Dawn","a":"Davide Morosinotto"}},{"k":"choix","l":"Pour découvrir les aventures d’un groupe de sœurs","to":252},{"k":"choix","l":"Pour découvrir les aventures d’un groupe de garçons","to":142}],"28":[{"k":"p","h":"Voici ma sélection de romans qui traitent des relations parents-enfants. Quel genre de livre souhaites-tu lire ?"},{"k":"choix","l":"Une lecture facile et drôle","to":51},{"k":"choix","l":"Un roman avec un parent vraiment méchant","to":349},{"k":"choix","l":"Un parent qui n’accepte pas son enfant comme il est","to":294},{"k":"choix","l":"Un parent qui cherche à contrôler la vie de son enfant","to":96},{"k":"choix","l":"Des parents qui divorcent, une famille qui éclate","to":393},{"k":"choix","l":"Un roman où l’enfant déterre un secret de famille","to":275},{"k":"choix","l":"Un roman où l’enfant doute des sentiments de ses parents","to":402}],"29":[{"k":"livre","b":{"isbn":["9788412201857"],"p":["Un météore écrasé près de Londres s’avère être une construction extraterrestre qui un jour se transforme en une machine de guerre gigantesque. La terre est envahie et dévastée par des créatures impitoyables. L’humanité survivra-t-elle ?"],"t":"La guerre des mondes","a":"H.G. Wells"}}],"30":[{"k":"livre","b":{"isbn":["9782253012696"],"p":["Phileas Fogg, gentleman anglais, parie avec les membres de son club qu’il fera le tour de la terre en 80 jours. Le soir même, il prépare ses bagages et commence son voyage en compagnie de son domestique Parisien. Il devra être revenu à Londres, pour gagner, le samedi 21 décembre 1872 à 20 heures 45 minutes ! Soupçonné d’être l’audacieux voleur qui a cambriolé la Banque d’Angleterre, Phileas Fogg va être filé tout au long de ses pérégrinations par le détective Fix qui mettra tout en œuvre pour le capturer."],"t":"Le tour du monde en 80 jours","a":"Jules Verne"}}],"31":[{"k":"livre","b":{"isbn":["9782266200462"],"p":["L’histoire se passe en un temps où les jeux télévisés n’existaient pas, ni les grandes surfaces, ni même les téléphones portables. Tomek, jeune orphelin de 13 ans, tient la petite épicerie de son village. Un soir, une mystérieuse jeune fille prénommée Hannah, entre dans sa boutique et lui demande s’il vend de l’eau de la Rivière Qjar : « C’est l’eau qui empêche de mourir, vous ne le saviez pas ? » Tomek lui répond qu’il ne connaît pas cette eau et la jeune fille s’en va. Tomek décide alors d’entamer la plus grande aventure de sa vie. Il traversera des contrées incroyables : la Forêt de l’Oubli, le village des Parfumeurs, l’île Inexistante… Réussira-t-il à rattraper Hannah ? Trouvera-t-il la Rivière Qjar, cette rivière magique qui coule à l’envers ?"],"t":"La rivière à l’envers","a":"Jean-Claude Mourlevat"}},{"k":"choix","l":"Si tu veux découvrir une autre œuvre onirique facile à lire","to":101}],"32":[{"k":"livre","b":{"isbn":["9782075168694"],"p":["Les monstres ont attaqué le Monastère dans lequel de jeunes prodiges tels que vous, sont initiés à l’art de la guerre. Vous êtes le seul survivant de la bataille, et une mission vitale vous incombe désormais : avertir le Roi du Summerlund que les Maîtres des Ténèbres ont décimé l’élite guerrière du pays.","Ce livre est le premier tome d’une fresque épique dont tu es le héros ! Les « Livres dont vous êtes le héros » sont des romans interactifs où le déroulement de l’histoire dépend des choix du lecteur. Tu l’auras compris, le guide que tu as entre les mains en est un :) Si le concept des livres dont tu es le héros ou l’héroïne t’intéresse, voici une petite liste d’autres livres :"],"t":"Les Maîtres des ténèbres","a":"Joe Dever"}},{"k":"choix","l":"Pour vivre une aventure d’heroic fantasy dans un open world de papier","to":262},{"k":"choix","l":"Pour incarner une servante qui doit survivre aux intrigues de la cité interdite","to":298},{"k":"choix","l":"Si tu veux découvrir une histoire effrayante","to":145}],"33":[{"k":"livre","b":{"isbn":["9782012043428"],"p":["Bastien, un garçon de dix ans, déroba un jour un livre ancien et mystérieux. Ce livre n’était pas comme les autres… Il y était question d’un pays fantastique où vivaient une toute petite impératrice, des elfes, des monstres, un garçon à la peau verte… Un pays menacé de mort et rongé par un mal étrange…"],"t":"L’histoire sans fin","a":"Michael Ende"}},{"k":"choix","l":"Si tu cherches une autre œuvre onirique susceptible de te plaire","to":31}],"34":[{"k":"livre","b":{"isbn":["9782070650644"],"p":["Robinson, parti faire fortune en Amérique du Sud échoue, au gré d’un naufrage, sur une île déserte. Il tente de survivre à une nature hostile en déployant des trésors d’ingéniosité. Mais son existence solitaire bascule le jour où un autre être humain fait son apparition sur l’île : Vendredi, le sauvage…"],"t":"Vendredi ou la vie sauvage","a":"Michel Tournier"}},{"k":"choix","l":"Si tu préfères découvrir l’histoire d’un autre naufragé","to":183}],"35":[{"k":"livre","b":{"isbn":["9782075139106"],"p":["L’histoire se passe en 1786. Le jour où son petit frère disparaît, Alma part sur ses traces, loin de sa famille et de la vallée d’Afrique qui les protégeait du reste du monde. Au même moment, dans le port de Lisbonne, Joseph Mars se glisse clandestinement à bord d’un navire de traite. Il est à la recherche d’un immense trésor. Dans le tourbillon de l’Atlantique, entre l’Afrique, l’Europe et les Caraïbes, leurs quêtes et leurs destins les mènent irrésistiblement l’un vers l’autre."],"t":"Alma","a":"Timothée de Fombelle"}},{"k":"choix","l":"Si tu veux découvrir un autre roman jeunesse susceptible de te plaire","to":303},{"k":"choix","l":"Si tu veux découvrir une œuvre de la littérature classique","to":19}],"36":[{"k":"p","h":"Peux-tu préciser ta pensée ?"},{"k":"choix","l":"« J’aimerais que le héros du livre soit un animal »","to":90},{"k":"choix","l":"« Si ce n’est pas un enfant… c’est donc un adulte »","to":85},{"k":"choix","l":"« Et pourquoi pas une personne âgée ! »","to":214}],"37":[{"k":"livre","b":{"isbn":["9782075196871"],"p":["Jack est très attaché à son cochon en peluche. Ils ont tout vécu ensemble, les bons comme les mauvais moments. Jusqu’à cette veille de Noël où arrive la catastrophe : le cochon est perdu ! Mais la nuit de Noël n’est pas une nuit comme les autres : c’est celle des miracles et des causes perdues, où même les jouets peuvent prendre vie. Alors, Jack et le Cochon de Noël - une peluche de remplacement un peu agaçante - embarquent pour une aventure magique et périlleuse au pays des Choses perdues. Jusqu’où iront-ils pour sauver le meilleur ami que Jack ait jamais eu ?"],"t":"Jack et la Grande Aventure du cochon de Noël","a":"J. K. Rowling"}},{"k":"choix","l":"Pour découvrir un autre livre susceptible de te plaire","to":103}],"38":[{"k":"p","h":"Je comprends. C’est rassurant d’avoir entre les mains un texte court. Néanmoins, il faut que je te prévienne d’une chose importante… Choisir un livre en fonction de sa taille est une fausse bonne idée. Laisse-moi t’expliquer pourquoi :"},{"k":"p","h":"Premièrement, l’épaisseur et la taille d’un livre ne signifient pas que le livre est long à lire. Pour t’en convaincre, demande à ton professeur documentaliste de te montrer un livre publié en grand format et sa version en livre de poche. Tu constateras qu’il s’agit du même texte ! Or pour la version poche, la taille de la police et l’espace entre les lignes sont considérablement réduits… ta lecture sera donc plus agréable si tu empruntes le livre grand format."},{"k":"p","h":"Deuxième raison, mieux vaut choisir un livre en fonction de son sujet (aventure, enquête, etc.) qu’en fonction de sa taille. N’en doute pas, tu liras avec plus de plaisir (et donc plus rapidement) un roman de 200 pages qui te passionne qu’un livre de 60 pages qui ne t’intéresse pas."},{"k":"p","h":"Cette mise au point étant faite, souhaites-tu que je te propose des recueils de nouvelles ou des romans courts ?"},{"k":"choix","l":"« Des recueils de nouvelles »","to":78},{"k":"choix","l":"« Des romans simples et courts »","to":93}],"39":[{"k":"livre","b":{"isbn":["9782010009228"],"p":["Trois jeunes gens visitent Naples. Dans un musée, l’un d’entre eux, Octavien, le plus jeune et le plus romantique, s’enflamme et se perd à la vue de l’empreinte d’un buste de femme pétrifiée dans des cendres de Pompéi. Ne trouvant pas le sommeil, Octavien retourne sur le site archéologique pour visiter les ruines. À la lumière de la lune, les bâtiments semblent moins abîmés, les rues mieux pavées. Au détour d’une rue, quand le jour se lève, les maisons de Pompéi sont intactes. Il croise un homme habillé « à l’antique ». Les siècles ont reculé devant les soupirs de son cœur et le voici en l’an 79 avant que le Vésuve n’explose. Parviendra-t-il à retrouver la belle Arria Marcella ?"],"t":"Arria Marcella","a":"Théophile Gautier"}},{"k":"choix","l":"Si tu souhaites découvrir une autre nouvelle fantastique","to":399},{"k":"choix","l":"Si tu préfères découvrir ma sélection de nouvelles horrifiques","to":228}],"40":[{"k":"p","h":"À toi de choisir ton programme de téléréalité :"},{"k":"choix","l":"« Survivre au camp de prisonniers »","to":74},{"k":"choix","l":"« Survivre à une battle royale »","to":180},{"k":"choix","l":"« Speed dating dans l’espace »","to":7},{"k":"choix","l":"« Séduire un prince »","to":258}],"41":[{"k":"livre","b":{"isbn":["9782361934361"],"p":["Imagine, c’est la guerre - non pas en Irak ou en Afghanistan, quelque part très loin, mais ici, en Europe, en France, chez nous. Dans ce livre l’auteure se lance dans une réflexion expérimentale par l’intermédiaire d’un simple renversement de perspective, elle nous explique avec clarté et sobriété les enjeux et les incidences du statut de réfugié - la fuite, l’exil, la survie dans un pays étranger."],"t":"Guerre : Et si ça nous arrivait ?","a":"Janne Teller"}}],"42":[{"k":"livre","b":{"isbn":["9782017240204"],"p":["Chacune des histoires de ce livre commence ou s’achève par un cri. Il est composé de vingt récits, chacun signé par un auteur différent, et je peux vous assurer que vous y trouverez votre dose d’adrénaline."],"t":"Des cris à glacer le sang !","a":""}},{"k":"choix","l":"Si tu veux découvrir un autre recueil pour la jeunesse","to":192},{"k":"choix","l":"Si tu préfères découvrir ma sélection de classiques","to":228}],"43":[{"k":"p","h":"Je comprends, c’est un loisir chronophage… et qui demande des efforts… contrairement à une vidéo qui avance toute seule une fois que l’on a appuyé sur lecture. Mais si tu veux mon avis… dire que tu n’aimes pas les livres alors que tu n’es pas lecteur, c’est comme de dire que tu n’aimes pas la pizza parce qu’une fois tu as goûté une pizza à l’ananas…"},{"k":"p","h":"Et puis… Si tu étais si convaincu de ne pas aimer les livres, tu ne serais pas en train de lire ces lignes. J’imagine que secrètement tu espères bien que je vais te trouver un livre qui te plaise… Laisse-moi te poser une question : Selon toi, pourquoi n’aimes-tu pas la lecture ?"},{"k":"p","h":"Que vas-tu répondre ?"},{"k":"choix","l":"« C’est trop long… c’est trop compliqué. Je n’arrive pas à suivre l’histoire, il y a trop de personnages »","to":38},{"k":"choix","l":"« J’ai l’impression de perdre mon temps ! Je m’ennuie quand je lis… J’ai besoin d’action ! »","to":32},{"k":"choix","l":"« Je n’ai jamais trouvé un livre qui aborde un sujet ou une thématique qui m’intéresse »","to":25}],"44":[{"k":"p","h":"Quel thème souhaites-tu que le roman aborde ?"},{"k":"choix","l":"« Les droits des animaux »","to":158},{"k":"choix","l":"« La protection de la biodiversité »","to":56},{"k":"choix","l":"« La réintroduction des espèces »","to":381},{"k":"choix","l":"« L’épuisement des ressources »","to":320},{"k":"choix","l":"« La déforestation (science-fiction) »","to":55},{"k":"choix","l":"« La déforestation (roman réaliste) »","to":392},{"k":"choix","l":"« La pollution »","to":383}],"45":[{"k":"p","h":"Que peux-tu me dire de l’histoire que tu veux lire ?"},{"k":"choix","l":"Un récit initiatique où le héros subit des épreuves pour devenir fort et courageux","to":287},{"k":"choix","l":"Si tu veux découvrir le récit d’une lutte épique opposant le bien et le mal","to":126},{"k":"choix","l":"Pour découvrir une histoire dans l’univers des légendes arthuriennes","to":343},{"k":"choix","l":"Si tu préfères découvrir un univers médiéval fantastique et déjanté","to":52},{"k":"choix","l":"Pour vivre une expérience immersive dans un monde médiéval-fantastique","to":262}],"46":[{"k":"livre","b":{"isbn":["9782812614330"],"p":["Alors que le monde se meurt, Avril, une jeune fille, tente tant bien que mal d’élever son petit frère, Kid. Réfugiés au cœur d’une forêt, ils se tiennent à l’écart des villes et de la folie des hommes… jusqu’au jour où le mystérieux passé d’Avril les jette brutalement sur la route. Pourchassés, il leur faut maintenant survivre dans cet univers livré au chaos et à la sauvagerie. Mais sur leur chemin, une rencontre va tout bouleverser."],"t":"Sirius","a":"Stéphane Servant"}},{"k":"choix","l":"Pour découvrir un autre roman jeunesse avec une ambiance sombre","to":336},{"k":"choix","l":"Pour découvrir un autre roman jeunesse avec une réflexion sur l’écologie","to":55},{"k":"choix","l":"Si tu veux découvrir une série de romans pour la jeunesse","to":286},{"k":"choix","l":"Si tu souhaites découvrir un classique de la littérature","to":29},{"k":"choix","l":"Pour découvrir une nouvelle susceptible de te plaire","to":167}],"47":[{"k":"p","h":"Voilà comment nous allons procéder : Tu vas choisir les questions auxquelles tu veux répondre et additionner les chiffres correspondant à tes réponses. Tu n’es pas obligé de répondre à toutes mes questions. Le résultat de ton addition t’indiquera le numéro du chapitre où tu dois te rendre."},{"k":"p","h":"Qu’aimerais-tu ressentir lors de ta lecture ?"},{"k":"p","h":"« Je suis à la recherche d’un frisson… d’une histoire effrayante » : 10 « Je veux parcourir le vaste monde et m’évader avec un livre d’aventure » : 30 « Mon objectif est de me détendre et de rire avec un livre feelgood » : 50 « J’aimerais un Thriller ! Un livre qui me donne un shoot d’adrénaline » : 70"},{"k":"p","h":"Quel niveau de lecture cherches-tu ?"},{"k":"p","h":"« Une lecture simple, pas prise de tête » : 1 « Un livre tout public avec un niveau de lecture intermédiaire » : 0 « Peu m’importe le nombre de pages ou le niveau de langue » : 2"},{"k":"p","h":"Cherches-tu un livre engagé ou qui te fasse réfléchir sur un sujet de société ?"},{"k":"p","h":"« Oui » : 3 « Non » : 0"},{"k":"p","h":"Par exemple : Un livre d’aventure (30) = Chapitre 30 Autre exemple : Un livre effrayant (10) + lecture simple (1) = Chapitre 11 Autre exemple : Une lecture simple (1) + qui soit engagé (3) = Chapitre 4 Autre exemple : Un thriller (70) + tout public (0) + qui soit engagé (3) = Chapitre 73"}],"48":[{"k":"livre","b":{"isbn":["9782070632022"],"p":["Quand il était petit, François rêvait d’être soldat. Puis la guerre de 1914 a éclaté et il est parti se battre, la « fleur au fusil », fier de défendre son pays. Mais il a rapidement découvert la dure réalité des champs de bataille, l’horreur des tranchées, la sauvagerie des hommes. Il a surtout connu une fin tragique, comme de nombreux soldats, et son nom s’est perdu dans la boue de Verdun. C’est ainsi qu’il est devenu… le Soldat inconnu."],"t":"Il s’appelait… le soldat inconnu","a":"Arthur Ténor"}},{"k":"choix","l":"Pour découvrir une autre œuvre susceptible de t’intéresser","to":263},{"k":"choix","l":"Si tu souhaites découvrir un classique de la littérature","to":69},{"k":"choix","l":"Si tu souhaites découvrir un témoignage de cette époque","to":188}],"49":[{"k":"livre","b":{"isbn":["9782290374115"],"p":["Alice se repose sur un talus lorsqu’elle voit passer un lapin blanc vêtu d’un gilet, visiblement pressé. Elle décide de le suivre et, sans hésitation, s’engouffre à sa suite dans un terrier qui la conduira au pays des merveilles."],"t":"Alice au pays des merveilles","a":"Lewis Carroll"}},{"k":"choix","l":"Si tu veux découvrir par toi-même le monde d’Alice…","to":94}],"50":[{"k":"livre","b":{"isbn":["9782070437436"],"p":["Comment garder tout son flegme quand on apprend dans la même journée : que sa maison va être abattue dans la minute pour laisser place à une déviation d’autoroute ; que la Terre va être détruite d’ici deux minutes, se trouvant, coïncidence malheureuse, sur le tracé d’une future voie express intergalactique ; que son meilleur ami, certes délicieusement décalé, est en fait un astrostoppeur natif de Bételgeuse, et s’apprête à vous entraîner aux confins de la galaxie ? Pas de panique ! Car Arthur Dent, un Anglais extraordinairement moyen, pourra compter sur le fabuleux Guide du voyageur galactique pour l’accompagner dans ses extraordinaires dérapages spatiaux moyennement contrôlés."],"t":"Le Guide du voyageur galactique","a":"Douglas Adams"}}],"51":[{"k":"livre","b":{"isbn":["9782095003517"],"p":["Alors qu’il joue aux jeux vidéo, Elias casse la tablette de ses parents. Il la cache au fond du tiroir de son bureau en attendant d’avoir l’idée lumineuse qui lui permettra d’éviter de se faire punir à vie. Il se dit que s’il devient absolument parfait, ses parents ne pourront pas s’énerver lorsqu’il leur avouera la vérité. Il prépare donc le petit-déjeuner, mais c’est comme si une tempête s’était déclenchée dans la cuisine. Il fait leur lit, mais il oublie de ranger sa propre chambre. Puis, pour montrer qu’il s’inquiète pour eux, il se met à leur faire des remarques étranges : papa utilise trop son téléphone, maman se couche trop tard… Et c’est l’effet inverse escompté qui se produit ! Le pauvre Elias se retrouve puni. Heureusement, il peut compter sur l’aide de sa chatte, fine observatrice de la famille, pour l’aider à se faire comprendre de ses parents…"],"t":"Comment apprendre à manipuler ses parents","a":"Titiou Lecoq"}}],"52":[{"k":"livre","b":{"isbn":["9782266211819"],"p":["Dans une dimension passablement farfelue, le monde (plat comme une pizza) est posé en équilibre sur le dos de quatre éléphants, eux-mêmes juchés sur la carapace de la Grande Tortue… Ce roman de fantasy vous propose de suivre les aventures absurdes et loufoques de Rincevent, un mage raté, pleutre mais plein de ressources et de Deuxfleurs, un touriste équipé d’une boîte à images démoniaque et talonné par son fidèle coffre sur pattes contenant des monceaux d’or pour les faux frais."],"t":"Les annales du Disque-Monde : La huitième couleur","a":"Terry Pratchett"}}],"53":[{"k":"livre","b":{"isbn":["9782290212233"],"p":["Trois jeunes filles ont été élues « boudins de l’année » sur Facebook dans leur collège de Bourg-en-Bresse. L’une d’elles décide de réagir et convainc les autres de monter sur Paris, accompagnées du frère de la benjamine, le beau Kader, qui a perdu ses jambes dans une embuscade au Galéristan. Leur objectif : sensibiliser les gens en leur vendant du boudin, perturber la garden party de l’Elysée ! Changer le regard sur ceux qui sont différents."],"t":"Les petites reines","a":"Clémentine Beauvais"}}],"54":[{"k":"livre","b":{"isbn":["9782330165727"],"p":["Une famille préhistorique s’attelle à améliorer l’ordinaire de son existence et se fait fort d’être précurseur en termes d’évolution de l’espèce « subhumaine » : la chasse, le feu, la cuisine, la danse, la musique, les arts, l’Amour, etc. Hélas pour eux, toutes les découvertes ne sont pas bonnes à faire et quand il s’agit de cohabiter avec d’autres hordes et de s’armer… Aïe."],"t":"Pourquoi j’ai mangé mon père","a":"Roy Lewis"}}],"55":[{"k":"livre","b":{"isbn":["9782290252499"],"p":["Le monde est fait de déserts, l’oxygène est rare et la chaleur insoutenable. Les animaux et la végétation ont disparu, après une catastrophe mystérieuse qui oblige l’humanité à vivre une vie bien différente de la nôtre. Les derniers humains vivent en tribus nomades, mangent des barres protéinées à l’origine indéfinissable et vivent dans la crainte de la famine ou de la déshydratation. Dans cet environnement hostile, les survivants se sont réorganisés et se sont répartis des tâches différentes pour subvenir aux besoins de la collectivité. Les femmes s’occupent du foyer et les hommes cherchent les derniers arbres à abattre ! En effet, le bois, plus rare que l’or, sert de monnaie d’échange contre la nourriture et les doses d’oxygène que l’on peut trouver à la Ville."],"t":"Et le désert disparaîtra","a":"Marie Pavlenko"}},{"k":"choix","l":"Pour découvrir un autre roman jeunesse, susceptible de te plaire","to":365}],"56":[{"k":"livre","b":{"isbn":["9782070624232"],"p":["« Awaïté Pawana ! » John, le matelot de Nantucket, oubliera-t-il jamais le terrible cri lancé par l’homme de vigie du baleinier avant le massacre ? Qu’est devenue la lagune de légende où les géants des mers venaient se cacher ? Pourquoi le capitaine Charles Melville Scammon a-t-il tant voulu découvrir ce lieu sans nom aussi vieux que le monde ? Un magnifique récit sur les baleines et la fragile beauté du monde."],"t":"Pawana","a":"J.M.G. Le Clézio"}}],"57":[{"k":"livre","b":{"isbn":["9782211236331"],"p":["Lazare écoute les conversations de son père, Sauveur, psychologue clinicien, à travers une porte qui donne sur le cabinet de consultation. Des patients aux histoires variées et complexes se succèdent. Sauveur, quant à lui, n’a jamais expliqué à son fils son histoire de famille compliquée, noir antillais adopté par un couple blanc, ayant épousé une blanche. Réussira-t-il à évoquer son épouse morte ? Et qui dépose des boîtes d’envoûtement devant la maison ?"],"t":"Sauveur et fils","a":"Marie-Aude Murail"}},{"k":"choix","l":"Si tu veux découvrir une autre série de romans","to":198},{"k":"choix","l":"Pour découvrir, l’histoire d’une famille recomposée suite à un divorce","to":393},{"k":"choix","l":"Pour découvrir l’histoire d’une ado qui grandit et apprend à devenir elle-même","to":332}],"58":[{"k":"p","h":"Préfères-tu que je te conseille un roman ou une nouvelle ?"},{"k":"choix","l":"« Un roman »","to":10},{"k":"choix","l":"« Des nouvelles »","to":228}],"59":[{"k":"livre","b":{"isbn":["9782010009105"],"p":["Ils sont dix à avoir reçu l’invitation : des vacances d’été sur l’île du Soldat ! Voilà une proposition à laquelle personne ne saurait résister. Non seulement c’est gratuit, mais l’île a tant fait parler d’elle ! Chacun se demande qui est son nouveau propriétaire – une star d’Hollywood, un milliardaire américain ? Aussi, sans vraiment connaître leur hôte, ils accourent volontiers : le médecin, le play-boy, la jeune prof de gym, le juge à la retraite, le général bardé de décorations, la vieille fille grincheuse, le sémillant capitaine, le majordome et sa femme, et M. Davis qui ne s’appelle pas Davis… Qu’ont-ils donc en commun ? À l’arrivée, cela dit, un par un, tous connaîtront le même sort…"],"t":"Ils étaient dix","a":"Agatha Christie"}},{"k":"choix","l":"Si tu veux découvrir un autre livre de la même autrice","to":157},{"k":"choix","l":"Si tu veux découvrir le roman d’un autre maître du suspense","to":112},{"k":"choix","l":"Si tu préfères que je te conseille un recueil de nouvelles policières","to":243}],"60":[{"k":"p","h":"Que peux-tu me dire de plus sur le roman que tu souhaites lire ?"},{"k":"choix","l":"Si tu souhaites lire un roman sur la rentrée de 6e","to":194},{"k":"choix","l":"Si tu souhaites lire un roman sur le stage de 3e","to":222},{"k":"choix","l":"Si tu désires découvrir une enquête policière dans un collège","to":71},{"k":"choix","l":"Pour découvrir un roman effrayant qui se passe dans un collège","to":176}],"61":[{"k":"livre","b":{"isbn":["9782226240453"],"p":["Tous les matins, Chloé se rend en voiture à son école privée ultrachic, vautrée sur la banquette arrière, avec sa peste de petite sœur, et tous les matins, elle regarde Monsieur Kipu, toujours assis sur le même banc, qu’il pleuve ou qu’il vente. Qui est-il ? Pourquoi vit-il dans la rue ? Que mange son chien ? Quand s’est-il lavé pour la dernière fois ? Et est-il possible qu’il s’appelle vraiment M. Kipu ? Toutes ces questions et d’autres encore, Chloé décide un jour d’aller les poser à monsieur Kipu en personne. Et lorsqu’il est question que son nouvel ami soit chassé de la ville, Chloé le cache dans la remise du jardin. Mais il se peut que Monsieur Kipu ait plus à cacher qu’il n’y semble au premier coup d’œil… ou de nez !"],"t":"Mr Kipu","a":"David Walliams"}},{"k":"choix","l":"Si tu souhaites découvrir un autre livre du même auteur","to":211},{"k":"choix","l":"Si tu veux suivre les aventures d’un enfant ou d’un adolescent","to":134},{"k":"choix","l":"Si, au contraire, tu préfères suivre les mésaventures d’un professeur","to":191}],"62":[{"k":"p","h":"Quelle partie du monde souhaites-tu partir explorer ?"},{"k":"choix","l":"« J’aimerais partir sur une île déserte »","to":92},{"k":"choix","l":"« J’aimerais explorer un glacier ou le pôle nord »","to":114},{"k":"choix","l":"« J’aimerais partir explorer l’Afrique »","to":363},{"k":"choix","l":"« Partir me perdre dans la jungle »","to":260},{"k":"choix","l":"« J’aimerais traverser l’Europe »","to":2},{"k":"choix","l":"« J’aimerais faire le tour du monde »","to":30},{"k":"choix","l":"« J’aimerais explorer des lieux inaccessibles »","to":179}],"63":[{"k":"livre","b":{"isbn":["9782070654154"],"p":["Garin est originaire d’une famille pauvre, composée de 25 enfants dont il était le 19e. Il eut beaucoup de chance car il put étudier l’écriture dans une abbaye, puis décida de parcourir les routes muni de son écritoire, et de travailler comme scribe itinérant pour assurer sa survie. Il ne donne presque jamais sa vraie identité, ayant honte de son nom qu’il trouve ridicule. Ce livre nous permet de découvrir le monde au Moyen Âge et la guerre de Cent Ans qui faisait rage à cette époque. Chacune de ces aventures est l’occasion de découvrir de nouveaux personnages et de nouveaux territoires, mais aussi de participer à des enquêtes dans lesquelles le contexte historique joue un rôle primordial. Il rencontre des figures réelles de l’histoire de France et d’Angleterre, comme le Prince Noir ou Bertrand du Guesclin."],"t":"Garin trousseboeuf","a":"Évelyne Brisou-Pellen"}},{"k":"choix","l":"Pour découvrir un autre livre susceptible de te plaire","to":133},{"k":"choix","l":"Pour découvrir une aventure qui se passe pendant la croisade du Roi Richard","to":306}],"64":[{"k":"p","h":"C’est une bonne question… je n’ai aucune certitude. Je ne connais pas tous les livres qu’il y a dans ton CDI… je suis donc limité dans mes réponses. Néanmoins, je suis assez confiant, car j’ai fait une sélection assez large couvrant tous les champs de la littérature jeunesse ! De plus, tous les livres que j’ai retenus pour ce guide sont très appréciés par les collégiens."},{"k":"p","h":"Quoi qu’il en soit, va chercher le roman que je te conseillerai. Regarde la couverture et lis le résumé sur la quatrième de couverture. Puis, et c’est très important, ouvre le livre et prends le temps de lire quelques pages. Parfois, c’est le coup de foudre ! Et d’autres fois, on se rend compte que la plume de l’auteur ne nous convient pas. Sache que tu as le droit de reposer le livre quand tu veux. Ne te force jamais à finir un livre, car la lecture n’est pas une corvée mais un plaisir. Prends simplement un autre livre et avec un peu de chance, il te plaira plus. Tu l’as dit toi-même, il y a quelque part dans ces rayonnages des livres qui te transporteront et qui te laisseront un souvenir impérissable. Ce sont ceux-là que tu dois chercher !"},{"k":"p","h":"Quoi qu’il en soit, si jamais j’échoue à te trouver un livre, tu peux toujours demander conseil au professeur documentaliste du collège. Il aura probablement d’autres romans à te suggérer. Demande-lui aussi si tu peux participer au club lecture pour rencontrer et échanger avec les autres élèves. C’est un bon moyen de découvrir de nouveaux romans et c’est très stimulant de pouvoir en parler avec d’autres personnes qui les ont lus eux aussi."},{"k":"p","h":"Que vas-tu lui répondre ?"},{"k":"choix","l":"« Je suis prêt à tenter l’expérience »","to":25},{"k":"choix","l":"« Pouvez-vous me conseiller autre chose qu’un roman ? »","to":23}],"65":[{"k":"p","h":"Que peux-tu me dire du livre que tu veux lire ?"},{"k":"choix","l":"« J’aimerais un roman d’aventure avec un chien de traineau »","to":136},{"k":"choix","l":"« J’aimerais une histoire avec un chien guide »","to":323},{"k":"choix","l":"« J’aimerais une histoire d’amitié entre un enfant et un animal »","to":121},{"k":"choix","l":"« J’aimerais un classique, une enquête policière »","to":289}],"66":[{"k":"p","h":"Tu cherches donc un livre qui te fera claquer des dents et te glacera le sang… Quel niveau d’épouvante penses-tu pouvoir supporter ?"},{"k":"choix","l":"« Une petite frayeur sans conséquence »","to":11},{"k":"choix","l":"« Une lecture pour affoler l’aiguille de mon trouillomètre »","to":58},{"k":"choix","l":"« Une lecture extrêmement terrifiante »","to":165}],"67":[{"k":"livre","b":{"isbn":["9782070581184"],"p":["L’avenir de Lou Brown, quinze ans, est tout tracé. Elle suit depuis toute petite un entraînement intensif de natation, avec sa meilleure amie, Hannah. Et ce quatre cents mètres quatre nages va leur permettre de se qualifier pour les Jeux Olympiques. Mais Lou rate sa course tandis que Hannah, elle, est sélectionnée. Lou fait sa première rentrée seule dans un lycée où elle ne connaît personne. L’adolescente trop gauche et timide hors de l’eau affronte sa nouvelle vie avec autant de courage que d’humour. Un jour, elle retourne à la piscine et trois garçons du lycée lui proposent un défi complètement fou…"],"t":"Moi et les Aquaboys","a":"Nat Luurtsema"}},{"k":"choix","l":"Pour découvrir un autre roman susceptible de te plaire","to":315}],"68":[{"k":"livre","b":{"isbn":["9782266238205"],"p":["Méto est un jeune garçon à l’âge incertain. Depuis 4 ans, il vit dans la Maison, avec soixante-trois autres enfants… étrangement il n’a aucun souvenir de sa vie d’avant. Les enfants sont soumis à des règles très strictes, ils n’ont aucune liberté, leur emploi du temps est minuté. Même les secondes entre chaque bouchée lors des repas doivent être comptées, sous peine de sanction. Chacun d’eux sait qu’il devra en partir lorsqu’il aura trop grandi. Mais qu’y a-t-il après la Maison ?"],"t":"Méto","a":"Yves Grevet"}},{"k":"choix","l":"Si tu veux découvrir une autre trilogie","to":144},{"k":"choix","l":"Si tu préfères un autre roman dystopique","to":173},{"k":"choix","l":"Si tu veux découvrir une nouvelle dystopique","to":233}],"69":[{"k":"livre","b":{"isbn":["9782253006701"],"p":["Paul Bäumer est un jeune Allemand de 19 ans. Après avoir été soumis à un bourrage de crâne patriotique par leur professeur, tous ses camarades de classe et lui-même s’engagent « volontairement » dans l’armée impériale allemande. Ils partent en guerre presque heureux, fiers de servir leur pays. Après dix semaines d’entraînement, la rencontre avec un caporal maltraitant puis la brutalité de la vie au front font découvrir à Paul et à ses amis que leurs idéaux de patriotisme et de nationalisme se résument à des clichés inadaptés au monde réel."],"t":"À l’ouest, rien de nouveau","a":"Erich Maria Remarque"}},{"k":"choix","l":"Pour découvrir une autre œuvre classique se passant pendant la Grande Guerre","to":87}],"70":[{"k":"livre","b":{"isbn":["9782203192188"],"p":["James, placé dans un orphelinat sordide à la mort de sa mère, ne tarde pas à tomber dans la délinquance. Il est alors recruté par CHERUB (une antenne des services secrets anglais) et va suivre un éprouvant programme d’entraînement avant de se voir confier sa première mission d’espionnage."],"t":"Chérub","a":"Robert Muchamore"}},{"k":"choix","l":"Pour découvrir un autre roman susceptible de te plaire","to":80}],"71":[{"k":"livre","b":{"isbn":["9782211223263"],"p":["Au collège Saint-Prix, un professeur a retrouvé son casier forcé et ses copies corrigées avec du sang humain… Le chasseur d’énigmes Nils Hazard et sa petite amie Catherine Roque sont chargés de mener une enquête discrète sur le terrain. Avec 280 suspects sur les bras, Nils va devoir redoubler d’efforts pour démasquer le coupable…"],"t":"L’assassin est au collège","a":"Marie-Aude Murail"}},{"k":"choix","l":"Pour découvrir un autre roman policier qui se passe dans un collège","to":141}],"72":[{"k":"livre","b":{"isbn":["9782092575215"],"p":["Dans un lycée américain, cinq adolescents sont collés : Bronwyn (l’élève parfaite), Addy (la fille populaire), Nate (le délinquant), Cooper (la star du baseball) et Simon (le gossip boy du lycée). Mais Simon ne ressortira jamais vivant de cette heure de colle… Et les enquêteurs en sont vite sûrs, sa mort n’est pas accidentelle. Dès lors qu’un article écrit par Simon contenant des révélations sur chacun d’eux est découvert, Bronwyn, Addy, Nate et Cooper deviennent les principaux suspects du meurtre. Ce qui est sûr, c’est qu’ils ont tous quelque chose à cacher…"],"t":"Qui ment ?","a":"Karen M. McManus"}},{"k":"choix","l":"Si tu veux découvrir une autre enquête susceptible de te plaire","to":275}],"73":[{"k":"livre","b":{"isbn":["9782266323178"],"p":["Starr a seize ans, elle est noire et vit dans un quartier rythmé par les guerres entre gangs et les descentes de police. Tous les jours, elle rejoint son lycée blanc situé dans une banlieue chic ; tous les jours, elle fait le grand écart entre ces deux mondes. Sa vie vole en éclats le soir où son ami Khalil est tué, sous ses yeux, de trois balles dans le dos, par un policier. Starr est la seule témoin et tandis que son quartier s’embrase et que la police cherche à enterrer l’affaire, Starr va apprendre à redresser la tête."],"t":"The Hate U give","a":"Angie Thomas"}}],"74":[{"k":"livre","b":{"isbn":["9782210750975"],"p":["Une émission de télé-réalité, nommée Concentration, est lancée. On y filme des prisonniers, choisis au hasard parmi la population. Leurs conditions de vie sont épouvantables : ils sont peu nourris, insultés, battus par des surveillants appelés « Kapos ». Chaque jour, deux prisonniers sont choisis et tués, sous le regard des caméras. Zdena, une des kapos, tombe éperdument amoureuse de Pannonique, héroïne du livre et prisonnière connue sous le matricule « CKZ 114 ». Pendant ce temps, les médias s’offusquent de l’horreur de l’émission, ce qui incite de plus en plus de gens à la regarder. Concentration arrive au paroxysme du scandale quand les producteurs décident d’accorder le choix des prisonniers tués au public."],"t":"Acide sulfurique","a":"Amélie Nothomb"}}],"75":[{"k":"livre","b":{"isbn":["9782812618291"],"p":["Une transformation mystérieuse affecte les adolescentes qui voient leurs sens s’aiguiser et leurs corps évoluer. Dans une société où le corps féminin est soumis à des normes rigides, ces transformations s’avèrent hautement perturbantes. D’abord pour les intéressées elles-même. Mais lorsqu’elles décident de s’assumer et de s’élever contre l’oppression qui les vise, c’est toute la société qui s’en trouve bouleversée et la réaction est d’une violence inouïe. Un bras de fer terrible s’enclenche…"],"t":"Féline","a":"Stéphane Servant"}}],"76":[{"k":"p","h":"Excellent choix ! Préfères-tu que je te propose des genres littéraires (aventure, policier, etc.) ou souhaites-tu que l’on axe notre réflexion sur le héros du livre ?"},{"k":"choix","l":"« Des genres littéraires »","to":16},{"k":"choix","l":"« Parlons plutôt du héros du livre »","to":102}],"77":[{"k":"livre","b":{"isbn":["9782013212113"],"p":["Bella, dix-sept ans, décide de quitter l’Arizona ensoleillé où elle vivait avec sa mère, pour s’installer chez son père. Elle croit renoncer à tout ce qu’elle aime, certaine qu’elle ne s’habituera jamais ni à la pluie, ni à la petite ville de Forks, où l’anonymat est interdit. Mais elle rencontre Edward, lycéen de son âge, d’une beauté inquiétante. Quels mystères et quels dangers cache cet être insaisissable, aux humeurs si changeantes ? À la fois attirant et hors d’atteinte, Edward Cullen n’est pas humain. Il est plus que ça. Bella en est certaine."],"t":"Twilight : Fascination","a":"Stephenie Meyer"}},{"k":"choix","l":"Pour découvrir une autre série de romans susceptible de te plaire","to":302}],"78":[{"k":"p","h":"Les nouvelles sont des récits courts, quelques dizaines de pages tout au plus. Quel genre de recueil souhaites-tu que je te conseille ?"},{"k":"choix","l":"« Des nouvelles d’horreur »","to":42},{"k":"choix","l":"« Des nouvelles fantastiques »","to":403},{"k":"choix","l":"« Des nouvelles réalistes »","to":361},{"k":"choix","l":"« Des nouvelles policières »","to":225},{"k":"choix","l":"« Des nouvelles féministes »","to":182}],"79":[{"k":"livre","b":{"isbn":["9782290170250"],"p":["Ce recueil est composé de plusieurs histoires courtes inspirées de la vie en Provence. Ces récits, empreints de poésie et de tendresse, dépeignent la vie quotidienne des habitants de la région, ainsi que des scènes pittoresques et des anecdotes touchantes. Parmi les histoires les plus célèbres figurent « La Chèvre de Monsieur Seguin », « Les Étoiles », « Le Curé de Cucugnan » et « La Mule du Pape »."],"t":"Les lettres de mon moulin","a":"Alphonse Daudet"}}],"80":[{"k":"livre","b":{"isbn":["9782017027997"],"p":["Alex Rider est un collégien londonien de quatorze ans. À la mort de son oncle, il est enrôlé par le célèbre MI-6 pour une périlleuse mission, enquêter sur le Stormbreaker, un nouvel ordinateur ultra-puissant."],"t":"Alex Rider : Stormbreaker","a":"Anthony Horowitz"}}],"81":[{"k":"serie","t":"Chair de poule","a":"R. L. Stine"},{"k":"p","h":"Dans cette série de romans, chaque livre raconte une histoire mettant en scène des enfants ou des adolescents confrontés à un phénomène étrange, effrayant, fantastique et horrifique. Voici ma petite sélection :"},{"k":"livre","b":{"isbn":["9791036357527"],"p":["Un pantin ventriloque, rien de tel pour avoir du succès ! Caro s’amuse beaucoup avec le sien. Jalouse, sa sœur jumelle en achète un et le nomme « Monsieur Wood ». À partir de ce jour, des événements diaboliques vont se produire dans la maison des Lafaye. Monsieur Wood est-il aussi inanimé qu’il y paraît ?"],"t":"La nuit des pantins","a":"R. L. Stine","serie":"Chair de poule"}},{"k":"livre","b":{"isbn":["9791036349737"],"p":["Partis visiter un zoo qu’ils ne trouveront jamais, la famille Morris se retrouve devant un mystérieux parc d’attractions. À peine en ont-ils franchi les grilles que des monstres croisent leur chemin. De sévères mises en garde précèdent les attractions proposées. Et s’il s’agissait de pièges pour faire disparaître les visiteurs à jamais ?"],"t":"Le parc de l’horreur","a":"R. L. Stine","serie":"Chair de poule"}},{"k":"livre","b":{"isbn":["9782227738331"],"p":["Avez-vous déjà vu du sang de monstre ? C’est vert, liquide et gluant. Ivan adore jouer avec ! Mais est-ce normal que l’innocente chose verte se mette à grossir, grossir, grossir jusqu’à avoir un … appétit … monstrueux ?"],"t":"Sang de monstre","a":"R. L. Stine","serie":"Chair de poule"}},{"k":"livre","b":{"isbn":["9782747059404"],"p":["Le docteur Brouwer fait des expériences dans son laboratoire. Rien de dangereux… Il est botaniste. Pourtant, Jane et Michael sont inquiets. Leur père a changé : son comportement est bizarre. Pourquoi mange-t-il du fertilisant en cachette dans la cuisine ? Est-ce du sang vert qui coule de sa main blessée ? Les expériences du docteur Brouwer sont-elles si inoffensives que cela ?"],"t":"Sous-sol interdit","a":"R. L. Stine","serie":"Chair de poule"}},{"k":"livre","b":{"isbn":["9791036357497"],"p":["« Celui-là fera l’affaire », pense Carolyn en choisissant pour la fête d’Halloween le masque le plus horrible dans la boutique de farces et attrapes. Mais pourquoi, une fois posé sur son visage, le masque s’anime-t-il tout à coup ? Pourquoi la voix de Carolyn devient-elle soudain grave et menaçante ?"],"t":"Le masque hanté","a":"R. L. Stine","serie":"Chair de poule"}},{"k":"livre","b":{"isbn":["9782747032940"],"p":["« Drôle d’engin », pense Alex en trouvant un appareil photo dans une maison abandonnée. Les clichés instantanés qu’il développe représentent des événements, toujours dramatiques, qui ne sont pas encore arrivés. Et si cet appareil, doté de pouvoirs maléfiques, provoquait l’avenir ?"],"t":"Dangereuses photos","a":"R. L. Stine","serie":"Chair de poule"}},{"k":"livre","b":{"isbn":["9791036332593"],"p":["Lucy a une passion : raconter des histoires d’horreur. Jusqu’au jour où elle rencontre un vrai monstre… et personne ne la croit. Même ses parents ne la prennent pas au sérieux. Lucy est paniquée. D’autant plus que le monstre, lui, sait qu’elle connaît son secret."],"t":"La fille qui criait au monstre","a":"R. L. Stine","serie":"Chair de poule"}},{"k":"livre","b":{"isbn":["9782747046909"],"p":["Ici, on suit le quotidien d’une famille venue s’installer en Floride. Loin des plages paradisiaques, elle découvre des cadavres d’animaux éventrés dans les marais. Le suspect n’est pas un alligator mais un lycanthrope qui traîne dans les parages. La pression se fait sentir, tout comme le poids des soupçons, à mesure que la recherche du coupable se précise. Cependant, les apparences sont trompeuses, et le suspense est maintenu jusqu’à la fin."],"t":"Le loup-garou des marécages","a":"R. L. Stine","serie":"Chair de poule"}},{"k":"livre","b":{"isbn":["9782747039031"],"p":["David Beamer est la risée du collège, et surtout le souffre-douleur de quatre élèves de cinquième. Pour se venger de Sandra qui l’a exclu du journal de l’école, David décide de lui faire une mauvaise blague : à la fin d’un article qu’elle a écrit dans le journal, il ajoute : « si vous êtes un monstre, appelez Sandra après minuit. ». Mais Sandra le découvre à temps et remplace son numéro de téléphone par celui de David, et c’est lui que les monstres appellent…"],"t":"Des appels monstrueux","a":"R. L. Stine","serie":"Chair de poule"}},{"k":"livre","b":{"isbn":["9782747033114"],"p":["Quelle est cette étrange sensation de légèreté que ressent soudain Stanislas ? Pourquoi personne ne le voit plus ni ne l’entend ? Jamais il n’aurait dû retourner au cimetière chercher son sac à dos. Jamais il n’aurait dû buter contre cette pierre tombale. Les spectres, lorsqu’ils sont dérangés, peuvent devenir redoutables. Redoutablement effrayants…"],"t":"L’attaque des spectres","a":"R. L. Stine","serie":"Chair de poule"}}],"82":[{"k":"p","h":"Les romans historiques sont des fictions ! Cependant, l’auteur ancre son récit dans une période historique et utilise des événements, des lieux, des personnages et des coutumes authentiques pour créer un cadre réaliste et immersif à son histoire. Quelle période souhaites-tu découvrir ?"},{"k":"choix","l":"« La Préhistoire »","to":108},{"k":"choix","l":"« L’Antiquité »","to":128},{"k":"choix","l":"« Le Moyen Âge »","to":63},{"k":"choix","l":"« Le Japon médiéval »","to":200},{"k":"choix","l":"« L’époque des conquistadors »","to":352},{"k":"choix","l":"« Les Caraïbes au temps des pirates »","to":92},{"k":"choix","l":"« L’esclavage au XVIIIe siècle »","to":35},{"k":"choix","l":"« L’époque des mousquetaires »","to":115},{"k":"choix","l":"« La conquête de l’Ouest »","to":98},{"k":"choix","l":"« La Première Guerre mondiale »","to":48},{"k":"choix","l":"« La Seconde Guerre mondiale »","to":150},{"k":"choix","l":"« La chute du mur de Berlin »","to":373}],"83":[{"k":"livre","b":{"isbn":["9782226455352"],"p":["Quand elle se perd au cours d’une marche sur la piste des Appalaches, Trisha se retrouve à la merci de la forêt, piégée dans un labyrinthe vert et marécageux. Alors que les heures défilent, la petite fille fait face à une peur qui grandit, tente de la posséder : et si on ne la retrouvait jamais ?"],"t":"La Petite Fille qui aimait Tom Gordon","a":"Stephen King"}}],"84":[{"k":"p","h":"J’aime aussi ces livres où tout est possible et où l’imagination des auteurs n’a aucune limite ! Essayons d’en savoir plus sur tes goûts, préfères-tu les mondes futuristes ou les histoires avec des créatures fantastiques ?"},{"k":"choix","l":"« Moi j’aime les univers peuplés de dragons, de magiciens et de fées »","to":147},{"k":"choix","l":"« Moi j’aime la science-fiction et les dystopies ! Pouvez-vous me conseiller un livre où l’histoire se passe dans un monde futuriste »","to":127},{"k":"choix","l":"« Je veux un roman où le héros découvre ses pouvoirs ou ses origines »","to":8},{"k":"choix","l":"« Pouvez-vous me conseiller un livre avec un univers réaliste mais où des éléments fantastiques ou merveilleux viennent se greffer »","to":122},{"k":"choix","l":"« J’aimerais lire un roman où les protagonistes sont des animaux »","to":20},{"k":"choix","l":"« Ce que j’aime par-dessus tout… c’est avoir peur »","to":97}],"85":[{"k":"livre","b":{"isbn":["9782070403691"],"p":["Benjamin Malaussène a un drôle de métier : bouc émissaire au service réclamations d’un grand magasin parisien où il est chargé d’apitoyer les clients grincheux. Une bombe, puis deux, explosent dans le magasin. Benjamin est le suspect numéro un de cette vague d’attentats aveugles. Et s’il n’y avait que ça ! Quand on est l’aîné, il faut aussi survivre aux tribulations de sa tumultueuse famille : la douce Clara qui photographie comme elle respire, Thérèse l’extralucide, Louna l’amoureuse, Jérémy le curieux, la maman et ses amants… Le tout sous les yeux de Julius, le chien épileptique, et de Tante Julia, journaliste volcanique.","J’aurais dû me douter qu’en te disant que les héros de la littérature jeunesse étaient souvent des adolescents tu viendrais ici… Si tu le souhaites, je t’invite à aller découvrir ma sélection de classiques <a class=\"renvoi\" href=\"#c93\">→ Chapitre 93<\/a>"],"t":"Au bonheur des ogres","a":"Daniel Pennac"}}],"86":[{"k":"livre","b":{"isbn":["9782812605673"],"p":["Deux courts récits qui racontent la même histoire de deux points de vue complémentaires. Celui d’une petite fille qui fuit la guerre avec la moitié de son village et attend le bateau qui lui fera traverser l’océan pour la première fois. Et celui d’un garçon se promenant avec son chien, le long de la plage
