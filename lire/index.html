u Parc des Grands Pins. Enfin, elle entre dans la cour des grands ! Rêvant de devenir populaire, Margot se présente aux élections des délégués de classe…"],"t":"La sixième","a":"Susie Morgenstern"}}],"335":[{"k":"livre","b":{"isbn":["9782211312813"],"p":["Les rats ont envahi la paisible bourgade d’Hamelin. Vous croyez connaître cette histoire ? Vous savez qu’un joueur de flûte va arriver, noyer les rats en musique, puis les enfants d’Hamelin ? Oubliez ces sornettes. La véritable histoire est bien pire, et c’est grâce à Mirella, une jeune fille de quinze ans, qu’on l’a enfin compris. Cette crève la-faim a un don ignoré de tous : elle voit ce que personne d’autre ne voit. Par exemple, elle a repéré cet homme en noir qui murmure à l’oreille de ceux qui vont mourir de la peste… Et ça lui donne une sacrée longueur d’avance. Y compris sur le plus célèbre dératiseur de tous les temps."],"t":"L’estrange malaventure de Mirella","a":"Flore Vesco"}}],"336":[{"k":"livre","b":{"isbn":["9782266334174"],"p":["Amy est devant sa télévision quand le pire se produit. Des créatures sans pitié attaquent. New York, Paris, Tokyo… et dévorent les humains. Personne ne sait d’où ils viennent mais une chose est sûre : la population de la planète décroît dramatiquement en quelques jours à peine. À l’abri de la grille électrifiée de sa maison, Amy parvient à leur échapper… mais pour combien de temps ?"],"t":"In the After","a":"Demitria Lunetta"}}],"337":[{"k":"livre","b":{"isbn":["9782383493068"],"p":["Paris, début du XIXe siècle. Louise survit dans la rue comme diseuse de bonne aventure. Officiellement, elle lit dans une boule de cristal. Officieusement, elle sait surtout décrypter le visage de ses clients. C’est ce qui pousse la célèbre cartomancienne, Marie-Anne Lenormand, à la prendre comme assistante. Ensemble, elles forment rapidement un duo très prisé de la place parisienne. Jusqu’au jour où l’inspecteur Brandicourt sollicite les compétences de Marie-Anne sur une étrange affaire de meurtre. De la cour de l’impératrice Joséphine aux bas-fonds de la capitale, l’apprentie cartomancienne devra se faire discrète et clairvoyante car les dangers sont nombreux dans ce monde de complots, de jalousie et de traîtrise…"],"t":"L’apprentie cartomancienne","a":"Aurélie Croizé"}},{"k":"choix","l":"Pour découvrir un autre roman susceptible de te plaire","to":395}],"338":[{"k":"livre","b":{"isbn":["9782330186852"],"p":["Quand Flore est prise d’une nouvelle crise d’angoisse en cours de maths, la documentaliste l’accueille avec joie dans son CDI où règne un joyeux chaos. Accompagnée de Gregory, un redoublant très populaire, elle fait la rencontre de Samuel, qui se voit futur grand rappeur, et Nadia, une gothique un brin sarcastique. Les quatre collégiens décident de former le « Gang du CDI » et se retrouvent au moment des pauses. Mais l’étrange disparition de la documentaliste casse leur routine. Le Gang du CDI se met en tête de la retrouver. Une mission qu’ils n’imaginaient probablement pas aussi dangereuse. Ils vont découvrir des endroits secrets du collège et, en particulier, un laboratoire destiné à transformer les humains en monstres…"],"t":"Le gang du CDI : Le collège de l’angoisse","a":"Vincent Mondiot"}}],"339":[{"k":"livre","b":{"isbn":["9782020239301"],"p":["Antonio José Bolivar connaît les profondeurs de la forêt amazonienne et ses habitants, le noble peuple des Shuars. Lorsque les villageois d’El Idilio les accusent à tort du meurtre d’un chasseur blanc, le vieil homme se révolte. Obligé de quitter ses romans d’amour - seule échappatoire à la barbarie des hommes - pour chasser le vrai coupable, une panthère majestueuse, il replonge dans le charme hypnotique de la forêt."],"t":"Le vieux qui lisait des romans d’amour","a":"Luis Sepúlveda"}}],"340":[{"k":"livre","b":{"isbn":["9782203241695"],"p":["Au lycée ou même chez soi, quand on vit au Japon, on n’étale pas ses problèmes. Pourtant, Emi aurait beaucoup à dire : le harcèlement qu’elle subit, l’attitude de ses parents… et surtout cette culpabilité qu’elle essaie d’enfouir depuis plusieurs mois. Emi ne se confie jamais. Elle se réfugie dans ses mangas et fait semblant que tout va bien. Jusqu’à ce qu’une rencontre lui donne envie de s’ouvrir enfin. Mais à qui peut-on se fier dans une société où les apparences peuvent l’emporter sur la vérité ?"],"t":"Chère Fubuki Katana","a":"Annelise Heurtier"}}],"341":[{"k":"livre","b":{"isbn":["9782211235624"],"p":["À onze ans, la petite Verte ne montre toujours aucun talent pour la sorcellerie. Pire que cela, elle dit qu’elle veut être quelqu’un de normal et se marier. Elle semble aussi s’intéresser aux garçons de sa classe et ne cache pas son dégoût lorsqu’elle voit mijoter un brouet destiné à empoisonner le chien des voisins. Ursule, sa mère, est consternée. C’est si important pour une sorcière de transmettre le métier à sa fille."],"t":"Verte","a":"Marie Desplechin"}}],"342":[{"k":"livre","b":{"isbn":["9782211328562"],"p":["Tout change dans la vie de Kix le jour où il rencontre un splendide chien des Pyrénées d’une blancheur éclatante. Le garçon et le mystérieux animal se prennent très vite d’amitié l’un pour l’autre. Sam (c’est le nom que Kix lui a donné) passe de plus en plus de temps chez le garçon. Il faut dire que Kix et sa sœur font preuve de beaucoup d’attention à l’égard du chien et que celui-ci raffole de leurs caresses. Pourtant, Kix est inquiet. Et si le propriétaire de Sam le réclamait ? Au cours d’une terrible nuit pleine de rebondissements, le garçon va prouver combien il aime son chien."],"t":"Le choix de Sam","a":"Edward Van de Vendel"}}],"343":[{"k":"livre","b":{"isbn":["9782075103824"],"p":["Et si le roi Arthur Pendragon en personne vous contait son histoire ? Si tous les personnages de la légende arthurienne : fées bienveillantes ou vengeresses, enchanteurs de renom et preux chevaliers, reprenaient soudain vie pour vous conduire au cœur d’une épopée tellement célèbre et populaire qu’elle a su traverser les siècles, du Moyen-Âge jusqu’à nos jours ?"],"t":"Le roi Arthur","a":"Michael Morpurgo"}},{"k":"choix","l":"Pour découvrir trois classiques de la littérature médiévale","to":229}],"344":[{"k":"livre","b":{"isbn":["9782290071823"],"p":["L’humanité est menacée d’extinction, et les seuls à pouvoir la sauver sont des enfants surdoués entraînés via des jeux vidéo dans une école de guerre spatiale. Le meilleur espoir s’appelle Andrew Wiggin, dit Ender, qui a tout pour devenir le plus grand commandant en chef de l’Histoire. Mais Ender n’a que 6 ans…"],"t":"La stratégie Ender","a":"Orson Scott Card"}}],"345":[{"k":"livre","b":{"isbn":["9782378763619"],"p":["Marjan ne pensait pas que les contes racontés par son père étaient réels… jusqu’à ce qu’elle se retrouve nez à nez avec un griffon blessé dans un manoir anglais. On lui annonce alors que son père, récemment assassiné, n’était pas un vétérinaire ordinaire : il veillait sur les créatures fantastiques, cachées à l’insu des humains. Sous le choc, Marjan apprend qu’elle doit prendre sa place. Mais plus elle soigne ces animaux particuliers, plus elle se rapproche d’une vérité dérangeante…"],"t":"Créatures fantastiques","a":"Kiyash Monsef"}}],"346":[{"k":"livre","b":{"isbn":["9782081494206"],"p":["« Chaân voulait être libre de ses mouvements et de ses paroles. Les chasseurs, seuls, avaient cette liberté. Aussi Chaân avait-elle fait son choix : elle chasserait. » Au cœur de la Préhistoire, Chaân, une jeune fille éprise de liberté, défie les lois de son peuple en apprenant à chasser en secret. Elle est alors rejetée par tous les habitants du village et par son propre père. Chaân est prête à surmonter toutes les épreuves pour conquérir son indépendance."],"t":"Chaân, la rebelle","a":"Christine Féret-Fleury"}}],"347":[{"k":"livre","b":{"isbn":["9782075085755"],"p":["Guillemot est un garçon du pays d’Ys, situé à mi-chemin entre le Monde Réel et le Monde Incertain. Mais d’où lui viennent ses dons pour la sorcellerie que lui enseigne Maître Qadehar ? Et qu’est devenu « Le Livre des Étoiles », qui renferme le secret de puissants sortilèges ? Dans sa quête de vérité, Guillemot franchira la porte qui conduit dans le Monde Incertain, peuplé de monstres et d’étranges tribus…"],"t":"Le livre des Étoiles","a":"Erik l’homme"}},{"k":"choix","l":"Pour découvrir les aventures d’un apprenti assassin","to":253},{"k":"choix","l":"Pour découvrir les aventures d’une jeune fille enlevée au monde des humains","to":206}],"348":[{"k":"livre","b":{"isbn":["9782075156981"],"p":["En Zamonie, tout le monde vit pour et par les livres. Hildegunst Taillemythes, jeune dragon de 77 ans et aspirant écrivain, ne fait pas exception. Quand, sur son lit de mort, son parrain en écriture lui tend un manuscrit qu’il considère comme le meilleur jamais composé, Hildegunst se jure d’en retrouver l’auteur. Il part alors pour Bouquinbourg : « ce pays où la lecture peut rendre fou, où les livres risquent de blesser, d’empoisonner, et même de tuer »."],"t":"La cité des livres qui rêvent","a":"Walter Moers"}}],"349":[{"k":"livre","b":{"isbn":["9782253237617"],"p":["Durant l’été 1922, un événement tragique se produit pour les deux frères Jean et Ferdinand : leur grand-mère qui les élevait jusqu’à présent meurt, ce qui oblige leur père et leur mère à rentrer de Chine pour pouvoir s’occuper des enfants. Lui et son frère ont très hâte de revoir leurs parents… Sauf que les retrouvailles vont très vite les décevoir : à peine descendue du train, leur mère les repousse violemment et en vient même à les gifler, leur ordonnant ensuite de porter les valises."],"t":"Vipère au poing","a":"Hervé Bazin"}}],"350":[{"k":"livre","b":{"isbn":["9782747083447"],"p":["Grégoire déteste l’école. Il déteste tellement l’école, qu’en sixième il a déjà redoublé deux fois. Ce qu’il aime par-dessus tout, c’est bricoler avec son grand-père Léon, avec lequel il a une grande complicité. Pourtant lorsque Grégoire est renvoyé du collège, Léon lui refuse sa protection et le jeune adolescent va devoir accepter de prendre son destin en main…"],"t":"35 kilos d’espoir","a":"Anna Gavalda"}}],"351":[{"k":"livre","b":{"isbn":["9782211307833"],"p":["Minuit-Cinq a dix ans. Tout le monde l’appelle Minuit-Cinq. Même lui a oublié son vrai prénom, Antonin. C’est pareil pour sa sœur Bretelle et leur meilleur ami Emil. Tous les trois ont deux problèmes dans la vie : comment trouver à manger quand on n’a pas un sou ? Comment trouver un coin au chaud quand le vent glacial de décembre balaie la ville de Prague ? Mais pour le moment, la grande affaire de ce Noël, c’est le collier perdu de la princesse Daniela Danilova. Elle a promis une belle somme d’argent à celui ou celle qui le lui retrouvera. Nos trois vagabonds de la vieille ville se demandent s’il n’y aurait pas quelque chose à faire…"],"t":"Minuit-cinq","a":"Malika Ferdjoukh"}}],"352":[{"k":"livre","b":{"isbn":["9782013225205"],"p":["Chaque jour, Totomitl et Pantli, deux guerriers aztèques, doivent faire prisonnier des hommes pour les offrir en sacrifice aux dieux. Telle est la règle de vie du peuple Soleil. Mais en cette année 1517, l’arrivée de soldats espagnols fait basculer la vie des jeunes gens et de tout leur peuple. Qui triomphera ?"],"t":"L’aigle de Mexico","a":"Odile Weulersse"}},{"k":"choix","l":"Pour découvrir un autre roman susceptible de te plaire","to":168}],"353":[{"k":"livre","b":{"isbn":["9782075098861"],"p":["Qui a tué Dédale, le célèbre architecte ? Les suspects ne manquent pas. L’inventeur du labyrinthe où fut enfermé le Minotaure s’était fait beaucoup d’ennemis. Seul Hermès, le plus malin des dieux, est capable de démêler cette énigme. Même s’il lui faut descendre jusqu’aux Enfers pour découvrir la vérité…"],"t":"Les enquêtes d’Hermès : le mystère Dédale","a":"Normandon Richard"}}],"354":[{"k":"livre","b":{"isbn":["9782700280838"],"p":["Grise et Cyrus sont élèves à la prestigieuse Académie des Sciences Occultes et Mécaniques de Celumbre. Une nuit, l’apprentie mécanicienne et le jeune mage échappent de justesse à un enlèvement. Alors qu’ils se détestent, ils doivent fuir ensemble et chercher refuge dans les Rets, sinistre quartier aux mains des voleurs et des assassins. S’ils veulent survivre, les deux adolescents n’ont d’autre choix que de faire alliance…"],"t":"Engrenages et sortilèges","a":"Adrien Tomas"}}],"355":[{"k":"livre","b":{"isbn":["9782266315531"],"p":["Avery Grambs, lycéenne sans histoire et sans le sou, rêve d’une bourse d’études pour entrer à l’université. Son destin bascule soudain quand Tobias Hawthorne, un célèbre milliardaire, lui lègue sa fortune. Cet argent tombe à pic, mais il y a un problème : Avery n’a jamais entendu parler de cet homme ! Pour toucher sa part d’héritage, elle doit néanmoins emménager dans la mystérieuse demeure des Hawthorne. Elle y côtoie les quatre petits-fils du défunt, tous aussi insondables que séduisants… et surtout bien décidés à l’empêcher de subtiliser leur dû ! Happée par un tourbillon de manigances, d’énigmes et de trahisons, Avery va devoir se prêter à un inquiétant jeu de dupes qui pourrait bouleverser sa vie à jamais…"],"t":"Inheritance Games","a":"Jennifer Lynn Barnes"}}],"356":[{"k":"livre","b":{"isbn":["9782075094276"],"p":["Depuis la disparition de sa mère il y a 9 ans, Meggie et son père Mo, un relieur de livres reconnu, consacrent leur vie aux livres et à la lecture. Une nuit, un homme étrange se présente chez eux. Il est à la recherche d’un livre mystérieux et semble prêt à tout pour le retrouver. C’est le début d’une incroyable aventure qui entraîne Meggie et Mo accompagnés de leur tante Elinor, une excentrique bibliophile, dans un vieux village d’Italie."],"t":"Coeur d’encre","a":"Cornelia Funke"}}],"357":[{"k":"livre","b":{"isbn":["9782070629015"],"p":["Stéphane et Romain sont deux amis inséparables, au collège comme au foot, leur passion commune. Lorsque Romain accepte de rejoindre le centre de formation d’un grand club, Stéphane se retrouve bien seul. Arrive alors un jeune Turc, Artun, incroyablement doué à la balle au pied. Mais la présence de cet étranger ne fait pas plaisir à tout le monde. Certains vont même jusqu’à le menacer…"],"t":"En pleine lucarne","a":"Philippe Delerm"}},{"k":"choix","l":"Si tu veux découvrir un autre roman qui parle de foot","to":226}],"358":[{"k":"livre","b":{"isbn":["9782017171638"],"p":["Été 1870, Sherlock Holmes, Arsène Lupin et Irene Adler font connaissance à Saint-Malo. Les trois amis espèrent profiter de leurs vacances en bord de mer, mais le destin leur a réservé une surprise. Un corps s’est échoué sur une plage voisine et le trio se retrouve au beau milieu d’une enquête criminelle. Un collier de diamants a disparu, le mort semble avoir deux identités et une silhouette fantomatique apparaît la nuit sur les toits de la ville. Trois détectives ne seront pas de trop pour résoudre l’énigme de Saint-Malo !"],"t":"Sherlock, Lupin & moi : le mystère de la dame en noir","a":"Irène Adler"}}],"359":[{"k":"livre","b":{"isbn":["9782080246530"],"p":["En cette année 1866, une forte angoisse règne sur les océans. Un monstre marin effrayant a été signalé dans diverses mers par plusieurs navires. Après des mois de navigation, la confrontation avec le monstre a enfin lieu et un choc entre le monstre et la frégate projette par-dessus bord le professeur Aronnax, son domestique Conseil et le harponneur Ned. Tous trois échouent finalement sur le dos du monstre, qui n’est autre qu’un mystérieux sous-marin. C’est alors qu’il font la connaissance du capitaine Nemo, qui refuse de leur rendre la liberté et les embarque dans un des périples les plus extraordinaires de la littérature."],"t":"Vingt mille lieues sous les mers","a":"Jules Verne"}}],"360":[{"k":"livre","b":{"isbn":["9782017038450"],"p":["Parvana a onze ans et n’a jamais connu son pays autrement qu’en guerre. Une guerre de cauchemars qui interdit aux femmes de sortir non voilées ou sans l’escorte d’un homme. Assez grande pour être soumise à ces interdits, Parvana doit trouver une façon de les contourner. Car depuis que les talibans ont emprisonné son père, c’est sur elle seule que repose la survie de la famille…"],"t":"Parvana : Une enfance en Afghanistan","a":"Deborah Ellis"}}],"361":[{"k":"livre","b":{"isbn":["9782081444843"],"p":["L’histoire se passe dans le Paris du XIXe siècle, Mathilde rêve d’une vie de richesses et d’élégance. Elle est l’épouse d’un petit employé du ministère de l’Instruction publique. Un jour, celui-ci arrive avec une invitation pour une fête au Ministère. Elle emprunte un collier à son amie, Jeanne, qui fait partie du beau monde qu’elle rêve de fréquenter. Mais après la soirée, elle s’aperçoit qu’elle a perdu le collier…"],"t":"La parure","a":"Guy de Maupassant"}},{"k":"choix","l":"Si tu veux découvrir un classique de la littérature écrit par cet auteur","to":199}],"362":[{"k":"livre","b":{"isbn":["9782290367117"],"p":["Une princesse visionnaire qui ne laissera personne lui dicter sa conduite. Un soldat idéaliste déchiré entre son cœur et ses devoirs. Une chasseuse intrépide traquant la plus dangereuse des proies. Un traître déterminé à venger le sang de son peuple. Un voleur insaisissable qui multiplie les faux-semblants… Un monde au bord du chaos, dont la clé se trouve peut-être au fond d’une bouteille de fumée…"],"t":"Les voleurs de fumée","a":"Sally Green"}}],"363":[{"k":"livre","b":{"isbn":["9782081449435"],"p":["Afrique. XIXe siècle. La princesse Tchinza, fille de la reine de Zimbaboué, a été faite prisonnière par un roi ennemi qui veut en faire une de ses épouses. Pour échapper à ce triste sort, elle va accepter de servir de guide à des explorateurs anglais qui partent en expédition vers sa ville natale. Le voyage commence. Tchinza et ses compagnons de route vont devoir affronter de nombreux dangers."],"t":"La princesse africaine","a":"Christel Mouchard"}},{"k":"choix","l":"Pour découvrir un autre roman d’aventure en Afrique","to":304},{"k":"choix","l":"Pour découvrir une aventure avec un lion","to":244}],"364":[{"k":"livre","b":{"isbn":["9782211223010"],"p":["Le narrateur, Moshé, raconte son enfance en Pologne dans les années 1920. Très jeune, il apprend à se débrouiller pour lutter contre la misère et la faim. Devenu maroquinier, il s’installe à Paris en 1929 et pratique la boxe en amateur. Il vit la montée de l’antisémitisme dans le pays qui le faisait rêver. Envoyé en 1941 à Pithiviers, il est déporté à Auschwitz. Il découvre l’enfer du camp, les lois de survie, les morts atroces au quotidien. Ses talents de boxeur contribueront-ils à sa survie ?"],"t":"Le ring de la mort","a":"Jean-Jacques Greif"}},{"k":"choix","l":"Pour découvrir un autre roman susceptible de te plaire","to":265}],"365":[{"k":"livre","b":{"isbn":["9782070623242"],"p":["Dans un monde futuriste peut-être pas si lointain, où les hommes vivent dans des tours de centaines d’étages pour échapper à la pollution qui étouffe la terre, le narrateur de quatorze ans tombe amoureux de Céleste, une camarade de classe apparue une seule fois à l’école. La jeune fille, qui n’est jamais revenue, souffre d’une étrange maladie de peau, à l’image de la planète malmenée par les hommes. Pourra-t-elle être soignée ?"],"t":"Céleste, ma planète","a":"Timothée de Fombelle"}}],"366":[{"k":"livre","b":{"isbn":["9782732472300"],"p":["En chassant dans les bois enneigés, Feyre voulait seulement nourrir sa famille. Mais elle a commis l’irréparable en tuant un Fae, et la voici emmenée de force à Prythian, royaume des immortels. Là-bas, pourtant, sa prison est un palais magnifique et son geôlier n’a rien d’un monstre. Tamlin, un Grand Seigneur Fae, la traite comme une princesse. Et quel est ce mal qui ronge le royaume et risque de s’étendre à celui des mortels ? À l’évidence, Feyre n’est pas une simple prisonnière. Mais comment une jeune humaine d’origine aussi modeste pourrait-elle venir en aide à de si puissants seigneurs ?"],"t":"Un palais d’épines et de roses","a":"Sarah J. Maas"}}],"367":[{"k":"livre","b":{"isbn":["9789953318530"],"p":["Basile trouve un gros cahier relié sur un banc, à la sortie du collège. Écrit par une dénommée Angèle, qu’il ne connaît pas, le cahier lui est destiné. Dès la première page, Angèle lui demande de ne lire qu’une page par jour. Que va-t-elle lui révéler ?"],"t":"Une page à la fois","a":"Corinne Albaud"}}],"368":[{"k":"livre","b":{"isbn":["9782848654577"],"p":["Quand le professeur demande à Marcus, devant toute la classe, ce que fait son père comme profession, Marcus invente un gros mensonge : pilote de ligne ! Tout le monde est intéressé, le professeur veut même le rencontrer. Impossible d’avouer la réalité, Marcus va continuer à mentir."],"t":"Vendeur de rêves","a":"Christine Beigel"}}],"369":[{"k":"livre","b":{"isbn":["9782266283021"],"p":["Y a-t-il des êtres humains ailleurs que dans notre galaxie ? C’est la question que se posent le professeur Antelle, Arthur Levain, son second, et le journaliste Ulysse Mérou, lorsque, de leur vaisseau spatial, ils observent le paysage d’une planète proche de Bételgeuse : on aperçoit des villes, des routes curieusement semblables à celles de notre Terre."],"t":"La planète des singes","a":"Pierre Boulle"}}],"370":[{"k":"livre","b":{"isbn":["9782211223614"],"p":["Quand Delphine et Simon suivent leur père chez sa nouvelle amie, ils doivent apprendre à supporter deux enfants qu’ils détestent. Ils se fixent alors un objectif : séparer leur père de cette nouvelle femme et réunir à nouveau leurs parents. Quelles stratégies vont-ils donc mettre en œuvre ? Parviendront-ils à leurs fins ?"],"t":"Les inséparables","a":"Colas Gutman"}},{"k":"choix","l":"Pour découvrir un autre roman susceptible de te plaire","to":231}],"371":[{"k":"livre","b":{"isbn":["9782075187244"],"p":["Olympe de Roquedor est en fuite ! On veut la marier contre sa volonté pour s’emparer du domaine dont elle est l’héritière. Traquée par ses ennemis sur les terres hostiles des Loups de l’Azeillan, la jeune rebelle rencontre Décembre, un ancien soldat borgne, et son complice, le timide et mystérieux Oost. Ensemble, ils vont livrer un combat sans merci pour reconquérir le château de Roquedor…"],"t":"Olympe de Roquedor","a":"Jean-Philippe Arrou-Vignod"}}],"372":[{"k":"livre","b":{"isbn":["9782020977432"],"p":["À la veille de l’éruption du Vésuve en 79, le héros est soupçonné de vol et risque de perdre la vie et celle qu’il aime."],"t":"Les prisonniers de Pompéi","a":"Bertrand Solet"}}],"373":[{"k":"livre","b":{"isbn":["9782211205764"],"p":["Anna avait sept ans à la chute du Mur de Berlin. Elle évoque en pointillés son « musée d’enfance » socialiste, les pénuries, la grisaille, l’embrigadement, la peur des disparitions et de la Stasi, mais aussi l’enthousiasme des pionniers et le cocon rassurant de l’endoctrinement communiste. Mieux informés, les parents ont une attitude ambiguë vis-à-vis du régime, pour protéger leurs enfants."],"t":"Il était une fois dans l’Est","a":"Audren"}}],"374":[{"k":"livre","b":{"isbn":["9782211022309"],"p":["En Afrique du Sud, au temps de l’apartheid, Johnny, douze ans, n’en peut plus de la pauvreté, et des tensions qui règnent dans sa famille. Il décide de quitter les bas quartiers du Cap, pour rejoindre les enfants qui vivent en bande dans les rues du centre-ville. Johnny est attiré par la liberté apparente de la vie de vagabond mais il se retrouve très vite confronté à la dure réalité."],"t":"Sans domicile fixe","a":"Lesley Beake"}}],"375":[{"k":"livre","b":{"isbn":["9782747095051"],"p":["Deux choses très importantes se produisent dans la vie de Spencer, l’été de ses treize ans : sa professeur de sciences lui assigne un projet sur la taxonomie, et Hope emménage dans la maison d’à-côté. Spencer sent tout de suite que Hope est spéciale : elle aime escalader les arbres, adore les anecdotes bizarres sur des sujets inutiles, et surtout, elle ne se moque pas de lui et de ses tics moteurs et vocaux, provoqués par son syndrome de La Tourette. À ses côtés, il a l’impression de faire enfin partie du monde qui l’entoure. Les deux ados grandissent ensemble et nouent des liens intenses, oscillant entre amour et amitié. Car la vie est rarement aussi claire que les taxonomies que Spencer créé, et son histoire avec Hope est pour le moins compliquée…"],"t":"Taxonomie de l’amour","a":"Rachel Allen"}}],"376":[{"k":"livre","b":{"isbn":["9782203084582"],"p":["À la rentrée de 1957, le plus prestigieux lycée de l’Arkansas, réservé aux blancs, accueille pour la première fois neuf étudiants noirs. Molly est l’une d’entre eux. Elle devra endurer tous les rejets : celui de ses amis qui ne comprennent pas son choix, et celui des blancs prêts à tout pour empêcher l’intégration des étudiants noirs."],"t":"Sweet sixteen","a":"Annelise Heurtier"}},{"k":"choix","l":"Si tu veux découvrir un roman sur les inégalités et les violences policières","to":73},{"k":"choix","l":"Si tu veux découvrir un roman sur la discrimination et les stéréotypes","to":197}],"377":[{"k":"livre","b":{"isbn":["9782266267533"],"p":["Harriet Manners, 15 ans, est une geek que personne ne veut fréquenter. Aussi, lorsqu’elle est repérée par un agent de top modèle, Harriet saisit cette chance de se réinventer. Même si cela signifie voler le rêve de sa meilleure amie, s’exposer à la rage de son ennemie jurée Alexa, et s’humilier régulièrement aux yeux de Nick, top model de classe internationale. Alors que Harriet vogue d’un désastre de haute couture à l’autre avec l’aide de son père ultra enthousiaste et de son stalker super-geek, Toby, elle commence à réaliser que le monde de la mode ne semble pas l’apprécier plus que le monde réel. Et lorsque son ancienne vie part en morceaux, une question se pose : Harriet arrivera-t-elle à se métamorphoser avant d’avoir tout gâché ?"],"t":"Geek Girl","a":"Holly Smale"}}],"378":[{"k":"livre","b":{"isbn":["9782017202363"],"p":["Angleterre, 2140. Les adultes peuvent choisir de ne plus mourir s’ils renoncent à faire des enfants. Anna vit depuis presque toujours au Foyer de Grange Hal, un pensionnat pour les Surplus, des enfants qui n’auraient pas dû naître, des enfants dont les parents ont défié la loi en les mettant au monde. Confinée dans l’enceinte du pensionnat, elle travaille très dur, pour effacer leur faute. Anna a tout oublié de son passé. Jusqu’au jour où arrive un jeune garçon qui semble la connaître. Mais qui est ce Peter ? Pourquoi ne la laisse-t-il pas tranquille ?"],"t":"La Déclaration : L’Histoire d’Anna","a":"Gemma Malley"}},{"k":"choix","l":"Pour découvrir un autre roman susceptible de te plaire","to":394}],"379":[{"k":"livre","b":{"isbn":["9782075134040"],"p":["Dans un paisible village du Comté, le jeune Frodon est sur le point de recevoir un cadeau qui changera sa vie à jamais : l’Anneau de Pouvoir. Forgé par Sauron au cœur de la Montagne du Feu, on le croyait perdu depuis qu’un homme le lui avait arraché avant de le chasser hors du monde. À présent, de noirs présages s’étendent à nouveau sur la Terre du Milieu, les créatures maléfiques se multiplient et, dans les Montagnes de Brume, les Orques traquent les Nains. L’ennemi veut récupérer son bien afin de dominer le monde ; l’œil de Sauron est désormais pointé sur le Comté. Heureusement Gandalf les a devancés. S’ils font vite, Frodon et lui parviendront peut-être à détruire l’Anneau à temps."],"t":"Le seigneur des anneaux","a":"J. R. R. Tolkien"}},{"k":"choix","l":"Si l’univers de cet auteur te plait mais que tu veux découvrir un roman plus court","to":307}],"380":[{"k":"livre","b":{"isbn":["9782211228084"],"p":["Quand Ruth Cassel poste sur internet une vieille photo de classe de son père, afin de pouvoir faire la différence entre deux jumelles, sa mère, morte quatre ans auparavant, et sa tante, morte lorsqu’elle était en Terminale, elle n’imagine pas les conséquences de son geste. Et quand une ancienne camarade de son père est assassinée, le passé ressurgit : y-a-t-il un lien entre toutes ces morts ? Le père de Ruth, Martin Cassel, brillant anesthésiste, est soupçonné."],"t":"Le tueur à la cravate","a":"Marie-Aude Murail"}}],"381":[{"k":"livre","b":{"isbn":["9782364746749"],"p":["Le jour où Elias trouve un ourson orphelin blessé, il sait qu’il s’expose à de sérieux problèmes. Fils d’un éleveur de moutons farouchement opposé aux défenseurs des ours qui ravagent les troupeaux dans les Pyrénées, il décide envers et contre tous de sauver et de soigner l’ourson, auquel il s’attache peu à peu."],"t":"Un ours dans la bergerie","a":"Quitterie Simon"}}],"382":[{"k":"livre","b":{"isbn":["9782080257130"],"p":["Petit-Jacques ne restera pas esclave. Profitant de l’évasion de son frère et de sa fiancée, il décide de risquer sa vie pour gagner lui aussi sa liberté. Ensemble, ils vont devenir des « marrons » comme on appelait les fugitifs sur cette île de la Réunion."],"t":"En haut, la liberté","a":"Daniel Vaxelaire"}}],"383":[{"k":"livre","b":{"isbn":["9782021020052"],"p":["Deux nouvelles évoquant deux catastrophes industrielles vécues par deux adolescents : au Japon, en 1956 et en Inde, en 1984. Lorsque le profit est plus important que tout, plus important que la vie d’êtres humains, que la nature, reste-t-il de l’espoir ?"],"t":"Bleu toxic","a":"Christophe Léon"}},{"k":"choix","l":"Pour découvrir un autre roman susceptible de te plaire","to":365}],"384":[{"k":"livre","b":{"isbn":["9782748508499"],"p":["Cléone est une jeune fille de quinze ans, orpheline et capitaine de son vaisseau spatial. Elle découvre une capsule de survie abritant un beau jeune homme blessé. Draco, l’Intelligence Artificielle qui a élevé Cléone, s’oppose au sauvetage car elle a reconnu sur la capsule, le logo de DeltaGen, entreprise multimondiale sulfureuse. Mais Cléone n’en fait qu’à sa tête. C’est le début d’une aventure dangereuse qui va mener Cléone sur la planète EdeN, encore protégée mais objet de convoitises."],"t":"EdeN en sursis","a":"Jeanne-A Debats"}}],"385":[{"k":"livre","b":{"isbn":["9782075143295"],"p":["RAGE… C’est ainsi qu’elle se nomme désormais pour oublier le nom de son enfance, celui d’avant l’exil. Rage a vécu la violence des hommes, la guerre. Et la voilà réfugiée en France, seule, sans aucun repère, se méfiant de tous. Une nuit, sa route croise celle d’un chien, apparemment dangereux, blessé, maltraité. Le sauver devient une nécessité…"],"t":"Rage","a":"Orianne Charpentier"}},{"k":"choix","l":"Si tu veux que je te présente un autre récit d’exil à cause de la guerre","to":245},{"k":"choix","l":"Pour découvrir une lecture simple et très immersive","to":41}],"386":[{"k":"livre","b":{"isbn":["9782364749887"],"p":["La lecture d’un extrait des Misérables et son commentaire sur l’abandon de Cosette chez les Thénardiers déclenche chez Abdou une vive réaction. Une de ses camarades de classe, intriguée, va alors chercher à comprendre qui est Abdou."],"t":"Une preuve d’amour","a":"Valentine Goby"}},{"k":"choix","l":"Pour découvrir un roman ou le héros doit fuir la guerre et la dictature","to":86}],"387":[{"k":"livre","b":{"isbn":["9782211235662"],"p":["Afrique. Sisanda, neuf ans, est malade du cœur. Sa maladie l’empêche de courir et de jouer avec les autres. Il faudrait l’opérer dans un hôpital spécialisé à l’étranger mais cela coûte trop cher. La mère de Sisanda, Maswala, décide de trouver cet argent en gagnant un marathon. Car Maswala aime courir dans les collines autour du village. Elle s’entraîne sans relâche pour essayer de sauver sa fille."],"t":"Mon petit cœur imbécile","a":"Xavier-Laurent Petit"}},{"k":"choix","l":"Pour découvrir un autre roman susceptible de te plaire","to":237}],"388":[{"k":"livre","b":{"isbn":["9782017867036"],"p":["Juillet 1687. Au lendemain d’une fête de nuit au château de Versailles, on découvre le cadavre d’une jeune fille dans le bosquet d’Encelade. À côté du corps, gît un couteau de cuisine aux armes d’Athénaïs de Montespan, l’ancienne favorite de Louis XIV. Par peur du scandale, le roi refuse une enquête officielle dirigée par le chef de sa police. Il choisit de faire appel à son filleul : Louis Alexandre Bontemps. Au cours du premier interrogatoire, le jeune homme rencontre Adélie, une artiste peintre, aussi douée que ravissante."],"t":"Les bosquets de Versailles : Le crime de L’Encelade","a":"Annie Pietri"}}],"389":[{"k":"livre","b":{"isbn":["9782491357115"],"p":["Edward Malone est un jeune journaliste qui aspire à faire ses preuves. Malheureusement pour lui, son rédacteur en chef estime qu’il ne possède pas l’expérience nécessaire pour couvrir des sujets importants. C’est à ce moment-là que Malone rencontre le célèbre professeur Challenger, un scientifique excentrique et controversé qui a été ridiculisé dans la presse pour avoir affirmé l’existence d’un monde préhistorique isolé en Amazonie. Malone voit là une opportunité de prouver sa valeur et décide de l’accompagner lors de sa prochaine expédition."],"t":"Le monde perdu","a":"Sir Arthur Conan Doyle"}}],"390":[{"k":"livre","b":{"isbn":["9782075107341"],"p":["Eté 1915. Anouck a treize ans lorsque sa famille arménienne reçoit l’ordre de quitter Bursa, en Turquie. C’est le début d’un long exode à travers le pays, jalonné de nombreuses étapes, pendant lequel la famille doit lutter pour sa survie. Sur son chemin, Anouck croise Dikran, déporté comme elle, avec qui elle se lie à jamais."],"t":"Dans les yeux d’Anouch","a":"Roland Godel"}}],"391":[{"k":"livre","b":{"isbn":["9782075085748","9782075097765"],"p":["Delphine et Marinette sont bien imprudentes. Elles ouvrent la porte au loup, recueillent un cerf en fuite et invitent les bêtes de la ferme dans la maison transformée en arche de Noé… Un canard part en voyage et ramène une panthère aux yeux d’or. Un mauvais jars mord les jambes des fillettes, qui se réveillent un matin transformées en âne et en cheval. Il se passe des choses bien étranges dès que les parents sont partis."],"t":"Les Contes du chat perché","a":"Marcel Aymé"}},{"k":"choix","l":"Si tu souhaites découvrir un autre livre répondant à tes critères","to":172}],"392":[{"k":"livre","b":{"isbn":["9782211223355"],"p":["« Je n’ai plus que quelques minutes d’électricité par jour et je ne pourrai certainement plus t’envoyer de nouvelles avant un certain temps. » Talia a beau relire le dernier mail de sa mère pour se rassurer, le « certain temps » s’éternise… Cela fait déjà un mois et demi qu’elle s’est installée au cœur de la forêt amazonienne pour empêcher un projet de forages pétroliers. Talia est bien décidée à tout faire pour retrouver sa mère. Quitte à se perdre elle aussi dans la jungle inhospitalière."],"t":"Itawapa","a":"Xavier-Laurent Petit"}}],"393":[{"k":"livre","b":{"isbn":["9782330092368"],"p":["Depuis le divorce de ses parents, chaque dimanche soir, c’est le même déchirement pour Camille. Elle connaît la fissure créée par la garde alternée, elle l’a même apprivoisée avec le temps. Mais aujourd’hui, Camille doit faire un choix. Elle a rendez-vous avec la juge, son avis va être entendu. Désire-t-elle rester à Paris avec son père, sa nouvelle compagne et leur bébé ? Ou bien préfère-t-elle partir avec sa mère en Australie et changer complètement de vie ?"],"t":"Coupée en deux","a":"Charlotte Erlih"}},{"k":"choix","l":"Pour découvrir un autre roman susceptible de te plaire","to":208}],"394":[{"k":"livre","b":{"isbn":["9782747083478"],"p":["Vers 2050 en région parisienne. La société est officiellement divisée en quatre sphères. Linus, quatorze ans, mène une vie privilégiée avec sa famille dans la sphère 1, réservée à l’élite intellectuelle et financière. Il doit bientôt passer l’examen qui sert à classer la population. Il s’inquiète pour son ami Chem, génie de l’informatique mais qui s’attend à être relégué en sphère 3, avec ceux qui dérangent l’ordre établi. Linus se pose des questions sur le mode de classement et décide de bousculer son destin."],"t":"Le destin de Linus Hoppe","a":"Anne-Laure Bondoux"}}],"395":[{"k":"livre","b":{"isbn":["9782211322065"],"p":["Morgan’s Moore, au nord de l’Angleterre. Ses villageois, ses notables, son unique auberge et ses crimes épouvantables… Un crime non élucidé reste à ce point mystérieux que Scotland Yard a dépêché sur place le superintendant Tanyblwch et son jeune adjoint, Pitchum Daybright, tout juste diplômé de la Royal School of Studies in Criminology. Ce dernier voit d’un mauvais œil les interventions de Flannery, la fille des aubergistes, qui est convaincue de pouvoir les aider dans leur enquête. Non seulement, Miss-Je-sais-Tout-sur-Tout a la langue bien pendue, mais elle a le chic pour lui faire monter le rouge aux joues. Il faut dire que la demoiselle est une peste fort charmante…"],"t":"Griffes","a":"Malika Ferdjoukh"}},{"k":"choix","l":"Pour découvrir un autre roman susceptible de te plaire","to":358}],"396":[{"k":"livre","b":{"isbn":["9782812610486"],"p":["1492. Les Taïnos vivent heureux sur leur île des Caraïbes, au sein d’une nature prodigue. Si leurs voisins sont féroces et cruels - on les dit même cannibales -, eux sont réputés pour la douceur de leur caractère. Quoi d’étonnant alors à ce qu’ils accueillent des étrangers venus en nombre par bateaux, avec hospitalité ?"],"t":"La dernière reine d’Ayiti","a":"Élise Fontenaille"}}],"397":[{"k":"livre","b":{"isbn":["9782211227452"],"p":["« Je suis sûre que tu deviendras un jeune homme très bien » dit la maîtresse de CM1 à George. Pas si simple… George, dans son corps de garçon, a la certitude d’être une fille. Il s’est renseigné : il existe des garçons qui deviennent des filles, des « transgenres ». Comment faire comprendre son identité sexuelle à sa mère ? Jouera-t-il le rôle principal féminin dont il rêve, dans la pièce montée à l’école ?"],"t":"George","a":"Alex Gino et Ellen Duda"}},{"k":"choix","l":"Pour découvrir un roman ou les parents rejettent l’homosexualité de leur enfant","to":294},{"k":"choix","l":"Un roman sur les difficultés de s’accepter et d’assumer son homosexualité","to":327}],"398":[{"k":"livre","b":{"isbn":["9782848655017"],"p":["Le narrateur, un garçon de treize ans, raconte comment sa vie au collège est un enfer et comment il a du mal à communiquer avec son père. Il se fait régulièrement intimider, frapper et humilier par une bande de garçons qui le traitent de « pédé ». Seule, son amie Sarah le défend."],"t":"À copier 100 fois","a":"Antoine Dole"}}],"399":[{"k":"livre","b":{"isbn":["9782290173855"],"p":["Un homme abject et terrifiant hante les rues de Londres en commettant les pires forfaits. Ceux qui l’ont croisé restent frappés d’horreur, persuadés d’avoir rencontré le diable en personne. Pourtant, le respectable Dr Jekyll s’obstine à prendre la défense de l’ignoble M. Hyde. Par quel affreux secret les deux hommes sont-ils liés ?"],"t":"L’Étrange Cas du docteur Jekyll et de M. Hyde","a":"Robert Louis Stevenson"}}],"400":[{"k":"livre","b":{"isbn":["9782700236255"],"p":["Lana, lycéenne, vit seule avec sa mère hôtesse de l’air. Mais voilà que cette dernière disparaît et que Lana est à son tour recherchée par de mystérieux assaillants. Une course-poursuite s’engage entre Paris et la Hongrie, en passant par Berlin ou Bruxelles, sur fond de complot autour des OGM."],"t":"Décollage immédiat","a":"Fabien Clavel"}}],"401":[{"k":"livre","b":{"isbn":["9782211239387"],"p":["Dans le monde de Léa et Tom, les rues et les collèges ont des noms de femmes célèbres, les hommes s’occupent des enfants et on apprend aux écoliers que le féminin l’emporte sur le masculin. Il en est ainsi depuis la nuit des temps, et personne ne semble vouloir remettre en cause cet ordre établi. Pourtant, Léa et Tom voient bien que quelque chose ne va pas… Alors, ils se mettent à réfléchir, et détricotent ensemble les clichés de ce monde où règne la domination féminine."],"t":"Renversante","a":"Florence Hinckel"}}],"402":[{"k":"livre","b":{"isbn":["9782812602566"],"p":["Le père d’Héloïse vient de subir une greffe du cœur. À son retour de l’hôpital, sa fille reste distante : et si ce nouveau cœur n’avait pas les mêmes sentiments pour elle ?"],"t":"L’autre cœur","a":"Irène Cohen-Jance"}}],"4 function pushTrail(n){
  const i = trail.lastIndexOf(n);
  if(i >= 0) trail = trail.slice(0, i+1); else trail.push(n);
  if(trail.length > 14) trail = trail.slice(-14);
  try{ sessionStorage.setItem('lac-trail', JSON.stringify(trail)); }catch(e){}
}

/* ---------- couvertures */
function coverHTML(isbn, title, author){

  return '<div class="cover" role="img" aria-label="Couverture non disponible : '+esc(strip(title))+'"><div class="ph c'+(h%5)+'"><span><em>'+title+'</em></span><small>'+esc(author||'')+'</small></div></div>';
}
const strip = s => s.replace(/<[^>]+>/g,'');
function bestCover(isbns, t, a){
  if(isbns.length > 1 && isbns.filter(i => COVERS[i]).length > 1)
    return '<div class="cover duo">'+isbns.filter(i=>COVERS[i]).map(i => coverHTML(i,t,a)).join('')+'</div>';

}

      i === trail.length-1 ? '<span class="now">'+(x===0?'Départ':x)+'</span>' : '<a href="#c'+x+'">'+(x===0?'Départ':x)+'</a> ›').join(' ') + '</nav>';
  }
  html += '<article class="card"><div class="chap-head"><span class="badge">'+(n===0?'Le début':'Chapitre '+n)+'</span>'+tags(n)+'</div><div class="text">';
  let choices = [];
  const books = [];
  for(const b of blocks){
    if(b.k === 'choix'){ choices.push(b); continue; }
    if(choices.length){ html += renderChoices(choices); choices = []; }
    if(b.k === 'p') html += '<p'+(b.h.startsWith('—')?' class="dial"':'')+'>'+b.h+'</p>';
    else if(b.k === 'alerte') html += '<div class="alerte" role="note"><b>Attention !</b>'+b.h+'</div>';
    else if(b.k === 'serie') html += '<div class="serie"><h2><em>'+b.t+'</em></h2><p class="by sub">'+esc(b.a)+'</p></div>';
    else if(b.k === 'livre'){ html += renderBook(b.b); books.push(b.b); }
  }
  if(n === 6) choices.push({l:'Ouvrir le guide au hasard', href:'#hasard'});
  if(n === 93){
    choices.push({l:'Voir les lectures rapides et simples', href:'#livres-simples'});
    choices.push({l:'Voir les classiques de la littérature', href:'#livres-classiques'});
  }
  if(choices.length) html += renderChoices(choices);
  html += '</div></article>';
  html += '<div class="tools">';
  html += '<button class="btn" type="button" data-act="back">'+svg('back')+'Revenir</button>';
  html += '<a class="btn" href="#c0" data-act="restart">'+svg('restart')+'Recommencer</a>';
  html += '<a class="btn" href="#hasard">'+svg('dice')+'Un livre au hasard</a>';
  html += '<a class="btn" href="#livres">'+svg('books')+'Tous les livres</a>';
  html += '</div>';
  return html;
}
function renderChoices(list){
  const isQuestion = list.some(c => c.l.startsWith('«'));
  return '<div class="choices">' + list.map(c => {
    const href = c.href || '#c'+c.to;
    const to = c.to !== undefined ? '<span class="to">→ '+c.to+'</span>' : '<span class="to">→</span>';
    return '<a class="choice" href="'+href+'"><span>'+c.l+'</span>'+to+'</a>';
  }).join('') + '</div>';
}
function renderBook(b){
  const id = b.isbn[0];
  const on = inList(id);
  let cov = bestCover(b.isbn, b.t, b.a);
  if(BDCOV[id]){
    cov = '<button class="stack" type="button" aria-pressed="false" aria-label="Afficher la couverture de la BD" title="Clique pour voir la couverture de l’adaptation en BD">' +
      '<span class="layer l-bd"><span class="cover"><img src="'+BDCOV[id]+'" alt="Couverture de l’adaptation en BD" loading="lazy"></span></span>' +
      '<span class="layer l-book">'+cov+'</span><span class="tag-bd">Roman</span></button>';
  }
  return '<section class="book">' + cov +
    '<div><h2><em>'+b.t+'</em></h2>' + (b.a ? '<p class="by">'+esc(b.a)+'</p>' : '') +
    ((AUDIO[id]||BDS[id]) ? '<div class="cartouches">' : '') +
    (AUDIO[id] ? '<a class="audio" href="'+AUDIO[id].u+'" target="_blank" rel="noopener" title="Ce livre existe en livre audio : '+esc(AUDIO[id].t)+(AUDIO[id].n?' (lu par '+esc(AUDIO[id].n)+')':'')+'">'+svg('casque')+'Audio</a>' : '') +
    (BDS[id] ? '<a class="audio" href="'+BDS[id].u+'" target="_blank" rel="noopener" title="Ce livre existe en bande dessinée : '+esc(BDS[id].t)+' (fiche Bedetheque)">'+svg('bulle')+'BD</a>' : '') +
    ((AUDIO[id]||BDS[id]) ? '</div>' : '') +
    '<div class="resume">' + b.p.map(p => '<p>'+p+'</p>').join('') + '</div>' +
    '<button class="save" type="button" data-save="'+id+'" aria-pressed="'+on+'">'+svg('heart')+'<span>'+(on?'Dans ma liste':'Ajouter à ma liste')+'</span></button>' +
    '</div></section>';
}

/* ---------- calcul (chapitre 47) */
const CALC = [
  {q:'Qu’aimerais-tu ressentir pendant ta lecture ?', name:'emo', opts:[
    ['« Je cherche un frisson… une histoire effrayante »',10],
    ['« Je veux parcourir le vaste monde avec un livre d’aventure »',30],
    ['« Je veux me détendre et rire avec un livre qui fait du bien »',50],
    ['« J’aimerais un thriller, un livre qui me donne une bonne dose d’adrénaline »',70]]},
  {q:'Quel niveau de lecture cherches-tu ?', name:'niv', opts:[
    ['« Une lecture simple, pas prise de tête »',1],
    ['« Un livre tout public, de niveau intermédiaire »',0],
    ['« Peu m’importe le nombre de pages ou le niveau de langue »',2]]},
  {q:'Cherches-tu un livre engagé, qui fait réfléchir sur un sujet de société ?', name:'eng', opts:[['« Oui »',3],['« Non »',0]]}
];
function calcPage(){
  return '<article class="card"><div class="chap-head"><span class="badge">Le calcul</span></div>' +
    '<h1>Fais le calcul</h1><p class="text">Choisis les réponses qui te ressemblent. Tu n’es pas obligé de répondre à toutes les questions. Le total te donne le numéro du chapitre à lire.</p>' +
    calcForm() + '</article>' +
    '<div class="tools"><button class="btn" type="button" data-act="back">'+svg('back')+'Revenir</button><a class="btn" href="#accueil">'+svg('restart')+'Accueil</a></div>';
}
function fr(s){ return s.replace(/« /g,'« ').replace(/ »/g,' »'); }
function calcForm(){
  return '<form class="calc" id="calc">' + CALC.map(g =>
    '<fieldset><legend>'+g.q+'</legend><div class="opts">' + g.opts.map((o,i) =>
      '<div class="opt"><input type="radio" name="'+g.name+'" id="'+g.name+i+'" value="'+o[1]+'"><label for="'+g.name+i+'"><span>'+fr(o[0])+'</span><span class="pts">'+o[1]+'</span></label></div>').join('') +
    '</div></fieldset>').join('') +
    '<div class="result" aria-live="polite" id="calc-res"></div>' +
    '<p style="margin-top:12px"><button class="btn" type="reset">'+svg('restart')+'Effacer mes réponses</button></p>' +
    '<p class="note" style="margin-top:12px">Exemples : un livre d’aventure (30) = chapitre 30. Un livre effrayant (10) + une lecture simple (1) = chapitre 11.</p></form>';
}
function updateCalc(){
  const f = $('#calc'); if(!f) return;
  let sum = 0, any = false;
  for(const g of CALC){ const v = f.querySelector('input[name="'+g.name+'"]:checked'); if(v){ sum += +v.value; any = true; } }
  const res = $('#calc-res');
  if(!any){ res.innerHTML = 'Choisis au moins une réponse.'; return; }
  if(sum === 0){ res.innerHTML = 'Total : 0. Ajoute une autre réponse pour obtenir un chapitre.'; return; }
  res.innerHTML = '<span>Total :</span><span class="sum">'+sum+'</span><a class="btn primary" href="#c'+sum+'">Aller au chapitre '+sum+' →</a>';
}

/* ---------- catalogue */
let filtre = 'tous', recherche = '';
function norm(s){ return strip(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }
function catalogue(){
  return '<h1>Tous les livres</h1><p class="sub">'+BOOKS.length+' livres du guide, par ordre alphabétique. Clique sur une couverture pour lire sa présentation.</p>' +
    '<div class="filters" role="search"><label class="sr" for="q" style="position:absolute;left:-9999px">Chercher un titre ou un auteur</label>' +
    '<input class="search" id="q" type="search" placeholder="Chercher un titre, un auteur…" value="'+esc(recherche)+'" autocomplete="off">' +
    chip('tous','Tous') + chip('simples','Lecture simple') + chip('classiques','Classiques') + chip('audio','Livres audio') + chip('bd','En BD') + '</div>' +
    '<div class="grid" id="grid"></div>';
}
function chip(v, l){ return '<button class="chip" type="button" data-filtre="'+v+'" aria-pressed="'+(filtre===v)+'">'+l+'</button>'; }
function fillGrid(){
  const g = $('#grid'); if(!g) return;
  const q = norm(recherche.trim());
  const list = SORTED.filter(b =>
    (filtre !== 'simples' || b.c % 10 === 1) && (filtre !== 'classiques' || b.c % 10 === 9) && (filtre !== 'audio' || !!AUDIO[b.isbn[0]]) && (filtre !== 'bd' || !!BDS[b.isbn[0]]) &&
    (!q || norm(b.t + ' ' + b.a + ' ' + (b.serie||'')).includes(q)));
  g.innerHTML = list.length ? list.map(b =>
    '<a class="tile" href="#c'+b.c+'">' + bestCoverSingle(b) + ((AUDIO[b.isbn[0]]||BDS[b.isbn[0]]) ? '<span class="badges">'+(AUDIO[b.isbn[0]]?'<span class="casque" title="Existe en livre audio">'+svg('casque')+'</span>':'')+(BDS[b.isbn[0]]?'<span class="casque" title="Existe en BD">'+svg('bulle')+'</span>':'')+'</span>' : '') + '<span class="t"><em>'+b.t+'</em></span><span class="a">'+esc(b.a)+'</span><span class="n">Chapitre '+b.c+'</span></a>').join('')
    : '<p class="empty">Aucun livre ne correspond. Essaie un autre mot.</p>';
}
function bestCoverSingle(b){ const i = b.isbn.find(x => COVERS[x]) || b.isbn[0]; return coverHTML(i, b.t, b.a); }

/* ---------- ma liste */
function maListe(){
  const items = liste.map(i => BOOKS.find(b => b.isbn.includes(i))).filter(Boolean);
  let h = '<h1>Ma liste</h1><p class="sub">Les livres que tu as mis de côté. La liste reste sur cet appareil.</p><article class="card">';
  if(!items.length) h += '<p class="empty">Ta liste est vide. Quand un livre te tente, appuie sur « Ajouter à ma liste ».</p>';
  else h += '<ul class="list">' + items.map(b => '<li>'+bestCoverSingle(b)+'<div class="info"><a href="#c'+b.c+'"><em>'+b.t+'</em></a><br><span class="note">'+esc(b.a)+' · chapitre '+b.c+'</span></div><button class="x" type="button" data-save="'+b.isbn[0]+'">Retirer</button></li>').join('') + '</ul>';
  h += '</article>';
  if(items.length) h += '<div class="tools"><button class="btn primary" type="button" data-act="copy">'+svg('copy')+'Copier ma liste</button><a class="btn" href="#livres">'+svg('books')+'Tous les livres</a></div><p class="note" style="margin-top:12px">Colle ta liste dans ton cahier de textes ou montre-la au professeur documentaliste au CDI.</p>';
  return h;
}

function credits(){
  return `<h1>Crédits et licence</h1><article class="card"><dl class="credits">
  <dt>Le guide original</dt>
  <dd><em>Lire au collège</em>, guide de lecture « dont tu es le héros ».<br>Texte : <b>Benjamin Martin</b>. Illustration de couverture : <b>Pierre Martin</b>.<br>Édition originale : mars 2024.</dd>
  <dt>Licence</dt>
  <dd>Le guide est diffusé sous licence <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.fr" rel="license">Creative Commons Attribution – Pas d’utilisation commerciale – Partage dans les mêmes conditions (CC BY-NC-SA)</a>. Cette adaptation est diffusée sous la même licence : tu peux la partager et la modifier, sans usage commercial, en citant les auteurs et en gardant la même licence.</dd>
  <dt>Cette adaptation</dt>
  <dd>Adaptation en page web pour la classe de M. Lesage (novembre 2026). Modifications apportées au guide original :
  <ul><li>passage du format Twine à une page web, avec recherche, liste de lecture et calcul interactif ;</li>
  <li>correction des liens entre chapitres, de quelques coquilles et de la typographie ;</li>
  <li>ajout des couvertures des livres.</li></ul></dd>
  <dt>Couvertures des livres</dt>
  <dd>Les couvertures appartiennent à leurs éditeurs et ne sont pas couvertes par la licence du guide. Elles sont reproduites en petit format pour aider à reconnaître les livres au CDI. Sources : catalogue de la BnF, Open Library, Leslibraires.fr.</dd>
  <dt>Livres audio</dt>
  <dd>Le cartouche « Audio » signale les livres qui existent en version audio sur Audible (recherche de novembre 2026). Pense aussi à demander au CDI ou à la médiathèque, qui prêtent des livres audio.</dd>
  <dt>Adaptations en BD</dt>
  <dd>Le cartouche « BD » signale les livres adaptés en bande dessinée. Sur la fiche du livre, la couverture de la BD apparaît derrière celle du roman : clique dessus pour passer de l’une à l’autre. Le cartouche renvoie à la fiche de l’adaptation sur <a href="https://www.bedetheque.com/">Bedetheque</a>, la base de données collaborative de la BD.</dd>
  </dl></article>`;
}
function notFound(){
  return '<article class="card"><h1>Page introuvable</h1><p>Ce chapitre n’existe pas.</p><p><a class="btn primary" href="#accueil">Revenir à l’accueil</a></p></article>';
}

/* ---------- routeur */
function route(){
  let h = (location.hash || '#accueil').slice(1);
  let html, nav = '';
  if(h === 'hasard'){
    const n = bookChapters[Math.floor(Math.random()*bookChapters.length)];
    history.replaceState(null, '', '#c'+n); h = 'c'+n;
  }
  if(h === 'c47') h = 'calcul';
  if(/^c\d+$/.test(h)){
    const n = +h.slice(1);
    html = chapter(n);
    nav = n === 132 ? 'themes' : 'guide';
    document.title = (n === 0 ? 'Le début' : 'Chapitre '+n) + ' · Lire au collège';
  } else if(h === 'calcul'){
    html = calcPage(); nav = 'guide'; document.title = 'Le calcul · Lire au collège';
  } else if(h === 'livres' || h === 'livres-simples' || h === 'livres-classiques'){
    if(h === 'livres-simples') filtre = 'simples'; else if(h === 'livres-classiques') filtre = 'classiques';
    html = catalogue(); nav = 'livres'; document.title = 'Tous les livres · Lire au collège';
  } else if(h === 'credits'){
    html = credits(); nav = ''; document.title = 'Crédits et licence · Lire au collège';
  } else if(h === 'ma-liste'){
    html = maListe(); nav = 'liste'; document.title = 'Ma liste · Lire au collège';
  } else {
    html = home(); nav = 'accueil'; document.title = 'Lire au collège';
  }
  view.innerHTML = html;
  document.querySelectorAll('nav.main a').forEach(a => a.removeAttribute('aria-current'));
  document.querySelectorAll('nav.main a').forEach(a => { if(a.dataset.nav === nav) a.setAttribute('aria-current','page'); });
  fillGrid(); updateCalc();
  window.scrollTo(0, 0);
  $('#main').focus({preventScroll:true});
}

/* ---------- événements */
document.addEventListener('click', e => {
  const st = e.target.closest('.stack');
  if(st){ st.classList.remove('moved'); void st.offsetWidth; st.classList.add('moved'); const f = st.classList.toggle('flip'); st.setAttribute('aria-pressed', f); st.setAttribute('aria-label', f ? 'Afficher la couverture du roman' : 'Afficher la couverture de la BD'); st.querySelector('.tag-bd').textContent = f ? 'BD' : 'Roman'; return; }
  const s = e.target.closest('[data-save]');
  if(s){
    const id = s.dataset.save; toggle(id);
    if(s.classList.contains('save')){
      const on = inList(id); s.setAttribute('aria-pressed', on); s.querySelector('span').textContent = on ? 'Dans ma liste' : 'Ajouter à ma liste';
      toast(on ? 'Ajouté à ta liste' : 'Retiré de ta liste');
    } else route();
    return;
  }
  const f = e.target.closest('[data-filtre]');
  if(f){ filtre = f.dataset.filtre; document.querySelectorAll('[data-filtre]').forEach(c => c.setAttribute('aria-pressed', c === f)); fillGrid(); return; }
  const a = e.target.closest('[data-act]');
  if(!a) return;
  if(a.dataset.act === 'back'){ if(history.length > 1) history.back(); else location.hash = '#accueil'; }
  if(a.dataset.act === 'restart'){ trail = []; }
  if(a.dataset.act === 'copy'){
    const items = liste.map(i => BOOKS.find(b => b.isbn.includes(i))).filter(Boolean);
    const txt = 'Ma liste de lecture\n' + items.map(b => '- ' + strip(b.t) + (b.a ? ' (' + b.a + ')' : '')).join('\n');
    try{ navigator.clipboard.writeText(txt).then(() => toast('Liste copiée'), () => toast('La copie n’a pas fonctionné')); }catch(err){ toast('La copie n’a pas fonctionné'); }
  }
});
document.addEventListener('input', e => {
  if(e.target.id === 'q'){ recherche = e.target.value; fillGrid(); }
});
document.addEventListener('change', e => { if(e.target.closest('#calc')) updateCalc(); });
document.addEventListener('reset', e => { if(e.target.id === 'calc') setTimeout(updateCalc, 0); });
let tt;
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 1800); }
window.addEventListener('hashchange', route);
updateCount();
route();
})();
</script>
<script src="/classe-nav.js"></script>
