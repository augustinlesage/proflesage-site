utre roman susceptible de te plaire","to":72}],"219":[{"k":"livre","b":{"isbn":["9782011810366"],"p":["Depuis des générations, la vie de la tribu des Oulhamrs s’est organisée autour du feu. Mais s’ils savent conserver les braises et attiser les flammes, ils sont en revanche incapables d’allumer le feu, qu’ils conservent précieusement dans trois cages gardées jour et nuit par quatre femmes et deux guerriers. Or un jour, au cours d’un affrontement avec une tribu ennemie, les cages où brûlait le Feu, sont détruites…"],"t":"La guerre du feu","a":"J.-H. Rosny aîné"}}],"220":[{"k":"livre","b":{"isbn":["9782211301091"],"p":["Quand Rose Dupin fait son entrée au collège à l’internat des Pierres-Noires, elle ne se doute pas de ce qui l’attend. Elle fait la connaissance de Nadget Mellaoui et de son sourire ravageur, ainsi que d’Ambroise, le fils des gardiens de l’internat, et de son chien Clipper. Il pleut ce jour-là sur Saint-Malo. Mais, depuis la tour de l’internat, ce sont des appels au secours qui pleuvent sous la forme de petits papiers. Qui peut bien envoyer de tels messages ?"],"t":"Le club de la pluie : au pensionnat des mystères","a":"Malika Ferdjoukh"}}],"221":[{"k":"livre","b":{"isbn":["9782012490284"],"p":["Tom est toujours en retard à l’école et n’a pas son pareil pour inventer des excuses farfelues quand il n’a pas fait ses devoirs. Ce qui arrive très souvent. Il faut dire qu’il a d’autres chats à fouetter : trouver de nouvelles façons d’embêter sa sœur, lire des bandes dessinées, gribouiller dans ses cahiers, monter son groupe de musique pop… Sauf que son instituteur, ne l’entend pas de cette oreille : puisque Tom est si distrait, il s’installera tout devant en classe, entre l’insupportable Marcus et la jolie Amy…"],"t":"Tom Gates","a":"Liz Pichon"}}],"222":[{"k":"livre","b":{"isbn":["9782211222839"],"p":["Pour son stage en entreprise de troisième, Louis a trouvé une place dans le salon de coiffure Maïté. L’adolescent, qui n’aime pas le collège, va découvrir, contre toute attente, un univers dans lequel il se plaît et s’épanouit. Mais son père, chirurgien renommé, pense que la coiffure est un métier d’analphabète. Comment Louis va-t-il s’affirmer et briser les idées reçues, pour oser vivre sa nouvelle passion ?"],"t":"Maïté Coiffure","a":"Marie-Aude Murail"}},{"k":"choix","l":"Pour découvrir un autre livre susceptible de te plaire","to":152}],"223":[{"k":"livre","b":{"isbn":["9782266280761"],"p":["Morrigane Crow est une enfant maudite. Au soir du Merveillon, elle mourra. En attendant, tous les maux du monde sont attribués à la pauvre jeune fille. Et comble de l’horreur, avec près d’un an d’avance, les cloches du Merveillon se mettent à sonner ! Morrigane doit se préparer à sa mort imminente ! À moins que Jupiter, son mystérieux et excentrique mécène, ne vienne l’arracher à une mort certaine pour l’entraîner dans le monde magique de Nevermoor…"],"t":"Nevermoor","a":"Jessica Townsend"}},{"k":"choix","l":"Si tu veux découvrir un autre roman jeunesse susceptible de te plaire","to":356}],"224":[{"k":"livre","b":{"isbn":["9782075120807"],"p":["Artemis a un plan pour rétablir la fortune de sa famille. Il a découvert l’existence du peuple des fées et avec l’aide de Butler, son majordome, s’apprête à kidnapper leur capitaine Holly Short pour exiger une rançon. Seul bémol : les fées sont armées, puissantes, terriblement dangereuses et Artemis semble avoir quelque peu sous-estimé leurs pouvoirs. Au moins, il peut se réjouir d’avoir enfin trouvé un adversaire digne de ce nom."],"t":"Artémis Fowl","a":"Eoin Colfer"}},{"k":"choix","l":"Pour découvrir une autre série susceptible de te plaire","to":162}],"225":[{"k":"livre","b":{"isbn":["9782070583638"],"p":["William Legrand s’est exilé sur l’île de Sullivan, au sud des États-Unis, après avoir fait faillite. Sa vie bascule lorsqu’il découvre sur la plage un scarabée doré, puis un message codé. L’énigme le tourmente jusqu’à l’obsession et il se lance alors dans une chasse au trésor, qui mêle pirates et cryptographie."],"t":"Le scarabée d’or","a":"Edgar Allan Poe"}},{"k":"choix","l":"Pour découvrir une autre nouvelle","to":243}],"226":[{"k":"livre","b":{"isbn":["9782700281378"],"p":["Dans son village de Haute-Guinée, Bandian rêve de devenir une star du ballon rond. Sara le féticheur ne lui a-t-il pas prédit qu’il serait un grand footballeur ? Mais pour s’entraîner correctement, il lui faudrait un ballon… un vrai, en cuir."],"t":"Le ballon d’or","a":"Yves Pinguilly"}}],"227":[{"k":"livre","b":{"isbn":["9782070651900"],"p":["Dans le Grand Nord sauvage et glacé, un jeune loup apprend à lutter pour la vie. Les premiers hommes qu’il rencontre, des Indiens, le baptisent Croc-Blanc. Auprès d’eux, il connaît la chaleur du feu de camp, mais aussi le goût du sang. Racheté par un Blanc cupide, il est dressé pour le combat et découvre la haine. Comment vivre avec les hommes quand on est un loup sauvage ?"],"t":"Croc blanc","a":"Jack London"}}],"228":[{"k":"livre","b":{"isbn":["9782070631827"],"p":["Le personnage principal de l’histoire a sombré dans l’alcoolisme et la violence… Il maltraite sa femme et ses animaux. Un soir, alors qu’il est ivre, il arrache l’œil de son chat avec un couteau ! Un autre matin, le narrateur saisit le chat et le pend à la branche d’un arbre où il le laisse mourir… C’est à partir de ce moment-là que les choses prennent une tournure fantastique et terrifiante."],"t":"Le chat noir","a":"Edgar Allan Poe"}},{"k":"choix","l":"Si tu veux découvrir une histoire de fantôme","to":329},{"k":"choix","l":"Si tu préfères une histoire de malédiction","to":207}],"229":[{"k":"livre","b":{"isbn":["9782075130691"],"p":["Un jeune Gallois naïf, ignorant jusqu’à son nom, élevé dans la profonde Forêt Déserte, devient un vaillant chevalier et prend place autour de la Table ronde, parmi les compagnons du roi Arthur. Il a pour nom Perceval. Mais, outre ses aventures périlleuses et ses exploits chevaleresques, son vrai destin est celui de la quête du Graal…"],"t":"Perceval ou la quête du graal","a":"Chrétien De Troyes"}},{"k":"livre","b":{"isbn":["9782080268815"],"p":["En forêt de Brocéliande, une fontaine magique déclenche d’effroyables tempêtes lorsqu’on renverse de l’eau sur son perron. Yvain, jeune chevalier fougueux, décide d’affronter Esclados le Roux, le seigneur des lieux. Il le blesse mortellement et se retrouve pourchassé par les gens du château désireux de venger leur maître. Comble de l’infortune, la jeune femme dont il tombe amoureux est Laudine, la veuve du chevalier vaincu !"],"t":"Yvain ou le chevalier au lion","a":"Chrétien De Troyes"}},{"k":"livre","b":{"isbn":["9782218997549"],"p":["Tristan est le neveu du roi Marc de Cornouailles. Il est chargé par celui-ci de lui amener sa future épouse, Iseut, fille du roi d’Irlande. Malheureusement, lors du voyage, Tristan et Iseut partagent par erreur un philtre d’amour… Le mariage d’Iseut avec Marc ne peut empêcher leur amour de croître… un amour défendu et dangereux !"],"t":"Tristan et Iseut","a":""}}],"230":[{"k":"livre","b":{"isbn":["9782203064317"],"p":["L’ascension du mont Everest, c’est le défi de Mallory. Du haut de ses quinze ans, elle ne craint ni le vide, ni le manque d’oxygène. Elle sait dans quoi elle s’est embarquée. Deux mois de préparation sur les flancs de Qomolangma, pour cinq minutes au sommet, dans la « zone de la mort ». Au pied de la montagne, Mallory est loin d’imaginer tout ce qui l’attend : Un peuple à la culture fascinante, des tonnes d’ordures, les glaciers qui fondent et reculent. L’Everest est bien plus qu’un trophée à conquérir…"],"t":"8848 mètres","a":"Silène Edgar"}},{"k":"choix","l":"Pour découvrir un autre roman","to":195}],"231":[{"k":"livre","b":{"isbn":["9782266245258"],"p":["Cherry a 13 ans et aime inventer des histoires pour embellir son monde et se protéger des autres. Lorsqu’elle déménage avec son père chez sa nouvelle compagne et ses quatre filles, elle se promet de ne plus mentir. Mais lors de son aménagement, elle a terriblement peur de ne pas plaire à sa nouvelle famille et se met de nouveau à raconter des mensonges…"],"t":"Cœur cerise","a":"Cathy Cassidy"}}],"232":[{"k":"livre","b":{"isbn":["9782266283304"],"p":["Hazel, 16 ans, est atteinte d’un cancer. Son dernier traitement semble avoir arrêté l’évolution de la maladie, mais elle se sait condamnée. Bien qu’elle s’y ennuie passablement, elle intègre un groupe de soutien, fréquenté par d’autres jeunes malades. C’est là qu’elle rencontre Augustus, un garçon en rémission, qui partage son humour et son goût pour la littérature. Entre les deux adolescents, l’attirance est immédiate. Et malgré les réticences d’Hazel, qui a peur de s’impliquer dans une relation dont le temps est compté, leur histoire d’amour commence…"],"t":"Nos étoiles contraires","a":"John Green"}},{"k":"choix","l":"Pour découvrir un autre roman susceptible de te plaire","to":246}],"233":[{"k":"livre","b":{"isbn":["9782841160297"],"p":["Charlie et son copain vivent une époque trouble, celle de la montée d’un régime politique extrême : l’État brun. Le régime « brun » multiplie les interdictions dans la ville : suppression des chats non bruns, puis suppression des chiens non bruns, puis du journal de la ville, puis les maisons d’édition et enfin les Hommes qui ont possédé un chat ou un chien non brun."],"t":"Matin Brun","a":"Franck Pavloff"}},{"k":"choix","l":"Si tu veux un autre livre simple et engagé qui parle de la guerre et de l’exil","to":41}],"234":[{"k":"livre","b":{"isbn":["9782253005377"],"p":["Dans le Pacifique, un yacht, le Sloughi, est en perdition. À bord, quinze enfants de huit à quatorze ans. Pas un adulte avec eux ; le bateau a rompu mystérieusement ses amarres dans un port de la Nouvelle-Zélande alors que les enfants s’apprêtaient à entreprendre une croisière, et que tout l’équipage se trouvait à terre. La tempête précipite le Sloughi sur des écueils et les enfants, non sans peine, arrivent sur une île déserte. Les longues « vacances » commencent… Pour subsister, les enfants chassent, pêchent, dressent des animaux, cultivent. Hélas ! des rivalités divisent la petite colonie et de redoutables bandits abordent le rivage."],"t":"Deux ans de vacances","a":"Jules Verne"}},{"k":"choix","l":"Si tu veux découvrir une autre aventure avec de jeunes enfants qui doivent se débrouiller pour survivre sur une île déserte","to":139}],"235":[{"k":"livre","b":{"isbn":["9782081480346"],"p":["Ovide s’inspire des récits et légendes de la mythologie et se concentre sur le thème de la transformation : métamorphoses d’êtres humains en animaux, plantes, astres, etc. Chaque métamorphose provient de la volonté des dieux qui récompensent ou punissent les hommes."],"t":"16 métamorphoses d’Ovide","a":"Ovide"}}],"236":[{"k":"livre","b":{"isbn":["9782075128780"],"p":["Lorsqu’ils embarquent comme stagiaires sur le vaisseau de Chien-de-la-lune, Xâvier le stratège, Mörgane la devineresse et leur ami Mârk ignorent la périlleuse mission de leur capitaine : contrer la flotte de guerre du Khan qui menace de prendre le contrôle de la galaxie. Sur eux repose désormais la survie de l’empire…"],"t":"Les maîtres des brisants","a":"Erik L’Homme"}},{"k":"choix","l":"Pour découvrir un autre roman susceptible de te plaire","to":344}],"237":[{"k":"livre","b":{"isbn":["9782203241817"],"p":["Comme pour la plupart des jeunes filles dans les années 1960, l’avenir de Catherine est tout tracé : se marier, avoir des enfants, puis… s’en occuper le plus clair de son temps. Un jour, elle est contrainte de rentrer du collège en courant. C’est une révélation : quel sentiment de force, de liberté ! Mais courir, surtout pour une femme, est une chose alors impensable. Pourtant Catherine s’interroge, rêve d’une vie différente, s’entête… Jusqu’où sa détermination la mènera-t-elle ?"],"t":"La fille d’avril","a":"Annelise Heurtier"}}],"238":[{"k":"livre","b":{"isbn":["9782290225370"],"p":["Quand le capitaine Louis Cornbutte disparaît au large de la Norvège, son père refuse de croire à sa mort. Le vieux marin organise alors une expédition pour sillonner l’Arctique à la recherche de son fils. Froid polaire, prison de glace, hivernage forcé sur la banquise, bandes d’ours affamés, rien ne sera épargné à l’équipage… pas même la fourberie d’un traître !"],"t":"Un hivernage dans les glaces","a":"Jules Verne"}}],"239":[{"k":"livre","b":{"isbn":["9782211238397"],"p":["Aux trois gentilshommes mousquetaires Athos, Porthos et Aramis, toujours prêts à en découdre avec les gardes du Cardinal de Richelieu, s’associe le jeune gascon d’Artagnan fraîchement débarqué de sa province avec pour ambition de servir le roi Louis XIII. Engagé dans le corps des mousquetaires, d’Artagnan s’éprend de l’angélique Constance Bonacieux. En lutte contre la duplicité et l’intrigue politique, les quatre compagnons trouveront en face d’eux une jeune anglaise démoniaque et très belle, Milady, la redoutable espionne du Cardinal. D’Artagnan seul échappe à ses agents. Mais rapportera-t-il à temps à la Reine de France, Anne d’Autriche, les ferrets qu’elle a remis à son amant, le duc de Buckingham ?"],"t":"Les trois mousquetaires","a":"Alexandre Dumas"}},{"k":"choix","l":"Pour découvrir un autre roman de cape et d’épée","to":204},{"k":"choix","l":"Si tu veux découvrir un autre classique du même auteur","to":89}],"240":[{"k":"livre","b":{"isbn":["9782266176545"],"p":["Jeune fille sans histoire, Tara apprend qu’elle est une sortcelière. Ce qu’elle trouve plutôt ringard… Elle a à peine le temps de digérer la nouvelle que sa maison est attaquée par les envoyés de Magister, le Maître des Sangraves ! Elle découvre alors que sa mère, disparue des années plus tôt, est toujours vivante et prisonnière du sinistre Magister. Décidée à la retrouver coûte que coûte, Tara - qui ne maîtrise pas encore ses dons - part sur AutreMonde, la planète où règne la magie. Accompagnée de son arrière-grand-père transformé en labrador par un sort raté, Tara découvre des créatures fascinantes, un Palais farceur, des peuples comme les vampyrs, les dragons ou les nains. Si certains deviennent des amis, le pouvoir trop puissant de la jeune fille attire aussi des convoitises malveillantes…."],"t":"Tara Duncan : Les Sortceliers","a":"Sophie Audouin-Mamikonian"}},{"k":"choix","l":"Si tu veux découvrir une autre série de romans jeunesse","to":170},{"k":"choix","l":"Si tu veux découvrir l’histoire d’une « vétérinaire » pas comme les autres","to":345},{"k":"choix","l":"Si tu veux découvrir l’histoire d’un magicien sans pouvoir","to":257},{"k":"choix","l":"Si tu veux découvrir une aventure se déroulant dans l’univers des contes","to":335},{"k":"choix","l":"Si tu veux découvrir un roman simple et rapide","to":321}],"241":[{"k":"livre","b":{"isbn":["9782070658374"],"p":["Dans les rues de Kinshasa, la vie n’est pas facile. Obligé de voler pour manger, Bilia est emprisonné. Mais lors d’un match entre les jeunes détenus et les enfants du quartier, un journaliste remarque ce garçon au talent exceptionnel. Il lui propose de quitter l’Afrique pour tenter de faire carrière en Europe. C’est la chance de sa vie !"],"t":"Rêve de foot","a":"Paul Bakolo Ngoi"}},{"k":"choix","l":"Si tu veux découvrir un autre roman qui parle de foot","to":357},{"k":"choix","l":"Pour découvrir un livre simple qui parle à la fois de foot et d’égalité fille-garçon","to":212}],"242":[{"k":"livre","b":{"isbn":["9782352046783"],"p":["Mieux que tous les livres de contes de fées : elles sont pirates, scientifiques, espionnes, sportives, chanteuses, guerrières, reines, romancières… Cent femmes aux vies extraordinaires qui brisent les stéréotypes et encouragent filles et garçons à suivre leurs rêves."],"t":"Histoires du soir pour filles rebelles","a":"Francesca Cavallo et Elena Favilli"}}],"243":[{"k":"livre","b":{"isbn":["9782080722867"],"p":["Récupérer la photographie compromettante du roi de Bohême chez son ancienne maîtresse, la plus rusée et la plus énigmatique des femmes ; déjouer le vol, en plein cœur de la City, de trente mille napoléons dormant dans la cave d’une banque ; expliquer la mort mystérieuse d’une jeune fille quelque temps avant son mariage : voilà des défis à la hauteur de Sherlock Holmes !"],"t":"Trois aventures de Sherlock Holmes : Un scandale en Bohême ; La ligue des rouquins ; Le ruban moucheté","a":"Sir Arthur Conan Doyle"}}],"244":[{"k":"livre","b":{"isbn":["9782070631896"],"p":["Tartarin est le héros de Tarascon, pays de soleil et d’exagération. Il n’a peut-être pas le corps d’un athlète, mais il est le roi de la chasse à la casquette. Sans parler de ses exploits exotiques et… quelque peu fictifs. Doué d’une imagination hors du commun, Tartarin est en effet un brin vaniteux, pour ne pas dire mythomane. À l’affût dans son jardin, derrière un minuscule baobab en pot, il rêve tout haut d’aventures et de gloire. Jusqu’au jour où il se retrouve, presque malgré lui, en partance pour une chasse aux grands lions d’Afrique…"],"t":"Tartarin de Tarascon","a":"Alphonse Daudet"}},{"k":"choix","l":"Si tu souhaites découvrir un autre roman avec un lion","to":149}],"245":[{"k":"livre","b":{"isbn":["9782221202982"],"p":["Il n’y a pas d’âge pour être un héros. Max, 13 ans, a quitté à contrecœur les États-Unis pour suivre sa famille à Bruxelles. Quand il découvre un jeune réfugié syrien, Ahmed, caché dans le sous-sol de sa nouvelle maison, il décide de l’aider sans en parler à ses parents. L’amitié entre les deux garçons grandit au fil des jours, mais avec les attentats terroristes de 2015, les contrôles policiers sont renforcés et Ahmed risque à tout moment d’être arrêté et renvoyé en Syrie. Avec l’aide de ses camarades, Max va tout faire pour éviter ce drame."],"t":"Le garçon du sous-sol","a":"Katherine Marsh"}}],"246":[{"k":"livre","b":{"isbn":["9782017038177"],"p":["Poppy et Rune sont amoureux depuis l’enfance. Ils pensaient que rien ni personne ne pourrait jamais les séparer. Jusqu’au jour où Rune part pour deux ans dans sa Norvège natale. Pourquoi Poppy cesse-t-elle alors de répondre aux appels de Rune ? Pourquoi coupe-t-elle les ponts, sans raison, sans explication ? Rune a le sentiment qu’on lui arrache le cœur. Poppy, elle, a le cœur brisé par un secret bien trop lourd. La vie leur laissera-t-elle le temps de se retrouver et de s’aimer ?"],"t":"Mille baisers pour un garçon","a":"Tillie Cole"}}],"247":[{"k":"livre","b":{"isbn":["9782266108157"],"p":["L’enfant noir grandit dans un village de Haute-Guinée où le merveilleux côtoie quotidiennement la réalité. Son père, forgeron, travaille l’or au rythme de la harpe des griots et des incantations aux génies du feu et du vent. Respectée de tous, sa mère jouit de mystérieux pouvoirs sur les êtres et les choses. Elle sait détourner les sortilèges et tenir à l’écart les crocodiles du fleuve Niger. Aîné de la famille, le petit garçon est destiné à prendre la relève de son père à l’atelier et, surtout, à perpétuer l’esprit de sa caste au sein du village. Mais son puissant désir d’apprendre l’entraînera inéluctablement vers d’autres horizons, loin des traditions et des coutumes de son peuple."],"t":"L’enfant noir","a":"Camara Laye"}}],"248":[{"k":"livre","b":{"isbn":["9782266335218"],"p":["Quand la vie prend un virage aussi terrible qu’inattendu, comment se réinventer et garder espoir dans l’avenir ? Léa a 16 ans, un talent immense et un rêve à réaliser. Entraînée par son père, qui est à la fois son modèle, son meilleur ami et son confident, elle avance avec confiance vers cet avenir tout tracé. À 17 ans, Anthony, obligé de faire face à l’absence de son père et aux gardes à vue de son frère, ne rêve plus depuis longtemps. Ils se sont croisés une fois par hasard ; ils n’auraient jamais dû se revoir. Pourtant, lorsque la vie de Léa s’écroule, Anthony est le seul à pouvoir l’aider à se relever. Leurs destinées s’en trouvent à jamais bouleversées."],"t":"Le Syndrome du spaghetti","a":"Marie Vareille"}}],"249":[{"k":"livre","b":{"isbn":["9782081521490"],"p":["Les animaux de la ferme de M. Jones se révoltent contre leur maître. Ils prennent le pouvoir et chassent les hommes. Ils instaurent de nouveaux principes pour l’égalité entre les animaux, et les cochons semblent bien décidés à faire respecter ces commandements. L’espoir des animaux perdurera-t-il ? Comment évoluera ce nouveau « régime » ?"],"t":"La ferme des animaux","a":"George Orwell"}},{"k":"choix","l":"Pour découvrir un autre classique","to":277}],"250":[{"k":"livre","b":{"isbn":["9782874231698"],"p":["2064. Suite à la montée inexorable des eaux, la Terre devient progressivement inhabitable. Les plus riches qui ont pu survivre en payant le voyage vers une nouvelle planète, « Reborn », en refusent désormais l’accès aux nouveaux immigrants. Les parents de Chuong doivent s’exiler et payent les services d’un passeur mais se font arrêter dès leur arrivée sur Reborn. Que va devenir Chuong sur cette planète où il est pourchassé car considéré comme un invasif ?"],"t":"Reborn : Le nouveau monde","a":"Thierry Robberecht"}},{"k":"choix","l":"Pour découvrir une planète menacée par la cupidité des hommes","to":384},{"k":"choix","l":"Si tu veux découvrir une aventure drôle et farfelue dans l’espace","to":50},{"k":"choix","l":"Si tu veux des batailles spatiales et des guerres interplanétaires","to":236},{"k":"choix","l":"Si tu veux découvrir un classique de la science-fiction","to":369}],"251":[{"k":"livre","b":{"isbn":["9782092595398"],"p":["Dans un monde recouvert par la glace, Cendre, 11 ans, a été abandonné par ses parents et vit sous la tutelle d’un yéti taciturne. Lorsqu’il révèle le pouvoir de dompter les monstres par son chant, il est recruté par un équipage d’aventuriers qui sillonne l’immensité à bord de leur traîneau, le Frostheart…"],"t":"Frostheart","a":"Jamie Littler"}}],"252":[{"k":"livre","b":{"isbn":["9782211111591"],"p":["C’est l’automne ; les nuages bas et gris sont remplis d’eau, le vent agite les arbres faisant valser les feuilles au-dessus d’Enid, la plus jeune des sœurs Verdelaine. En petite dernière de la fratrie, on pourrait croire qu’il est difficile pour elle de s’imposer mais elle a tout à fait sa place parmi ses quatre sœurs : la discrète et rêveuse Hortense, la coquette et bavarde Bettina, la sérieuse et ordonnée Geneviève et l’adulte responsable de la famille Charlie. Cette dernière a pris en charge tout ce petit monde, depuis la mort de leurs parents dans un accident de voiture. Les sœurs habitent dans une grande bâtisse, la Vill’Hervé, pleine de charme, de grincements en tout genre et de courants d’air, à la chaudière capricieuse, à l’escalier tordu et aux portes qui claquent. Quant aux parents disparus, leur présence fantomatique est d’un grand soutien pour les filles, devant lesquelles ils apparaissent de temps à autre."],"t":"Quatre sœurs","a":"Malika Ferdjoukh"}},{"k":"choix","l":"Pour découvrir quatre autres sœurs célèbres de la littérature","to":279}],"253":[{"k":"livre","b":{"isbn":["9782290383520"],"p":["Au royaume des Six-Duchés, le prince Chevalerie, de la famille régnante des Loinvoyant, renonce à devenir roi-servant le jour où il apprend l’existence de Fitz, son fils illégitime. Le bâtard grandit à Castelcerf, sous l’autorité de Burrich, le maître d’écurie. Mais le roi Subtil exige que Fitz reçoive une éducation princière. L’enfant découvre bientôt que le dessein du monarque est tout autre : faire de lui un assassin au service du pouvoir."],"t":"L’Assassin Royal","a":"Robin Hobb"}}],"254":[{"k":"livre","b":{"isbn":["9782092588208"],"p":["Je m’appelle Alassane, j’ai 15 ans et déjà je dois quitter ma famille et mon pays. M’en aller me fend le cœur, mais depuis la mort de mon père et la perte des terres que nous cultivions, je n’ai plus d’avenir ici. Je m’en vais donc en trouver un ailleurs. Le chemin jusqu’à la France promet d’être long et semé d’embûches, entre les passeurs qui demandent toujours plus d’argent et les murs de barbelés érigés aux portes de l’Europe. Pourtant ma décision est prise : je pars pour un ailleurs meilleur."],"t":"Ailleurs meilleur","a":"Sophie Adriansen"}}],"255":[{"k":"livre","b":{"isbn":["9782266203227"],"p":["Yann et ses six frères aînés, tous jumeaux, fuient la violence de leurs parents, en marchant jusqu’à l’océan."],"t":"L’enfant océan","a":"Jean-Claude Mourlevat"}},{"k":"choix","l":"Pour découvrir la version romancée d’un autre conte","to":18}],"256":[{"k":"livre","b":{"isbn":["9782075137737"],"p":["Cette chronique familiale prend place aux États-Unis pendant la guerre de Sécession. Mme March, en l’absence de son mari, pasteur servant comme aumônier dans l’armée, élève courageusement leurs quatre filles, âgées de seize à onze ans. Malgré l’inquiétude et les difficultés matérielles, les quatre sœurs forment avec leur mère une famille très unie. Lorsque les épreuves surviennent, les jeunes filles les affrontent avec courage, mettant en exergue la sororité qui les unit, et la fidélité des amies véritables."],"t":"Les quatre filles du docteur March","a":"Louisa May Alcott"}}],"257":[{"k":"livre","b":{"isbn":["9782075139151"],"p":["Kelen, 16 ans, est l’héritier d’une des grandes familles qui se disputent le trône de la cité. Il prépare son premier duel pour devenir mage. Mais ses pouvoirs ont disparu. Il doit ruser, quitte à risquer l’exil, voire pire. Ses seuls soutiens : deux acolytes explosifs - Furia, la vagabonde imprévisible, et Rakis, un chacureuil féroce et acerbe."],"t":"L’anti-magicien","a":"Sébastien de Castell"}}],"258":[{"k":"livre","b":{"isbn":["9782266251020"],"p":["Trois cent ans ont passé et les États-Unis ont sombré dans l’oubli. De leurs ruines est née une monarchie de castes. Mais un jeu de téléréalité pourrait bien changer la donne… Trente-cinq jeunes filles participent à ce jeu qui leur propose de troquer un destin misérable contre un monde de paillettes. C’est l’occasion unique d’habiter dans un palais et de conquérir le cœur de l’héritier du trône. Mais pour America Singer, ce jeu relève plutôt du cauchemar. Cela signifie renoncer à son amour interdit avec Aspen, un soldat de la caste inférieure. Quitter sa famille. Vivre jour et nuit sous l’œil des caméras…"],"t":"La sélection","a":"Kiera Cass"}}],"259":[{"k":"livre","b":{"isbn":["9782010015595"],"p":["Lemuel Gulliver est chirurgien de marine. Au cours de ses périples, il va découvrir quatre étranges contrées peuplées de bizarres autochtones. Il échoue d’abord sur l’île des Lilliputiens, petits bonshommes bagarreurs d’une quinzaine de centimètres de hauteur, dont la société se divise entre ceux qui ouvrent les œufs à la coque par le gros bout et ceux qui ne l’entament que par le petit. Après avoir échappé aux Lilliputiens, il débarque chez les géants de Brobdingnag, puis sur l’île volante de Laputa et enfin au paradis terrestre des Houyhnhnms… Dans ce récit fantastique à la fois satirique et philosophique, Swift caricature avec humour les travers de la société anglaise, qui sont ceux de toute société humaine."],"t":"Les voyages de Gulliver","a":"Jonathan Swift"}},{"k":"choix","l":"Si tu souhaites découvrir un autre roman d’aventure","to":389}],"260":[{"k":"livre","b":{"isbn":["9782075107907"],"p":["Will passe de belles vacances avec sa mère en Indonésie. Un jour, il réalise son rêve : une promenade à dos d’éléphant, le long de la plage. Mais c’est à ce moment que frappe le tsunami dévastateur. Oona l’éléphante s’enfuit à temps vers la forêt, sauvant la vie du garçon. Perdu au cœur de l’épaisse végétation, Will n’est pas seul au monde : l’éléphante fait de lui un enfant de la jungle…"],"t":"Enfant de la jungle","a":"Michael Morpurgo"}},{"k":"choix","l":"Pour découvrir un autre roman jeunesse se déroulant dans la jungle","to":392},{"k":"choix","l":"Pour découvrir les aventures d’un autre enfant sauvage","to":309},{"k":"choix","l":"Si tu veux participer à une curieuse expédition scientifique dans la jungle","to":389}],"261":[{"k":"livre","b":{"isbn":["9782266314343"],"p":["À l’Ecole de Danse de l’Opéra de Paris, c’est l’effervescence. Les filles de la 6e division, les plus jeunes de l’école, sont en compétition pour deux rôles dans un ballet à Garnier. Certaines, comme Constance, se jettent dans le travail, d’autres à l’image de Zoé, se rebellent. Du haut de ses 11 ans, Maïna, elle, ne semble pas concernée. Elle aide ses amis, les encourage, les rassure… sans jamais penser à elle. Elle ne semble même pas consciente qu’elle pourrait être choisie. Alors, elle s’interroge : a-t-elle sa place dans une école d’élite où tous les élèves sont concurrents ? Comment concilier sa passion, son ambition, et ses amitiés ?"],"t":"20 allée de la danse : Amies et rivales","a":"Elizabeth Barféty"}}],"262":[{"k":"livre","b":{"isbn":["9791097577308"],"p":["Fabled Lands est un véritable jeu de rôle en solo dans un monde totalement ouvert. Passez d’un livre à l’autre, dans l’ordre que vous voulez, pour parcourir les régions contrastées qui composent la carte. Guerrier, mage, voleur, troubadour, prêtre ou simple voyageur, choisissez votre destin et vivez comme le plus grand héros ou la plus vile crapule. Au fil des quêtes et de vos explorations, faites-vous des alliés et des ennemis, découvrez des lieux merveilleux, devenez plus fort, obtenez du matériel, achetez un navire, un équipage et même une maison, offrez-vous la bénédiction d’un dieu ou reniez-le pour un autre et parcourez les terres fabuleuses en toute liberté dans cette série de livres-jeux d’une richesse inédite."],"t":"Fabled Lands","a":"Dave Morris et Jamie Thomson"}}],"263":[{"k":"livre","b":{"isbn":["9782075167697"],"p":["Eté 1914. Dans la ferme de son père, en Angleterre, Albert grandit en compagnie de son cheval, Joey. En France, la petite Emilie joue dans un verger avec ses frères, alors qu’en Allemagne, Friedrich travaille comme à l’accoutumée dans sa boucherie. Pendant ce temps, des armées se préparent à s’affronter dans le cauchemar de la guerre. Dès lors, le destin de Joey est tracé. Vendu aux soldats anglais, il partagera leur existence et leur lutte pour survivre dans l’enfer des champs de bataille. Albert et Joey se reverront-ils ?"],"t":"Cheval de guerre","a":"Michael Morpurgo"}}],"264":[{"k":"livre","b":{"isbn":["9782070630004"],"p":["Ce livre est le fruit d’un réel échange épistolaire entre une mère japonaise et son fils au cours de la Seconde Guerre mondiale : d’où le titre alors que la famille n’habite pas Hiroshima. Elle est une vraie mère courage qui s’épuise pour subvenir aux besoins des siens mais trouve toujours le temps pour écrire, avec beaucoup de sagesse, de dignité et d’amour, à son fils qui la sollicite de manière très aimante, mêlée parfois d’un peu d’égoïsme ; leur relation très fusionnelle a des accents universels."],"t":"L’enfant d’Hiroshima","a":"Isoko et Ichirô Hatano"}}],"265":[{"k":"livre","b":{"isbn":["9782092582947"],"p":["Fleur, 16 ans, ne prend pas grand-chose au sérieux. Lorsqu’elle débarque dans le club de boxe du coin, c’est un peu pour rire (et par défi). Mais taper dans un sac, c’est étrangement satisfaisant. Alors Fleur y retourne, pour s’améliorer, au grand dam de sa mère surprotectrice et de son petit copain qui apprécie moyennement son corps plus musclé et son appétit d’ogre. Et si casser son image de fille lisse pour suivre sa passion et monter sur le ring était le premier pas pour être libre ?"],"t":"Sois belle et bats toi","a":"T.S. Easton"}}],"266":[{"k":"livre","b":{"isbn":["9782290173879"],"p":["La famille Otis, de riches Américains, s’installent en Angleterre avec leurs quatre enfants dans un manoir dont les anciens propriétaires prétendent qu’il est hanté. Les Américains n’en croient pas un mot et prennent possession des lieux sans se soucier de ce fantôme. Pourtant, ce dernier est bien décidé à les terroriser."],"t":"Le fantôme de Canterville","a":"Oscar Wilde"}}],"267":[{"k":"livre","b":{"isbn":["9782211230384"],"p":["Lorsque Phénix et sa petite sœur Sacha acceptent d’être raccompagnées par M. Smith, le charismatique professeur d’anglais de Phénix, elles instaurent un rapprochement avec celui que tous les élèves trouvent si charmant et sympathique. M. Smith emménage avec Erika, leur mère, seule depuis son divorce. Cet homme est-il si extraordinaire ? La jeune Phénix ne devrait-elle pas être alertée par ses sautes d’humeur, ses reproches blessants ? Elle ignore encore que le pire reste à venir."],"t":"Tous les héros s’appellent Phénix","a":"Nastasia Rugani"}},{"k":"alerte","h":"Téléphone au 119 si tu es victime ou témoin de maltraitance. L’appel est gratuit et te permet d’entrer en contact avec des professionnels. (24 heures sur 24 et 7 jours sur 7)."},{"k":"choix","l":"Pour découvrir un autre roman où deux sœurs se protègent l’une l’autre","to":284}],"268":[{"k":"livre","b":{"isbn":["9782012490192"],"p":["Au temps des croisades, en Angleterre, Ivanhoé se voit défié par le chevalier saxon Brian de Bois-Guilbert. De tournoi en duel, de bataille en attaque de château fort, deux camps s’affrontent : Normands contre Saxons, adversaires contre partisans du Prince Jean. Seul le mystérieux Chevalier Noir semble vraiment maître de la situation."],"t":"Ivanhoé","a":"Walter Scott"}}],"269":[{"k":"livre","b":{"isbn":["9782211124485"],"p":["Dans la petite île d’Ithaque, Pénélope et son fils Télémaque attendent Ulysse, leur époux et père. Voilà vingt ans qu’il est parti pour Troie et qu’ils sont sans nouvelles de lui. De l’autre côté des mers, Ulysse a pris le chemin du retour depuis longtemps déjà. Mais les tempêtes, les monstres, les géants, les dieux parfois, l’arrêtent ou le détournent de sa route."],"t":"L’Odyssée","a":"Homère"}},{"k":"choix","l":"Si tu veux découvrir cette œuvre autrement","to":216}],"270":[{"k":"livre","b":{"isbn":["9782010009167"],"p":["Au Ve siècle avant Jésus-Christ, la vie de Timoklès et celle de sa sœur basculent brusquement le jour où leur père est banni de la cité pour dix ans. Dès lors, l’aventure commence : exil, naufrage, pirates… Les jeunes gens ne sont pas au bout de leurs surprises."],"t":"Le messager d’Athènes","a":"Odile Weulersse"}}],"271":[{"k":"livre","b":{"isbn":["9782070617197"],"p":["« J’étais un rat ! » affirme Roger. Mais maintenant, qui est-il ? Un monstre effrayant qui hante les égouts, rapporte le journal à sensation. Un phénomène de foire, prétend M. Lachignole, le forain. Un excellent passe-partout, espère Billy, le voleur. Et s’il n’était qu’un petit garçon ordinaire qui se conduit parfois de manière un peu bizarre ?"],"t":"J’étais un rat","a":"Philip Pullman"}},{"k":"choix","l":"Pour découvrir la version romancée d’un autre conte","to":18}],"272":[{"k":"livre","b":{"isbn":["9782211072755"],"p":["Bouleversée par un attentat suicide à côté de chez elle, Tal, une jeune Juive de Jérusalem confie ses espoirs de paix à une lettre qu’elle glisse dans une bouteille et qu’elle demande à son frère de jeter dans la mer de Gaza. Elle noue ainsi une relation par mails avec un correspondant palestinien d’abord mystérieux et agressif, qui signe Gazaman."],"t":"Une bouteille dans la mer de Gaza","a":"Valérie Zenatti"}},{"k":"choix","l":"Si tu veux découvrir un autre livre susceptible de te plaire","to":360}],"273":[{"k":"livre","b":{"isbn":["9782070560165"],"p":["À quels sombres trafics se livrent les clients de l’auberge du Bon Chien Jaune ? Une nuit, le jeune Louis-Marie surprend une conversation entre matelots. Il y est question du « Hollandais-Volant », ce vaisseau fantôme qui sème la terreur sur les mers. Impossible de résister à l’appel de l’aventure : Louis-Marie embarque aussitôt avec la bande pour une mystérieuse expédition…"],"t":"Les clients du bon chien jaune","a":"Pierre Mac Orlan"}}],"274":[{"k":"livre","b":{"isbn":["9782070585540"],"p":["Dans un royaume imaginaire, Ilian, un jeune prince, a grandi en secret loin de son frère tyrannique. Devenu adolescent, il tombe amoureux de la fée Olia mais la jalousie de son frère le contraint à s’enfuir. Il se retrouve à Paris en 1936 et est recueilli par un couple de confiseurs. Il prend le nom de leur fils disparu, Joshua Perle, et s’intègre dans notre monde, de la boutique aux champs de bataille de la Seconde Guerre mondiale. Mais son passé le hante encore…"],"t":"Le livre de perle","a":"Timothée de Fombelle"}}],"275":[{"k":"livre","b":{"isbn":["9782266148719"],"p":["Qui a tué Wellington, le grand caniche noir de Mme Shears, la voisine ? Christopher Boone, quinze ans, trois mois et deux jours, décide de mener l’enquête. Christopher est autiste. Il aime les listes, les plans, la vérité. Il comprend les mathématiques et la théorie de la relativité. Mais Christopher ne s’est jamais aventuré plus loin que le bout de la rue. Il ne supporte pas qu’on le touche, et trouve les autres êtres humains… déconcertants. Quand son père lui demande d’arrêter ses investigations, Christopher refuse d’obéir. Au risque de bouleverser le délicat équilibre de l’univers qu’il s’est construit…"],"t":"Le bizarre incident du chien pendant la nuit","a":"Mark Haddon"}}],"276":[{"k":"livre","b":{"isbn":["9782070653768"],"p":["Sous son écharpe élimée et ses lunettes de myope, Ophélie cache des dons singuliers : elle peut lire le passé des objets et traverser les miroirs. Elle vit paisiblement sur l’arche d’Anima quand on la fiance à Thorn, du puissant clan des Dragons. La jeune fille doit quitter sa famille et le suivre à la Citacielle, capitale flottante du Pôle. À quelle fin a-t-elle été choisie ? Pourquoi doit-elle dissimuler sa véritable identité ? Sans le savoir, Ophélie devient le jouet d’un complot mortel."],"t":"La passe miroir","a":"Christelle Dabos"}},{"k":"choix","l":"Pour découvrir un roman steam-punk ou la magie et les machines coexistent","to":354},{"k":"choix","l":"Pour découvrir un roman de fantasy qui se passe dans un arbre","to":320},{"k":"choix","l":"Pour découvrir un univers où tout le monde vit pour et par les livres","to":348}],"277":[{"k":"livre","b":{"isbn":["9782070630165"],"p":["Unique survivant d’un naufrage, Edward Prendick est secouru par Montgomery, l’assistant d’un certain Docteur Moreau. Depuis une dizaine d’années, sur leur île isolée du monde, les deux scientifiques se livrent à de terribles expériences, greffant et modifiant génétiquement des animaux pour les rendre doués de conscience et de parole. Sur place, les « Hommes-bêtes » obéissent à un ensemble de règles bien précises, la Loi, leur interdisant tout comportement primitif, et vénèrent Moreau tel un dieu. Mais Prendick découvrira bien vite que les pulsions animales de ces créatures sont loin d’être oubliées…"],"t":"L’Île du docteur Moreau","a":"H.G. Wells"}}],"278":[{"k":"livre","b":{"isbn":["9782290212240"],"p":["Fidèle, jeune adolescente, grandit, entourée de ses six frères et sœurs, dans une famille dysfonctionnelle : son père enchaîne les allers-retours en prison, sa mère est à l’asile. Dotée d’une « intelligence précoce », elle s’intègre à un lycée des beaux quartiers où les élèves la regardent comme un alien. Mais c’est là que l’attend l’amour, le vrai, celui qui transforme, celui qui sauve…"],"t":"Dysfonctionnelle","a":"Axl Cendres"}},{"k":"choix","l":"Si tu veux découvrir un autre roman susceptible de te plaire","to":232}],"279":[{"k":"livre","b":{"isbn":["9791093835600"],"p":["Mme Bennet a cinq filles et compte bien les marier toutes, ce qui n’est pas une tâche facile dans l’Angleterre du début du XIXe siècle. Non que les demoiselles Bennett soient laides, mais elles n’ont pas de fortune. Et cinq maris riches, ce n’est pas si facile à trouver. Surtout quand les filles en question s’en mêlent ; elles qui ont des préjugés, éprouvent des sentiments, et n’agissent pas forcément toujours pour trouver « un bon parti »."],"t":"Orgueil et préjugés","a":"Jane Austen"}},{"k":"choix","l":"Pour découvrir un autre groupe de sœurs célèbres","to":256}],"280":[{"k":"livre","b":{"isbn":["9782070369652"],"p":["Ce livre est un récit autobiographique. L’auteur y évoque ses souvenirs, ou entre misère et pauvreté, il dénonce tout les difficultés que vivaient les Noirs dans le Sud au début du XXème siècle : prédominance de l’Eglise, les violences et les injustices des Blancs envers les Noirs, la ségrégation raciale…"],"t":"Black boy","a":"Richard Wright"}}],"281":[{"k":"livre","b":{"isbn":["9782070577071"],"p":["La sorcière de la rue Mouffetard lit dans le Journal des sorcières qu’elle pourra devenir jeune et belle en mangeant une petite fille à la sauce tomate. Point important de la recette, le prénom de l’enfant doit impérativement commencer par la lettre « N »… heureusement, une de ses petites voisines s’appelle Nadia !"],"t":"La sorcière de la rue Mouffetard et autres contes de la rue Broca","a":"Pierre Gripari"}},{"k":"choix","l":"Si tu veux découvrir un autre livre susceptible de te plaire","to":391}],"282":[{"k":"livre","b":{"isbn":["9782075142991"],"p":["Carmen, Tibby, Lena et Bridget ont seize ans. Nées à dix-jours maximum d’intervalles, elles se connaissent depuis toujours. Inséparables, elles n’en sont pas moins extrêmement différentes les unes des autres. Cet été-là, c’est la première fois qu’elles seront séparées aussi longtemps. Aussi, quand Carmen achète ce jean dans une friperie, et que celui-ci semble miraculeusement s’adapter à chacune de leur morphologie, il devient l’emblème de leur amitié. Ainsi, elles décident de se l’envoyer mutuellement durant les vacances, de quoi porter un peu de ses amies sur soi."],"t":"Quatre filles et un jean","a":"Ann Brashares"}}],"283":[{"k":"livre","b":{"isbn":["9782755636673"],"p":["Vicky est une jeune fille agoraphobe et très timide. Alors, quand sa meilleure amie Jenna déménage et qu’elle se retrouve seule dans son lycée, sa vie prend un nouveau tournant. Elle décide de s’inventer une vie sociale, en photoshopant des photos d’inconnus pour les poster sur Instagram. Au début, c’est uniquement à Jenna que ces posts sont destinés, mais très vite, de nouveaux followers s’intéressent à ses aventures. Vicky se laisse embarquer dans cette incroyable double vie online. Elle excelle à se créer des péripéties passionnantes sans même quitter sa chambre ! Et, très vite, elle va découvrir que beaucoup d’adolescents sur la toile se sentent comme elle, #seuls et #ignorés dans le monde réel."],"t":"Comment disparaître","a":"Sharon Huss Roat"}}],"284":[{"k":"livre","b":{"isbn":["9782075161589"],"p":["River est une adolescente différente. Elle est timide, très sensible, et est parfois bizarre dans ses réactions. Elle n’a pas les codes pour se faire accepter et intégrer. Comme elle ne comprend pas les autres, elle a besoin de thérapeutes pour l’aider. Elle est harcelée par un groupe d’adolescents qui n’hésitent pas à la racketter. Sa grande sœur a un peu honte d’elle mais fait son possible pour l’aider, lui donner des conseils et la guider dans sa vie au quotidien."],"t":"River","a":"Claire Castillon"}}],"285":[{"k":"serie","t":"Easter egg","a":"B. Martin"},{"k":"p","h":"J’aimerais bien savoir comment tu as atterri là ? Figures-toi qu’aucun chapitre de ce guide ne permet d’arriver ici !"},{"k":"choix","l":"Pour découvrir mon roman d’aventure préféré","to":389},{"k":"choix","l":"Pour découvrir ma série préférée","to":10},{"k":"choix","l":"Pour découvrir mon livre de fantasy préféré","to":307},{"k":"choix","l":"Pour découvrir mon classique préféré","to":159},{"k":"choix","l":"Pour découvrir mon roman animalier préféré","to":227},{"k":"choix","l":"Pour découvrir mon roman préféré, toutes catégories confondues","to":31}],"286":[{"k":"livre","b":{"isbn":["9782266270854"],"p":["Enfermés tels des rats de laboratoire, des ados doivent trouver l’issue d’un labyrinthe peuplé de monstres… Quand Thomas reprend connaissance, sa mémoire est vide, seul son nom lui est familier… Il se retrouve entouré d’adolescents dans un lieu étrange, à l’ombre de murs infranchissables. Quatre portes gigantesques, qui se referment le soir, ouvrent sur un labyrinthe peuplé de monstres d’acier. Chaque nuit, le plan en est modifié. Thomas comprend qu’une terrible épreuve les attend tous. Comment s’échapper par le labyrinthe maudit sans risquer sa vie ? Si seulement il parvenait à exhumer les sombres secrets enfouis au plus profond de sa mémoire…"],"t":"Le labyrinthe","a":"James Dashner"}}],"287":[{"k":"livre","b":{"isbn":["9791036313691"],"p":["C’est en poursuivant une biche dans la montagne que le jeune Eragon, quinze ans, tombe sur une magnifique pierre bleue, qui s’avère être… un œuf de dragon ! Fasciné, il l’emporte à Carvahall, le village où il vit pauvrement avec son oncle et son cousin. Il n’imagine pas alors qu’une dragonne, porteuse d’un héritage ancestral, va en éclore… Très vite, la vie d’Eragon est bouleversée. Contraint de quitter les siens, le jeune homme s’engage dans une quête qui le mènera aux confins de l’empire de l’Alagaësia. Armé de son épée et guidé par les conseils de Brom, le vieux conteur, Eragon va devoir affronter avec sa dragonne les terribles ennemis envoyés par le roi Galbatorix, dont la malveillance démoniaque ne connaît aucune limite."],"t":"Eragon","a":"Christopher Paolini"}},{"k":"choix","l":"Pour découvrir d’autres séries de romans correspondant à tes critères","to":347},{"k":"choix","l":"Pour découvrir un autre roman susceptible de te plaire","to":120},{"k":"choix","l":"Pour découvrir un roman de fantasy simple et rapide à lire","to":251},{"k":"choix","l":"Pour découvrir un classique du genre, pour ne pas dire un incontournable","to":307}],"288":[{"k":"livre","b":{"isbn":["9782215132462"],"p":["À 14 ans, Léa a une vie de rêve : dans son blog, elle raconte sa vie de mannequin vedette, son quotidien avec une maman styliste et un père galeriste branché ! Elle vit dans un « subliiime » appartement à Paris, capitale de la mode ! Elle croule sous les invitations aux défilés de mode ! Bref tout va pour le mieux pour Léa, sauf que tout est faux. Léa a une légère tendance à enjoliver sa vie. Mais ça intéresse qui une mère qui tient un pressing et un père poissonnier ? Et si Léa habite une capitale, c’est Agen, la capitale du pruneau ! Alors Léa n’hésite pas à ré-écrire sa vie, au stylo rose et avec beaucoup de paillettes, quitte à prendre des risques, parfois inconsidérés…"],"t":"Le Blog ou la vie ?","a":"Sophie de Villenoisy"}},{"k":"choix","l":"Si tu veux découvrir une autre œuvre susceptible de te plaire","to":283}],"289":[{"k":"livre","b":{"isbn":["9782010023545"],"p":["Selon une ancienne légende, un chien démoniaque, crachant du feu de sa gueule géante, pourchasserait les membres de la famille Baskerville. Lorsque Sir Charles décède dans des circonstances troubles, Sherlock Holmes et le docteur Watson enquêtent. Ils doivent protéger le dernier descendant de la famille, Sir Henry, revenu du Canada pour hériter du domaine familial."],"t":"Le chien des Baskerville","a":"Sir Arthur Conan Doyle"}}],"290":[{"k":"livre","b":{"isbn":["9782075091237"],"p":["Pourquoi la jeune Lyra, élevée dans l’atmosphère confinée d’une prestigieuse université anglaise, est-elle l’objet de tant d’attentions ? De quelle mystérieuse mission est-elle investie ? Lorsque son meilleur ami, Roger, disparaît, victime des ravisseurs d’enfants qui opèrent dans tout le pays, elle n’hésite pas à se lancer sur ses traces… Un périlleux voyage vers le Grand Nord, qui lui révèlera ses extraordinaires pouvoirs et la conduira à la frontière d’un autre monde."],"t":"À la croisée des mondes","a":"Philip Pullman"}},{"k":"choix","l":"Pour découvrir une autre œuvre susceptible de te plaire","to":118}],"291":[{"k":"livre","b":{"isbn":["9782075147682"],"p":["« Il y avait dans un port de la Norvège un très vieil homme à qui manquait une oreille. Comment l’as-tu perdue ? lui demandait-on dans l’auberge où il venait s’enivrer chaque soir, et il répondait volontiers : “Oh, ça remonte à loin ! disait-il, j’étais encore un petit garçon… » » Chaque fois, le vieux marin raconte une nouvelle histoire, alors comment savoir ?"],"t":"L’Homme à l’oreille coupée","a":"Jean-Claude Mourlevat"}},{"k":"choix","l":"Si tu veux découvrir une autre nouvelle sur le thème du mensonge","to":361}],"292":[{"k":"livre","b":{"isbn":["9782012202344"],"p":["Tom Sawyer est un orphelin d’une dizaine d’années qui vit sur les bords du Mississipi et cause bien des soucis à sa tante Polly. Pour les yeux de la jolie Becky, il fait les 400 coups et se retrouve plus souvent à vagabonder avec son ami Huckleberry que sur les bancs de l’école. Un soir, cachés dans un cimetière, Tom et Huck sont témoins d’un meutre !"],"t":"Les aventures de Tom Sawyer","a":"Mark Twain"}}],"293":[{"k":"livre","b":{"isbn":["9782081486416"],"p":["Nils est un grand garçon de quatorze ans aux cheveux blonds comme du lin. Un jour, après s’être endormi, il se réveille au milieu d’un monde étrange, qu’il ne reconnaît plus. L’aventure commence alors : perché sur le dos d’une oie sauvage, Nils fait un voyage fabuleux de la Suède à la Laponie et trouve des amis parmi les hommes comme parmi les animaux."],"t":"Le merveilleux voyage de Nils Holgersson","a":"Selma Lagerlöf"}},{"k":"choix","l":"Si tu veux découvrir un autre classique de la littérature","to":259}],"294":[{"k":"livre","b":{"isbn":["9782354885632"],"p":["Armelle le sait depuis trois ans, elle aime les filles. Seul son carnet bleu est mis dans la confidence. L’adolescente solitaire et férue de lecture y confie ses peurs, ses espoirs. Elle lui parle d’Inès, une nouvelle élève qui l’attire. Lorsque son amie la rejette violemment, Armelle devient rapidement l’objet du mépris et des insultes de ses camarades. Pourtant, cet événement n’est qu’un tournant dans sa vie qui bascule définitivement un dimanche soir. Alors que ses parents découvrent son secret, Armelle est jetée dehors. Elle n’a que 16 ans quand, cette nuit-là, elle voit la porte de sa maison se fermer brutalement devant ses yeux."],"t":"Les mots bleus","a":"Christine Féret-Fleury"}},{"k":"choix","l":"Pour découvrir un autre roman susceptible de te plaire","to":398}],"295":[{"k":"livre","b":{"isbn":["9782266249621"],"p":["« Je m’appelle August. Je ne me décrirai pas. Quoi que vous imaginiez, c’est sans doute pire. » Né avec une malformation faciale, August, dix ans, n’est jamais allé à l’école. Aujourd’hui, pour la première fois, ses parents l’envoient au collège… Pourra-t-il convaincre les élèves qu’il est comme eux ?"],"t":"Wonder","a":"R. J. Palacio"}},{"k":"choix","l":"Si tu veux découvrir une œuvre très poétique","to":88},{"k":"choix","l":"Si tu préfères découvrir un roman d’enquête","to":275},{"k":"choix","l":"Si tu veux suivre le combat d’un enfant contre la maladie","to":215}],"296":[{"k":"p","h":"Voici une petite sélection de mes contes favoris :"},{"k":"livre","b":{"isbn":["9782081336551"],"p":["Il était une fois un meunier qui vivait pauvrement, mais dont la fille était fort belle. Or il arriva un jour où le meunier eut à parler au roi, et pour se donner de l’importance, lui dit : « J’ai une fille capable de filer la paille et d’en tirer du fil d’or pur. – Voilà un art qui me plaît, dit le roi ; et si ta fille est aussi habile que tu le dis, conduis-la demain au château que je la voie à l’œuvre. » Le lendemain, quand la jeune fille fut devant lui, le roi la conduisit aussitôt dans une pièce toute emplie de paille, lui montra le rouet, et lui dit : « À présent, au travail ! Et si d’ici demain matin tu ne m’as pas filé en or toute cette paille, il te faudra mourir ! »","<em>Tom pouce<\/em> — Les frères Grimm","Un pauvre laboureur assis un soir au coin de son feu dit à sa femme, qui filait à côté de lui : « Quel grand chagrin pour nous de ne pas avoir d’enfants. Notre maison est si triste tandis que la gaieté et le bruit animent celle de nos voisins. - Hélas ! dit la femme, en poussant un soupir quand nous n’en aurions qu’un gros comme le pouce, je m’en contenterais et nous l’aimerions de tout notre cœur. »"],"t":"Nain Tracassin","a":"Les frères Grimm"}},{"k":"livre","b":{"isbn":["9782290173527"],"p":["L’empereur de Chine découvre un rossignol qui chante si bien qu’il l’enferme dans une cage dorée pour pouvoir le garder près de lui. Le rossignol a ensorcelé, par la beauté de son chant, l’empereur et sa cour. Cette nouvelle vie n’est pas du goût de l’oiseau qui aime la liberté. Un jour, un oiseau mécanique paré de diamants et de saphirs, étonnant par sa beauté et son chant mélodieux, est offert à l’empereur. L’empereur et le rossignol vont-ils se séparer et s’oublier ?","<em>La Reine des neiges<\/em> — Hans Christian Andersen","Le diable a fabriqué un miroir magique, qui déforme les visages de ceux qui s’y regardent. Un jour le miroir se casse et deux des morceaux ensorcelés atterrissent dans l’œil d’un garçon innocent. Le sortilège fait de lui un être dur et indifférent. Il disparaît et son amie Gerda entreprend de le chercher, jusqu’au château de la Reine des neiges où elle le tient sous son emprise…","<em>La Petite Fille aux allumettes<\/em> — Hans Christian Andersen","La veille du Jour de l’an, une petite fille marche seule et pieds nus dans la neige. Elle serre contre son cœur une petite boîte d’allumettes. Personne ne fait attention à elle : les passants sont pressés de rentrer chez eux. Pour tenter de se réchauffer, elle se réfugie entre deux maisons et frotte plusieurs allumettes. Des hallucinations successives lui font apparaître tout ce dont elle est privée : la chaleur d’un bon feu ; un délicieux repas de fête ; un superbe sapin de Noël…"],"t":"Le rossignol et l’Empereur","a":"Hans Christian Andersen"}},{"k":"livre","b":{"isbn":["9782081408623"],"p":["Un meunier ne laissa pour tous biens, à trois enfants qu’il avait, que son moulin, son âne et son chat. Les partages furent bientôt faits ; ni le notaire ni le procureur n’y furent point appelés. L’aîné eut le moulin, le second eut l’âne, et le plus jeune n’eut que le chat. Ce dernier ne pouvait se consoler d’avoir un si pauvre lot : « Mes frères, disait-il, pourront gagner leur vie honnêtement en se mettant ensemble ; pour moi, lorsque j’aurai mangé mon chat, et que je me serai fait un manchon de sa peau. Il faudra que je meure de faim. »","<em>La barbe-bleue<\/em> — Charles Perrault","II était une fois un homme qui avait de belles maisons à la ville et à la campagne, de la vaisselle d’or et d’argent, des meubles en broderies, et des carrosses tout dorés. Mais, par malheur, cet homme avait la barbe bleue : cela le rendait si laid et si terrible, qu’il n’était ni femme ni fille qui ne s’enfuit de devant lui. Une de ses voisines, dame de qualité, avait deux filles parfaitement belles. Il lui en demanda une en mariage, et lui laissa le choix de celle qu’elle voudrait lui donner. Elles n’en voulaient point toutes deux, et se le renvoyaient l’une à l’autre, ne pouvant se résoudre à prendre un homme qui eût la barbe bleue. Ce qui les dégoûtait encore, c’est qu’il avait déjà épousé plusieurs femmes, et qu’on ne savait ce que ces femmes étaient devenues.","Le petit poucet Charles Perrault : II était une fois un bûcheron et une bûcheronne qui avaient sept enfants, tous garçons ; l’aîné n’avait que dix ans, et le plus jeune n’en avait que sept. Ils étaient fort pauvres, et leurs sept enfants les incommodaient beaucoup, parce qu’aucun d’eux ne pouvait encore gagner sa vie… Il vint une année très fâcheuse, et la famine fut si grande que ces pauvres gens résolurent de se défaire de leurs enfants."],"t":"Le chat botté","a":"Charles Perrault"}}],"297":[{"k":"livre","b":{"isbn":["9782081494220"],"p":["Pour se venger de sa femme qui lui avait été infidèle, le roi de Perse Schahriar décide de passer chaque nuit avec une femme différente, qu’il étrangle au petit matin. Vient le tour de Schéhérazade qui, grâce à ses talents de conteuse, parvient à charmer le roi par ses récits, jusqu’au petit matin, et repousser ainsi, de jour en jour, le moment de son exécution.","Sindbad le marin : Le soir de la soixante-neuvième nuit, la princesse se lance dans le récit des nombreuses aventures que Sindbad, fameux marin haut en couleurs, a connues au cours de ses sept voyages en bateau. D’île en île, de naufrage en naufrage, Sindbad parcourt les Indes orientales, rapporte d’innombrables richesses à Bagdad, mais surtout, fait de fabuleuses rencontres, comme celle des Rocks, immenses oiseaux fabuleux. Il tombe avec ses compagnons dans les griffes d’un peuple d’indigènes anthropophages, affronte un cyclope, un serpent géant…","Ali Baba et les quarante voleurs : « Sézame, ouvre-toi ! » Grâce à cette formule magique, Ali Baba découvre un fabuleux trésor caché au fond d’une grotte. Le voilà riche ! Mais les quarante voleurs qui possèdent ce butin ont bien l’intention de récupérer leur bien…","Aladin et la lampe merveilleuse : Aladin, le fils du tailleur, n’en croit pas ses oreilles : un mystérieux oncle revenu d’Afrique lui offre de devenir marchand d’étoffes. En échange, Aladin devra s’aventurer dans les profondeurs d’un souterrain pour lui en rapporter une lampe magique. Mais rien ne se passe comme prévu. Prisonnier sous la terre, Aladin parviendra-t-il à maîtriser les pouvoirs de la lampe ?"],"t":"Contes des mille et une nuits","a":""}}],"298":[{"k":"livre","b":{"isbn":["9791097577353"],"p":["Dans un cadre inspiré de la Chine impériale, vous incarnez Xi Mei-Mei, une jeune servante à la cour de l’empereur. Déterminée à vous assurer un avenir meilleur, vous comptez sur les occasions qui se présenteront pendant la visite de trois princes prétendant à la main de l’héritière du trône.","Avec une large liberté d’action et une absence totale de hasard, l’auteur vous confie les rênes du récit. Le succès de l’héroïne ne dépendra que de vos choix, basés sur vos observations, votre intuition, votre audace, votre prudence, votre loyauté, peut-être votre fourberie et, bien sûr, votre stratégie."],"t":"Fleurir en hiver","a":"Romain Baudry"}}],"299":[{"k":"livre","b":{"isbn":["9782010008993"],"p":["Le destin de Jean Valjean, forçat échappé du bagne, est bouleversé par sa rencontre avec Fantine. Mourante et sans le sou, celle-ci lui demande de prendre soin de Cosette, sa fille confiée aux Thénardier. Ce couple d’aubergistes, malhonnêtes et sans scrupules, exploitent la fillette jusqu’à ce que Jean Valjean tienne sa promesse et l’adopte. Cosette devient alors sa raison de vivre. Mais son passé le rattrape et l’inspecteur Javert le traque…"],"t":"Les Misérables","a":"Victor Hugo"}},{"k":"choix","l":"Si tu veux découvrir un autre classique de la littérature susceptible de te plaire","to":210}],"300":[{"k":"livre","b":{"isbn":["9782081479838"],"p":["Un recueil de récits mythologiques aussi savant que souriant et qui permet de découvrir les amours de Jupiter, les travaux d’Hercule, les colères d’Achille et les ruses d’Ulysse."],"t":"Les dieux s’amusent","a":"Denis Lindon"}},{"k":"choix","l":"Si tu veux découvrir un classique de la littérature latine","to":235},{"k":"choix","l":"Pour découvrir d’autres œuvres sur la mythologie grecque","to":216}],"301":[{"k":"livre","b":{"isbn":["9782070619412"],"p":["Quand on est une famille de six garçons, impossible de s’ennuyer un seul instant. Surtout avec Jean-A. qui veut toujours être le chef, le club d’agents secrets de Jean-B., Jean-C. qui ne comprend jamais rien, Jean-D. alias Jean-Dégâts, les poissons rouges de Jean-E. et le bébé Jean-F. qui n’arrête pas de pleurer… Sans parler du déménagement, des bagarres avec la bande des Castors et des cousins Fougasse aux oreilles décollées… Heureusement que papa est un as du bricolage et que maman est très organisée !"],"t":"Histoires des Jean-Quelque-Chose","a":"Jean-Philippe Arrou-Vignod"}}],"302":[{"k":"livre","b":{"isbn":["9782010009037"],"p":["David Eliot vient d’être renvoyé du collège et cette fois ses parents ont décidé de sévir ! Il se retrouve dans une école bien étrange, sur la sinistre île du crâne, au large de l’Angleterre. Très vite, il soupçonne le pire. Mais il est encore loin de la vérité…","T’attendais-tu à ce que je te conseille de lire Harry Potter ? :) Pour ta gouverne, L’île du crâne est une des inspirations de J.K. Rowling. Si tu veux découvrir d’autres livres de J.K. Rowling, <a class=\"renvoi\" href=\"#c37\">→ Chapitre 37<\/a>"],"t":"L’île du crâne","a":"Anthony Horowitz"}}],"303":[{"k":"livre","b":{"isbn":["9782010009174"],"p":["Bretagne, 1819. À l’âge de douze ans, Julien découvre qu’il a été adopté. Bouleversé par cette révélation, il s’enfuit vers Haïti. Son but : partir à la recherche de son histoire… Mais le Prince Sauvage à bord duquel il est monté n’est pas le simple navire marchand qu’il imagine. De nombreux esclaves noirs font eux aussi partie du voyage, tous destinés à être vendus."],"t":"Deux graines de cacao","a":"Evelyne Brisou-Pellen"}},{"k":"choix","l":"Pour découvrir un autre roman susceptible de te plaire","to":382}],"304":[{"k":"livre","b":{"isbn":["9782253005902"],"p":["Tenter de traverser l’Afrique d’est en ouest par la voie des airs, prétendre survoler dans sa plus grande largeur le dangereux continent noir à bord d’une fragile nacelle livrée à tous les caprices des vents, c’était, au temps de Jules Verne, une entreprise d’une audace incroyable. Comme on peut s’y attendre, les cinq semaines qu’il faudra au docteur Fergusson et à ses deux compagnons pour y parvenir seront pleines d’imprévus et de péripéties."],"t":"Cinq semaines en ballon","a":"Jules Verne"}}],"305":[{"k":"livre","b":{"isbn":["9782075088107"],"p":["Au XIVe siècle, dans un Japon médiéval mythique, le jeune Takeo grandit au sein d’une communauté paisible qui condamne la violence. Mais celle-ci est massacrée par les hommes d’Iida, chef du clan des Tohan. Takeo, sauvé par sire Shigeru, du Clan des Otori, se trouve plongé au cœur de luttes sanglantes entre les seigneurs de la guerre. Il doit suivre son destin. Mais qui est-il ? Paysan, seigneur ou assassin ? D’où tient-il ses dons prodigieux ?"],"t":"Le clan des Otori : le silence du rossignol","a":"Lian Hearn"}}],"306":[{"k":"livre","b":{"isbn":["9782075107891"],"p":["Richard Cœur de Lion est parti en croisade et le prince Jean, son frère, assisté par le terrible shérif de Nottingham, règne en tyran sur l’Angleterre. Réfugiée dans la forêt de Sherwood, une bande de hors-la-loi défie leur autorité. À leur tête se trouve Robin des bois. Avec l’aide de frère Tuck, Much, Petit Jean et de la fidèle Marion, il s’est engagé, au nom du roi Richard, et rétablir la justice dans le pays."],"t":"Robin des bois","a":"Michael Morpurgo"}},{"k":"choix","l":"Pour découvrir un autre livre susceptible de te plaire","to":268}],"307":[{"k":"livre","b":{"isbn":["9782266341233"],"p":["Comme tous les hobbits, Bilbo est un petit être paisible et sans histoire. Son quotidien est bouleversé un beau jour, lorsque Gandalf le magicien et treize nains barbus l’entraînent dans un voyage périlleux. C’est le début d’une grande aventure, d’une fantastique quête au trésor semée d’embûches et d’épreuves, qui mènera Bilbo jusqu’à la Montagne Solitaire gardée par le terrible dragon Smaug…"],"t":"Bilbo le hobbit","a":"J.R.R. Tolkien"}}],"308":[{"k":"livre","b":{"isbn":["9782019110154"],"p":["Jacob Portman, écoute depuis son enfance les récits fabuleux de son grand-père. Ce dernier a passé une partie de sa vie sur une minuscule île du pays de Galles dans un orphelinat pour enfants « particuliers ». Un soir, Jacob trouve son grand-père mortellement blessé par une créature qui s’enfuit sous ses yeux. Bouleversé, il part en quête de la vérité sur l’île si chère à son grand-père. En découvrant le pensionnat en ruines, il n’a plus aucun doute : les enfants particuliers ont réellement existé. Mais pourquoi vivaient-ils ainsi reclus, cachés de tous ?"],"t":"Miss Peregrine et les Enfants particuliers","a":"Ransom Riggs"}},{"k":"choix","l":"Si tu veux découvrir un autre incontournable de la littérature jeunesse","to":290},{"k":"choix","l":"Si tu veux découvrir un voyage extraordinaire","to":293}],"309":[{"k":"livre","b":{"isbn":["9782290173480"],"p":["Mowgli, un bébé orphelin abandonné dans la jungle, est recueilli et élevé par une meute de loups. Passant son enfance parmi les animaux, il apprend la loi de la jungle. Dans ce milieu hostile, la vie est une lutte de chaque instant, et il doit sans cesse affronter ses ennemis, le peuple des singes et le tigre Sher Khan, pour survivre. Il finit par rencontrer des hommes et doit choisir entre ses vraies origines ou sa vie dans la jungle."],"t":"Le livre de la jungle","a":"Rudyard Kipling"}}],"310":[{"k":"livre","b":{"isbn":["9782010009020"],"p":["Pour avoir sauvé des brigands la fille du comte de Blois, l’écuyer Thibaut de Sauvigny est adoubé chevalier. Amoureux de la belle, sa pauvreté ne lui permet pas de l’épouser. Mais une nouvelle menace guette : Eléonore comprend que sa propre sœur veut sa mort ! Cette fois, la seule alliée des jeunes gens sera la fée Hadelize. S’ils la trouvent à temps…"],"t":"Le chevalier au bouclier vert","a":"Odile Weulersse"}},{"k":"choix","l":"Pour découvrir un autre livre susceptible de te plaire","to":154}],"311":[{"k":"livre","b":{"isbn":["9782748512625"],"p":["Pour Momo, l’été s’annonce interminable dans la triste cité des Bleuets. Du jour où il s’inscrit à la bibliothèque, le cours de ses vacances change. Assis sur son banc, il dévore Vendredi ou la vie sauvage, Mon ami Frédéric, Le Petit Prince, au point d’en oublier de manger. Et c’est ainsi qu’il fait la connaissance de Monsieur Edouard, un extravagant instituteur à la retraite, qui le sacre « Petit Prince des Bleuets ». De leurs discussions autour des livres va naître une forte amitié. Mais Momo apprend que le vieil homme est atteint de la maladie d’Alzheimer et que ses jours sont comptés."],"t":"Momo, petit prince des Bleuets","a":"Yaël Hassan"}}],"312":[{"k":"livre","b":{"isbn":["9782354887759"],"p":["Dans un univers peuplé de machines extraordinaires et d’îles dérivant entre les nuages, les habitants du Bas-Monde traversent une ère obscure et rétrograde, tandis que le Haut-Monde, figé depuis l’extinction des Alchimistes, demeure inaccessible et fait l’objet de tous les fantasmes. Une nuit, le village de Prudence est attaqué par des pirates du ciel ! Elle est enlevée et enrôlée de force à bord de L’Héliotrope, un navire volant à la sinistre réputation…"],"t":"Steam sailors : l’héliotrope","a":"E. S. Green"}},{"k":"choix","l":"Pour découvrir d’autres romans jeunesse steampunk","to":330},{"k":"choix","l":"Si tu veux découvrir un classique de la littérature","to":359}],"313":[{"k":"livre","b":{"isbn":["9782266277297"],"p":["Michael, un lycéen de 14 ans, croit être le seul à posséder un super pouvoir jusqu’au jour où il rencontre Taylor, une pom-pom girl qui est capable d’irradier de l’électricité, tout comme lui. Avec son meilleur ami, Ostin, Michael décide de rechercher d’autres êtres comme lui. À peine commencent-ils à comprendre leur secret qu’une mystérieuse organisation, convoitant les pouvoirs des deux adolescents, les prend en chasse…"],"t":"Le cercle des 17","a":"Richard Paul Evans"}}],"314":[{"k":"livre","b":{"isbn":["9782010009143"],"p":["À cinq ans, tout le monde bat Zézé et lui dit qu’il est le diable… Mais ange ou démon, Zézé a un secret : un oranger, le seul confident de ses rêves, qui l’écoute et lui répond."],"t":"Mon bel oranger","a":"José-Mauro De Vasconcelos"}},{"k":"choix","l":"Pour découvrir un autre roman susceptible de te plaire","to":374},{"k":"choix","l":"Pour un roman facile à lire","to":351}],"315":[{"k":"livre","b":{"isbn":["9782889082230"],"p":["Mark est une graine de champion de la natation française. À la rentrée, l’adolescent intègre une filière sport-études à Paris. Mark tombe rapidement sous le charme de Marie, spécialiste du marathon. Dans la capitale, il goûte à ses premières sorties, jusqu’au fameux soir où une barrière invisible l’arrête net : impossible de grimper au sommet du Sacré-Coeur avec ses amis. Peu à peu, une véritable cartographie de Paris s’imprime dans son corps et sa tête ; il se sent mal aussitôt qu’il essaie de la dépasser. Mark comprend qu’il souffre d’agoraphobie."],"t":"Autopsie d’un papillon","a":"Jean-Noël Sciarini"}}],"316":[{"k":"livre","b":{"isbn":["9782011611543"],"p":["Paris, 1941. La France est occupée par les nazis. Joseph et Maurice, deux frères juifs âgés de dix et douze ans, partent seuls sur les routes pour tenter de gagner la zone libre. Pendant ce voyage, des périodes heureuses et insouciantes alternent avec des moments plus délicats de danger et d’emprisonnement."],"t":"Un sac de billes","a":"Joseph Joffo"}},{"k":"choix","l":"Si tu veux découvrir un des plus poignants témoignages de cette époque","to":3}],"317":[{"k":"livre","b":{"isbn":["9782075191142"],"p":["Jan a un caractère bien trempé, de l’énergie à revendre et un amour sans bornes pour son petit frère Arthur. Alors, quand le destin les sépare en les plaçant dans des familles d’accueil différentes, Jan rue dans les brancards. Elle n’a plus qu’une idée : s’évader pour le retrouver."],"t":"Jan","a":"Claudine Desmarteau"}},{"k":"choix","l":"Pour découvrir un autre livre susceptible de te plaire","to":267}],"318":[{"k":"livre","b":{"isbn":["9782266270663"],"p":["Sophie sait qu’elle n’est pas comme tout le monde : depuis toujours, elle entend les pensées des gens autour d’elle. Un matin, un étrange garçon l’aborde et lui apprend qu’elle n’est pas humaine. Elle doit rejoindre l’univers qu’elle a quitté douze ans plus tôt. Elle découvre l’univers des elfes, plein de rebondissements, de dangers, de plaisirs. De retour parmi les siens, plusieurs questions l’obsèdent : Pourquoi l’a-t-on cachée si longtemps dans le monde des humains ? Et qui sont ces fameux rebelles qui n’en font qu’à leur tête ?"],"t":"Gardien des cités perdues","a":"Shannon Messenger"}},{"k":"choix","l":"Pour découvrir une autre œuvre susceptible de te plaire","to":302}],"319":[{"k":"livre","b":{"isbn":["9782290032725"],"p":["Algernon est une souris de laboratoire dont le traitement du Pr Nemur et du Dr Strauss vient de décupler l’intelligence. Enhardis par cette réussite, les deux savants tentent alors, avec l’assistance de la psychologue Alice Kinnian, d’appliquer leur découverte à Charlie Gordon, un simple d’esprit employé dans une boulangerie. C’est bientôt l’extraordinaire éveil de l’intelligence pour le jeune homme. Il découvre un monde dont il avait toujours été exclu, et l’amour qui naît entre Alice et lui achève de le métamorphoser. Mais un jour, les facultés supérieures d’Algernon déclinent. Commence alors pour Charlie le drame atroce d’un homme qui, en pleine conscience, se sent retourner à l’état de bête…"],"t":"Des fleurs pour Algernon","a":"Daniel Keyes"}},{"k":"choix","l":"Si tu veux découvrir des expériences impliquant des animaux","to":277},{"k":"choix","l":"Si tu veux comprendre le mystère de la vie et tenter de vaincre la mort","to":15}],"320":[{"k":"livre","b":{"isbn":["9782070629459"],"p":["Tobie Lolness ne mesure pas plus d’un millimètre et demi. Sa mère, la douce Maïa, lui a donné le goût des mots et son père, le grand savant Sim Lolness, sa vivacité d’esprit. Ils vivent dans les cimes du grand chêne jusqu’au jour où, s’opposant à ce que la sève de l’Arbre soit exploitée, ses parents sont emprisonnés. Tobie trouve alors refuge dans les basses branches. Mais, poursuivi par la bande de Jo Mitch, un industriel qui cherche à prendre le contrôle de l’Arbre, il doit s’enfuir. Tobie est prêt à tout, pour libérer ses parents… et pour Elisha, l’élue de son cœur."],"t":"Tobie lolness","a":"Timothée de Fombelle"}}],"321":[{"k":"livre","b":{"isbn":["9782700253313"],"p":["Robin est un garçon peu sûr de lui qui ne se sent à l’aise qu’en famille ou avec son ami Charly. Un jour, il découvre une étrange horloge lui permettant de voyager dans le temps. Il apprivoise alors progressivement ce don et teste toutes ses possibilités. Mais les limites de ses actions lui apparaissent rapidement et naît une grande frustration…. Suffit-il d’avoir un super-pouvoir pour être un super-héros ?"],"t":"Robin les plieurs de temps","a":"Manon Fargetton"}}],"322":[{"k":"livre","b":{"isbn":["9782812623974"],"p":["À la mort de leur père, Auguste, un lycéen d’aujourd’hui, et sa petite sœur Césarine, autiste géniale, sont plongés tête la première dans une guerre secrète. Elle oppose depuis des siècles, La Confrérie et Les Autodafeurs. Nos deux héros vont devenir malgré eux les acteurs de ce conflit millénaire. Son enjeu ? Le contrôle du savoir et la main mise sur sa forme la plus ancienne : Les livres…"],"t":"Les autodafeurs","a":"Marine Carteron"}},{"k":"choix","l":"Si tu souhaites découvrir un autre livre répondant à tes critères","to":75}],"323":[{"k":"livre","b":{"isbn":["9791036311307"],"p":["Parker et Sven se détestent au premier regard. Quand Parker découvre qu’Alaska, la merveilleuse chienne dont elle a dû se séparer, vit désormais avec Sven, il devient officiellement son pire ennemi. Parker n’a plus qu’une idée en tête : récupérer Alaska à tout prix. Mais la nuit où elle rentre par effraction chez Sven, une cagoule sur la tête, elle découvre un garçon différent… Parker et Sven n’ont rien en commun, sauf un chien, Alaska. Or, ce chien est ce qu’ils ont de plus précieux."],"t":"Alaska","a":"Anna Woltz"}}],"324":[{"k":"livre","b":{"isbn":["9791023503470"],"p":["À quinze ans, Marie se réveille un jour sans aucun souvenir. Le médecin qui l’accueille dans cette nouvelle existence prétend l’avoir ramenée à la vie alors que tout le monde la croyait perdue. Pourtant, Marie est habitée par le sentiment étrange d’être plusieurs personnes et ses souvenirs, aussi confus soient-ils, la ramènent à des histoires ne pouvant avoir été vécues par un seul individu…"],"t":"Resurrectio","a":"Amélie Sarn"}}],"325":[{"k":"livre","b":{"isbn":["9782075142335"],"p":["« Je suis probablement le pantin le plus célèbre que le monde ait jamais connu. Vous savez sûrement pourquoi mon nez s’allonge… Mais vous ne connaissez pas ma véritable histoire ! C’est pourquoi j’ai pensé qu’il était temps pour moi, Pinocchio, de vous la raconter avec mes propres mots. Vous pourrez voir que, quelle que soit notre nature, pour nous tous, grandir est une période difficile mais passionnante… »"],"t":"Pinocchio raconte Pinocchio","a":"Michael Morpurgo"}},{"k":"choix","l":"Pour découvrir la version romancée d’un autre conte","to":18}],"326":[{"k":"livre","b":{"isbn":["9782266289658"],"p":["Un matin d’avril, le jeune Charlie Fisher est témoin d’une scène insolite au cœur de Marseille. Sous ses yeux s’opère un spectaculaire vol orchestré par… des enfants ! Par un prodigieux tour de passe-passe, l’un d’entre eux parvient même à lui dérober son stylo. Époustouflé, le garçon est prêt à tout pour intégrer le gang secret des Whiz, un clan international d’astucieux pickpockets entraînés par la mystérieuse école des Sept Clochettes…"],"t":"Charlie Fisher et le gang des Whiz","a":"Colin Meloy"}},{"k":"choix","l":"Pour découvrir un classique de la littérature ayant pour héros un cambrioleur","to":112},{"k":"choix","l":"Pour découvrir un héros assoiffé de vengeance, dans un roman facile à lire","to":191},{"k":"choix","l":"Pour découvrir un héros assoiffé de vengeance, dans un classique de la littérature","to":89},{"k":"choix","l":"Pour découvrir un anti-héros ayant des tendances mythomanes","to":288}],"327":[{"k":"livre","b":{"isbn":["9782874231551"],"p":["Loïc vient de se suicider, laissant une lettre expliquant son geste : il n’assumait pas son homosexualité. Trois de ses camarades réagissent à cette annonce : Réginald, nourri de clichés homophobes, Philippe, homosexuel lui aussi, à qui s’était confié Loïc, et Elsa, qui va aider Philippe à s’accepter."],"t":"Tabou","a":"Frank Andriat"}}],"328":[{"k":"livre","b":{"isbn":["9782211222792"],"p":["Ils sont frère et sœur. Depuis quelques heures, ils sont orphelins. Ils ont juré qu’on ne les séparerait pas. Il y a Siméon Morlevent, 14 ans. Maigrichon. Yeux marron. Signe particulier : surdoué, prépare actuellement son bac. Morgane Morlevent, 8 ans. Yeux marron. Oreilles très décollées. Première de sa classe, très proche de son frère. Signe particulier : les adultes oublient tout le temps qu’elle existe. Venise Morlevent, 5 ans. Yeux bleus, cheveux blonds, ravissante. La petite fille que tout le monde rêve d’avoir. Signe particulier : fait vivre des histoires d’amour torrides à ses Barbie. Ils n’ont aucune envie de confier leur sort à la première assistante sociale venue. Leur objectif est de quitter le foyer où on les a placés et de se trouver une famille. À cette heure, deux personnes pourraient vouloir les adopter. Pour de bonnes raisons. Mais aussi pour de mauvaises raisons. L’une n’est pas très sympathique, l’autre est irresponsable, et… Ah, oui ! ces deux personnes se détestent."],"t":"Oh boy","a":"Marie Aude Murail"}}],"329":[{"k":"livre","b":{"isbn":["9782290170212"],"p":["Le narrateur mène une vie tranquille dans sa maison au bord de la Seine, en Normandie, lorsque d’étranges phénomènes commencent à se produire. C’est la carafe d’eau sur sa table de nuit qui est bue, des objets qui disparaissent ou se brisent… Peu à peu, le narrateur acquiert la certitude qu’un être surnaturel et immatériel vit chez lui. Pire encore, cet être, qu’il baptise le Horla, a tout pouvoir sur lui, un pouvoir grandissant…"],"t":"Le Horla","a":"Guy de Maupassant"}},{"k":"choix","l":"Si tu veux découvrir une autre histoire de fantôme","to":266}],"330":[{"k":"livre","b":{"isbn":["9783423715188"],"p":["Le Worldshaker est un mégalonef, un gigantesque bateau sur lequel vivent plus de 10 000 personnes. Dans cette uchronie steampunk, la société guindée du pont supérieur est opposée à la classe ouvrière surexploitée qu’ils surnomment les « immondes » et qu’ils obligent à travailler pour faire fonctionner le gigantesque vaisseau…"],"t":"Le Worldshaker","a":"Richard Harland"}},{"k":"choix","l":"Pour découvrir un autre roman jeunesse steampunk","to":354}],"331":[{"k":"livre","b":{"isbn":["9782081308671"],"p":["Derrière son ordinateur, Sacha envoie des e-mails à des destinataires imaginaires, comme autant de bouteilles à la mer. Jusqu’au jour où Macha lui répond. Commence alors une bien étrange correspondance, pleine de tâtonnements mais aussi de confidences… Est-ce le début d’une belle amitié ?"],"t":"De S@cha à M@cha","a":"Rachel Hausfater et Yaël Hassan"}}],"332":[{"k":"livre","b":{"isbn":["9782211221245"],"p":["Lilas Fleury, en 6ème, raconte d’un ton décalé et plein d’humour comment elle se met à percevoir sa vie, son appartement, ses parents : elle les trouve niais, ridicules, « cucus ». Elle s’imagine que la vie chez son amie Toscane, dont la mère est à la pointe de la mode, est plus agréable. Comment va se dérouler le traditionnel dîner de classe, qui aura lieu chez Lilas ? Clovis, dont elle est amoureuse, s’intéressera-t-il à elle ? Toscane est-elle si heureuse ?"],"t":"Cucu","a":"Claire Castillon"}},{"k":"choix","l":"Pour découvrir un autre roman susceptible de te plaire","to":377}],"333":[{"k":"livre","b":{"isbn":["9782958747435"],"p":["Un étrange minéral est tombé du ciel dans le jardin de Nahum Gardner, dans les environs de la ville d’Arkham. Des études indiquent qu’il s’agit d’une météorite, dont le noyau présente des couleurs indescriptibles. Mais l’arrivée de ce mystérieux fragment venu de l’espace nuit gravement à l’écosystème de la ferme… et le sort qui attend les membres de la famille Gardner n’est pas moins terrifiant. Quelle menace interstellaire la météorite a-t-elle pu apporter ? Serez-vous capable de faire face à cette mystérieuse couleur tombée du ciel ?","Ce livre jeu vous permet d’incarner un personnage d’une des œuvres les plus terrifiantes de H.P. Lovecraft… Combien de fois, au cours de vos lectures ou du visionnage d’un film, vous êtes-vous retenu de hurler au personnage principal :« Ne fais pas ça, pauvre fou ! » ? Eh bien, voici enfin l’occasion de le faire !"],"t":"Choose Cthulhu : La Couleur tombée du ciel","a":"Edward T. Riker, Jen D. Pine"}}],"334":[{"k":"livre","b":{"isbn":["9782211236096"],"p":["C’est officiel. Margot tient la lettre entre ses mains. Elle est admise en sixième au collège d
