qu’il connaît si bien."],"t":"La fille qui parle à la mer / le garçon au chien parlant","a":"Claudine Galea"}},{"k":"choix","l":"Si tu veux que je te présente un autre récit d’exil à cause de la guerre","to":390},{"k":"choix","l":"Si tu veux un roman sur les difficultés à s’intégrer et la xénophobie","to":385},{"k":"choix","l":"Si tu veux un récit où le héros continue à vivre dans son pays pendant la guerre","to":272}],"87":[{"k":"livre","b":{"isbn":["9782070387366"],"p":["Cinq soldats français condamnés à mort en conseil de guerre, aux bras liés dans le dos. Cinq soldats qu’on a jetés dans la neige de Picardie, un soir de janvier 1917, devant la tranchée ennemie, pour qu’on les tue. Toute une nuit et tout un jour, ils ont tenté de survivre. Le plus jeune était un Bleuet, il n’avait pas vingt ans. À l’autre bout de la France, la paix venue, Mathilde veut savoir la vérité sur cette ignominie. Elle a vingt ans elle aussi, elle est plus désarmée que quiconque, mais elle aimait le Bleuet d’un amour à l’épreuve de tout, elle va se battre pour le retrouver, mort ou vivant, dans le labyrinthe où elle l’a perdu."],"t":"Un long dimanche de fiançailles","a":"Sébastien Japrisot"}}],"88":[{"k":"livre","b":{"isbn":["9782700277067"],"p":["Grace et Tippi sont deux sœurs siamoises qui entrent pour la première fois au lycée. Elles se soutiennent face aux regards des autres. Lorsque Grace tombe amoureuse, c’est tout son monde qui vacille. Ce livre parle de deux sœurs siamoises Tipi et Grace. C’est cette dernière qui nous raconte l’histoire. Les deux siamoises doivent rentrer au lycée. Jusque là, elles avaient un prof particulier. Mais leurs parents ne pouvant plus le payer doivent envoyer leurs filles dans un lycée comme les autres. Là-bas, elles rencontreront deux amis : Yasmine et Jon, dont Grace tombera amoureuse. Un jour où les deux sœurs se rendent à l’hôpital pour contrôler que tout va bien, on apprend que Grace est malade. Il n’y a que deux solutions : soit séparer les siamoises et courir le risque que l’une des deux meure ou alors les laisser ensemble…"],"t":"Inséparables","a":"Sarah Crossan"}}],"89":[{"k":"livre","b":{"isbn":["9782081366503"],"p":["Edmond Dantès est un fier marin sur le point d’être nommé capitaine et d’épouser Mercédès la femme qu’il aime. Suite aux accusations et aux mensonges de ses rivaux, il se retrouve emprisonné pendant des années et se voit dépossédé de sa vie et de son amour… Après sa spectaculaire évasion, il n’a plus qu’une chose en tête : la vengeance !"],"t":"Le comte de Monte-Cristo","a":"Alexandre Dumas"}}],"90":[{"k":"p","h":"Quel animal ?"},{"k":"choix","l":"« Un loup ou un chien »","to":65},{"k":"choix","l":"« Un lion »","to":244},{"k":"choix","l":"« Un faucon »","to":154},{"k":"choix","l":"« Un cheval »","to":263},{"k":"choix","l":"« Une baleine »","to":56},{"k":"choix","l":"« Un chat »","to":111},{"k":"choix","l":"« Un ours »","to":381}],"91":[{"k":"livre","b":{"isbn":["9782075148832"],"p":["Passer sa vie entière dans l’ombre d’un mari ? Jamais ! La jeune Pénélope aime trop la liberté. Mais sa rencontre avec Ulysse, le roi d’Ithaque, va changer son destin, et c’est par amour qu’elle devient reine. Lorsqu’Ulysse part pour la guerre de Troie, nombreux sont les prétendants qui veulent le remplacer. Pénélope va devoir employer mille ruses pour défendre le trône."],"t":"Pénélope, la femme aux mille ruses","a":"Isabelle Pandazopoulos"}},{"k":"choix","l":"Pour découvrir un autre roman susceptible de te plaire","to":353}],"92":[{"k":"livre","b":{"isbn":["9782070651849"],"p":["La vie du jeune Jim Hawkins bascule le jour où un marin ivrogne et balafré s’installe dans l’auberge tenue par ses parents. Qui est réellement celui que l’on surnomme le « capitaine » ? Pourquoi se cache-t-il ? Une nuit, des pirates attaquent l’auberge. Jim n’a que le temps de s’enfuir, emportant avec lui le secret du vieux forban : la carte d’une île abritant un fabuleux trésor…"],"t":"L’île au trésor","a":"Robert Louis Stevenson"}},{"k":"choix","l":"Pour une autre aventure de pirates","to":273},{"k":"choix","l":"Si tu préfères suivre les aventures d’un naufragé sur une île déserte","to":34}],"93":[{"k":"p","h":"Si tu cherches une lecture rapide et simple, je t’invite à regarder tous les chapitres finissant par le chiffre « UN » : 1, 11, 21, 31, 41, 51, etc."},{"k":"p","h":"Si au contraire tu souhaites découvrir un classique de la littérature, je t’invite à regarder tous les chapitres finissant par le chiffre « NEUF » : 9, 19, 29, 39, 49, 59, etc."},{"k":"p","h":"Dans un cas comme dans l’autre, n’hésite pas à suivre les liens pointant vers mes autres recommandations !"}],"94":[{"k":"livre","b":{"isbn":["9782376360414"],"p":["Ne vous êtes-vous jamais demandé ce qu’il se serait passé si Alice n’avait pas bu le contenu de la bouteille étiquetée « Buvez-moi » ? Ou si elle n’avait pas pris le thé avec le Chapelier, le Lièvre de Mars et le Loir ? Vous pouvez désormais le découvrir. Dans Alice au Pays des cauchemars, vous décidez quel chemin la fillette doit suivre, quels risques elle doit prendre, et lesquels des étranges habitants du pays des merveilles elle doit affronter. Mais prenez garde : ce sont vos choix qui détermineront si Alice réussira dans sa quête ou si elle rencontrera une fin cauchemardesque. Êtes-vous prêt à redescendre dans le terrier du lapin ?"],"t":"Alice au pays des cauchemars","a":"Jonathan Green"}},{"k":"choix","l":"Pour découvrir le classique qui a inspiré cet ouvrage","to":49}],"95":[{"k":"livre","b":{"isbn":["9782075148313"],"p":["Pénélope, 14 ans, ne vit que pour le foot. Mais dans son nouveau collège, une fille qui tape dans un ballon, c’est un peu trop bizarre aux yeux de certains. Péné devient la risée de l’établissement, des réseaux sociaux. Elle peut néanmoins compter sur un soutien précieux : celui de ses coéquipières Florie, Léïla, Marisa… Une team de championnes, et pas seulement sur le terrain !"],"t":"Championnes","a":"Mathilde Tournier"}},{"k":"choix","l":"Si tu veux un autre livre sur le foot","to":241},{"k":"choix","l":"Si tu veux un roman sur un autre sport","to":123}],"96":[{"k":"p","h":"Face au manque d’acceptation de ses parents, il est crucial de communiquer ouvertement, de chercher à comprendre leur point de vue tout en s’affirmant, et de chercher un soutien extérieur si nécessaire."},{"k":"choix","l":"Si tu souhaites découvrir un roman simple et rapide à lire","to":341},{"k":"choix","l":"Si tu veux découvrir un roman un peu plus sombre","to":160}],"97":[{"k":"p","h":"Je vois… tu cherches des sensations fortes. Fais-moi confiance, le mieux c’est que tu fasses demi-tour. Il n’y a aucune honte à cela, au contraire c’est une preuve de sagesse."},{"k":"choix","l":"Revenir sagement en arrière","to":84},{"k":"choix","l":"Ignorer mes avertissements","to":66}],"98":[{"k":"livre","b":{"isbn":["9782266324540"],"p":["Ouest américain, années 1920. Garett vit avec son père, un pasteur adulé de tous mais extrêmement violent avec ses enfants. La vie du jeune homme bascule lorsqu’il est kidnappé par une hors-la-loi en cavale, Ab Stenson. Cette femme indomptable est celle qui lui ouvrira les portes d’un avenir moins sombre, loin de son père violent. Terrifié, puis fasciné par sa ravisseuse, l’adolescent découvrira ses plus grands secrets, ceux qu’on ne révèle qu’à ses plus proches amis. Dans son sillage, il rencontrera l’amour et l’amitié, là où il les attendait le moins. Jusqu’au bout de la route, où Ab lui offrira le plus beau des destins : la liberté."],"t":"Sans foi ni loi","a":"Marion Brunet"}},{"k":"choix","l":"Si tu veux découvrir un autre roman","to":155}],"99":[{"k":"livre","b":{"isbn":["9782070664795"],"p":["Dans un tombeau de la Vallée des Rois, un jeune lord anglais et un archéologue découvrent la momie d’une jeune fille à la beauté bouleversante. Près d’elle, un papyrus raconte son histoire…"],"t":"Le roman de la momie","a":"Théophile Gautier"}}],"100":[{"k":"p","h":"Que peux-tu me dire du livre que tu souhaites lire ?"},{"k":"choix","l":"Pour découvrir les souvenirs d’un enfant en France au début du XXe siècle","to":169},{"k":"choix","l":"Pour découvrir un récit drôle","to":213},{"k":"choix","l":"Pour découvrir un récit de vie pendant la ségrégation aux États-Unis","to":280},{"k":"choix","l":"Si tu veux découvrir le récit d’un enfant pendant la Shoah","to":3},{"k":"choix","l":"Si tu veux découvrir l’enfance d’un jeune Guinéen jusqu’à son arrivée à Paris","to":247}],"101":[{"k":"livre","b":{"isbn":["9782070612758"],"p":["L’histoire commence lorsque le narrateur, un pilote d’avion, fait un atterrissage forcé dans le désert du Sahara… Alors qu’il est au milieu de nulle part, il fait la rencontre d’un petit bonhomme venu d’une autre planète. Ce petit bonhomme commence alors le récit de l’étonnant voyage qui l’a conduit sur terre…"],"t":"Le Petit Prince","a":"Antoine de Saint-Exupéry"}},{"k":"choix","l":"Si tu veux une autre œuvre onirique mais un peu plus longue","to":31}],"102":[{"k":"p","h":"Ce n’est pas une règle absolue, mais très souvent, les personnages principaux de la littérature jeunesse sont eux-mêmes des adolescents. Cela permet au lecteur d’être plus empathique avec le personnage voire de s’identifier et de vivre une aventure par procuration. Je suis curieux de savoir quel livre je vais pouvoir te conseiller…"},{"k":"p","h":"Que peux-tu me dire sur le personnage principal du livre que tu souhaites lire ?"},{"k":"choix","l":"« Le héros est confronté à une situation difficile ou extraordinaire »","to":116},{"k":"choix","l":"« Les préoccupations du héros sont proches des miennes »","to":57},{"k":"choix","l":"« Le personnage principal est un anti-héros : il est menteur, voleur, etc »","to":326},{"k":"choix","l":"« J’aimerais plutôt que le roman suive un petit groupe de personnages »","to":27},{"k":"choix","l":"« Une histoire qui raconte la vie d’une personne ayant réellement existé »","to":100},{"k":"choix","l":"« Un classique de la littérature jeunesse avec des enfants comme héros »","to":119},{"k":"choix","l":"« J’aimerais lire une histoire qui se passe dans un collège »","to":60},{"k":"choix","l":"« Et si je ne souhaite pas suivre les aventures d’un adolescent ? »","to":36}],"103":[{"k":"livre","b":{"isbn":["9782075173773"],"p":["La Cornucopia était un petit royaume heureux. On n’y manquait de rien, le roi portait la plus élégante des moustaches, et le pays était célèbre pour ses mets délicieux ! Mais dans tout le royaume, un monstre rôde : selon la légende, l’Ickabog habitait les marécages brumeux et froids du nord du pays. On disait de cette créature qu’elle avait de formidables pouvoirs et sortait la nuit pour dévorer les moutons et les enfants. Des histoires pour les petits et les naïfs ? Parfois, les mythes prennent vie de façon étonnante…"],"t":"L’Ickabog","a":"J. K. Rowling"}}],"104":[{"k":"p","h":"Que peux-tu me dire sur ce mensonge ?"},{"k":"choix","l":"C’est un mensonge qui se voit comme le nez au milieu de la figure","to":325},{"k":"choix","l":"Un mensonge qui change à chaque fois qu’il faut raconter la même histoire","to":291},{"k":"choix","l":"C’est un mensonge terrible, cruel et aux conséquences effrayantes…","to":14},{"k":"choix","l":"Ces mensonges servent à se protéger du regard des autres","to":231},{"k":"choix","l":"Des mensonges qui se propagent et se multiplient sur les réseaux sociaux","to":288},{"k":"choix","l":"Des ruses et de pieux mensonges","to":91}],"105":[{"k":"livre","b":{"isbn":["9782017868293"],"p":["En 1933, Anna à neuf ans. Elle aime lire, dessiner et se rendre au zoo avec son frère Max. Brusquement tout change. Son père disparaît sans prévenir. Puis, elle-même et le reste de sa famille s’exilent pour le rejoindre en Suisse. C’est le début d’une vie de réfugiés. D’abord Zurich, puis Paris et enfin Londres. Avec chaque fois de nouveaux usages, de nouveaux amis, une nouvelle langue. Ce périple plein d’angoisse et d’imprévus est ensoleillé par la cohésion de cette famille qui fait front, ensemble, célébrant leur bonheur d’être libre."],"t":"Quand Hitler s’empara du lapin rose","a":"Judith Kerr"}},{"k":"choix","l":"Pour découvrir un autre récit","to":316}],"106":[{"k":"p","h":"De quoi doit parler le livre que je dois te proposer ?"},{"k":"choix","l":"« Une famille recomposée »","to":370},{"k":"choix","l":"« Un groupe de sœurs qui vit dans la même maison »","to":252},{"k":"choix","l":"« Une fratrie de six garçons »","to":301},{"k":"choix","l":"« Les aventures d’orphelins »","to":156},{"k":"choix","l":"« Des frères et sœurs découvrent un monde fantastique »","to":118},{"k":"choix","l":"« Des frères et sœurs qui se protègent l’un l’autre »","to":317}],"107":[{"k":"livre","b":{"isbn":["9782092548387"],"p":["Trois jeunes filles ont l’habitude de passer l’été ensemble à Cherbourg et fortes de ce moment de complicité, elles continuent toute l’année à échanger leurs secrets via internet. Mais voilà que cette année, leur amitié montre des failles, chacune étant prise dans ses propres problèmes, sans réussir à s’ouvrir aux autres. De plus, Mar s’est liée avec Angela qu’elle souhaite présenter à son groupe d’amies. Arriveront-elles à rester unies ?"],"t":"Trois (ou quatre) amies","a":"Laurence Schaack et Françoise de Guibert"}},{"k":"choix","l":"Pour découvrir l’histoire de copines qui se serrent les coudes","to":53},{"k":"choix","l":"Pour découvrir l’histoire d’un groupe de meilleures copines pour la vie","to":282}],"108":[{"k":"livre","b":{"isbn":["9782354883270"],"p":["Tillo est un jeune Néandertalien dont la horde, la tribu de Safa, affronte maints dangers pour survivre : le froid pinçant, la chasse difficile, les dangers que représentent les hordes ennemies dont certaines sont cannibales, des fauves redoutables comme les hyènes des cavernes. Il a un atout, son intelligence, et la confiance qu’il place dans un louveteau qu’il nourrit depuis la mort de sa mère."],"t":"Tillo, un torrent de bisons","a":"Martial Caroff"}},{"k":"choix","l":"Pour découvrir un roman jeunesse susceptible de te plaire","to":346},{"k":"choix","l":"Pour découvrir un classique susceptible de te plaire","to":219}],"109":[{"k":"livre","b":{"isbn":["9782210751620"],"p":["Une jeune fille que l’on appelle « la belle » se sacrifie pour sauver son père, condamné à mort pour avoir cueilli une rose dans le domaine d’un terrible monstre. Contre toute attente, la Bête épargne la Belle et lui permet de vivre dans son château. Peu à peu, elle s’aperçoit que, derrière les traits de l’animal, souffre un homme victime d’un sortilège…"],"t":"La belle et la bête","a":"Jeanne-Marie Leprince de Beaumont"}},{"k":"choix","l":"Pour découvrir d’autres contes européens","to":296},{"k":"choix","l":"Pour découvrir les classiques d’orient","to":297}],"110":[{"k":"livre","b":{"isbn":["9782266168656"],"p":["Depuis des générations, fidèles aux lois de leurs ancêtres, quatre clans de chats sauvages se partagent la forêt. Mais le Clan du Tonnerre court un grave danger, et les sinistres guerriers de l’Ombre sont de plus en plus puissants. Rusty est un jeune chat domestique qui rêve de liberté, de courses folles et d’odeurs de souris. Parviendra-t-il à trouver sa place dans la forêt, sera-t-il accepté par les autres chats ?"],"t":"La guerre des clans","a":"Erin Hunter"}},{"k":"choix","l":"Si tu veux découvrir une autre série","to":26},{"k":"choix","l":"Si tu veux découvrir un autre roman susceptible de te plaire","to":163}],"111":[{"k":"livre","b":{"isbn":["9782748505689"],"p":["Vanessa et ses parents, de retour d’Algérie, s’installent dans un petit village du sud de la France. Un jour, ils reçoivent une lettre anonyme menaçant leur chat Amchiche, qu’ils ont ramené de Kabylie. Un polar inoubliable sur le racisme et la violence qu’il engendre."],"t":"Le chat de Tigali","a":"Didier Daeninckx"}}],"112":[{"k":"livre","b":{"isbn":["9791035822491"],"p":["L’histoire commence par le cambriolage d’un château de Normandie, où rien n’a été volé, mais où un homme a été tué. Le magistrat chargé de l’affaire ne parvient pas à en écarter un lycéen surdoué, Isidore Beautrelet qui s’est fait passer pour un journaliste et qui va mener l’enquête."],"t":"L’Aiguille creuse","a":"Maurice Leblanc"}},{"k":"choix","l":"Pour découvrir un autre auteur de roman policier","to":289}],"113":[{"k":"livre","b":{"isbn":["9782019109950"],"p":["Le jeune Percy vit à New-York avec sa mère et son beau-père. Alors qu’il ignore tout de l’identité de son vrai père, il est attaqué par des monstres mythologiques… Imaginez un peu sa surprise quand il découvre qu’il est accusé par Zeus d’avoir volé l’éclair source de son pouvoir ! Afin d’éviter une guerre fratricide entre les dieux de l’Olympe, Percy va devoir traverser les États Unis pour retrouver l’éclair et démasquer le vrai coupable… au péril de sa vie."],"t":"Percy Jackson : Le voleur de foudre","a":"Rick Riordan"}},{"k":"choix","l":"Si tu veux un roman jeunesse facile à lire","to":91},{"k":"choix","l":"Si tu veux découvrir un florilège de récits de la mythologie gréco-latine","to":300},{"k":"choix","l":"Si tu veux découvrir un classique de la littérature grecque","to":269}],"114":[{"k":"livre","b":{"isbn":["9782290233276"],"p":["L’histoire se déroule dans les Alpes françaises et suit Pierre, un jeune guide de montagne, qui aspire à suivre les traces de son père. Malgré les défis et les dangers, Pierre est déterminé à devenir le meilleur guide de la vallée. Un jour, un riche industriel lui demande de l’accompagner dans l’ascension d’une montagne réputée inaccessible. Pierre y voit l’occasion d’enfin prouver sa valeur… mais ce sommet ne sera pas facilement conquis."],"t":"Premier de cordée","a":"Roger Frison-Roche"}},{"k":"choix","l":"Si tu veux découvrir le grand nord","to":136},{"k":"choix","l":"Si tu préfères découvrir une nouvelle d’aventure","to":238}],"115":[{"k":"livre","b":{"isbn":["9782070652846"],"p":["À 15 ans, Jean de Courçon veut devenir mousquetaire, mais son père en décide autrement : il sera page à Versailles et servira les grands. Finis les rêves d’aventure ? Pas si sûr, car la cour du Roi-Soleil recèle mille pièges. Très vite, le jeune provincial s’y fait un ennemi mortel, François de Champin-Belcourt, petit noble arrogant et sans scrupule. Avec la complicité de la jolie Prunelle, Jean va devoir rendre chaque coup s’il veut sauver son honneur… et sa tête."],"t":"Guerre secrète à Versailles","a":"Arthur Ténor"}},{"k":"choix","l":"Si tu veux découvrir un roman jeunesse avec une histoire de vengeance","to":371},{"k":"choix","l":"Si tu veux découvrir un roman jeunesse avec une enquête policière","to":388},{"k":"choix","l":"Si tu veux découvrir un classique de la littérature","to":239}],"116":[{"k":"p","h":"En quoi le héros que tu veux découvrir est-il différent des autres ?"},{"k":"choix","l":"« Il souffre d’une maladie ou d’un handicap »","to":295},{"k":"choix","l":"« C’est un orphelin »","to":217},{"k":"choix","l":"« Son pays est en guerre »","to":86},{"k":"choix","l":"« Il est victime de harcèlement »","to":143},{"k":"choix","l":"« Il est victime de maltraitance »","to":267},{"k":"choix","l":"« Il a des problèmes familiaux »","to":317},{"k":"choix","l":"« Il vit dans une grande pauvreté »","to":314},{"k":"choix","l":"« Il est victime de racisme »","to":376}],"117":[{"k":"livre","b":{"isbn":["9782013224048"],"p":["En 1550 avant. J.-C., des envahisseurs venus d’Asie règnent sur la vallée du Nil. Mais la résistance s’organise et Tétiki est chargé de mettre un trésor à l’abri des voleurs. Il doit découvrir la sépulture secrète de Taa avant l’ennemi. L’avenir de son pays en dépend. Pour mener à bien sa mission, Tétiki va défier les espions, le désert et la mort."],"t":"Les Pilleurs de sarcophages","a":"Odile Weulersse"}},{"k":"choix","l":"Si tu veux découvrir un classique de la littérature","to":99}],"118":[{"k":"livre","b":{"isbn":["9782075088404"],"p":["Au fond d’une armoire magique se trouve l’entrée de l’extraordinaire pays de Narnia. Aslan, le noble lion, a créé ce monde enchanté et tous les êtres qui y vivent. Or, il y a quarante ans, la Sorcière blanche a plongé Narnia dans un hiver éternel. Depuis, le royaume attend d’être libéré. L’arrivée miraculeuse de quatre enfants, Peter, Susan, Edmund et Lucy, fait renaître l’espoir…"],"t":"Le monde de Narnia","a":"C.S. Lewis"}}],"119":[{"k":"livre","b":{"isbn":["9782211302661"],"p":["L’histoire se situe au XIXe siècle. Rémi, un enfant abandonné, est vendu par ses parents adoptifs à un saltimbanque nommé Vitalis. Sous les ordres de ce patron, Rémi endure les rigueurs de la vie itinérante et affronte toutes sortes d’épreuves. Parcourant les routes françaises et anglaises, il exerce différents métiers avant de découvrir le secret de ses origines."],"t":"Sans famille","a":"Hector Malot"}},{"k":"choix","l":"Pour découvrir les aventures d’un autre héros classique","to":292},{"k":"choix","l":"Pour découvrir des récits autobiographiques susceptibles de te plaire","to":349}],"120":[{"k":"livre","b":{"isbn":["9782211233729"],"p":["Bjorn, fils d’Erik, douze ans, vit à Fizzland. Il honore le dieu Godinn, alors que sa mère est chrétienne. La tempête de neige de l’hiver 1065 oblige la famille à rester cloîtrée dans la maison, puis à descendre dans une galerie de trolls. Bjorn le craintif se découvre un talent pour combattre, qu’il tire de ses rêves où apparaît un garçon sans tête. Vainqueur du combat contre le guerrier de glace, il s’interroge : serait-il un Morphir, un timide voué à devenir le plus grand héros de sa génération ?"],"t":"Bjorn le morphir","a":"Thomas Lavachery"}}],"121":[{"k":"livre","b":{"isbn":["9782266126304"],"p":["Dans un zoo, un vieux loup borgne tourne en rond dans sa cage. Un enfant nommé Afrique le regarde avec insistance. Le loup ne veut pas voir les hommes qui le retiennent prisonnier mais cet enfant est différent. Le loup se met alors à fixer l’enfant et un lien va se créer entre ces deux êtres pour leur permettre de communiquer."],"t":"L’œil du loup","a":"Daniel Pennac"}},{"k":"choix","l":"Pour découvrir un autre livre susceptible de te plaire","to":342}],"122":[{"k":"p","h":"Essayons d’en savoir un peu plus sur le livre que tu cherches ! De prime abord, je pense que les nouvelles fantastiques pourraient très bien t’intéresser. Si c’est le cas, <a class=\"renvoi\" href=\"#c403\">→ Chapitre 403<\/a>"},{"k":"choix","l":"Si tu cherches un livre drôle pour te détendre, je te conseille d’","to":201}],"123":[{"k":"p","h":"Quel sport ?"},{"k":"choix","l":"« De la danse »","to":197},{"k":"choix","l":"« De l’alpinisme »","to":230},{"k":"choix","l":"« De la natation »","to":67},{"k":"choix","l":"« Du basket »","to":248},{"k":"choix","l":"« Du tennis »","to":160},{"k":"choix","l":"« De la boxe »","to":364},{"k":"choix","l":"« De la course à pied »","to":387},{"k":"choix","l":"« Du cyclisme »","to":53}],"124":[{"k":"livre","b":{"isbn":["9782410004847"],"p":["Tout oppose les deux jeunes enfants allemands d’avant la seconde guerre mondiale : l’un est un modeste bourgeois juif, l’autre est issu de la noblesse. Pourtant, plus forte que la distinction sociale et religieuse, une réelle camaraderie va naître entre eux. La haine anti-juive nazie se déchaînant, l’adolescent juif quitte l’Allemagne. Une fois la guerre terminée, l’adolescent devenu adulte se penche sur son passé et va chercher à savoir ce qu’est devenu son ami, aristocrate. L’enquête est dure. Le silence est pesant aux questions qu’il pose aux proches de cet ami…"],"t":"L’ami retrouvé","a":"Fred Uhlman"}}],"125":[{"k":"choix","l":"Si tu es plus attiré par les elfes et les fées","to":178},{"k":"choix","l":"Si tu es plus attiré par les monstres et les fantômes","to":164}],"126":[{"k":"livre","b":{"isbn":["9791022405263"],"p":["L’Empereur Noir, a levé ses armées monstrueuses pour envahir les royaumes d’Enkidiev. Bientôt, le continent subit les attaques féroces de ses dragons et hommes-insectes. Pourquoi déclencher une guerre après des siècles de paix ? Les Chevaliers d’Émeraude sont les seuls à pouvoir percer ce mystère et repousser les forces du Mal. Ils devront pour cela accomplir l’étrange prophétie qui lie Kira, une petite fille de deux ans, au sort du monde…"],"t":"Les chevaliers d’émeraude : Le feu dans le ciel","a":"Anne Robillard"}},{"k":"choix","l":"Si tu veux découvrir un autre roman susceptible de te plaire","to":362},{"k":"choix","l":"Si tu veux découvrir un classique de la fantasy","to":379}],"127":[{"k":"p","h":"La science-fiction est un genre littéraire que j’apprécie tout particulièrement. Que peux-tu me dire du livre que tu souhaites lire ?"},{"k":"choix","l":"« J’aimerais visiter une autre planète ! »","to":186},{"k":"choix","l":"« J’aimerais un roman qui se passe dans un futur dystopique ! »","to":68},{"k":"choix","l":"« J’aimerais découvrir une uchronie steampunk »","to":312},{"k":"choix","l":"« Un roman avec des scientifiques qui font des expériences controversées »","to":319},{"k":"choix","l":"« Un univers post-apocalyptique, ravagé par une maladie ou par la guerre »","to":46}],"128":[{"k":"livre","b":{"isbn":["9782010009013"],"p":["L’histoire suit un groupe d’écoliers romains. Rufus un élève facétieux accroche au tableau une tablette de cire sur laquelle est écrit « Caïus est un âne » pour se moquer d’un de ses camarades. Ce dernier étant le fils d’un sénateur, le professeur n’a pas d’autre choix que de le renvoyer de son cours. Le lendemain, les même mots sont retrouvés peints en rouge sur le temple de Minerve. Tout semble accuser Rufus qui se fait arrêter et condamner aux galères. Ses camarades de classe, Mucius, Jules, Flavien, Publius et Antoine, convaincus de son innocence, mènent alors l’enquête pour découvrir le véritable coupable."],"t":"L’affaire Caïus","a":"Henry Winterfeld"}},{"k":"choix","l":"Si tu veux un autre roman se déroulant pendant l’Empire romain","to":22},{"k":"choix","l":"Si tu veux découvrir un roman dans le monde de la Grèce antique","to":270},{"k":"choix","l":"Si c’est l’Antiquité égyptienne qui t’intéresse","to":117}],"129":[{"k":"livre","b":{"isbn":["9782012814578"],"p":["Jonathan Harker, jeune notaire, est envoyé en Transylvanie pour rencontrer un client, le Comte Dracula, nouveau propriétaire d’un domaine à Londres. À son arrivée, il découvre un pays mystérieux et menaçant. Malgré la bienveillance de son hôte, le jeune clerc ne peut qu’éprouver une angoisse grandissante. Très vite, il se rend à la terrifiante évidence : il est prisonnier d’un homme qui n’en est pas un. Et qui partira bientôt hanter les nuits de Londres…"],"t":"Dracula","a":"Bram Stoker"}},{"k":"choix","l":"Si tu veux découvrir un autre classique de l’épouvante","to":15}],"130":[{"k":"livre","b":{"isbn":["9782203064553"],"p":["Paul, un collégien de 11 ans, vient de déménager dans une maison aux murs de pierre imposants et froids. Loin de ses anciens amis, voyant ses parents toujours occupés, Paul se sent seul… et la nuit, il commence à faire des crises de somnambulisme. Chaque fois, il se réveille au plus profond de la maison, devant la porte de la cave. Derrière cette porte se cache une chose terrifiante, qui fait vibrer toute la tuyauterie, qui vient gratter derrière les murs… Qui l’attend…"],"t":"La maison sans sommeil","a":"Benoît Malewicz"}},{"k":"choix","l":"Si tu veux découvrir d’autres livres susceptibles de te plaire","to":81}],"131":[{"k":"livre","b":{"isbn":["9782070612918"],"p":["Qui pourrait croire que derrière cette paisible ménagère, si tendre et si attentionnée avec son mari, se cache une terrible meurtrière ? Les apparences sont parfois trompeuses…"],"t":"Coup de gigot et autres histoires à faire peur","a":"Roald Dahl"}},{"k":"choix","l":"Pour découvrir un autre roman susceptible de te plaire","to":71}],"132":[{"k":"p","h":"Voici ma liste thématique pour t’aider à trouver ton bonheur :"},{"k":"choix","l":"Le sport","to":95},{"k":"choix","l":"Les animaux","to":20},{"k":"choix","l":"La peur","to":66},{"k":"choix","l":"L’amitié","to":137},{"k":"choix","l":"Relations entre frère et sœur","to":106},{"k":"c il veut survivre, il doit écouter son instinct et s’adapter à la vie sauvage et aux conditions extrêmes de l’Alaska.","Si tu veux un autre livre du même auteur mais avec un loup comme héros 227."],"t":"L’appel de la forêt","a":"Jack London"}}],"137":[{"k":"p","h":"Quel genre de livre sur l’amitié souhaites-tu lire ?"},{"k":"choix","l":"L’histoire d’un groupe de meilleures copines","to":107},{"k":"choix","l":"Les aventures d’une bande de garçons","to":146},{"k":"choix","l":"L’amitié entre un garçon et une fille","to":24},{"k":"choix","l":"Une amitié entre un enfant et un animal","to":121},{"k":"choix","l":"La naissance d’une amitié","to":331},{"k":"choix","l":"La terrible fin d’une amitié !","to":9}],"138":[{"k":"livre","b":{"isbn":["9782092490495"],"p":["Ceux qui disent que Sherlock Holmes est le meilleur détective du monde ignorent encore l’existence de sa sœur : Enola Holmes ! 1888. Le jour où Enola Holmes découvre que sa mère a disparu, elle pressent qu’elle seule pourra la retrouver. Elle qui a grandi libre, est alors soumise par ses frères à l’apprentissage des bonnes manières d’une lady, puis expédiée droit vers un pensionnat de jeunes filles. Mais la chère enfant a du cran et de la ressource et elle échappe à son détective de frère, plongeant dans les bas-fonds de la capitale…"],"t":"Les Enquêtes d’Enola Holmes : La Double disparition","a":"Nancy Springer"}},{"k":"choix","l":"Pour découvrir un autre roman policier jeunesse qui se passe au XIXe siècle","to":337},{"k":"choix","l":"Pour découvrir un roman policier jeunesse dans un univers contemporain","to":175},{"k":"choix","l":"Si tu préfères que je te conseille un livre rapide à lire","to":131},{"k":"choix","l":"Si tu veux te frotter aux enquêtes des maîtres du genre","to":59},{"k":"choix","l":"Si tu préfères découvrir un roman d’espionnage","to":70}],"139":[{"k":"livre","b":{"isbn":["9782075120401"],"p":["Un avion s’écrase sur une île, en plein océan Pacifique, avec à son bord un groupe d’écoliers anglais. Aucun adulte ne survit au crash et les enfants se trouvent livrés à eux-mêmes. Les survivants tentent de s’organiser et de vivre en groupe. Mais bien vite, la fragile société vole en éclats et laisse peu à peu la place à une organisation tribale, sauvage et violente bâtie autour d’une religion rudimentaire et d’un chef charismatique nommé Jack. Offrandes sacrificielles, chasse à l’homme, guerres sanglantes : la civilisation disparaît au profit d’un retour à un état proche de l’animal que les enfants les plus fragiles ou les plus raisonnables paient de leur existence."],"t":"Sa majesté des mouches","a":"William Golding"}}],"140":[{"k":"choix","l":"Si tu veux découvrir un roman s’inspirant de l’univers des contes de fée","to":185},{"k":"choix","l":"Si tu veux un roman qui soit la réécriture d’un conte célèbre","to":18},{"k":"choix","l":"Si tu veux découvrir mes contes classiques préférés","to":109},{"k":"choix","l":"Si tu veux découvrir des contes amusants et faciles à lire","to":281}],"141":[{"k":"livre","b":{"isbn":["9782070647798"],"p":["Que se passe-t-il donc au collège ? Qui se promène la nuit dans les couloirs déserts ? Quel secret abritent les sous-sols où aucun élève n’est jamais allé ? Qui a saccagé la salle de sciences naturelles et assommé M. Cornue, le laborantin ? Le principal cherche des coupables parmi les internes… Une seule solution pour Rémi, Mathilde et P.P. Cul-Vert : découvrir eux-mêmes la vérité."],"t":"Enquête au collège","a":"Jean-Philippe Arrou-Vignod"}},{"k":"choix","l":"Pour découvrir un autre roman susceptible de te plaire","to":220}],"142":[{"k":"p","h":"J’ai en tête deux classiques à te conseiller !"},{"k":"choix","l":"Si tu souhaites découvrir une histoire d’amour et d’amitié","to":189},{"k":"choix","l":"Si au contraire tu veux découvrir une histoire de rivalité et de violence","to":139}],"143":[{"k":"livre","b":{"isbn":["9782748537864"],"p":["Elles sont dans la même classe de troisième. Elles auraient pu être amies. Mais Sarah, élève populaire qui aime dominer, décide de cristalliser les regards et la haine sur Orlane, une nouvelle à l’allure sage. Sans raison particulière : peut-être parce que Orlane a un drôle de nez, peut-être parce que les bretelles de son sac à dos sont trop serrées. C’est donc sans raison particulière que la vie d’Orlane va subitement se transformer en un cauchemar sans fin."],"t":"Ne vois-tu rien venir","a":"Amélie Antoine"}},{"k":"choix","l":"Pour découvrir un roman sur le harcèlement scolaire au collège","to":398},{"k":"choix","l":"Pour découvrir un roman où la grande sœur protège sa cadette","to":284},{"k":"choix","l":"Pour découvrir un thriller sur le thème du harcèlement","to":5},{"k":"choix","l":"Pour découvrir un roman sur le harcèlement qui se passe au Japon","to":340},{"k":"choix","l":"Pour un roman plein d’espoir et d’humour sur le thème du harcèlement","to":53},{"k":"p","h":"( !) Téléphone au 3018 si tu es victime ou témoin de harcèlement : L’appel est gratuit et te permet d’entrer en contact avec des professionnels qui se relaient 7 jours sur 7."}],"144":[{"k":"livre","b":{"isbn":["9782266274500"],"p":["Dans un Chicago post-apocalyptique, la société est divisée en 5 factions : les Altruistes, les Audacieux, les Sincères, les Érudits et les Fraternels. Chacune est consacrée au culte d’une vertu dans l’espoir de créer une civilisation parfaite. Les enfants grandissent dans la faction où ils sont nés. À 16 ans, ils doivent choisir quelle sera la leur, pour la vie. Avant de prendre cette décision, ils passent des tests pour connaître la vertu la plus proche de leur personnalité."],"t":"Divergente","a":"Veronica Roth"}},{"k":"choix","l":"Es-tu joueur ? lance une pièce en l’air ! Si elle tombe sur pile","to":180},{"k":"choix","l":", si elle tombe sur face","to":258}],"145":[{"k":"choix","l":"Si tu veux explorer par toi même le pays des merveilles d’Alice…","to":94},{"k":"choix","l":"Si tu n’as pas peur de perdre ta santé mentale, tu peux partir explorer l’œuvre du maître de l’horreur","to":333}],"146":[{"k":"livre","b":{"isbn":["9782070612772"],"p":["Comme tous les petits garçons, Nicolas ne serait pas grand-chose sans les copains : Clotaire le rêveur, Agnan le chouchou surdoué, Maixent le magicien et Rufus et Joachim. Sans oublier Marie-Edwidge, la fille des voisins."],"t":"Le petit Nicolas et les copains","a":"René Goscinny"}},{"k":"choix","l":"Pour découvrir d’autres aventures du petit Nicolas","to":161},{"k":"choix","l":"Pour découvrir les aventures de chenapans aimant faire l’école buissonnière","to":292},{"k":"choix","l":"Pour une histoire d’amitié et de solidarité entre deux enfants","to":245}],"147":[{"k":"p","h":"Les dragons, les cyclopes et autres créatures fantastiques sont omniprésents dans la littérature depuis l’antiquité. Quel genre d’univers souhaites-tu découvrir ?"},{"k":"choix","l":"« J’aimerais un livre s’inspirant de l’antiquité et des récits mythologiques »","to":113},{"k":"choix","l":"« J’aimerais un livre merveilleux s’inspirant des contes de fées »","to":140},{"k":"choix","l":"« J’aimerais un livre médiéval-fantastique où la magie côtoie les épées »","to":45},{"k":"choix","l":"« J’aimerais un livre original qui sort un peu des sentiers battus »","to":276}],"148":[{"k":"choix","l":"Pour découvrir des nouvelles engagées sur le thème du féminisme","to":182},{"k":"choix","l":"Pour découvrir une lecture simple qui aborde la question des stéréotypes sexistes de notre société","to":401},{"k":"choix","l":"Pour reprendre le contrôle de son corps grâce au sport : la boxe","to":265},{"k":"choix","l":"Pour reprendre le contrôle de son corps grâce au sport : la course à pied","to":237},{"k":"choix","l":"Pour un roman historique qui remonte jusqu’à la Préhistoire","to":346},{"k":"choix","l":"Pour un roman historique de cape et d’épée","to":371},{"k":"choix","l":"Pour un roman de science-fiction où les adolescentes doivent lutter contre le diktat bien-pensant de la société qui veut dissimuler leurs corps","to":75},{"k":"choix","l":"Pour découvrir un roman dont l’intrigue se passe en Afghanistan et où l’héroïne doit braver les règles patriarcales imposées par la société pour survivre","to":360}],"149":[{"k":"livre","b":{"isbn":["9782075099899"],"p":["Patricia est la fille du directeur d’une grande réserve naturelle au Kénya. Alors qu’elle s’occupe de King, un fauve impressionnant qu’elle a recueilli et nourri lorsqu’il n’était encore qu’un lionceau… Un jeune Masaï pénètre dans ce sanctuaire pour effectuer le rite de passage à l’âge adulte exigé par sa tribu : Tuer un lion."],"t":"Le lion","a":"Joseph Kessel"}}],"150":[{"k":"livre","b":{"isbn":["9782070612987"],"p":["Berlin 1942. Bruno a 9 ans, et vit avec ses parents et sa sœur dans une belle maison. Son père, un officier nazi, vient d’avoir une promotion et ils déménagent hors de Berlin. Bruno est triste de se retrouver loin de tout, dans une lugubre maison. De sa fenêtre, il peut voir des silhouettes d’hommes, de femmes et d’enfants, tous vêtus de pyjamas rayés. Personne ne veut lui expliquer qui ils sont."],"t":"Le garçon en pyjama rayé","a":"John Boyne"}},{"k":"choix","l":"Si tu veux découvrir un récit de la guerre sur le front asiatique","to":264},{"k":"choix","l":"Si tu veux découvrir une histoire vraie, un témoignage de cette époque","to":105},{"k":"choix","l":"Si tu veux découvrir un classique de la littérature","to":9}],"151":[{"k":"livre","b":{"isbn":["9782070601592"],"p":["Dans un monde où les sorcières sont habillées de façon ordinaire et ressemblent à n’importe qui, elles parviennent à passer totalement inaperçues. Leur terrible objectif : se débarrasser des enfants qu’elles détestent par-dessus tout. Seul un jeune garçon et sa grand-mère sont en mesure de les en empêcher. Mais cela leur promettra de sacrées aventures !"],"t":"Sacrées sorcières","a":"Roald Dahl"}}],"152":[{"k":"livre","b":{"isbn":["9782290360965"],"p":["La Présidente de la République l’a décidé : tout élève doit faire, entre sa troisième et sa seconde, une année de service civique quelque part en France. Valentin Lemonnier n’a pas de chance : ses vœux ne sont pas respectés, et il est envoyé dans le Pas-de-Calais, dans un centre pour personnes âgées atteintes d’Alzheimer, minutieusement reconstitué pour ressembler à un village des années 60."],"t":"Âge tendre","a":"Clémentine Beauvais"}}],"153":[{"k":"livre","b":{"isbn":["9791022401395"],"p":["Au Pays des contes, rien n’est comme on l’imagine : Boucle d’or est une criminelle recherchée, Blanche-Neige dissimule un lourd secret, et le Petit Chaperon rouge n’a même plus peur du loup. Projetés dans cet univers par un grimoire enchanté, Alex et Conner n’ont qu’un seul moyen de rentrer chez eux : rassembler huit objets magiques, si possible en évitant les foudres de la Méchante Reine. Car cette dernière a un plan machiavélique qui pourrait bien les y enfermer à tout jamais."],"t":"Le pays des contes","a":"Chris Colfer"}}],"154":[{"k":"livre","b":{"isbn":["9782266203579"],"p":["Martin a un secret : il cache un jeune faucon qu’il réussit à apprivoiser. C’est une aventure dangereuse car, en ce temps-là, le petit paysan risque la prison s’il garde pour lui l’oiseau réservé aux chasses du seigneur. Mais Martin s’en moque, il refuse de se soumettre et rien ne l’arrêtera."],"t":"Le faucon déniché","a":"Jean-Côme Noguès"}}],"155":[{"k":"livre","b":{"isbn":["9782351786246"],"p":["Au XVIIIe siècle, la guerre fait rage entre Anglais et Français pour la conquête du Nouveau Monde. Un jeune officier anglais est chargé de conduire Alice et Cora chez leur père, le colonel Munro, dans son fort assiégé. Trahis par leur guide, attaqués par les Hurons, ils sont secourus par un vieux chef indien et son fils, Uncas, le dernier des Mohicans. Mais pourront-ils échapper à la lutte sans merci que se livrent les tribus indiennes ?"],"t":"Le dernier des mohicans","a":"James Fenimore Cooper"}}],"156":[{"k":"livre","b":{"isbn":["9782092524817"],"p":["Un terrible incendie ravage la maison des Baudelaire. Les parents y perdent la vie, laissant orphelins leurs trois enfants, Klaus, Violette et Prunille. Ils sont placés chez un lointain cousin, le comte Olaf, qui compte bien tout mettre en œuvre pour récupérer leur fortune."],"t":"Les Désastreuses Aventures des orphelins Baudelaire","a":"Daniel Handler"}},{"k":"choix","l":"Si tu veux découvrir un autre roman jeunesse susceptible de te plaire","to":328}],"157":[{"k":"livre","b":{"isbn":["9782253104025"],"p":["Le célèbre détective privé belge Hercule Poirot enquête sur le meurtre de la jeune et belle héritière Linnet Ridgeway, perpétré à bord d’un navire de croisière voguant sur le Nil. Cette dernière s’était éprise de Simon Doyle, le fiancé de sa meilleure amie, Jacqueline de Bellefort et l’avait épousé dans la foulée. La suspecte la plus probable, Jacqueline, qui nourrissait une grande haine envers celle-ci, est pourtant une des seules personnes parmi les divers clients à avoir un alibi solide."],"t":"Mort sur le Nil","a":"Agatha Christie"}},{"k":"choix","l":"Si tu veux découvrir un autre livre de la même autrice","to":203}],"158":[{"k":"livre","b":{"isbn":["9782017155102"],"p":["Ivan est un gorille, mais il n’a rien d’une bête sauvage. C’est un animal paisible qui vit dans un vieux centre commercial oublié de tous. Ivan s’accommode assez bien de sa condition. Il a ses amis : Stella, la vieille éléphante, Bob, le chien errant, et Julia, la fille du gardien. Il a la télé et, surtout, il a le dessin, car Ivan est un peu artiste. Mais l’arrivée dans la ménagerie de Ruby, une petite éléphante innocente et fragile, va changer sa vie. Bouleversé par sa tristesse, Ivan se fait une promesse : grâce à lui, elle retrouvera sa joie de vivre et aura une vie meilleure."],"t":"Le seul et unique Ivan","a":"Katherine A. Applegate"}},{"k":"choix","l":"Si tu souhaites découvrir un autre roman répondant à tes critères","to":249}],"159":[{"k":"livre","b":{"isbn":["9782072762086"],"p":["Santiago est un vieux pêcheur cubain très pauvre. Mais la pêche est depuis longtemps mauvaise et les parents du gamin qui l’accompagne ne veulent plus qu’il travaille avec lui. Le vieillard prend son bateau et part tout seul sur la mer… C’est alors qu’un énorme espadon mord à son hameçon !"],"t":"Le vieil homme et la mer","a":"Ernest Hemingway"}},{"k":"choix","l":"Pour découvrir un autre roman classique","to":339}],"160":[{"k":"livre","b":{"isbn":["9782070601202"],"p":["Depuis leur enfance, Ulysse et Ludovic, son frère aîné, sont entraînés par leur père pour pratiquer le tennis à haut niveau. Ulysse raconte sa position délicate de cadet, l’entraînement intensif, son arrêt des compétitions à quatorze ans, le coma de son frère après un match. Comment vivra-t-il son changement de vie, au lycée Montaigne, dans un milieu social si différent, celui de sa grand-mère qui n’a jamais accepté que sa fille épouse le fils d’un maçon portugais ? Reprendra-t-il un jour le tennis ?"],"t":"Double faute","a":"Isabelle Pandazopoulos"}}],"161":[{"k":"livre","b":{"isbn":["9782070612765"],"p":["Cette série de romans raconte les aventures de Nicolas, un petit garçon dans les années 60. On le suit dans toutes les étapes de sa jeune vie, toujours ponctuées de bagarres ou bêtises de toutes sortes."],"t":"Le petit Nicolas","a":"René Goscinny"}},{"k":"choix","l":"Si tu veux découvrir un autre livre susceptible de te plaire","to":21}],"162":[{"k":"livre","b":{"isbn":["9782266168649"],"p":["La vie de Henry Atherton bascule le jour où il capture… un papillon. Ce papillon très spécial n’est autre que Pyrgus, héritier du royaume des fées de la lumière. Entré dans le monde de Henry par un portail magique saboté, Pyrgus doit, coûte que coûte, rentrer chez lui. Car là-bas, Beleth, le démon des fées de la nuit, rêve de conquérir le pouvoir ! Malgré lui, Henry est entraîné dans la terrible guerre qui divise le royaume. Pour secourir Pyrgus, lui aussi doit franchir le portail qui permet d’accéder au monde des fées, désormais à feu et à sang…"],"t":"La Guerre des Fées","a":"James Herbert Brennan"}}],"163":[{"k":"livre","b":{"isbn":["9782075118781"],"p":["Tout commence le jour où Tonin, le fils du roi des ours, est enlevé par des chasseurs dans les montagnes de Sicile… Profitant de la rigueur d’un hiver qui menace son peuple de famine, le roi décide alors d’envahir la plaine où habitent les hommes. Avec l’aide de son armée et d’un magicien, il réussit à vaincre et finit par retrouver Tonin. Mais il comprend vite que le peuple des ours n’est pas fait pour vivre au pays des hommes…"],"t":"La fameuse invasion de la Sicile par des ours","a":"Dino Buzzati"}}],"164":[{"k":"livre","b":{"isbn":["9782747086073"],"p":["Après une grave maladie, Liam, 15 ans, est envoyé en convalescence dans un manoir isolé. Cette maison de repos, où il n’y a ni téléphone ni électricité, semble aussi abriter une section psychiatrique. En effet, l’un des pensionnaires se prend pour Léonidas, roi de Sparte ; un autre pour un pirate ; une jeune fille s’habille comme au Moyen Âge et une autre comme au XIXe siècle. Enfin, Liam apprend que des malades dangereux sont enfermés dans une pièce secrète de la maison."],"t":"Le manoir","a":"Evelyne Brisou-Pellen"}},{"k":"choix","l":"Pour découvrir une autre série de romans susceptible de te plaire","to":77}],"165":[{"k":"livre","b":{"isbn":["9782226460905"],"p":["Mike est écrivain et chasseur de fantômes. Non pas qu’il y croit lui-même, bien au contraire. Jusque-ici, rien n’est encore parvenu à vaincre son scepticisme. Rien, jusqu’à cette enquête qui le mène à l’hôtel Dolphin de New York, réputé pour sa tristement célèbre chambre 1408. Une chambre supposée hantée…"],"t":"Chambre 1408","a":"Stephen King"}},{"k":"choix","l":"Si tu veux découvrir un autre titre du même auteur","to":83},{"k":"choix","l":"Pour découvrir un des grands classiques de la littérature d’épouvante","to":129},{"k":"choix","l":"Si tu souhaites vivre une expérience horrifique immersive…","to":145}],"166":[{"k":"p","h":"Celui qui lit ça est une banane ! Trop tard, tu l’as lu :) Pour te débarrasser de ta « bananité » tu dois lire un roman avant la fin des prochaines vacances…"}],"167":[{"k":"livre","b":{"isbn":["9782290154601"],"p":["La civilisation s’effondre après une épidémie incontrôlable et foudroyante. Les règles disparaissent, les rapports de puissance s’inversent, et le monde plonge dans les ténèbres. Un vieillard raconte le jour où tout a basculé à ses petits-fils, désormais en proie aux superstitions ancestrales et soumis à la loi du plus fort. Voués à revivre les balbutiements de l’humanité, ils ont oublié les plus grands accomplissements des êtres humains avant eux…"],"t":"La peste écarlate","a":"Jack London"}}],"168":[{"k":"livre","b":{"isbn":["9782211223294"],"p":["De l’or, de l’or, de l’or ! En 1523, le général Pizarro part à la conquête du Pérou et entre dans la ville de Cajamalca. Ses hommes et lui sont éblouis par ce qu’ils découvrent : il y a de l’or partout. Pour s’en emparer, Pizarro a un plan : il va capturer l’Inca, l’empereur du Pérou, et réclamer le plus d’or possible en échange de lui. Mais jusqu’où ira cette fièvre de posséder, violente et incompréhensible ? Et aura-t-elle jamais une fin ?"],"t":"L’or de Cajamalca","a":"Jakob Wassermann"}},{"k":"choix","l":"Pour découvrir un autre roman susceptible de te plaire","to":396}],"169":[{"k":"livre","b":{"isbn":["9782877065078"],"p":["Tout semble opposer Joseph, l’instituteur anticlérical, au truculent et catholique oncle Jules ; pourtant les deux familles décident en 1904 de louer ensemble une maison de campagne pour y passer les vacances d’été. Ces vacances sont une révélation pour le jeune Marcel et son frère qui tombent amoureux des collines emblématiques de la Provence, de sa végétation sauvage. Un jour, Marcel suit en secret son père et son oncle partis faire l’ouverture de la chasse et, après s’être égaré, finit par retrouver les chasseurs au son des coups de fusil. Il découvre que son père, qui « n’avait jamais tué ni poil ni plume », vient de réussir un « coup du roi » !"],"t":"La gloire de mon père","a":"Marcel Pagnol"}},{"k":"choix","l":"Si tu veux découvrir la mère la plus méchante de la littérature","to":349}],"170":[{"k":"livre","b":{"isbn":["9782700238938"],"p":["La vie de Camille, adolescente surdouée, bascule le jour où elle pénètre accidentellement dans un univers parallèle, nommé Gwendalavir. Elle ignore tout de ce monde où, pourtant, on semble la reconnaître sous le nom d’Ewilan. Accompagnée dans sa quête par son ami Salim, elle réalise qu’elle possède un don prodigieux et que tout un peuple l’attendait pour reconquérir sa liberté et sa dignité. Camille doit vite apprendre à maîtriser son pouvoir, l’art du Dessin…"],"t":"La quête d’Ewilan","a":"Pierre Bottero"}}],"171":[{"k":"livre","b":{"isbn":["9782211235747"],"p":["Le jeune Ernest vit avec sa grand-mère, depuis que sa mère est morte à sa naissance et que son père a disparu. Il vit dans une maison hors du temps, depuis 10 ans. Mais « vivre », quel bien grand mot pour ce petit garçon solitaire qui n’a rien vécu, rien connu… Jusqu’au jour où Victoire de Montardent arrive dans sa classe et jette son dévolu sur lui. Car Ernest est beau, ce que les autres filles de la classe avaient déjà remarqué…"],"t":"Lettre d’amour de 0 à 10 ans","a":"Susie Morgenstern"}}],"172":[{"k":"livre","b":{"isbn":["9782013223997"],"p":["Savez-vous pourquoi l’éléphant s’est retrouvé affublé d’une trompe ? Douze fables mettant en scène des animaux de la jungle et de la savane et racontant comment ils sont devenus tels que nous les connaissons aujourd’hui."],"t":"Histoires comme ça","a":"Rudyard Kipling"}},{"k":"choix","l":"Si tu souhaites découvrir un autre livre répondant à tes critères","to":79}],"173":[{"k":"livre","b":{"isbn":["9782211205825"],"p":["Dans le monde où vit Jonas, la guerre, les inégalités, les différences n’existent pas. Des sages imposent des règles de vie strictes, composent les familles, organisent l’éducation des enfants, choisissent leurs métiers… Le jour de ses douze ans, Jonas se voit attribuer sa future fonction : il sera « passeur », c’est-à-dire dépositaire de la mémoire de la communauté. Pendant son apprentissage, Jonas découvre les sentiments, les couleurs mais aussi la douleur, la souffrance, la différence… Sa vie va être bouleversée."],"t":"Le passeur","a":"Lois Lowry"}},{"k":"choix","l":"Pour découvrir un autre roman susceptible de te plaire","to":378}],"174":[{"k":"livre","b":{"isbn":["9782211056465"],"p":["M.et Mme Little attendaient un enfant, et c’est avec une souris de 5 centimètres de haut qu’ils sont rentrés de la maternité. Un souriceau prodige nommé Stuart, qui sait parler et marcher dès la naissance et pour lequel il va falloir rendre la maison confortable et sûre. Mais Stuart est un aventurier qui n’aime ni le confort ni la sécurité. Ce qu’il aime, c’est conduire des bolides modèles réduits, sur la route et sur les flots. Jouer à être le Président du Monde. Se battre au tir à l’arc avec un chat assassin."],"t":"Stuart Little","a":"E. B. White"}},{"k":"choix","l":"Si tu souhaites suivre une enquête palpitante","to":17},{"k":"choix","l":"Si tu préfères découvrir les astuces d’un renard","to":193}],"175":[{"k":"livre","b":{"isbn":["9782211001250"],"p":["Y a t-il un lien entre la cocaïne découverte dans le container d’un négociant de café et la disparition d’un jeune docker tatoué ? Le capitaine de police Augustin Maupetit en est persuadé. Mais comment pourrait-il enquêter alors qu’il est cloué en fauteuil roulant ? Le policier teigneux va devoir compter sur son entourage et notamment sur sa voisine de palier, Angie Tourniquet qui n’a que 12 ans mais qui se révèle être une parfaite coéquipière. Mais voilà qu’un drôle de virus se répand et le président Macron s’apprête à faire une allocution télévisée. On parle d’un grand confinement… Comment mener l’enquête au temps du Covid ?"],"t":"Angie","a":"Marie-Aude Murail et Lorris Murail"}},{"k":"choix","l":"Pour découvrir un autre roman policier de Marie-Aude Murail","to":380},{"k":"choix","l":"Si tu veux que je te conseille une autre enquête","to":218}],"176":[{"k":"livre","b":{"isbn":["9791036318887"],"p":["Panneaux solaires, écrans tactiles, tablettes numériques… le collège est à la pointe de la technologie ! Mais bientôt, des événements étranges se produisent. Des rats surgissent des casiers, des élèves disparaissent, et l’immense bibliothèque dissimule un passage secret. Quant au professeur de sciences, Garfield Gouille, il se comporte très bizarrement. Aidé d’improbables amis, Matteo va découvrir que le collège Lovecraft cache un secret… démoniaque !"],"t":"Collège Lovecraft : Professeur Gargouille","a":"Charles Gilman"}},{"k":"choix","l":"Pour découvrir un autre livre susceptible de te plaire","to":338}],"177":[{"k":"livre","b":{"isbn":["9782019110277"],"p":["Orphelin surdoué, Reynie répond à une annonce : on recrute des enfants pour un mystérieux projet. Le garçon passe des examens plus incongrus les uns que les autres au terme desquels il est recruté avec trois autres enfants, orphelins et surdoués comme lui, par un certain Mr Benedict. Celui-ci demande à Reynie, Kate, Sticker et Constance d’infiltrer une pension tenue par Mr Curtain, un savant mégalo qu’il soupçonne de mettre au point un système de contrôle des esprits. Les enfants n’ont qu’une seule instruction : se serrer les coudes."],"t":"Le mystérieux cercle Benedict","a":"Trenton Lee Stewart"}},{"k":"choix","l":"Pour découvrir un autre livre répondant à tes critères","to":322}],"178":[{"k":"livre","b":{"isbn":["9782910753221"],"p":["Arthur a bien des soucis. Un méchant promoteur rêve de saisir la belle maison de sa grand-mère dans laquelle il passe ses vacances. Pas question de compter sur ses parents qui l’ont déposé là sans ménagement. Pas question non plus d’attendre son grand-père, disparu mystérieusement il y a maintenant quatre ans. Peut-être pourra-t-il compter sur Alfred, son gros chien plus affectueux qu’intelligent ? À moins que, dans la vieille bibliothèque du grand-père, un grimoire ne lui permette de passer « de l’autre côté », au pays des minimoys… Eux seuls peuvent encore tout sauver !"],"t":"Arthur et les Minimoys","a":"Luc Besson"}},{"k":"choix","l":"Si tu souhaites que je te propose un autre livre d’aventure","to":224},{"k":"choix","l":"Si tu préfères que je te conseille une histoire d’amour","to":274}],"179":[{"k":"livre","b":{"isbn":["9782253012542"],"p":["Dans le cabinet encombré de l’excentrique professeur Lidenbrock, un parchemin couvert d’étranges caractères s’échappe d’un vieux manuscrit, œuvre d’un alchimiste islandais du 16e siècle. Le savant déchiffre alors un curieux message… Un mois plus tard, avec son neveu Axel et un guide islandais, Lidenbrock s’engouffre dans les entrailles de notre planète…"],"t":"Voyage au centre de la terre","a":"Jules Verne"}},{"k":"choix","l":"Pour découvrir un autre roman de cet auteur","to":359}],"180":[{"k":"livre","b":{"isbn":["9782266260770"],"p":["Dans un futur sombre, sur les ruines des États-Unis, un jeu télévisé est créé pour contrôler le peuple par la terreur. Douze garçons et douze filles tirés au sort participent à cette sinistre téléréalité, que tout le monde est forcé de regarder en direct. Une seule règle dans l’arène : survivre, à tout prix."],"t":"Hunger Games","a":"Suzanne Collins"}}],"181":[{"k":"livre","b":{"isbn":["9782021011968"],"p":["Greg a 12 ans, un grand frère musicien qui lui fait des blagues, un petit frère qui le colle, un copain qu’il supporte histoire de ne pas être seul, des problèmes avec les filles qui pouffent à longueur de journée, des parents qui ne comprennent jamais rien à ce qu’il demande… Un jour sa mère lui offre un journal intime, que Greg rebaptise en carnet de bord. « Si elle croit que je vais écrire là-dedans ce que je »ressens« ou je ne sais pas trop quoi, elle se fourre le doigt dans l’œil. » Heureusement, entre ce que dit Greg et ce qu’il fait vraiment, il y a un monde…"],"t":"Journal d’un dégonflé","a":"Jeff Kinney"}},{"k":"choix","l":"Si tu veux découvrir un autre livre susceptible de te plaire","to":221}],"182":[{"k":"livre","b":{"isbn":["9782377420520"],"p":["Les princesses ne sont pas toutes de belles endormies, de délicates rêveuses, de romantiques filles sages… Les princesses prennent leur revanche ! Ici, lassées d’attendre qu’un prince vienne enfin les rejoindre, elles partent elles-mêmes à l’aventure ! Tour à tour espiègles, courageuses et rebelles, au théâtre comme en forêt profonde, rien ne les arrête."],"t":"La revanche des princesses","a":""}},{"k":"choix","l":"Si tu veux découvrir un autre livre susceptible de te plaire","to":242}],"183":[{"k":"livre","b":{"isbn":["9782075103763"],"p":["Le 10 septembre 1987, Michael embarque avec ses parents et leur chienne, Stella, sur un voilier pour faire le tour du monde. Ils s’arrêtent, parfois, pour de fabuleuses escales, Afrique, Amérique, Australie, jusqu’au jour où survient un terrible accident. Le jeune garçon se retrouve échoué, avec sa chienne, sur un île déserte perdue au milieu du Pacifique. Va-t-il pouvoir survivre, affamé, menacé par toutes sortes de dangers ? Reverra-t-il jamais ses parents ? Un matin, alors que l’épuisement le gagne, Michael trouve auprès de lui un peu de nourriture et d’eau douce. Il n’est pas seul…"],"t":"Le Royaume de Kensuké","a":"Michael Morpurgo"}},{"k":"choix","l":"Si tu veux découvrir une autre aventure avec des naufragés","to":234}],"184":[{"k":"livre","b":{"isbn":["9782075121453"],"p":["Charly Vernier découvre que sa grand-mère était magicienne. Mais un mystérieux voleur de mémoire, le Cavalier, l’a dépouillée de ses souvenirs et cherche à s’emparer de la source ultime de la magie. Pour la sauver, Charly, aidé par Maître Lin et par son amie Sapotille, n’a d’autre choix que de devenir apprenti magicien."],"t":"Magic Charly","a":"Audrey Alwett"}},{"k":"choix","l":"Si tu veux découvrir un autre roman jeunesse susceptible de te plaire","to":223},{"k":"choix","l":"Si tu veux une lecture simple et amusante","to":341},{"k":"choix","l":"Si tu veux découvrir un roman légèrement effrayant","to":10}],"185":[{"k":"livre","b":{"isbn":["9791023513226"],"p":["Carmin, pensionnaire à l’orphelinat Sainte-Alliance, pensait finir sa vie dans les usines de Linn. Qui, en effet, voudrait adopter un garçon doté d’un sabot à la place du pied droit ? Alors, quand Gléphirina et Calphurnius Powell l’emmènent vivre dans leur demeure, le jeune orphelin n’en croit pas ses yeux. Aurait-il enfin droit, lui aussi, à la belle vie des riches habitants de Linn ? Malheureusement, son enthousiasme laisse bientôt place à une sourde inquiétude. Que cachent donc les Powell, collectionneurs d’animaux empaillés, dans le cabinet secret où ils passent leur journées ? Carmin serait-il, à cause de son pied-sabot, destiné à rejoindre leur collection ? Non, bien sûr, car on n’empaille pas les enfants…"],"t":"Carmin : Le garçon au pied-sabot","a":"Amélie Sarn"}},{"k":"choix","l":"Pour découvrir un autre livre susceptible de te plaire","to":153}],"186":[{"k":"livre","b":{"isbn":["9782080262295"],"p":["Sur la planète Mars, en 2541. Quatre adolescents vivent dans un Eden mystérieux, mi-paradis mi-prison, avec pour seule compagne une étrange gouvernante. Ils mènent une existence sans heurt jusqu’au jour où ils décident de quitter ce cocon pour explorer le monde. Sur leur chemin : un lac noir, une pyramide maya, des ogres mais aussi un agent du Comité d’Ethique Mondial et un savant fou à qui ils doivent la vie. Pour les quatre héros, l’aventure se transforme peu à peu en parcours initiatique et en quête des origines. De cette épreuve, ils ne sortiront pas indemnes…"],"t":"Projet oXatan","a":"Fabrice Colin"}},{"k":"choix","l":"Si tu veux découvrir une autre aventure martienne","to":7}],"187":[{"k":"livre","b":{"isbn":["9782700256444"],"p":["Kasienka est polonaise et elle vient d’arriver en Angleterre avec sa mère. Mais la vie ici n’a rien d’une vie rêvée. Heureusement, il y a la piscine, il y a l’eau. Et dans l’équipe de natation, il y a William…"],"t":"Swimming pool","a":"Sarah Crossan"}},{"k":"choix","l":"Pour découvrir un autre livre susceptible de te plaire","to":88}],"188":[{"k":"livre","b":{"isbn":["9782210740563"],"p":["Témoignage exceptionnel sur la Première Guerre mondiale. Le récit est d’un réalisme parfois terrible mais toujours d’une généreuse humanité. La vie des tranchées nous est décrite dans toute son horreur, on y découvre le quotidien des poilus : l’arrière, le front, la tambouille, les obus, la camaraderie et la mort."],"t":"Les croix de bois","a":"Roland Dorgelès"}}],"189":[{"k":"livre","b":{"isbn":["9782218962813"],"p":["L’histoire se déroule au début du XXe siècle dans la campagne française. François Seurel est un adolescent solitaire qui observe avec curiosité un nouvel élève : Augustin Meaulnes, un garçon charismatique et intrépide. L’histoire prend un tournant inattendu lorsque Meaulnes se perd lors d’une escapade dans la campagne. Meaulnes revient après plusieurs jours et raconte à François de mystérieuses histoires sur un étrange domaine abandonné où se déroulent des fêtes somptueuses… Cet évènement marque le début d’une quête obsessionnelle pour retrouver ce lieu magique et la belle jeune fille qui hante les pensées de Meaulnes."],"t":"Le grand Meaulne","a":"Alain-Fournier"}}],"190":[{"k":"livre","b":{"isbn":["9782211223096"],"p":["L’auteur raconte son enfance pendant la Seconde Guerre mondiale en France. Il explique les mesures prises contre les Juifs par le gouvernement de Vichy, et son quotidien, dans un village. En juillet 1942, il a six ans. Son père, médecin, et ses oncles sont arrêtés par des gendarmes allemands et français. Il est confié à des voisins avec sa petite sœur. Les enfants sont ensuite arrêtés, puis internés à Drancy. Il raconte comment ils ont pu échapper à la déportation et retrouver leur mère."],"t":"Voyage à Pitchipoï","a":"Jean-Claude Moscovici"}}],"191":[{"k":"livre","b":{"isbn":["9782070623921"],"p":["Comment occuper sa retraite quand on a été toute sa vie instituteur en CM1 ? Robert Poutifard n’a qu’une idée en tête : se venger de ses anciens élèves. Leur faire enfin payer ces années de chahut et d’humiliation ! La vengeance est un plat qui se mange froid, et Robert Poutifard leur prépare une vraie surprise du chef. Ces sales mômes vont vraiment déguster !"],"t":"La troisième vengeance de Poutifard","a":"Jean-Claude Mourlevat"}}],"192":[{"k":"livre","b":{"isbn":["9782010009075"],"p":["Un appareil photo d’occasion bien embarrassant, une antique baignoire de fonte d’où s’écoule du sang, un bus de nuit sans passagers, un ordinateur démodé qui affiche des messages inquiétants, un souvenir rapporté de vacances… Neuf histoires à glacer le sang, où la réalité la plus anodine glisse inexorablement vers le cauchemar."],"t":"La photo qui tue : Neuf histoires à vous glacer le sang","a":"Anthony Horowitz"}}],"193":[{"k":"livre","b":{"isbn":["9782075097109"],"p":["Dans la vallée vivent trois riches fermiers, éleveurs de succulentes volailles. Ils sont mesquins, avares et méchants et chacun dans le voisinage les craint. Or, au-dessus de la vallée, dans le bois, une famille de renards a établi son terrier. Affamés et malins, ils ont trouvé un astucieux moyen de se ravitailler. Dindes dodues et tendres poulets figurent ainsi tous les soirs au menu. Mais les trois grigous méditent une terrible vengeance…","Symbole de la ruse, le renard a joué très tôt le rôle du sournois trublion parvenant à tirer avantage de toutes les situations. Si tu veux découvrir une autre œuvre mettant en scène un renard, <a class=\"renvoi\" href=\"#c209\">→ Chapitre 209<\/a>"],"t":"Fantastique maître renard","a":"Roald Dahl"}}],"194":[{"k":"livre","b":{"isbn":["9782075195867"],"p":["Avant, la seule chose qui comptait, en âge, c’était celui du fond des verres. Avant, je n’avais pas remarqué que mes parents étaient deux vieillards. Avant, mes copines m’enviaient parce que chez moi on avait le droit de jouer des maracas, de se déguiser avec les affaires de ma mère… Mais maintenant, ce n’est plus comme avant. Je n’ai plus tellement envie de montrer mes parents. Tout a changé depuis que je suis en sixième."],"t":"L’âge du fond des verres","a":"Claire Castillon"}},{"k":"choix","l":"Pour découvrir un autre roman susceptible de te plaire","to":205}],"195":[{"k":"livre","b":{"isbn":["9782021051094"],"p":["Pic vient d’être arrêté par la police pour avoir escaladé un gratte-ciel en plein New York. Son père Josh, un célèbre alpiniste, décide de l’emmener au Tibet et d’en faire la plus jeune personne à gravir le Mont Everest."],"t":"Pic","a":"Roland Smith"}}],"196":[{"k":"livre","b":{"isbn":["9782010015601"],"p":["Lorsque Titus apprend un matin que Hannibal, le général carthaginois, a traversé les Alpes avec ses éléphants pour envahir la Gaule, il se jure, du haut de ses seize ans, de l’en empêcher."],"t":"Tumulte à Rome","a":"Odile Weulersse"}}],"197":[{"k":"livre","b":{"isbn":["9782017202387"],"p":["Ève grandit dans un orphelinat du Mali. Son rêve : devenir un jour danseuse étoile. Adoptée à l’âge de six ans, elle part vivre en France. Sous le regard aimant de ses parents, elle suit une formation solide, épaulée par sa professeure qui l’encourage à se présenter à l’école de danse de l’Opéra de Paris. Jusqu’à ce jour où une remarque blessante vient tout faire basculer. Elle réalise brutalement que, dans ses livres, dans les films et sur les scènes de ballet, il n’y a jamais de danseuses étoiles noires. Comment a-t-elle pu ne pas le remarquer plus tôt ? Et si toutes ces années à la poursuite de son rêve n’étaient qu’une illusion ?"],"t":"Les pointes noires","a":"Sophie Noël"}},{"k":"choix","l":"Pour découvrir un autre livre susceptible de te plaire","to":261}],"198":[{"k":"livre","b":{"isbn":["9782749913025"],"p":["Lorsqu’on a quatorze ans, des neurones d’écureuil, une meilleure amie obsédée par les garçons et qu’on enchaîne les gaffes, la vie n’est pas facile. Depuis le décès de son père, Aurélie Laflamme se demande d’où elle vient. Aurait-elle été oubliée sur Terre par des extraterrestres ? Pour couronner le tout, sa mère semble sous le charme du directeur de son collège. Pas question pour Aurélie de se laisser elle aussi ramollir le cerveau ! Mais personne n’est à l’abri du coup de foudre… Au milieu de ce tourbillon, Aurélie ne désire qu’une chose : trouver sa place dans l’univers."],"t":"Le journal d’Aurélie Laflamme","a":"India Desjardins"}},{"k":"choix","l":"Pour découvrir une série teintée de secrets","to":355},{"k":"choix","l":"Pour découvrir une série facile à lire","to":231}],"199":[{"k":"livre","b":{"isbn":["9782290200988"],"p":["1870, les soldats prussiens occupent Rouen. Des bourgeois tentent de quitter la ville en diligence… Parmi eux se trouve une prostituée surnommée Boule de suif. Pendant le trajet, tous les passagers commencent à avoir faim. Heureusement, Boule de Suif a un cœur d’or et propose gentiment de partager ses provisions. Les voyageurs s’arrêtent pour la nuit dans une auberge. Mais le lendemain, impossible de repartir, l’auberge est occupée par les Prussiens. La seule porte de sortie est un horrible chantage : la diligence pourra reprendre la route seulement si Boule de Suif accepte de coucher avec un officier prussien !"],"t":"Boule de suif","a":"Guy de Maupassant"}}],"200":[{"k":"livre","b":{"isbn":["9782075126977"],"p":["Enfant abandonné, Ichirô est élevé comme un fils par un mystérieux samouraï qui lui enseigne la voie du sabre. Vivant reclus dans les montagnes, au cœur d’une nature sauvage, il grandit au rythme des saisons, entre une insouciance bienheureuse et un apprentissage qui exige persévérance et courage. Mais par une nuit terrible, Ichirô voit sa vie basculer. Il doit tourner le dos à son enfance pour affronter le monde et son destin."],"t":"Chroniques de l’érable et du cerisier : Le masque de Nô","a":"Camille Monceaux"}},{"k":"choix","l":"Pour découvrir un autre livre susceptible de te plaire","to":305}],"201":[{"k":"livre","b":{"isbn":["9782070601585"],"p":["Le père de Matilda Verdebois pense que sa fille n’est qu’une petite idiote. Sa mère passe tous ses après-midi à jouer au loto. Quant à la directrice de l’école, Mlle Legourdin, c’est la pire de tous : un monstrueux tyran, qui trouve que les élèves sont des cafards. Elle les enferme même dans son terrible étouffoir. Matilda, elle, est une petite fille extraordinaire à l’esprit magique, et elle en a assez. Tous ces adultes feraient bien de se méfier, car Matilda va leur donner une leçon qu’ils ne sont pas près d’oublier."],"t":"Mathilda","a":"Roald Dahl"}},{"k":"choix","l":"Si tu veux découvrir un autre roman de cet auteur","to":151},{"k":"choix","l":"Si tu préfères un autre roman","to":282}],"202":[{"k":"livre","b":{"isbn":["9782081410947"],"p":["Tristan vit avec sa mère au cœur d’une cité. Lorsque Clélia arrive dans sa classe au collège, il découvre une jeune fille au langage soigné, intéressée par les cours et la littérature, différente des autres élèves. Peu à peu, des sentiments nouveaux s’emparent de Tristan, une « douceur inhabituelle porteuse de promesses ». Comment céder à ces sentiments et créer des liens avec Clélia sous le regard des autres garçons ? Faut-il toujours dresser des murs pour se protéger du regard des autres ?"],"t":"Tour B2 mon amour","a":"Pierre Bottero"}},{"k":"choix","l":"Si tu veux découvrir une histoire d’amour entre deux écoliers","to":171},{"k":"choix","l":"Si tu veux découvrir une autre histoire d’amour entre deux collégiens","to":375},{"k":"choix","l":"Si tu veux découvrir une histoire d’amour entre deux lycéens","to":278},{"k":"choix","l":"Si tu veux découvrir un classique de la littérature","to":189}],"203":[{"k":"livre","b":{"isbn":["9782253104049"],"p":["C’est par le plus grand des hasards qu’Hercule Poirot se trouve à bord de l’Orient-Express, ce train de luxe qui traverse l’Europe. Alors qu’il est bloqué par la neige au cœur de la Yougoslavie, on découvre, dans l’une des voitures, le corps d’un Américain sauvagement assassiné à coups de couteau. Le meurtrier se cache forcément parmi les voyageurs… Mais qui de la princesse russe, de l’Américaine fantasque, de ce couple de Hongrois distingués, de ce colonel de retour des Indes ou même du propre secrétaire de la victime a bien pu commettre pareil crime ?"],"t":"Le crime de l’Orient-Express","a":"Agatha Christie"}}],"204":[{"k":"livre","b":{"isbn":["9782253144212"],"p":["Qui est le Bossu, cet être contrefait que l’on croise dans le Paris populaire comme à la cour du Régent ? Quels liens étranges l’unissent au chevalier de Lagardère, fine lame incomparable, cœur généreux, idole des dames et du petit peuple ? Les bonnes gens s’étonnent de voir l’un rendre si souvent visite à l’autre, sans que jamais on ne les voie ensemble. Pour accomplir son œuvre de justicier, pour venger Philippe de Nevers assassiné dix-huit ans plus tôt par le ténébreux prince de Gonzague, le beau Lagardère ne recule devant aucune audace."],"t":"Le Bossu","a":"Paul Féval"}}],"205":[{"k":"livre","b":{"isbn":["9782809663273"],"p":["Sarah a 11 ans, elle vient d’emménager dans une ville inconnue et elle rentre en 6e au collège Ronsard. Pour couronner le tout, sa meilleure amie est partie vivre en Nouvelle-Zélande, pile à l’autre bout du monde ! Alors, le jour de la rentrée, elle est morte de trouille, même si elle est très fière d’être enfin en 6e. Tom aussi a 11 ans. Ronsard, il connaît, ses deux grands frères y sont passés avant lui. À cause de ça, tout le monde l’appelle petit Tom, ce qui l’agace profondément. À priori, rien ne semble devoir rapprocher Sarah et Tom. Et pourtant leur amitié va se voir scellée par une cause commune…"],"t":"Enfin la 6e !","a":"Fabrice Colin"}},{"k":"choix","l":"Pour découvrir l’histoire d’une déléguée de classe très impliquée","to":334}],"206":[{"k":"livre","b":{"isbn":["9782700279825"],"p":["Enlevée au monde des mortels lorsqu’elle n’était qu’une enfant, Jude vit parmi les Faes, des créatures sublimes, immortelles… et cruelles. Mais être humaine à Terrafe est un défi incessant. Et savoir manier l’épée, maîtriser les usages, se protéger des sortilèges, tout cela ne suffit pas. D’autant que Jude s’est fait un ennemi de choix : le Prince Cardan, héritier de la couronne. Pour gagner sa place à la cour, appartenir vraiment à cette terre de magie, Jude doit le défier, quelles qu’en soient les conséquences."],"t":"Le peuple de l’air : le prince cruel","a":"Holly Black"}},{"k":"choix","l":"Pour découvrir un autre livre susceptible de te plaire","to":366}],"207":[{"k":"livre","b":{"isbn":["9782290151310"],"p":["Une Vénus en bronze a été découverte dans la petite ville d’Ille. Cette étonnante statue, d’une étrange beauté, hante les imaginations et déchaîne les passions, alors que se préparent les noces du jeune Alphonse et de Mlle de Puygarrig. Est-elle une bienveillante représentation de la déesse de l’Amour, comme l’affirment les archéologues ? Est-elle maléfique, comme le prétendent les habitants du village ? Les curieuses inscriptions gravées sur son socle apporteront-elles une réponse aux mystérieux événements qui bouleversent la région ?"],"t":"La Vénus d’Ille","a":"Prosper Mérimée"}},{"k":"choix","l":"Si tu désires découvrir une autre nouvelle fantastique","to":13}],"208":[{"k":"livre","b":{"isbn":["9782700279696"],"p":["Pénélope n’a jamais fait le deuil de son enfance heureuse, avant le divorce de ses parents. Depuis quatre ans, elle évite autant que possible son père qui a refait sa vie et qu’elle déteste. Elle évite un peu tout le monde, en fait, la peur d’être déçue… Alors, elle tente de passer inaperçue et se cache derrière un humour acerbe. Quand sa mère ethnologue lui annonce qu’elle part un an en Papouasie et qu’elle va devoir s’installer chez son père, c’est alerte rouge ! Pénélope se recroqueville dans sa coquille et se prépare à l’orage : un père mielleux, une belle-mère tyrannique, une demi-sœur insupportable, un nouveau lycée où elle sera une étrangère…"],"t":"Regarder l’orage dans les yeux","a":"Cécile Alix"}},{"k":"choix","l":"Pour un roman qui aborde les conflits et les difficultés à accepter sa belle famille","to":370}],"209":[{"k":"livre","b":{"isbn":["9782081385696"],"p":["Pour un bon plat d’anguilles ou d’andouilles, Renart est prêt à tout. Habile stratège, il imagine mille ruses pour duper son monde. Le coq Chantecler, Tiecelin le corbeau, le loup Ysengrin et même Noble le lion, son roi, en font les frais. Beau parleur déguisé en chevalier, en médecin ou en sorcier, il parvient toujours à ses fins. Jusqu’au jour où les autres animaux, lassés de ses mauvais coups, décident de lui tendre un piège…"],"t":"Le roman de Renart","a":""}}],"210":[{"k":"livre","b":{"isbn":["9782831302614"],"p":["Dans un orphelinat de l’Angleterre victorienne, Oliver Twist survit au milieu de ses compagnons d’infortune. Mal nourri, exploité, il ne connaît que privations et mauvais traitements. Oliver endure tout, jusqu’au jour où il s’enfuit vers Londres et est recueilli par une bande de jeunes voleurs qui travaillent pour le vieux Fagin…"],"t":"Oliver Twist","a":"Charles Dickens"}}],"211":[{"k":"livre","b":{"isbn":["9782226257758"],"p":["Le jeune Alfie a douze ans et cache à son père malade et infirme une montagne de lettres de rappel de rendez-vous chez le dentiste. Le temps et les sucreries ont rendu les dents d’Alfie franchement épouvantables ! Mais la supercherie prend fin le jour où une nouvelle dentiste particulièrement inquiétante arrive en ville et vient examiner les dents des collégiens. Très vite, Alfie devient sa proie. L’horrible Docteure Ratiche ruse, l’attache et l’endort, pour mieux charcuter sa mâchoire à sa guise. Lorsque Alfie reprend ses esprits, toutes ses dents ont disparu !"],"t":"Diabolique Dentiste","a":"David Walliams"}}],"212":[{"k":"livre","b":{"isbn":["9782748526165"],"p":["Margot est énervée ! Les garçons occupent presque toute la cour avec leur foot et en plus ils empêchent les filles d’y jouer. Elle décide de parler du problème avec eux et prend même l’initiative de distribuer à chacun un petit message. Peine perdue… Personne ne l’écoute. Alors Margot a une autre idée."],"t":"Qui veut jouer au foot ?","a":"Myriam Gallot"}}],"213":[{"k":"livre","b":{"isbn":["9782075085359"],"p":["Que se passe-t-il quand on attrape une ratite ? Et quand on simule une crise d’appendicite ? Avez-vous jamais fumé du tabac de chèvre ? Vous a-t-on déjà affublé d’un costume qui donne l’air d’un employé des pompes funèbres pour vous rendre à l’école ? Neuf, dix, onze ans… Les années passent : voici venu le temps de se demander ce que l’on fera après le collège…"],"t":"Moi, Boy","a":"Roald Dahl"}}],"214":[{"k":"livre","b":{"isbn":["9782070577637"],"p":["Il était une fois au Japon, au cœur du XIXe siècle, un petit vendeur des rues, nommé Tojiro. Le jeune garçon rencontre un jour un curieux vieil homme. C’est Katsushika Hokusai, le vieillard fou de dessin, le plus grand artiste japonais, le maître des estampes, l’inventeur des mangas. Fasciné par son talent, Tojiro devient son ami et son apprenti, et le suit dans son atelier…"],"t":"Le vieux fou de dessin","a":"François Place"}},{"k":"choix","l":"Pour découvrir un autre livre susceptible de te plaire","to":159},{"k":"choix","l":"Pour découvrir une lecture facile et rapide","to":311}],"215":[{"k":"livre","b":{"isbn":["9782253079910"],"p":["Oscar a dix ans et vit désormais à l’hôpital. Même si personne n’ose le lui dire, il sait qu’il va mourir. Parmi les dames en blouse rose qui viennent passer du temps avec les enfants malades, il en est une qui lui propose, pour qu’il se sente moins seul, d’écrire à Dieu. Ces lettres décrivent douze jours dans l’existence d’Oscar, des jours cocasses et poétiques, pleins de personnages drôles et émouvants. Douze jours qui seront peut-être les derniers."],"t":"Oscar et la dame en rose","a":"Eric-Emmanuel Schmitt"}},{"k":"choix","l":"Pour découvrir un autre roman susceptible de t’intéresser","to":367},{"k":"choix","l":"Pour découvrir une belle histoire d’amour","to":232}],"216":[{"k":"livre","b":{"isbn":["9782747049030"],"p":["Ulysse le voyageur malgré lui, qui sait en quittant sa chère île d’Ithaque, sa douce Pénélope et son petit Télémaque qu’il ne les reverra pas avant vingt ans, pas avant d’avoir exploré des terres et des mers inconnues. Ulysse aux mille ruses, qui devra trouver un moyen pour que cesse l’interminable guerre de Troie, qui devra combattre le cyclope Polyphème, résister à la plante de l’oubli, au chant des sirènes et aux charmes de la magicienne Circé. Ulysse l’exilé, qui, durant toute sa vie, n’aura qu’un désir : rentrer chez lui et mener une existence paisible avec les siens."],"t":"Le feuilleton d’Ulysse","a":"Sébastien Thibault et Murielle Szac"}}],"217":[{"k":"livre","b":{"isbn":["9782211204897"],"p":["Malo de Lange n’est le fils de personne. Rien ne permet d’identifier l’enfant recueilli en 1822 par l’abbé Pigrièche à l’orphelinat de Tours. Rien, sauf une marque tatouée sur son épaule, la fleur de lys des bagnards que découvrent, horrifiées, les demoiselles de Lange qui viennent de l’adopter…"],"t":"Malo de Lange","a":"Marie Aude Murail"}},{"k":"choix","l":"Si tu veux découvrir un autre roman de cette auteure","to":328},{"k":"choix","l":"Si tu veux découvrir un autre roman jeunesse","to":156},{"k":"choix","l":"Si tu veux découvrir un classique de la littérature","to":299}],"218":[{"k":"livre","b":{"isbn":["9782017134282"],"p":["Après avoir disparu pendant plus d’un mois et être revenu sans aucune explication, Colton Crest a été assassiné. C’est son meilleur ami, Eliott, qui retrouve son corps. Ainsi qu’une lettre, nichée dans sa veste. Signée de la main de l’assassin, elle propose un jeu de piste qui le mènera à six autres lettres. Chacune d’elles le rapprochant un peu plus de la vérité, de l’identité du tueur…"],"t":"7 lettres","a":"Olivia Harvard"}},{"k":"choix","l":"Si tu veux découvrir un a
