*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--f-texte)}
a{color:inherit}
:focus-visible{outline:2px solid var(--clay);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[data-g]{--g:var(--c-ardoise)}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}

/* ── Barre latérale ── */
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--side);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:20px 14px 16px max(14px,env(safe-area-inset-left,0px))}
.marque{display:flex;gap:10px;align-items:center;text-decoration:none;padding:4px 8px 16px}
.marque .ardoise{width:38px;height:38px;border-radius:9px;background:var(--board);border:3px solid var(--clay);color:var(--chalk);
  display:grid;place-items:center;font:700 15px var(--f-titre)}
.marque b{display:block;font:700 1.02rem/1.2 var(--f-titre)}
.marque small{color:var(--muted);font-size:.8rem}
nav ul{list-style:none;margin:0;padding:0}
.lien{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:8px;text-decoration:none;font-size:.93rem}
a.lien:hover{background:var(--line)}
.lien[aria-current="page"]{background:var(--ink);color:var(--paper)}
.lien .ext{margin-left:auto;opacity:.55;width:14px;height:14px}
.puce{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;color:var(--g);background:color-mix(in srgb,var(--g) 14%,transparent)}
.puce svg.i{width:16px;height:16px}
details.grp{margin-top:2px}
details.grp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:5px 8px;border-radius:8px;font-weight:650;font-size:.95rem}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary:hover{background:var(--line)}
details.grp>summary .chev{margin-left:auto;width:15px;height:15px;transition:transform .15s;opacity:.6}
details.grp[open]>summary .chev{transform:rotate(90deg)}
details.grp>ul{margin:2px 0 8px 21px;padding-left:12px;border-left:2px solid color-mix(in srgb,var(--g) 45%,transparent)}
details.grp ul .lien{padding:4px 10px;font-size:.89rem}
details.grp ul ul{margin:0 0 2px 10px}
details.grp ul ul .lien{font-size:.84rem;padding:3px 10px}
.nav-seul{display:flex;align-items:center;gap:10px;padding:5px 8px;border-radius:8px;font-weight:650;font-size:.95rem;text-decoration:none}
.nav-seul:hover{background:var(--line)}
.nav-seul[aria-current="page"]{background:var(--ink);color:var(--paper)}
.nav-seul[aria-current="page"] .puce{background:var(--paper)}
.bientot{color:var(--muted)}
.pt{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.pt.on{background:var(--ok)}
.pt.off{background:transparent;border:1.5px solid var(--muted);opacity:.7}
.lien .pt{margin-left:auto}
.side .bas{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.outils{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap;margin:0 0 18px}
.dys-btn{height:34px;min-width:34px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 .8rem var(--f-titre);cursor:pointer}
.dys-btn:hover{border-color:var(--clay)}
.dys-btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.compte{position:relative}
.compte-b{height:34px;display:inline-flex;align-items:center;gap:8px;padding:0 14px 0 10px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font:600 .88rem var(--f-texte);cursor:pointer;text-decoration:none}
.compte-b.on{background:var(--card);color:var(--ink);border-color:var(--line)}
.compte-b small{color:var(--muted);font-weight:400}
.compte-menu{position:absolute;right:0;top:40px;z-index:50;min-width:230px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;gap:2px;box-shadow:0 8px 24px rgb(0 0 0 / .12)}
.compte-menu a,.compte-menu button{display:block;text-align:left;font:inherit;font-size:.92rem;color:var(--ink);background:none;border:0;border-radius:8px;padding:7px 10px;text-decoration:none;cursor:pointer}
.compte-menu a:hover,.compte-menu button:hover{background:var(--side)}
.compte-menu p{margin:4px 10px 6px;font-size:.8rem;color:var(--muted)}
.compte-menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.cadenas{display:inline-block;margin-left:6px;font-size:.66rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:0 6px;vertical-align:1px}
:fullscreen{overflow:auto;background:var(--paper)}
/* Mode Dys : comme le Laboratoire et les flashcards (police OpenDyslexic, fond clair uni, bordures franches, sans décor) */
html:root.dys{color-scheme:light;--paper:#fbf8ef;--card:#fffdf7;--side:#f3efe3;--line:#c9c3b3;--ink:#1d1d1d;--muted:#4a4a4a;--clay:#1d1d1d;--board:#fffdf7;--chalk:#1d1d1d;
  --c-ardoise:#1d1d1d;--c-bois:#1d1d1d;--c-terracotta:#1d1d1d;--c-violet:#1d1d1d;--c-sarcelle:#1d1d1d;--c-bleu:#1d1d1d;--c-vert:#1d1d1d;--c-ocre:#1d1d1d;--c-rose:#1d1d1d;--c-prune:#1d1d1d;
  --f-titre:"OpenDyslexic",Verdana,Arial,sans-serif;--f-texte:"OpenDyslexic",Verdana,Arial,sans-serif}
html.dys body{line-height:1.6;letter-spacing:.01em;word-spacing:.08em}
html.dys button{font-family:inherit}
html.dys #theme,html.dys .craies,html.dys .tableau::after{display:none}
html.dys .tableau{border:2px solid var(--ink);border-radius:10px}
html.dys .dys-btn{border:2px solid var(--ink)}
html.dys .fiche,html.dys a.tuile,html.dys .vide,html.dys .onglets a[aria-current="page"]{border:2px solid var(--line)}
html.dys *{transition:none!important}
.rond{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.rond:hover{border-color:var(--clay)}

.haut{display:none}

/* ── Contenu ── */
main{min-width:0;padding-block:28px 56px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.col{max-width:1000px;margin:0 auto}

.tableau{position:relative;background:var(--board);color:var(--chalk);border:10px solid var(--clay);border-radius:14px;padding:34px 34px 30px;overflow:hidden}
.tableau::after{content:"";position:absolute;left:24px;right:24px;bottom:0;height:8px;background:var(--clay);border-radius:4px 4px 0 0;opacity:.85}
.tableau .date{font:600 .95rem var(--f-titre);opacity:.85}
.tableau h1{font:700 clamp(1.9rem,4.4vw,2.8rem)/1.15 var(--f-titre);margin:.25em 0 .2em;text-wrap:balance;letter-spacing:.01em}
.tableau p{margin:0;max-width:56ch;opacity:.92}
.craies{position:absolute;right:26px;bottom:10px;display:flex;gap:6px}
.craies i{display:block;width:26px;height:7px;border-radius:3px;background:var(--chalk)}
.craies i:nth-child(2){background:var(--sun)}
.craies i:nth-child(3){background:#e9a08f}

h2.titre{font:700 1.25rem var(--f-titre);margin:38px 0 14px}
h2.grand{font:700 1.7rem var(--f-titre);margin:4px 0 10px}
.sous{color:var(--muted);margin:-6px 0 16px;font-size:.95rem;max-width:68ch}

.tuiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
a.tuile{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;text-decoration:none;transition:border-color .15s,transform .15s}
a.tuile:hover{border-color:var(--g);transform:translateY(-2px)}
.tuile .puce{width:40px;height:40px;border-radius:10px;margin-bottom:6px}
.tuile .puce svg.i{width:22px;height:22px}
.tuile b{font:700 1.05rem var(--f-titre)}
.tuile span{color:var(--muted);font-size:.9rem}

/* Fiche de rubrique : en-tête façon fiche imprimée (titre + étiquette de couleur, liseré) */
.fiches{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));align-items:start}
.fiche{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px 16px}
.fiche-h{display:flex;align-items:center;gap:10px;padding-bottom:10px;margin-bottom:10px;border-bottom:2px solid var(--g)}
.fiche-h h3{margin:0;font:700 1.05rem var(--f-titre);color:var(--g)}
.fiche-h .etq{margin-left:auto;font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--card);background:var(--g);border-radius:6px;padding:2px 8px}
.fiche p{margin:0;color:var(--muted);font-size:.9rem}
.fiche ul{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.fiche li{display:grid;grid-template-columns:8px minmax(0,1fr);gap:10px;align-items:baseline}
.fiche li a{font-weight:600}
.fiche li small{display:block;color:var(--muted);font-size:.8rem}
.fiche li ul{margin-top:5px;gap:3px}
.fiche li li{grid-template-columns:8px minmax(0,1fr);font-size:.88rem}
.prof{display:inline-block;margin-left:6px;font-size:.66rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 6px;vertical-align:1px}

.legende{display:flex;gap:8px 16px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin:0 0 22px;align-items:center}
.legende span{display:inline-flex;align-items:center;gap:6px}
.code{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.code span{display:inline-flex;align-items:center;gap:7px;font-size:.85rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 11px 3px 6px}
.code i{width:14px;height:14px;border-radius:4px;background:var(--g)}

/* Page intérieure : titre de couleur + onglets horizontaux pour les sous-pages */
.fil{font-size:.85rem;color:var(--muted);margin:0 0 6px}
.fil a{color:var(--g);text-decoration:none;font-weight:600}
.page-h{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:2px solid var(--g);margin-bottom:16px}
.page-h h2{margin:0;font:700 1.7rem var(--f-titre);color:var(--g)}
.page-h .puce{width:40px;height:40px;border-radius:10px}
/* Onglets discrets, comme les sous-vues du Cahier de suivi : groupe teinté, onglet actif en blanc */
.onglets{display:inline-flex;flex-wrap:wrap;gap:2px;margin:0 0 18px;padding:3px;border-radius:999px;background:color-mix(in srgb,var(--g) 9%,transparent);max-width:100%}
.onglets a{font-size:.88rem;text-decoration:none;color:var(--muted);padding:4px 13px;border-radius:999px;border:1px solid transparent}
.onglets a:hover{color:var(--ink)}
.onglets a[aria-current="page"]{background:var(--card);border-color:var(--line);color:var(--ink);font-weight:600}
.vide{border:1px dashed var(--line);border-radius:14px;padding:28px 20px;text-align:center;color:var(--muted)}
.vide b{display:block;color:var(--ink);font:700 1.05rem var(--f-titre);margin-bottom:4px}
/* Contenus des pages (contenus.html) */
.contenu{max-width:72ch}

.contenu .chapo{font-size:1.05rem;color:var(--ink);margin:0 0 16px;line-height:1.55}
.contenu p{line-height:1.55}
.contenu a{color:var(--g)}
.sommaire{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 22px}
.sommaire a{cursor:pointer;font-size:.85rem;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 11px}
.sommaire a:hover{border-color:var(--g);color:var(--g)}
.bloc{margin:0 0 30px;scroll-margin-top:70px}
.bloc h3,.titre-bloc{font:700 1.2rem var(--f-titre);color:var(--g);margin:0 0 10px;padding-bottom:4px;border-bottom:1px solid color-mix(in srgb,var(--g) 30%,transparent)}
.titre-bloc{margin-top:24px}
.carte{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.carte h4{margin:0 0 6px;font:700 1rem var(--f-titre)}
.carte p{margin:0 0 8px;font-size:.93rem}
.carte>.i{width:26px;height:26px;color:var(--g);margin-bottom:6px}
.cartes3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:0 0 18px}
.deux{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:12px 0}
.btn{display:inline-block;margin-top:4px;font-size:.88rem;font-weight:600;text-decoration:none;border:1px solid var(--g);border-radius:999px;padding:3px 12px}
.puces{margin:0 0 10px;padding-left:20px}.puces li{margin:4px 0;line-height:1.5}
.note-bas{font-size:.9rem;color:var(--muted)}
.etiquettes{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px}
.etiquettes li{font-size:.88rem;background:color-mix(in srgb,var(--g) 10%,var(--card));border:1px solid color-mix(in srgb,var(--g) 25%,transparent);border-radius:8px;padding:4px 10px}
.regles{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:6px 14px;counter-reset:r}
.regles li{counter-increment:r;display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 12px 7px 7px;line-height:1.35}
.regles li .i{width:40px;height:40px;padding:8px;border-radius:10px;color:var(--g);background:color-mix(in srgb,var(--g) 12%,transparent)}
.regles li::after{content:counter(r);font:700 .8rem var(--f-titre);color:var(--muted)}
.paliers{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.paliers li{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:baseline;background:var(--card);border:1px solid var(--line);border-left:6px solid color-mix(in srgb,#c0392b calc(var(--n)*25%),#e8b64c);border-radius:10px;padding:8px 12px}
.paliers li span{color:var(--muted);font-size:.9rem}
.triangle{list-style:none;margin:12px 0;padding:0;display:grid;gap:4px;max-width:72ch}
.triangle li{--t:calc(100% - (var(--e) - 1) * 15%);--b:calc(100% - var(--e) * 15%);display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;align-items:stretch}
.triangle li:nth-child(1){--f:#ffe100;--x:#3b3200}.triangle li:nth-child(2){--f:#fcd263;--x:#4a3500}.triangle li:nth-child(3){--f:#f9a825;--x:#3d2600}
.triangle li:nth-child(4){--f:#e53525;--x:#fff}.triangle li:nth-child(5){--f:#a5150f;--x:#fff}.triangle li:nth-child(6){--f:#1c1c1c;--x:#fff}
.tri-b{background:var(--f);color:var(--x);display:grid;place-items:center;font:700 1.15rem var(--f-titre);min-height:64px;
  clip-path:polygon(calc(50% - var(--t)/2) 0,calc(50% + var(--t)/2) 0,calc(50% + var(--b)/2) 100%,calc(50% - var(--b)/2) 100%)}
.triangle li:last-child .tri-b{clip-path:polygon(calc(50% - var(--t)/2) 0,calc(50% + var(--t)/2) 0,50% 100%);place-items:start center;padding-top:8px}
.tri-c{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--f);border-radius:10px;padding:8px 12px;align-self:center}
.tri-c b{display:block;line-height:1.35}
.tri-c p{display:flex;gap:6px;align-items:center;margin:3px 0 1px;font-weight:600;color:var(--g)}
.tri-c p .i{flex:none;width:18px;height:18px}
.tri-c small{color:var(--muted);font-size:.8rem}
@media (max-width:560px){.triangle li{grid-template-columns:56px minmax(0,1fr);gap:10px}.tri-b{font-size:1rem}}
.nvc{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:8px 0}
.nvc-col{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.nvc-col h4{display:flex;gap:8px;align-items:center;margin:0 0 6px;font:700 .98rem var(--f-titre)}
.nvc-col.plus{--v:#4d8a4a}.nvc-col.moins{--v:#b2453b}
:root[data-theme="dark"] .nvc-col.plus{--v:#8fca8a}:root[data-theme="dark"] .nvc-col.moins{--v:#ec8f86}
.nvc-col h4 .i{color:var(--v);width:18px;height:18px}
.nvc-col ul{list-style:none;margin:0;padding:0}
.nvc-col li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line)}
.nvc-col li:last-child{border:0}.nvc-col li b{color:var(--v);font-variant-numeric:tabular-nums}
.parties-cahier{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:6px}
.parties-cahier li{display:grid;grid-template-columns:30px auto 1fr;gap:10px;align-items:baseline;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--g);border-radius:10px;padding:8px 12px}
.parties-cahier span{font:700 1rem var(--f-titre);color:var(--g)}.parties-cahier small{color:var(--muted)}
.garde{display:grid;justify-items:center;gap:2px;margin:6px 0 10px;padding:14px;border:2px solid var(--line);border-radius:8px;background:repeating-linear-gradient(var(--card) 0 15px,color-mix(in srgb,var(--line) 60%,transparent) 15px 16px);text-align:center}
.garde strong{font:700 1.1rem var(--f-titre);color:var(--g);margin-top:4px}.garde small{color:var(--muted);margin-top:6px}
.materiel{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:0 0 8px}

.pictos{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px;margin:0 0 8px}
.pictos>div{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.pictos .i{flex:none;width:34px;height:34px;padding:6px;border-radius:9px;color:var(--g);background:color-mix(in srgb,var(--g) 12%,transparent)}
.pictos span{font-size:.92rem;line-height:1.4}.pictos b{display:block}
.code-parties{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px}
.code-parties span{display:grid;grid-template-columns:16px auto;gap:0 9px;align-items:center;font-size:.86rem;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.code-parties i{grid-row:span 2;width:16px;height:100%;min-height:30px;border-radius:4px;background:var(--g)}
.code-parties b{color:var(--ink);font-size:.93rem}
.trimestres{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.trimestres ol{margin:0;padding-left:24px}.trimestres li{margin:5px 0}.trimestres li.bilan{font-weight:600;color:var(--g)}

<!-- ===================== MA CLASSE › RÈGLES ===================== -->
<template data-page="p-ma-classe-regles">
<p class="chapo">En classe, on apprend mieux quand chacun connait les règles et les respecte. Voici ce que l’on fait, ce qui arrive quand on ne le fait pas, et comment on valorise les efforts.</p>
<nav class="sommaire" aria-label="Sur cette page">
  <a data-ancre="r-regles">Les 15 règles</a><a data-ancre="r-classe">Si je ne respecte pas les règles</a><a data-ancre="r-echelle">L’échelle des sanctions</a><a data-ancre="r-nvc">La note de vie de classe</a>
</nav>

<section class="bloc" id="r-regles">
  <h3>Les règles de la classe</h3>
  <ol class="regles">
    <li><i data-ico="horloge"></i><span>Je n’arrive pas en retard.</span></li>
    <li><i data-ico="porte"></i><span>Je rentre calmement en classe.</span></li>
    <li><i data-ico="bonjour"></i><span>Je dis bonjour à mon enseignant·e.</span></li>
    <li><i data-ico="cintre"></i><span>Je retire mon manteau.</span></li>
    <li><i data-ico="fournitures"></i><span>J’ai mon matériel et je sors mes affaires.</span></li>
    <li><i data-ico="main"></i><span>Je lève la main pour prendre la parole.</span></li>
    <li><i data-ico="bavarder"></i><span>Je ne bavarde pas.</span></li>
    <li><i data-ico="pomme"></i><span>Je ne mange pas en cours.</span></li>
    <li><i data-ico="cartable"></i><span>J’attends pour ranger mes affaires.</span></li>
    <li><i data-ico="journal"></i><span>Je rattrape les cours que j’ai manqués.</span></li>
    <li><i data-ico="poubelle"></i><span>Je ne jette aucun déchet par terre.</span></li>
    <li><i data-ico="devoir"></i><span>Je fais le travail demandé.</span></li>
    <li><i data-ico="lire"></i><span>J’ai toujours un livre à lire.</span></li>
    <li><i data-ico="concentre"></i><span>Je suis concentré·e en cours.</span></li>
    <li><i data-ico="question"></i><span>Je pose des questions.</span></li>
  </ol>
</section>

<section class="bloc" id="r-classe">
  <h3>Si je ne respecte pas les règles</h3>
  <p>En classe, les sanctions vont de la plus légère à la plus lourde.</p>
  <ol class="paliers">
    <li style="--n:1"><b>Mot dans le carnet</b><span>Les parents le signent.</span></li>
    <li style="--n:2"><b>Heures de retenue</b><span>Pour rattraper le travail ou réfléchir à son comportement.</span></li>
    <li style="--n:3"><b>Appel ou message à la famille</b><span>Pour trouver ensemble une solution.</span></li>
    <li style="--n:4"><b>Exclusion de cours et rapport d’incident</b><span>Transmis à la vie scolaire.</span></li>
  </ol>
</section>

<section class="bloc" id="r-echelle">
  <h3>L’échelle des sanctions du collège</h3>
  <p>Tout commence par une <b>mise en garde orale</b>. Plus la faute est grave, plus on descend dans le triangle et plus la sanction est lourde.</p>
  <ol class="triangle">
    <li style="--e:1"><span class="tri-b" aria-hidden="true">1</span><div class="tri-c"><b>Bavardage, leçon non sue, travail non fait, oubli de matériel</b><p><i data-ico="fleche"></i>Mot ou croix dans le carnet</p><small>Décidé par tout le personnel</small></div></li>
    <li style="--e:2"><span class="tri-b" aria-hidden="true">2</span><div class="tri-c"><b>Observations répétées, perturbation du cours, carnet non signé, retards répétés</b><p><i data-ico="fleche"></i>Appel aux parents, retenue</p><small>Décidé par tout le personnel</small></div></li>
    <li style="--e:3"><span class="tri-b" aria-hidden="true">3</span><div class="tri-c"><b>Perturbations répétées, falsification, dégradation du matériel</b><p><i data-ico="fleche"></i>Exclusion de cours, travail d’intérêt général</p><small>Décidé par tout le personnel</small></div></li>
    <li style="--e:4"><span class="tri-b" aria-hidden="true">4</span><div class="tri-c"><b>Insolence, jeu dangereux, bagarre, harcèlement, vol</b><p><i data-ico="fleche"></i>Exclusion temporaire</p><small>Décidé par la direction et le CPE</small></div></li>
    <li style="--e:5"><span class="tri-b" aria-hidden="true">5</span><div class="tri-c"><b>Manquements graves et répétés</b><p><i data-ico="fleche"></i>Commission éducative</p><small>Décidé par la direction et le CPE</small></div></li>
    <li style="--e:6"><span class="tri-b" aria-hidden="true">6</span><div class="tri-c"><b>Insulte envers un adulte, violence, mise en danger</b><p><i data-ico="fleche"></i>Conseil de discipline : risque d’exclusion définitive</p><small>Décidé par la direction</small></div></li>
  </ol>
</section>

<section class="bloc" id="r-nvc">
  <h3>La note de vie de classe</h3>
  <p>Chaque trimestre, tu as une note de vie de classe. Tu commences à <b>10 sur 20</b>. Chaque point gagné ou perdu en cours la fait bouger d’<b>un demi-point</b>. La note reste entre 0 et 20 et elle est arrondie au demi-point.</p>
  <div class="nvc">
    <div class="nvc-col plus"><h4><i data-ico="plus"></i>Ce qui rapporte des points</h4><ul>
      <li>Participation<b>+1</b></li><li>Efforts remarqués<b>+1</b></li><li>Aide ses camarades<b>+1</b></li><li>Travail soigné<b>+1</b></li><li>Autonomie<b>+1</b></li><li>Travail en équipe<b>+1</b></li><li>Réponse bonus<b>+2</b></li><li>Excellent travail<b>+3</b></li></ul></div>
    <div class="nvc-col moins"><h4><i data-ico="moins"></i>Ce qui fait perdre des points</h4><ul>
      <li>Bavardage<b>−1</b></li><li>Perturbe la classe<b>−1</b></li><li>Oubli de matériel<b>−1</b></li><li>Ne travaille pas<b>−1</b></li><li>Manque de respect<b>−2</b></li><li>Triche<b>−2</b></li><li>Violence<b>−3</b></li></ul></div>
  </div>
</section>

</template>

<!-- ===================== MA CLASSE › BADGES ===================== -->
<template data-page="p-ma-classe-badges">
<p class="chapo">Les badges récompensent ton travail, tes progrès et ton comportement en classe. Clique sur une famille pour voir les badges à gagner.</p>
<div class="cartes3">
  <a class="carte tuile-badge" data-ouvre="bd-classe" aria-expanded="false"><i data-ico="brevet"></i><h4>Les badges de la classe</h4><p>Donnés en cours par l’enseignant, quand tu fais des efforts, quand tu aides les autres ou quand tu réussis un défi.</p><span class="btn">Voir les badges</span></a>
  <a class="carte tuile-badge" data-ouvre="bd-labo" aria-expanded="false"><i data-ico="langue"></i><h4>Les badges du Laboratoire</h4><p>Gagnés en t’entrainant dans le Laboratoire de la langue : séries réussies, temps passé, régularité.</p><span class="btn">Voir les badges</span></a>
  <a class="carte tuile-badge" data-ouvre="bd-ceintures" aria-expanded="false"><i data-ico="ceinture"></i><h4>Les ceintures et les trophées</h4><p>Chaque ceinture valide un niveau dans une notion. Les trophées récompensent les ceintures gagnées.</p><span class="btn">Voir les trophées</span></a>
</div>
<p class="note-bas">Les badges en gris sont ceux qui restent à gagner. Pour voir en couleur ceux que tu as déjà, connecte-toi puis ouvre <b>Mes badges</b> dans le menu de ton prénom.</p>

<section class="bloc vitrine-bloc" id="bd-classe" hidden>
  <h3>Les badges de la classe</h3>
  <div data-vitrine="classe"></div>
</section>
<section class="bloc vitrine-bloc" id="bd-labo" hidden>
  <h3>Les badges du Laboratoire</h3>
  <div data-vitrine="labo"></div>
</section>
<section class="bloc vitrine-bloc" id="bd-ceintures" hidden>
  <h3>Les trophées des ceintures</h3>
  <p>Dans le Laboratoire, cinq échelles (grammaire, conjugaison, orthographe, homophones, vocabulaire) ont chacune sept ceintures par niveau, de la blanche à la noire, et une ceinture Expert. <a href="/labo/#ceintures">Voir les ceintures</a></p>
  <div data-vitrine="ceintures"></div>
</section>

<section class="bloc" id="bd-calcul">
  <h3>Ce que rapportent les badges</h3>
  <p>Les badges de la classe comptent dans ta <a href="#p-ma-classe-regles">note de vie de classe</a>. Chaque badge ajoute <b>un demi-point</b>. Avec <b>10 badges</b>, ton passeport est complet : c’est <b>un point de plus</b>.</p>
  <div class="calcul"><b>Ma note</b> = 10 + (mes points × 0,5) + (mes badges × 0,5) + (mes passeports complets × 1)</div>
  <p class="note-bas">Exemple : 6 points gagnés en cours et 10 badges, cela fait 10 + 3 + 5 + 1 = 19 sur 20. La note reste entre 0 et 20 et elle est arrondie au demi-point.</p>
</section>

<template data-page="p-ma-classe-cahier">
<p class="chapo">Le cahier de français est ton outil de travail principal. Il est organisé en cinq parties. Chacune a sa couleur, la même sur le site et sur les fiches.</p>
<ol class="parties-cahier">
  <li style="--g:var(--c-sarcelle)"><span>1</span><b>Littérature</b><small>Les textes, les séquences, les activités.</small></li>
  <li style="--g:var(--c-terracotta)"><span>2</span><b>Grammaire</b><small>Les leçons d’étude de la langue et <em class="fx">les mots nouveaux</em>.</small></li>
  <li style="--g:var(--c-violet)"><span>3</span><b>Méthode</b><small>Les fiches méthode, pour savoir comment faire.</small></li>
  <li style="--g:var(--c-rose)"><span>4</span><b>Projets</b><small>Les projets de la classe.</small></li>
  <li style="--g:var(--c-ocre)"><span>5</span><b>Rituels</b><small>La phrase du jour et les rituels d’entrée en classe.</small></li>
</ol>
<div class="deux">
  <div class="carte"><h4>La page de garde</h4>
    <div class="garde"><b>Prénom NOM</b><span>Classe</span><strong>Français</strong><span>Littérature</span><small>20…–20… · M. LESAGE</small></div>
    <p>Sur la première page, on écrit son prénom, son nom, sa classe, la matière et l’année. Chaque partie commence par une page de garde à son nom.</p></div>
  <div class="carte"><h4>Les mots nouveaux et la phrase du jour</h4>
    <p><b>Les mots nouveaux</b> : dans la partie Grammaire, on note chaque mot nouveau avec sa définition. Quand la page est pleine, on tourne la page et on continue.</p>
    <p><b>La phrase du jour</b> : dans la partie Rituels, on laisse deux pages pour les phrases du jour.</p></div>
</div>
<p class="note-bas">Voir aussi <a href="#p-ma-classe-cahier--materiel">le matériel</a> et <a href="#p-ma-classe-cahier--legende">la légende des pictogrammes</a>.</p>

<section class="bloc" id="re-pp"><h3>Le rôle du professeur principal</h3>
<ul class="puces"><li>Il coordonne l’équipe pédagogique.</li><li>Il suit chaque élève, avec le CPE.</li><li>C’est l’interlocuteur privilégié des familles. On le contacte par Pronote ou par WebCollège.</li></ul></section>

<section class="bloc" id="re-edt"><h3>L’emploi du temps</h3>
<p>Il y a une semaine A et une semaine B. Toutes les modifications (absences, changements de salle, heures de vie de classe…) sont mises à jour sur Pronote le plus tôt possible. <b>C’est l’emploi du temps de Pronote qui fait foi.</b></p></section>

<section class="bloc" id="re-pronote"><h3>Pronote et WebCollège</h3>
<p>Deux applications à télécharger, <b>Pronote</b> et <b>Skolengo</b> (WebCollège). On s’y connecte avec son compte <b>ÉduConnect</b>, à créer sur <a href="https://teleservices.education.gouv.fr/" target="_blank" rel="noopener">teleservices.education.gouv.fr</a>.</p>
<div class="deux">
  <div class="carte"><h4>Pronote</h4><ul class="puces"><li>L’emploi du temps</li><li>Les notes, les absences et les retards</li><li>Les sanctions</li><li>Les bulletins</li></ul></div>
  <div class="carte"><h4>WebCollège</h4><ul class="puces"><li>L’espace numérique de travail (ENT)</li><li>Le cahier de texte : le travail fait en cours et le travail à faire</li><li>La messagerie officielle</li></ul></div>
</div>
<p class="note-bas">Une vidéo explique comment utiliser Pronote : <a href="#p-ma-classe-parents--tutoriel-pronote">Tutoriel Pronote</a>.</p></section>

<section class="bloc" id="re-carnet"><h3>Le carnet de correspondance</h3>
<p>L’élève doit l’avoir <b>en permanence</b> avec lui. Chaque observation, retard ou absence doit être signé par les parents. En cas de perte, il faut en racheter un à la vie scolaire (5 €).</p></section>

<section class="bloc" id="re-absences"><h3>Les retards et les absences</h3>
<p>L’école est obligatoire. Toute absence doit être justifiée le plus vite possible auprès de la vie scolaire, avec le carnet de correspondance.</p></section>

<section class="bloc" id="re-reglement"><h3>Le règlement intérieur et les sanctions</h3>
<p>3 retards ou 3 observations = 1 heure de retenue. À partir de 5 retards ou absences non justifiées, un avertissement est donné au conseil de classe. Le téléphone est interdit. Tout est détaillé sur la page <a href="#p-ma-classe-regles">Règles</a>, avec l’échelle des sanctions.</p></section>

<section class="bloc" id="re-cantine"><h3>La bourse et la cantine</h3>
<p>L’inscription à la cantine et la demande de bourse se font en ligne, avec le compte ÉduConnect. En cas de difficulté, on peut joindre le secrétariat d’intendance du collège. En cas de difficultés financières, le fonds social du collège peut aider, par l’assistante sociale.</p>
<p>Si l’enfant ne mange pas un jour où il est inscrit, il remplit un billet d’absence à la demi-pension dans son carnet et le montre à l’intendance. S’il veut manger un jour où il n’est pas inscrit, on modifie l’inscription en ligne, ou il passe le matin à l’intendance.</p></section>

<section class="bloc" id="re-temps"><h3>Les temps forts de la 6ᵉ</h3>
<ul class="etiquettes"><li>Les évaluations nationales (2 h de français, 1 h de mathématiques)</li><li>Le test de fluence</li><li>La visite médicale</li><li>Les remises de bulletin</li><li>La sortie au Salon du livre</li><li>La sortie au théâtre</li></ul></section>

<section class="bloc" id="re-lecture"><h3>Le quart d’heure lecture</h3>
<p>Chaque jour, après la récréation de 10 heures, toute la classe lit pendant 15 minutes.</p>
<ul class="puces"><li>Le but : développer le plaisir de lire, sans note.</li><li>À la maison aussi, on laisse l’enfant choisir librement ses lectures et on encourage sa curiosité.</li><li>Des livres sont disponibles au CDI et dans la salle de classe. Les médiathèques municipales sont gratuites.</li></ul></section>

<section class="bloc" id="re-materiel"><h3>Le matériel</h3>
<p>Le but est de rendre l’enfant responsable. Gardez un stock de matériel à la maison et vérifiez son sac régulièrement, le temps que les bonnes habitudes s’installent. Pas de matériel, c’est une sanction. Attention au matériel d’EPS. La liste est sur la page <a href="#p-ma-classe-cahier--materiel">Cahier › Matériel</a>.</p></section>

<section class="bloc" id="re-rythme"><h3>Le rythme de travail</h3>
<ul class="puces">
  <li><b>Un rythme intense</b> : 33 heures de cours par semaine, des journées qui commencent tôt, deux journées de 8 heures.</li>
  <li><b>Une charge de travail importante</b> : 11 matières, des leçons à apprendre, des exercices à faire.</li>
  <li><b>Un travail régulier</b> : au moins 15 minutes par jour et par matière principale, pour anticiper les évaluations.</li>
  <li><b>Un cadre de travail à la maison</b> : un horaire régulier, un endroit calme, des pauses, des encouragements.</li>
  <li><b>Le sommeil</b> : l’adolescence fatigue. Pas d’écrans le soir.</li>
</ul>
<p>Il y a toujours du travail à faire : lire, réviser une leçon 5 minutes, refaire des exercices 5 minutes pour s’entrainer.</p></section>

<section class="bloc" id="re-devoirs"><h3>Le dispositif « Devoirs faits »</h3>
<p>Une aide proposée chaque trimestre aux élèves qui en ont besoin, notamment s’ils ont du mal à travailler chez eux : une heure de plus au collège, avec un adulte du collège.</p></section>

<section class="bloc" id="re-graphie"><h3>Que faire en cas de difficulté d’écriture ?</h3>
<p>Il existe des cahiers d’exercices à faire un peu chaque jour. Deux sont adaptés à la 6ᵉ :</p>
<ul class="puces"><li><i>Les cahiers d’écriture — Remédiation collège</i>, Hatier.</li><li><i>Cahier pour consolider son écriture dès la 6ᵉ</i>, Bordas.</li></ul></section>

<section class="bloc" id="re-ecrans"><h3>Le téléphone et les réseaux sociaux</h3>
<p>Les élèves passent en moyenne 4 heures par jour devant un écran.</p>
<ul class="puces"><li>Limiter le téléphone en journée et en parler avec son enfant.</li><li>Interdire les écrans le soir.</li><li>Discuter de ce qu’il voit et lit sur les réseaux.</li><li>Rester vigilant : les réseaux sociaux sont le premier lieu du harcèlement entre adolescents. Au moindre doute, contacter les CPE.</li><li>L’âge légal pour s’inscrire sur un réseau social est de 13 ou 15 ans selon les cas.</li><li>Montrer l’exemple.</li></ul>
<p class="chapo" style="margin-top:14px">Le but de l’école, c’est aussi le bonheur et l’épanouissement des élèves.</p></section>
</template>

  const BG_COUL = { // [clair, face, bord, encre] : copie du Cahier
    or: ["#fff1c2", "#f4c95a", "#c98d14", "#6b4300"], argent: ["#f4f6f9", "#cfd5de", "#8c96a5", "#3a414d"], bronze: ["#ffe4cc", "#eeaa72", "#b86a2c", "#5c2e0c"],
    rouge: ["#ffe0da", "#f59484", "#d14b38", "#6e1b10"], orange: ["#ffe8d2", "#f9a866", "#e0702a", "#6b3005"], jaune: ["#fff6c6", "#f6d955", "#d1aa15", "#5a4600"],

  const LB = [

  /* ---------- dessin : copie de bgForme / bgMotif (trophées) / bgSvg du Cahier ---------- */
  function forme(f, r) {

    if (f === "octogone") return `<polygon points="${poly(8, Math.PI / 8, 1.04)}" stroke-linejoin="round"/>`;
    if (f === "losange") return `<rect x="${-r * .76}" y="${-r * .76}" width="${r * 1.52}" height="${r * 1.52}" rx="${r * .22}" transform="rotate(45)"/>`;
    if (f === "carre") return `<rect x="${-r * .9}" y="${-r * .9}" width="${r * 1.8}" height="${r * 1.8}" rx="${r * .32}"/>`;
    if (f === "bouclier") return `<path d="M0 ${-r} C ${r * .55} ${-r * .72} ${r * .8} ${-r * .8} ${r * .95} ${-r * .82} C ${r * .98} ${r * .1} ${r * .7} ${r * .7} 0 ${r * 1.02} C ${-r * .7} ${r * .7} ${-r * .98} ${r * .1} ${-r * .95} ${-r * .82} C ${-r * .8} ${-r * .8} ${-r * .55} ${-r * .72} 0 ${-r} Z"/>`;
    if (f === "etoile") { const pts = Array.from({ length: 20 }, (_, i) => { const a = -Math.PI / 2 + i * Math.PI / 10, k = i % 2 ? .86 : 1.06; return `${(Math.cos(a) * r * k).toFixed(2)},${(Math.sin(a) * r * k).toFixed(2)}`; }).join(" "); return `<polygon points="${pts}" stroke-linejoin="round"/>`; }
    return `<circle r="${r}"/>`;
  }
  /* motif par catégorie : copie de bgMotif du Cahier (Travail, Participation…), sinon le motif des trophées */
  function motif(r, cat) {
    const L = [];
    if (cat === "Travail") for (let i = 0; i < 24; i++) { const a = i * Math.PI / 12; L.push(`<line x1="0" y1="0" x2="${(Math.cos(a) * r).toFixed(1)}" y2="${(Math.sin(a) * r).toFixed(1)}"/>`); }
    else if (cat === "Participation") for (let k = 1; k <= 6; k++) L.push(`<circle r="${(r * k / 6).toFixed(1)}"/>`);
    else if (cat === "Coopération") for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; L.push(`<circle cx="${(Math.cos(a) * r * .45).toFixed(1)}" cy="${(Math.sin(a) * r * .45).toFixed(1)}" r="${(r * .45).toFixed(1)}"/>`); }
    else if (cat === "Responsabilité") for (let k = -5; k <= 6; k++) L.push(`<polyline points="${-r},${k * 9 + r * .4} 0,${k * 9} ${r},${k * 9 + r * .4}"/>`);
    else if (cat === "Français") { for (let y = -r; y <= r; y += 5) L.push(`<line x1="${-r}" y1="${y}" x2="${r}" y2="${y}"${Math.round((y + r) / 5) % 4 ? ' stroke-opacity=".45"' : ""}/>`); L.push(`<line x1="-26" y1="${-r}" x2="-26" y2="${r}" stroke-width="2.2"/>`); }
    else if (cat === "Défis") for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, b = a + Math.PI / 4; L.push(`<polygon points="0,0 ${(Math.cos(a) * r).toFixed(1)},${(Math.sin(a) * r).toFixed(1)} ${(Math.cos(b) * r).toFixed(1)},${(Math.sin(b) * r).toFixed(1)}" ${i % 2 ? 'fill="#fff" fill-opacity=".18"' : ""}/>`); }
    else for (let i = 0; i < 16; i++) { const a = i * Math.PI / 8; L.push(`<line x1="${(Math.cos(a) * r * .3).toFixed(1)}" y1="${(Math.sin(a) * r * .3).toFixed(1)}" x2="${(Math.cos(a) * r).toFixed(1)}" y2="${(Math.sin(a) * r).toFixed(1)}" stroke-width="${i % 2 ? 1 : 2.4}"/>`); }
    return L.join("");
  }
  let N = 0;
  function svg(b, { taille = 64, verrou = false, nb = 0 } = {}) {
    /* b.ico : tracés de l'icône venus du Cahier (filtrés par le serveur) ; b.emoji : repli sans icône */
    const n = ++N, g = id => `lbg${n}${id}`, f = b.forme || "cercle", ic = ICO[b.ic] || b.ico || "";

<radialGradient id="${g("f")}" cx=".4" cy=".32" r=".8"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/><\/radialGradient>
<linearGradient id="${g("h")}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><\/linearGradient>
<clipPath id="${g("c")}">${forme(f, 42)}<\/clipPath><\/defs>

<g fill="url(#${g("h")})">${forme(f, 42)}<\/g>
${ic ? `<g transform="translate(-24.6 -24.6) scale(2.05)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><g stroke="#fff" opacity=".8" transform="translate(0 .6)">${ic}<\/g><g stroke="${c3}">${ic}<\/g><\/g>` : `<text x="0" y="2" text-anchor="middle" dominant-baseline="central" font-size="34">${esc(b.emoji || "")}<\/text>`}
${nb > 1 ? `<g transform="translate(38 40)"><circle r="14" fill="${(BG_COUL[b.coul] || BG_COUL.or)[3]}" stroke="#fff" stroke-width="2.5"/><text x="0" y="1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#fff" font-family="system-ui,sans-serif">×${nb}<\/text><\/g>` : ""}
<\/svg>`;
  }

  /* ---------- dates d'obtention ----------
     chrono : événements dans l'ordre { d: Date, t: secondes comptées, serie: {id, pct, n, mode} | null }
     ceintures : [{ id, ech, niv, coul, s: {score, total, date dd/MM/yyyy} }], niv : niveau de la classe ('6'…'3')
     test : date (Date) du premier test de positionnement, ou null. Résultat : { id: Date } (badges obtenus seulement) */
  const deFr = s => { const m = /^(\d\d)\/(\d\d)\/(\d{4})/.exec(s || ''); return m ? new Date(+m[3], +m[2] - 1, +m[1], 12) : null; };
  const cle = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const COUL = ['blanche', 'jaune', 'orange', 'verte', 'bleue', 'marron', 'noire'];
  function dates(chrono, ceintures, niv, test) {
    const R = {}, pose = (id, d) => { if (!R[id] && d) R[id] = d; };
    const lots = new Set(), jours = new Set(), sem = new Set(), bas = {};
    let temps = 0, ecrites = 0;
    for (const e of chrono) {
      temps += e.t || 0;
      if (temps >= 3600) pose('lab-1h', e.d);
      if (temps >= 5 * 3600) pose('lab-5h', e.d);
      const s = e.serie; if (!s) continue;
      pose('lab-premier', e.d);
      lots.add(s.id); if (lots.size >= 10) pose('lab-10lots', e.d);
      jours.add(cle(e.d)); if (jours.size >= 5) pose('lab-assidu', e.d);
      const l = new Date(e.d); l.setHours(12, 0, 0, 0); l.setDate(l.getDate() - ((l.getDay() + 6) % 7)); sem.add(cle(l));
      if (sem.has(cle(new Date(l - 7 * 864e5))) && sem.has(cle(new Date(l - 14 * 864e5)))) pose('lab-regulier', e.d);
      if (s.pct === 100 && s.n >= 20 && s.mode && s.mode !== 'honneur') pose('lab-parfaite', e.d);
      if (s.mode === 'ecrit' && ++ecrites >= 10) pose('lab-plume', e.d);
      if (s.pct < 60) bas[s.id] = true; else if (s.pct >= 80 && bas[s.id]) pose('lab-progres', e.d);
    }
    pose('lab-test', test);
    const C = ceintures.map(c => Object.assign({ d: deFr(c.s.date) || new Date() }, c)).sort((a, b) => a.d - b.d);
    const par = {}, nc = +niv || 0;
    for (const c of C) {
      par[c.id] = c; const v = Object.values(par);
      pose('lb-1', c.d);
      if (v.length >= 5) pose('lb-5', c.d);
      if (v.length >= 15) pose('lb-15', c.d);
      if (new Set(v.map(x => x.ech)).size >= 5) pose('lb-ech', c.d);
      if (c.s.score != null && c.s.total != null && +c.s.score === +c.s.total) pose('lb-parfait', c.d);
      if (nc && c.niv && +c.niv < nc) pose('lb-avance', c.d);
      if (c.coul === 'noire') pose('lb-noire', c.d);
      if (c.coul === 'expert') pose('lb-expert', c.d);
      if (v.filter(x => x.coul === 'expert').length >= 5) pose('lb-expert5', c.d);
      if (c.niv && COUL.every(k => par[`${c.ech}-${c.niv}-${k}`])) pose('lb-complet', c.d);
    }
    return R;
  }
  return { LAB, LB, TOUS, svg, dates };

const ic = (n, cls) => '<svg class="i'+(cls?' '+cls:'')+'" viewBox="0 0 24 24" aria-hidden="true">'+(ICO[n]||ICO.etoile)+'</svg>';
const ICO_RUB = {"accueil":"maison","ma classe":"classe","littérature":"livre","langue":"langue","latin et antiquité":"colonne","lecture":"lire","écriture":"plume","méthode":"methode","brevet":"brevet","prolongements":"etoile"};
const COULEURS = ["ardoise","bois","terracotta","violet","sarcelle","bleu","vert","ocre","rose","prune"];
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const slug = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

/* Lecture du fichier texte : « # Rubrique | couleur », « - Page | description | lien », tabulation = sous-page, [prof], « > » = note */
function lirePlan(txt){
  const rubs = []; let bas = null, rub = null, pile = [];
  for(const brute of txt.split(/\r?\n/)){
    if(!brute.trim()) continue;
    const ind = (brute.match(/^[\t ]*/)[0].replace(/ {2,4}/g,"\t").match(/\t/g)||[]).length;
    const l = brute.trim();
    if(l.startsWith("# ")){
      const [t, c] = l.slice(2).split("|").map(s=>s.trim());
      rub = {t, id:slug(t), col:COULEURS.includes((c||"").toLowerCase())?(c||"").toLowerCase():"ardoise", items:[]};
      if(/barre latérale/i.test(t)) bas = rub; else rubs.push(rub);
      pile = []; continue;
    }
    if(!rub || l.startsWith(">")) continue;
    if(l.startsWith("- ")){
      const parts = l.slice(2).split("|").map(s=>s.trim());
      let t = parts[0], prof = /\[prof\]/i.test(t), connecte = t.startsWith("*");
      t = t.replace(/^\*\s*/,"").replace(/\s*\[prof\]\s*/i,"").trim();
      const it = {t, d:parts[1]||"", url:parts[2]||"", prof, connecte, enfants:[]};
      pile.length = Math.min(pile.length, ind);
      const parent = ind>0 ? pile[ind-1] : null;
      (parent ? parent.enfants : rub.items).push(it);
      pile[ind] = it;
    }
  }
  return {rubs, bas};
}
const {rubs:PLAN, bas:BAS} = lirePlan(document.getElementById("plan-txt").textContent);
/* Connexion : la même que le Laboratoire (proflesage.fr/labo), partagée par le navigateur.
   Élève : localStorage « labo.compte » ; enseignant : sessionStorage « labo.prof ». */

const ecrireJ = (k,v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };

const visible = it => it.prof ? PROF : it.connecte ? (PROF || !!COMPTE) : true;

const VUES_BAS = {"outils":"outils","plan du site":"plan","à propos":"apropos"};
const ICO_BAS = {outils:"outils",plan:"plan",apropos:"info"};

const href = it => it.url ? (/^https?:/.test(it.url) ? it.url : (SUR_SITE ? it.url : SITE + it.url)) : null;
const horsSite = it => !!it.url && (!SUR_SITE || /^https?:/.test(it.url));
/* Chaque page sans lien externe a sa vue dans le site : #p-<rubrique>-<page>, onglet : #p-<rubrique>-<page>--<sous-page> */
const PAGES = {};
PLAN.forEach(r=>r.items.forEach(it=>{ it.rub=r; it.vue="p-"+r.id+"-"+slug(it.t); PAGES[it.vue]=it; it.enfants.forEach(e=>{ e.vue=it.vue+"--"+slug(e.t); }); }));
const lienDe = it => it.url ? href(it) : "#"+it.vue;
const cible = it => horsSite(it) ? ' target="_blank" rel="noopener"' : '';

/* Une page est en ligne quand elle a un contenu (contenus.html), elle ou l’un de ses onglets */
const aContenu = it => !!document.querySelector('template[data-page="'+it.vue+'"]') || (it.enfants||[]).some(e=>!!document.querySelector('template[data-page="'+e.vue+'"]'));

function lienNav(it){
  if(!visible(it)) return "";
  const h = href(it);
  const tete = h ? '<a class="lien" href="'+esc(h)+'"'+cible(it)+'>'+esc(it.t)+(horsSite(it)?ic("ext","ext"):'<i class="pt on" title="En ligne"></i>')+'</a>'
                 : aContenu(it) ? '<a class="lien" data-vue="'+it.vue+'" href="#'+it.vue+'">'+esc(it.t)+'<i class="pt on" title="En ligne"></i></a>'
                 : '<a class="lien bientot" data-vue="'+it.vue+'" href="#'+it.vue+'">'+esc(it.t)+'<i class="pt off" title="En cours de construction"></i></a>';
  return '<li>'+tete+'</li>';
}

function lireOuverts(){ try{ return JSON.parse(localStorage.getItem("classe.ouverts")||"null"); }catch(e){ return null; } }
function garderOuverts(){ try{ localStorage.setItem("classe.ouverts", JSON.stringify([...document.querySelectorAll("details.grp[open]")].map(d=>d.dataset.id))); }catch(e){} }

function construireNav(){
  const ouverts = lireOuverts() || ["langue"];
  let h = "";
  for(const r of PLAN){
    const g = ' data-g style="--g:var(--c-'+r.col+')"';
    if(r.id==="accueil"){
      h += '<a class="nav-seul" data-vue="accueil" href="#accueil"'+g+'><span class="puce">'+ic("maison")+'</span>Accueil</a>';
      continue;
    }
    h += '<details class="grp" data-id="'+r.id+'"'+(ouverts.includes(r.id)?' open':'')+g+'><summary><span class="puce">'+ic(ICO_RUB[r.t.toLowerCase()])+'</span>'+esc(r.t)+ic("chev","chev")+'</summary><ul>'+r.items.map(lienNav).join("")+'</ul></details>';
  }
  document.getElementById("nav").innerHTML = h;
  const bas = (BAS ? BAS.items : [{t:"Plan du site"},{t:"À propos"}]);
  document.getElementById("nav-bas").innerHTML = bas.map(b=>{
    const v = VUES_BAS[b.t.toLowerCase()] || "plan";
    return '<li><a class="lien" data-vue="'+v+'" href="#'+v+'">'+ic(ICO_BAS[v]||"plan")+esc(b.t)+'</a></li>';
  }).join("");
  document.querySelectorAll("details.grp").forEach(d=>d.addEventListener("toggle", garderOuverts));
}

function dateDuJour(){
  const s = new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});

}

function ficheRub(r, detail){
  const items = r.items.filter(i=>detail || visible(i));
  const ligne = i => {
    const h = href(i);
    const enf = i.enfants.filter(e=>detail || visible(e));
    return '<li><i class="pt '+(h||(i.vue&&aContenu(i))?'on':'off')+'"></i><div>'+
      (h?'<a href="'+esc(h)+'"'+cible(i)+'>'+esc(i.t)+'</a>':'<a href="#'+i.vue+'" style="font-weight:400;text-decoration:none">'+esc(i.t)+'</a>')+
      (i.prof?'<span class="prof">enseignant</span>':i.connecte?'<span class="cadenas">connexion</span>':'')+
      (detail && i.d?'<small>'+esc(i.d)+'</small>':'')+
      (detail && enf.length?'<ul>'+enf.map(ligne).join("")+'</ul>':'')+'</div></li>';
  };
  const corps = items.length ? '<ul>'+items.map(ligne).join("")+'</ul>' : '<p>Des raccourcis vers les pages les plus utilisées.</p>';
  return '<section class="fiche" data-g style="--g:var(--c-'+r.col+')"><div class="fiche-h"><span class="puce">'+ic(ICO_RUB[r.t.toLowerCase()])+'</span><h3>'+esc(r.t)+'</h3></div>'+corps+'</section>';
}

  return '<section class="tableau"><div class="date">'+dateDuJour()+'</div>'+

    '</div>'+pied();

function compte(list){ let on=0, tot=0; const f=a=>a.forEach(i=>{ if(i.prof) return; tot++; if(i.url || (i.vue && aContenu(i))) on++; f(i.enfants); }); list.forEach(r=>f(r.items)); return [on,tot]; }

function vuePlan(){
  const [on, tot] = compte(PLAN);
  return '<h2 class="grand">Plan du site</h2>'+
    '<p class="sous">Toutes les pages du site, partie par partie. '+on+' pages sont déjà en ligne sur '+tot+'. Les autres arriveront au fil de l’année.</p>'+
    '<div class="legende"><span><i class="pt on"></i>En ligne</span><span><i class="pt off"></i>En cours de construction</span><span><span class="cadenas" style="margin:0">connexion</span>Visible une fois connecté</span><span><span class="prof" style="margin:0">enseignant</span>Réservé à l’enseignant</span></div>'+
    '<h2 class="titre" style="margin-top:8px">Le code couleur</h2>'+
    '<p class="sous">Chaque partie a sa couleur, la même sur le site, dans le cahier et sur les fiches.</p>'+
    '<div class="code">'+PLAN.filter(r=>r.id!=="accueil").map(r=>'<span data-g style="--g:var(--c-'+r.col+')"><i></i>'+esc(r.t)+'</span>').join("")+'</div>'+
    '<div class="fiches">'+PLAN.map(r=>ficheRub(r,true)).join("")+'</div>'+pied();

function vuePage(v){
  const [base, sous] = v.split("--");
  const it = PAGES[base]; if(!it) return vueAccueil();
  if(!visible(it)) return '<h2 class="grand">'+esc(it.t)+'</h2><div class="vide"><b>Page réservée</b>'+(it.prof?'Cette page est réservée à l’enseignant.':'Connecte-toi pour voir cette page.')+'</div>'+pied();
  const r = it.rub;
  const ongl = it.enfants.filter(visible);
  const actif = ongl.find(e=>slug(e.t)===sous) || null;
  const qui = actif || it;
  let h = '<div data-g style="--g:var(--c-'+r.col+')">'+
    '<p class="fil"><a href="#plan">'+esc(r.t)+'</a></p>'+
    '<div class="page-h"><span class="puce">'+ic(ICO_RUB[r.t.toLowerCase()])+'</span><h2>'+esc(it.t)+'</h2></div>';
  if(ongl.length){
    h += '<nav class="onglets" aria-label="Sous-pages"><a href="#'+it.vue+'"'+(actif?'':' aria-current="page"')+'>Présentation</a>'+
      ongl.map(e=>'<a href="#'+e.vue+'"'+(e===actif?' aria-current="page"':'')+'>'+esc(e.t)+'</a>').join("")+'</nav>';
  }
  const tpl = document.querySelector('template[data-page="'+qui.vue+'"]');
  h += tpl ? '<div class="contenu">'+tpl.innerHTML+'</div></div>'
           : '<div class="vide"><b>'+esc(qui.t)+'</b>'+(qui.d?esc(qui.d)+'<br>':'')+'En cours de construction.</div></div>';
  return h+pied();
}

function vueOutils(sous){

/* Vitrines de badges (page Badges) : catalogue du Cahier + du Laboratoire, en gris */
function remplirVitrines(z){
  const L = window.LABO_BADGES; if(!L) return;
  const med = b => '<div class="medaille" title="'+esc(b.desc||"")+'">'+L.svg(b,{taille:58,verrou:true})+'<b>'+esc(b.lib)+'</b><small>'+esc(b.desc||"")+'</small></div>';
  const grille = l => '<div class="vitrine">'+l.map(med).join("")+'</div>';
  z.querySelectorAll("[data-vitrine]").forEach(v=>{
    const k = v.dataset.vitrine;
    if(k==="classe") v.innerHTML = BADGES_CAHIER.cats.map(c=>'<p class="vitrine-cat">'+esc(c)+'</p>'+grille(BADGES_CAHIER.badges.filter(b=>b.cat===c))).join("")+'<p class="vitrine-cat">Trophées de la classe</p>'+grille(BADGES_CAHIER.trophees);
    else if(k==="labo") v.innerHTML = grille(L.LAB);
    else if(k==="ceintures") v.innerHTML = grille(L.LB);
  });
}

/* Après affichage d'un contenu : icônes, liens vers proflesage.fr dans l'aperçu, sommaire, filtres à puces */
function preparerContenu(z){
  remplirVitrines(z);
  z.querySelectorAll("i[data-ico]").forEach(i=>{ i.outerHTML = ic(i.dataset.ico); });
  if(!SUR_SITE) z.querySelectorAll('[href^="/"],[src^="/"],[poster^="/"]').forEach(e=>["href","src","poster"].forEach(a=>{ const v=e.getAttribute(a); if(v&&v.startsWith("/")) e.setAttribute(a, SITE+v); }));
  z.querySelectorAll(".contenu a[href^='http'],.contenu a[href*='/labo/']").forEach(a=>{ a.target="_blank"; a.rel="noopener"; });
  z.querySelectorAll("[data-ancre]").forEach(a=>{ a.href="#"; a.addEventListener("click",ev=>{ ev.preventDefault(); const c=document.getElementById(a.dataset.ancre); if(c) c.scrollIntoView({behavior:"smooth",block:"start"}); }); });
  z.querySelectorAll("[data-ouvre]").forEach(a=>{ a.href="#"; a.addEventListener("click",ev=>{ ev.preventDefault();
    const ouvert = a.getAttribute("aria-expanded")==="true";
    z.querySelectorAll("[data-ouvre]").forEach(x=>{ x.setAttribute("aria-expanded","false"); const s=document.getElementById(x.dataset.ouvre); if(s) s.hidden=true; });
    if(!ouvert){ a.setAttribute("aria-expanded","true"); const s=document.getElementById(a.dataset.ouvre); if(s){ s.hidden=false; s.scrollIntoView({behavior:"smooth",block:"start"}); } } }); });
  z.querySelectorAll("[data-filtres]").forEach(f=>{
    const liste = z.querySelector('[data-liste="'+f.dataset.filtres+'"]'), vide = z.querySelector(".vide-filtre"), choix = {};
    const appliquer = ()=>{ let n=0; liste.querySelectorAll(".doc").forEach(d=>{ const ok = Object.entries(choix).every(([k,v])=>!v || (d.dataset[k]||"").split(" ").includes(v)); d.hidden=!ok; if(ok) n++; }); if(vide) vide.hidden = n>0; };
    f.querySelectorAll(".chips").forEach(g=>g.querySelectorAll("button").forEach(b=>{ b.type="button"; b.addEventListener("click",()=>{ g.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", String(x===b))); choix[g.dataset.cle]=b.dataset.v; appliquer(); }); }));
  });
}

const TITRES = {outils:"Outils", plan:"Plan du site", apropos:"À propos"};
function afficher(){
  let v = (location.hash||"#accueil").slice(1);
  const page = PAGES[v.split("--")[0]];
  const sousOutil = v.startsWith("outils--") ? v.slice(8) : null; if(sousOutil!==null) v = "outils";
  if(!["accueil","outils","plan","apropos"].includes(v) && !page) v = "accueil";
  document.getElementById("vue").innerHTML = page ? vuePage(v) : v==="outils" ? vueOutils(sousOutil) : v==="plan" ? vuePlan() : v==="apropos" ? vueAPropos() : vueAccueil();
  preparerContenu(document.getElementById("vue"));
  const cle = page ? page.vue : v;
  document.querySelectorAll("[data-vue]").forEach(a=>{ if(a.dataset.vue===cle) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  if(page){ const d=document.querySelector('details.grp[data-id="'+page.rub.id+'"]'); if(d) d.open=true; }
  document.title = (page ? page.t+" · " : TITRES[v] ? TITRES[v]+" · " : "") + "La classe de M. Lesage";
  fermerMenu();
  window.scrollTo(0,0);
}

const bt = document.getElementById("theme");

function majBouton(){ bt.innerHTML = ic(themeActuel()==="dark"?"soleil":"lune"); }
try{ const t = localStorage.getItem("classe.theme") || (lireJ("labo")||{}).theme; if(t) document.documentElement.dataset.theme = t; }catch(e){}
bt.addEventListener("click",()=>{ const t = themeActuel()==="dark"?"light":"dark"; document.documentElement.dataset.theme = t;
  try{ localStorage.setItem("classe.theme",t); localStorage.setItem("flashcards.theme",t); }catch(e){} const L=lireJ("labo"); if(L){ L.theme=t; ecrireJ("labo",L); } majBouton(); });
majBouton();

/* Mode Dys : même réglage que le Laboratoire (labo.dys) et les flashcards (flashcards.eleve.dys) */
const bd = document.getElementById("dys");
function appliquerDys(on){
  document.documentElement.classList.toggle("dys", on);
  bd.setAttribute("aria-pressed", on?"true":"false");
  bd.title = on ? "Mode Dys activé"+NB+": revenir à l’affichage normal" : "Mode Dys"+NB+": police OpenDyslexic, texte espacé, sans décor";
  bd.setAttribute("aria-label", on ? "Quitter le mode Dys" : "Activer le mode Dys");
}
appliquerDys(!!(lireJ("labo")||{}).dys || !!(lireJ("flashcards.eleve")||{}).dys);
bd.addEventListener("click",()=>{ const on = !document.documentElement.classList.contains("dys");
  const L = lireJ("labo")||{}; L.dys = on; ecrireJ("labo", L); const F = lireJ("flashcards.eleve")||{}; F.dys = on; ecrireJ("flashcards.eleve", F); appliquerDys(on); });

/* Plein écran (comme le Cahier de suivi et le Laboratoire) */
const bp = document.getElementById("plein");
const AGR = '<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>';
const RED = '<path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/>';
function majPlein(){ const on = !!document.fullscreenElement; bp.innerHTML = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+(on?RED:AGR)+'</svg>'; bp.title = on ? "Quitter le plein écran" : "Afficher en plein écran"; bp.setAttribute("aria-label", bp.title); }
if(!document.fullscreenEnabled){ bp.hidden = true; } else {
  bp.addEventListener("click",()=> document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(()=>{}));
  document.addEventListener("fullscreenchange", majPlein); majPlein();
}

/* Bouton « Se connecter » : ouvre la connexion du Laboratoire, qui ramène ici ensuite */
function construireCompte(){
  const z = document.getElementById("compte");
  const LABO = SUR_SITE ? "/labo/" : SITE + "/labo/";
  if(!COMPTE && !PROF){
    z.innerHTML = '<button type="button" class="compte-b" id="compte-b" aria-expanded="false">Se connecter</button>'+
      '<div class="compte-menu" id="compte-menu" hidden>'+
      (SUR_SITE ? '<a href="/labo/?retour=/">Élève'+NB+': me connecter avec ma classe</a><a href="/labo/">Enseignant'+NB+': espace professeur</a>'
                : '<p>Sur proflesage.fr, ce bouton ouvre la connexion du Laboratoire. Dans cet aperçu, tu peux simuler une connexion'+NB+':</p><button type="button" data-sim="eleve">Simuler un élève connecté</button><button type="button" data-sim="prof">Simuler l’enseignant</button>')+
      '</div>';
  } else {
    const nom = PROF ? "Enseignant" : esc(COMPTE.prenom||"Élève"), cl = PROF ? "" : esc(COMPTE.classe||"");
    z.innerHTML = '<button type="button" class="compte-b on" id="compte-b" aria-expanded="false">'+nom+(cl?' <small>'+cl+'</small>':'')+'</button>'+
      '<div class="compte-menu" id="compte-menu" hidden>'+
      (PROF ? '<a href="'+LABO+'prof.html">Espace professeur</a>' : '<a href="'+LABO+'#accueil">Mon laboratoire</a><a href="'+LABO+'#bilans">Mes bilans</a><a href="'+LABO+'#badges">Mes badges</a>')+
      '<hr><button type="button" id="compte-out">Ce n’est pas moi / Se déconnecter</button></div>';
  }
  const b = document.getElementById("compte-b"), m = document.getElementById("compte-menu");
  b.addEventListener("click", ev=>{ ev.stopPropagation(); m.hidden = !m.hidden; b.setAttribute("aria-expanded", String(!m.hidden)); });
  document.addEventListener("click", ev=>{ if(!m.hidden && !ev.target.closest("#compte")){ m.hidden = true; b.setAttribute("aria-expanded","false"); } });
  m.querySelectorAll("[data-sim]").forEach(x=>x.addEventListener("click",()=>{ try{ sessionStorage.setItem("classe.apercu", x.dataset.sim); }catch(e){} location.reload(); }));
  const out = document.getElementById("compte-out");
  if(out) out.addEventListener("click",()=>{
    try{ sessionStorage.removeItem("classe.apercu"); sessionStorage.removeItem("labo.prof"); }catch(e){}
    if(COMPTE && SUR_SITE){ /* comme la déconnexion du Laboratoire : on vide la progression de ce navigateur, on garde les réglages */
      const L = lireJ("labo")||{}, F = lireJ("flashcards.eleve")||{};
      try{ localStorage.removeItem("labo.compte"); }catch(e){}
      ecrireJ("labo", {theme:L.theme, dys:L.dys, niveau:L.niveau}); ecrireJ("flashcards.eleve", {lv:F.lv, dys:F.dys});
    }
    location.reload();
  });
}
construireCompte();

construireNav();
afficher();
addEventListener("hashchange", afficher);
})();
