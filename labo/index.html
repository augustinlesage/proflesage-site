@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --paper:#161a24; --sheet:#222837; --ink:#ece4d8; --muted:#aab0bf; --line:#363d50; --soft:#2c3344; --clay:#4b5672; --icon:#aab6dc; --acc:#c9d1ec; --acc-soft:rgba(170,182,220,.16);
  --brick:#ec8f85; --brick-soft:rgba(236,143,133,.16); --sun-soft:rgba(247,204,115,.18); --sun-ink:#f7cc73; --sage-soft:rgba(166,189,185,.14);
  --b-blanche:#ffffff; --b-jaune:#ffd21a; --b-orange:#ff8424; --b-verte:#34b956; --b-bleue:#3d82f2; --b-marron:#a0612f; --b-noire:#050506; --belt-edge:rgba(255,255,255,.7);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#161a24; --sheet:#222837; --ink:#ece4d8; --muted:#aab0bf; --line:#363d50; --soft:#2c3344; --clay:#4b5672; --icon:#aab6dc; --acc:#c9d1ec; --acc-soft:rgba(170,182,220,.16);
  --brick:#ec8f85; --brick-soft:rgba(236,143,133,.16); --sun-soft:rgba(247,204,115,.18); --sun-ink:#f7cc73; --sage-soft:rgba(166,189,185,.14);
  --b-blanche:#ffffff; --b-jaune:#ffd21a; --b-orange:#ff8424; --b-verte:#34b956; --b-bleue:#3d82f2; --b-marron:#a0612f; --b-noire:#050506; --belt-edge:rgba(255,255,255,.7);
}
/* noms de variables des pages reprises de l'appli des flashcards (Notions par niveau, À propos) */
:root{--panel:var(--sheet);--brand:var(--icon);--radius:var(--r);--shadow:none;--acc-ink:var(--sheet);--bg:var(--paper)}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 48px;display:flex;flex-direction:column;gap:28px}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--clay);outline-offset:2px}

/* En-tête */
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:42px;height:42px;flex:none;border-radius:12px;border:2px solid var(--clay);display:flex;align-items:center;justify-content:center;letter-spacing:.02em;font-family:var(--font-display);font-weight:700;font-size:1.05rem;background:var(--sheet)}
.mark span{color:var(--icon)}
h1{font-family:var(--font-display);font-weight:700;font-size:1.6rem;line-height:1.15;margin:0;text-wrap:balance}
.brand small{display:block;font-size:.82rem;color:var(--muted)}
.top-right{display:flex;align-items:center;gap:8px;width:100%}
.top-outils{display:flex;align-items:center;gap:8px;margin-left:auto} /* Dys, plein écran, thème : en haut à droite ; le menu de l'élève va au bout de la ligne des onglets (Augustin, 22/11/2026) */
.top-right nav.tabs{flex:1;min-width:0}
.theme{flex:none;width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer;display:inline-grid;place-items:center;padding:0}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px}
nav.tabs a{text-decoration:none;font-weight:600;font-size:.9rem;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--sheet)}
nav.tabs a:hover{border-color:var(--clay)}
nav.tabs a.aux{background:var(--soft)}
nav.tabs a[aria-current="page"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.dys-btn{flex:none;width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer;display:inline-grid;place-items:center;padding:0;font-family:"OpenDyslexic",Verdana,Arial,sans-serif;font-size:.62rem;font-weight:700;letter-spacing:0;line-height:1}
.sep-outils{flex:none;width:1px;height:28px;background:var(--clay);opacity:.55;margin:0 6px}
html.dys .sep-outils{background:var(--ink);opacity:1;width:2px}
nav.tabs .sep{width:1px;background:var(--line);margin:4px 4px}
/* téléphone (Augustin, 22/11/2026) : tous les onglets visibles sur plusieurs lignes, menu de l’élève dessous à droite */
@media (max-width:720px){header.top{gap:10px 12px}h1{font-size:1.3rem}.top-right{flex-wrap:wrap;justify-content:flex-end;gap:8px}.top-right nav.tabs{flex:1 1 100%;flex-wrap:wrap;gap:6px}nav.tabs a{white-space:nowrap;padding:6px 12px;font-size:.88rem}}
nav.tabs a.minor{border-color:transparent;background:transparent;color:var(--muted);font-weight:500}

/* Bandeau niveau */
.intro{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:stretch}
@media (max-width:820px){.intro{grid-template-columns:minmax(0,1fr)}}
.lead h2{font-family:var(--font-display);font-size:1.9rem;line-height:1.15;margin:4px 0 10px;font-weight:700;text-wrap:balance}
.lead p{margin:0 0 16px;max-width:58ch;color:var(--muted)}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.levels{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--sheet);padding:3px;gap:2px}
.levels button{border:0;background:transparent;border-radius:999px;padding:6px 16px;font-weight:700;cursor:pointer}
.levels button[aria-pressed="true"]{background:var(--acc);color:var(--sheet)}
:root[data-theme="dark"] .levels button[aria-pressed="true"]{color:#1f2333}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .levels button[aria-pressed="true"]{color:#1f2333}}
.levels-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.levels-row .hint{font-size:.82rem;color:var(--muted)}

.suite{background:var(--sheet);border:2px solid var(--clay);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.suite h3{margin:0;font-size:1.05rem}
.suite .step{display:flex;gap:10px;align-items:flex-start}
.suite .step b{display:block;font-size:.95rem}
.suite .step span{font-size:.85rem;color:var(--muted)}
.dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--line)}
.dot.now{background:var(--sun);box-shadow:0 0 0 3px var(--sun-soft)}
.dot.todo{background:var(--brick)}
.ex{align-self:flex-start;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--sage-soft);color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;text-decoration:none;font-weight:700;font-size:.9rem;padding:8px 14px;border-radius:999px;background:var(--ink);color:var(--sheet);border:0;cursor:pointer}

/* Rubriques */
.section-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin-bottom:12px}
.section-h h2{font-family:var(--font-display);font-size:1.3rem;margin:0}
.section-h p{margin:0;font-size:.88rem;color:var(--muted)}
.rubriques{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:720px){.rubriques{grid-template-columns:minmax(0,1fr)}}
.rub{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.rub-h{display:flex;align-items:center;gap:12px}
.num{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.9rem;border:2px solid var(--clay);color:var(--ink)}
.rub h3{margin:0;font-size:1.1rem}
.rub .role{margin:0;font-size:.88rem;color:var(--muted)}
.rub ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rub li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:.92rem}
.rub li:first-child{border-top:0}
.rub li a{text-decoration:none;min-width:0}
.rub li a:hover{text-decoration:underline;text-decoration-color:var(--clay);text-underline-offset:3px}
.tag{flex:none;font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--paper);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.conseil{background:var(--sun-soft);border-color:transparent;color:var(--sun-ink);font-weight:700}
.rub .more{font-size:.85rem;font-weight:700;text-decoration:none;color:var(--icon);margin-top:auto}

/* Ceintures */
.belts{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:6px 18px}
.scale{display:grid;grid-template-columns:150px auto minmax(0,1fr);gap:10px 18px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.scale:first-child{border-top:0}
@media (max-width:720px){.scale{grid-template-columns:minmax(0,1fr) auto}.scale .track{grid-column:1/-1;grid-row:2}}
.scale h3{margin:0;font-size:1rem}
.scale h3 small{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
.track{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.belt{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;width:62px;cursor:default}
.belt i{display:block;width:52px;height:14px;border-radius:4px;background:var(--bc);border:1px solid var(--belt-edge);position:relative}
.belt i::after{content:"";position:absolute;left:50%;top:-3px;width:10px;height:18px;margin-left:-5px;border-radius:3px;background:var(--bc);border:1px solid var(--belt-edge)}
.belt span{font-size:.68rem;color:var(--muted);text-align:center;line-height:1.15}
.belt.off span{opacity:.8}
.belt .boxe{display:block;width:64px;height:30px;margin:-8px 0 0;overflow:visible;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.belt.expert{width:70px}
.belt.expert span{color:var(--ink);font-weight:700}
.belt.expert.off .boxe{opacity:.85}
.belt .boxe .eclat{transform:translateX(-30px)}
@media (prefers-reduced-motion:no-preference){.belt .boxe .eclat{animation:eclat 3.4s ease-in-out infinite}}
@keyframes eclat{0%{transform:translateX(-30px)}55%,100%{transform:translateX(52px)}}
html.dys .belt .boxe .eclat{animation:none;display:none}
.lrow .belt.expert{width:80px}
.belt.ok span::before{content:"✓\00a0";color:var(--ink);font-weight:700}
.belt.cur span{color:var(--ink);font-weight:700}
.belt.cur i{box-shadow:0 0 0 3px var(--sun-soft)}
.link-sep{width:1px;height:26px;background:var(--line);margin:0 4px}
.scale .next{font-size:.82rem;color:var(--muted);text-align:right}
.scale .next b{display:block;color:var(--ink);font-size:.88rem}
.belt-note{font-size:.82rem;color:var(--muted);margin:10px 0 0}

/* Mode Dys : repris de la version élève des flashcards (eleve.css, body.dys) : police OpenDyslexic, fond clair uni,
   texte presque noir, bordures franches, aucun décor ni animation. Le bouton s'écrit en OpenDyslexic et propose « Mode normal » une fois activé. */
html:root.dys{color-scheme:light;--soft:#efeadc;--icon:#1d1d1d;--acc:#1d1d1d;--acc-soft:#efeadc;--paper:#fbf8ef;--sheet:#fffdf7;--ink:#1d1d1d;--muted:#4a4a4a;--line:#c9c3b3;--clay:#c9c3b3;--brick:#1d1d1d;--brick-soft:#efeadc;--sun:#1d1d1d;--sun-soft:#efeadc;--sun-ink:#1d1d1d;--sage-soft:#efeadc;--b-blanche:#ffffff;--b-noire:#26272d;--belt-edge:#1d1d1d;
  --font-ui:"OpenDyslexic",Verdana,Arial,sans-serif;--font-display:"OpenDyslexic",Verdana,Arial,sans-serif}
html.dys body{font-family:"OpenDyslexic",Verdana,Arial,sans-serif;line-height:1.6;letter-spacing:.01em;word-spacing:.08em}
html.dys button,html.dys input{font-family:inherit;letter-spacing:inherit;word-spacing:inherit}
html.dys .dys-btn{font-family:"OpenDyslexic",Verdana,Arial,sans-serif;letter-spacing:0;word-spacing:normal;border:2px solid var(--ink);background:var(--ink);color:var(--sheet)}
html.dys #theme,html.dys .mark{display:none}
html.dys #plein{border:2px solid var(--ink);background:var(--sheet)}
:fullscreen{overflow:auto;background:var(--paper)}
html.dys h1{font-size:1.45rem;line-height:1.4}
html.dys .lead h2{font-size:24px;line-height:1.4}
html.dys .section-h h2{font-size:1.2rem}
html.dys .eyebrow{letter-spacing:.08em;color:var(--ink)}
html.dys .rub,html.dys .belts,html.dys .suite{border:2px solid var(--line);border-radius:10px}
html.dys nav.tabs a,html.dys .levels,html.dys .tag,html.dys .num{border:2px solid var(--ink);background:var(--sheet);color:var(--ink)}
html.dys nav.tabs a.minor{border-color:transparent;background:transparent;text-decoration:underline}
html.dys nav.tabs a[aria-current="page"],html.dys .levels button[aria-pressed="true"],html.dys .btn{background:var(--ink);color:var(--sheet)}
html.dys .tag.conseil{background:var(--ink);color:var(--sheet)}
html.dys .ex{border:2px solid var(--ink);background:transparent;color:var(--ink)}
html.dys .dot,html.dys .dot.now,html.dys .dot.todo{box-shadow:none;border:2px solid var(--ink);background:transparent}
html.dys .dot.todo{background:var(--ink)}
html.dys .rub .more{color:var(--ink);text-decoration:underline}
html.dys .belt.cur i{box-shadow:none;outline:2px solid var(--ink);outline-offset:2px}
html.dys .belt.cur span{text-decoration:underline}
html.dys .rub .role,html.dys .suite .step span,html.dys .belt-note,html.dys .lead p,html.dys .scale .next{color:var(--muted)}
html.dys *{transition:none!important}

/* Pied */
footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
footer a{color:var(--muted)}
@media (prefers-reduced-motion:no-preference){nav.tabs a,.levels button,.btn{transition:background .15s,border-color .15s,color .15s}}

/* ===================== Pages intérieures ===================== */
#vue{display:flex;flex-direction:column;gap:24px;min-width:0}
.page-h{display:flex;flex-direction:column;gap:6px}
.page-h h2{font-family:var(--font-display);font-size:1.7rem;line-height:1.2;margin:0;text-wrap:balance}
.page-h p{margin:0;color:var(--muted);max-width:65ch}
.crumbs{font-size:.82rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px}
.crumbs a{color:var(--muted)}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.card h3{margin:0 0 6px;font-size:1.05rem}
.card p{margin:0 0 8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:5px 11px;font-size:.82rem}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.pill{display:inline-block;font-size:.75rem;padding:2px 9px;border-radius:999px;background:var(--paper);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.pill.ok{background:rgba(79,154,94,.16);color:#2f6b3c;border-color:transparent;font-weight:700}
.pill.warn{background:var(--sun-soft);color:var(--sun-ink);border-color:transparent;font-weight:700}
.pill.ko{background:var(--brick-soft);color:var(--brick);border-color:transparent;font-weight:700}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.ok{color:#9fd8ab}}
:root[data-theme="dark"] .pill.ok{color:#9fd8ab}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:5px 12px;font-weight:600;font-size:.85rem;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}

/* Liste de lots (Entraînements) */
.deck-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.deck-list a{display:flex;flex-direction:column;gap:2px;text-decoration:none;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:11px 14px;height:100%}
.deck-list a:hover{border-color:var(--clay)}
.deck-list b{font-size:.95rem}
.deck-list span{font-size:.8rem;color:var(--muted)}
.theme-block+.theme-block{margin-top:22px}
/* vignettes des lots (Entraînements), comme l'accueil élève des flashcards */
.lot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.lot-tile{display:flex;flex-direction:column;align-items:stretch;gap:4px;text-decoration:none;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:12px;transition:border-color .12s}
.lot-tile:hover{border-color:var(--clay)}
.lot-couv{display:flex;justify-content:center;align-items:center;margin-bottom:6px;aspect-ratio:3/2}
.lot-couv img{display:block;max-width:100%;max-height:100%;border-radius:8px}
.lot-nom{font-weight:700;font-size:1rem;line-height:1.25}
.lot-meta{color:var(--muted);font-size:.82rem}
.lot-last{color:var(--ok,#3f7d4e);font-size:.8rem;font-weight:600}
.lot-tile .tag{align-self:flex-start}
@media (max-width:560px){.lot-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.lot-tile{padding:8px;border-radius:12px}.lot-nom{font-size:.9rem}}
html.dys .lot-couv{display:none}
html.dys .lot-tile{border:2px solid var(--line);border-radius:10px}
.theme-block h3{margin:0 0 2px;font-size:1.05rem}
.theme-block>p{margin:0 0 10px;font-size:.85rem;color:var(--muted)}

/* Parcours : plan */
.plan{display:flex;flex-direction:column;gap:14px}
.mod h3{margin:0 0 6px;font-size:1rem;display:flex;align-items:center;gap:8px}
.mod ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.stp{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:9px 13px;text-decoration:none}
.stp:hover{border-color:var(--clay)}
.stp .t{display:flex;flex-direction:column;min-width:0}
.stp .t b{font-size:.93rem}
.stp .t span{font-size:.78rem;color:var(--muted)}
.stp .s{flex:none;display:flex;gap:6px;align-items:center;font-size:.8rem}
.stp.cur{border:2px solid var(--clay)}
.mdot{width:10px;height:10px;border-radius:50%;background:var(--m,var(--clay));flex:none}
.m-fm{--m:#7a5c99}.m-gn{--m:#2f7d6d}.m-gv{--m:#b25751}.m-ph{--m:#3f6fb5}.m-bilan{--m:#373e56}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .m-fm{--m:#b9a0d6}:root:not([data-theme="light"]) .m-gn{--m:#7cc4b3}:root:not([data-theme="light"]) .m-gv{--m:#ec8f85}:root:not([data-theme="light"]) .m-ph{--m:#93b4e6}:root:not([data-theme="light"]) .m-bilan{--m:#ece4d8}}
:root[data-theme="dark"] .m-fm{--m:#b9a0d6}:root[data-theme="dark"] .m-gn{--m:#7cc4b3}:root[data-theme="dark"] .m-gv{--m:#ec8f85}:root[data-theme="dark"] .m-ph{--m:#93b4e6}:root[data-theme="dark"] .m-bilan{--m:#ece4d8}
.etoiles{color:#c99a1c;letter-spacing:.05em;white-space:nowrap}.etoiles .v{color:var(--line)}
.layout-step{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:22px;align-items:start}
@media (max-width:900px){.layout-step{grid-template-columns:minmax(0,1fr)}.layout-step aside{order:2}}
.layout-step aside{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
@media (max-width:900px){.layout-step aside{position:static;max-height:none}}
.side-plan{display:flex;flex-direction:column;gap:2px;font-size:.84rem}
.side-plan .mh{font-weight:700;margin-top:8px;display:flex;align-items:center;gap:6px}
.side-plan a{display:flex;justify-content:space-between;gap:6px;text-decoration:none;padding:4px 8px;border-radius:8px;color:var(--muted)}
.side-plan a:hover{background:var(--paper)}
.side-plan a.cur{background:var(--paper);color:var(--ink);font-weight:700}
.side-plan a .ok{color:#2f8f4f}
.role-t{font-size:.7rem;padding:1px 7px;border-radius:999px;background:var(--brick-soft);color:var(--brick);font-weight:700;white-space:nowrap}
.role-t.verif{background:var(--sage-soft);color:var(--muted)}

.chip{font-size:.68rem;font-weight:700;padding:1px 7px;border-radius:999px;border:1px solid var(--m,var(--line));color:var(--m,var(--muted));font-family:var(--font-ui);letter-spacing:.02em}

.tw{overflow-x:auto;margin:12px 0}

/* Exercices */

/* Ceintures : échelles et tests */

@media (max-width:600px){.memos .tw table,.memos .tw tbody,.memos .tw tr,.memos .tw td{display:block;width:auto}.memos .tw tr:first-child{display:none}.memos .tw tr{border-top:1px solid var(--line);padding:8px 10px}.memos .tw tr:nth-child(2){border-top:0}.memos .tw td{border:0!important;padding:2px 0;background:transparent!important}.memos .tw td[data-l]:not(:first-child)::before{content:attr(data-l);display:block;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:4px}.memos .tw td:first-child{font-size:1rem}.memos .tw tr:nth-child(even){background:color-mix(in srgb,var(--soft) 22%,var(--sheet))}}
.memos .tw-petit table{width:auto;max-width:560px;font-size:.84rem}.memos .tw-petit th,.memos .tw-petit td{padding:4px 9px}.memos .tw-petit th{font-size:.66rem}
@media (max-width:600px){.memos .tw-petit table{width:auto}.memos .tw-petit tr{padding:5px 10px}}

  { id:'c3-fm-c1', type:'cours', titre:'Radical, préfixe, suffixe',
    sub:'Décomposer les mots pour les comprendre et pour les écrire.',
    html:`
<p class="lead">Beaucoup de mots sont fabriqués à partir d’un autre mot. Quand on sait les décomposer, on devine leur sens et on écrit mieux leurs lettres muettes.</p>
<h3>Les éléments d’un mot <span class="chip fm">CM1</span></h3>
<ul>
<li>Le <b>radical</b> porte le sens principal : <i>terre</i> dans <i>terrier, enterrer, atterrir</i>.</li>
<li>Le <b>préfixe</b> se place <b>avant</b> le radical : <i><u>re</u>lire, <u>dé</u>coller, <u>in</u>connu</i>.</li>
<li>Le <b>suffixe</b> se place <b>après</b> le radical : <i>jardin<u>ier</u>, lente<u>ment</u>, lav<u>able</u></i>.</li>
</ul>
<div class="obs"><span class="lbl">Exemple</span><i>dé + <b>coll</b> + er → décoller</i> : le préfixe <i>dé-</i> indique le contraire, le radical <i>coll-</i> vient de <i>colle</i>.</div>
<div class="tw"><table>
<tr><th>Préfixe</th><th>Sens</th><th>Exemples</th></tr>
<tr><td>re-, ré-</td><td style="font-weight:400">de nouveau</td><td style="font-weight:400"><i>relire, réécrire</i></td></tr>
<tr><td>dé-, dés-</td><td style="font-weight:400">le contraire</td><td style="font-weight:400"><i>décoller, désobéir</i></td></tr>
<tr><td>in-, im-</td><td style="font-weight:400">pas</td><td style="font-weight:400"><i>inconnu, impossible</i></td></tr>
<tr><td>pré-</td><td style="font-weight:400">avant</td><td style="font-weight:400"><i>prévoir, préhistoire</i></td></tr>
</table></div>
<div class="tw"><table>
<tr><th>Suffixe</th><th>Ce qu’il fabrique</th><th>Exemples</th></tr>
<tr><td>-ier, -eur, -euse</td><td style="font-weight:400">un nom de métier ou de personne</td><td style="font-weight:400"><i>jardinier, chanteur, vendeuse</i></td></tr>
<tr><td>-ette, -et</td><td style="font-weight:400">un nom qui veut dire « petit »</td><td style="font-weight:400"><i>fillette, garçonnet</i></td></tr>
<tr><td>-able, -ible</td><td style="font-weight:400">un adjectif : « qu’on peut… »</td><td style="font-weight:400"><i>lavable, lisible</i></td></tr>
<tr><td>-ment</td><td style="font-weight:400">un adverbe</td><td style="font-weight:400"><i>lentement, doucement</i></td></tr>
</table></div>
<h3>Mots simples, dérivés, composés <span class="chip fm">6e</span></h3>
<ul>
<li>Un <b>mot simple</b> ne se décompose pas : <i>table, mer, chanter</i>.</li>
<li>Un <b>mot dérivé</b> est formé d’un radical et d’un préfixe ou d’un suffixe : <i>refaire, chanteur</i>.</li>
<li>Un <b>mot composé</b> est formé de deux mots qui existent seuls : <i>portemanteau, chou-fleur, pomme de terre</i>.</li>
</ul>
<h3>La famille de mots et l’orthographe <span class="chip fm">CM1</span> <span class="chip fm">CM2</span></h3>
<p>Les mots formés sur le même radical forment une <b>famille</b> : <i>dent, dentiste, dentier, édenté</i>. La famille aide à écrire la lettre muette à la fin d’un mot : le <i>d</i> de <i>grand</i> s’entend dans <i>grandir</i> ; le <i>t</i> de <i>petit</i> s’entend dans <i>petite</i>.</p>
<div class="trap"><b>Attention.</b> Deux mots qui se ressemblent ne sont pas toujours de la même famille : <i>chat</i> et <i>château</i> n’ont pas de sens commun.</div>`},

  { id:'c3-fm-c2', type:'cours', titre:'Les relations entre les mots',
    sub:'Synonymes, antonymes, homonymes, polysémie, mots génériques.',
    html:`
<h3>Synonymes et antonymes <span class="chip fm">CM1</span></h3>
<ul>
<li>Deux <b>synonymes</b> ont un sens proche : <i>content / joyeux ; commencer / débuter</i>.</li>
<li>Deux <b>antonymes</b> ont un sens contraire : <i>grand / petit ; partir / arriver</i>.</li>
</ul>
<div class="rule fm"><b>Règle</b> <span class="chip fm">6e</span>. Un synonyme ou un antonyme appartient à la <b>même classe</b> que le mot de départ : le synonyme d’un verbe est un verbe (<i>courir / filer</i>), celui d’un adjectif est un adjectif (<i>rapide / vif</i>).</div>
<h3>Les homonymes</h3>
<p>Des <b>homonymes</b> se prononcent de la même façon, mais n’ont pas le même sens : <i>un ver de terre, un verre d’eau, la couleur verte (vert), un vers de poème, aller vers la mer</i>. Ils s’écrivent souvent différemment.</p>
<h3>La polysémie <span class="chip fm">CM1</span> <span class="chip fm">CM2</span></h3>
<p>Un mot <b>polysémique</b> a plusieurs sens. C’est le contexte qui permet de choisir le bon :</p>
<ul>
<li><i>une <b>feuille</b> d’arbre / une <b>feuille</b> de papier</i> ;</li>
<li><i>la <b>souris</b> grignote / je clique avec la <b>souris</b></i> ;</li>
<li><i>un <b>bouton</b> de veste / un <b>bouton</b> de rose</i>.</li>
</ul>
<h3>Le mot générique</h3>
<p>Un mot général (l’<b>hyperonyme</b>) regroupe des mots plus précis (ses <b>hyponymes</b>) : <i>siège</i> regroupe <i>tabouret, banc, chaise, fauteuil</i> ; <i>fruit</i> regroupe <i>pomme, poire, cerise</i>.</p>
<div class="obs"><span class="lbl">Pour écrire</span>Remplacer un mot répété par un synonyme ou par un mot générique évite les répétitions : <i>Le renard s’approcha. <b>L’animal</b> avait faim.</i></div>`},

  { id:'c3-ph-c1', type:'cours', titre:'Types et formes de phrases ; les manipulations',
    sub:'Reconnaître une phrase, la transformer, et utiliser cinq manipulations pour l’analyser.',
    html:`
<p class="lead">Une phrase a du sens. À l’écrit, elle commence par une majuscule et se termine par un point (<b>.</b> <b>?</b> <b>!</b>).</p>
<h3>Les trois types de phrases <span class="chip ph">CM1</span></h3>
<div class="tw"><table>
<tr><th>Type</th><th>À quoi il sert</th><th>Exemple</th></tr>
<tr><td>Déclaratif</td><td style="font-weight:400">raconter, décrire, donner une information</td><td style="font-weight:400"><i>Le loup entre dans la maison.</i></td></tr>
<tr><td>Interrogatif</td><td style="font-weight:400">poser une question</td><td style="font-weight:400"><i>Où est le loup ?</i></td></tr>
<tr><td>Impératif (ou injonctif)</td><td style="font-weight:400">donner un ordre, un conseil</td><td style="font-weight:400"><i>Ferme la porte.</i></td></tr>
</table></div>
<p>On pose une question de trois façons : avec l’<b>intonation</b> (<i>Tu viens ?</i>), avec <b>est-ce que</b> (<i>Est-ce que tu viens ?</i>) ou par l’<b>inversion du sujet</b> (<i>Viens-tu ?</i>).</p>
<h3>Les formes de phrases <span class="chip ph">CM1</span></h3>
<ul>
<li>La <b>forme négative</b> : <i>ne… pas, ne… jamais, ne… plus, ne… rien</i> encadrent le verbe. <i>Le loup ne mange pas.</i></li>
<li>La <b>forme exclamative</b> exprime une émotion forte : <i>Comme il est grand !</i></li>
</ul>
<h3>Cinq manipulations pour analyser <span class="chip ph">CM1</span></h3>
<div class="tw"><table>
<tr><th>Manipulation</th><th>Exemple</th></tr>
<tr><td>Déplacer</td><td style="font-weight:400"><i>Le soir, le loup sort → Le loup sort le soir.</i></td></tr>
<tr><td>Supprimer (effacer)</td><td style="font-weight:400"><i>Le petit loup sort → Le loup sort.</i></td></tr>
<tr><td>Remplacer (substituer)</td><td style="font-weight:400"><i>Le loup sort → Il sort.</i></td></tr>
<tr><td>Ajouter</td><td style="font-weight:400"><i>Le loup sort → Le loup gris sort.</i></td></tr>
<tr><td>Encadrer</td><td style="font-weight:400"><i>C’est le loup qui sort. Le loup ne sort pas.</i></td></tr>
</table></div>
<h3>Nature et fonction <span class="chip ph">CM1</span> <span class="chip ph">CM2</span></h3>
<div class="rule ph">La <b>nature</b> (ou classe) dit <b>ce qu’est</b> un mot : nom, verbe, adjectif… Elle ne change pas. La <b>fonction</b> dit <b>le rôle</b> qu’il joue dans la phrase : sujet, complément… Elle dépend de la phrase. Dans <i>Le chat dort</i> et <i>Je caresse le chat</i>, <i>chat</i> est toujours un nom, mais il est sujet dans la première phrase, COD dans la seconde.</div>`},

  { titre:'Module 3 · Le groupe nominal', court:'Groupe nominal', cls:'gn', steps:[

  { id:'c3-gn-c1', type:'cours', titre:'Déterminant, nom noyau, expansions',
    sub:'Construire et analyser le groupe nominal.',
    html:`
<p class="lead">Le <b>groupe nominal</b> (GN) est organisé autour d’un nom, le <b>nom noyau</b>. Le nom est le plus souvent précédé d’un déterminant.</p>
<h3>Le nom</h3>
<ul>
<li><b>nom commun</b> : <i>une forêt, un enfant, la joie</i> ;</li>
<li><b>nom propre</b>, avec une majuscule : <i>Lucie, Paris, la Loire</i>.</li>
</ul>
<h3>Les déterminants <span class="chip gn">CM1</span></h3>
<div class="tw"><table>
<tr><th>Déterminant</th><th>Formes</th><th>Exemple</th></tr>
<tr><td>Article défini</td><td style="font-weight:400">le, la, l’, les</td><td style="font-weight:400"><i>la forêt, les arbres</i></td></tr>
<tr><td>Article indéfini</td><td style="font-weight:400">un, une, des</td><td style="font-weight:400"><i>un loup, des loups</i></td></tr>
<tr><td>Déterminant possessif</td><td style="font-weight:400">mon, ton, son, ma, ta, sa, mes, tes, ses, notre, votre, leur, nos, vos, leurs</td><td style="font-weight:400"><i>mon panier, leurs maisons</i></td></tr>
<tr><td>Déterminant démonstratif</td><td style="font-weight:400">ce, cet, cette, ces</td><td style="font-weight:400"><i>ce chemin, cet arbre, cette fleur</i></td></tr>
</table></div>
<h3>Trois structures <span class="chip gn">CM1</span></h3>
<ul>
<li>Dét. + Nom : <i>un loup</i></li>
<li>Dét. + Nom + Adj. : <i>un loup <b>affamé</b></i></li>
<li>Dét. + Adj. + Nom : <i>un <b>grand</b> loup</i></li>
</ul>
<p>L’adjectif placé contre le nom est <b>épithète</b>. On peut le supprimer : <i>un grand loup → un loup</i>.</p>
<h3>Les expansions du nom <span class="chip gn">CM2</span></h3>
<p>Le nom peut être complété par un adjectif ou par un <b>groupe nominal prépositionnel</b> (un GN introduit par une préposition : <i>à, de, en, pour, sans…</i>). Ce groupe est <b>complément du nom</b> : <i>une maison <b>de briques</b>, un panier <b>en osier</b>, une tasse <b>à café</b></i>.</p>
<h3>Épithète ou attribut du sujet ? <span class="chip gn">CM2</span></h3>
<div class="rule gn"><i>Un loup <b>affamé</b> rôde</i> : l’adjectif est contre le nom → <b>épithète</b>. <i>Le loup est <b>affamé</b></i> : l’adjectif est après le verbe <i>être</i> → <b>attribut du sujet</b>. On ne peut pas le supprimer : *<i>Le loup est.</i></div>`},

  { id:'c3-gn-c2', type:'cours', titre:'La chaîne d’accords dans le GN',
    sub:'Le nom noyau donne son genre et son nombre au déterminant et à l’adjectif.',
    html:`
<h3>Le donneur d’accord <span class="chip gn">CM1</span></h3>
<p>Dans le GN, le <b>nom noyau</b> est le donneur d’accord. Le déterminant et l’adjectif prennent son <b>genre</b> (masculin ou féminin) et son <b>nombre</b> (singulier ou pluriel) : <i>un petit chat → une petite chatte → des petits chats</i>.</p>
<div class="rule gn"><b>Méthode.</b> 1. Je trouve le nom noyau. 2. Je cherche son genre et son nombre. 3. Je vérifie le déterminant et chaque adjectif. Beaucoup de marques ne s’entendent pas : <i>bleu, bleue, bleus, bleues</i>.</div>
<h3>Le féminin</h3>
<div class="tw"><table>
<tr><th>Règle</th><th>Exemples</th></tr>
<tr><td>on ajoute -e</td><td style="font-weight:400"><i>grand → grande ; joli → jolie</i></td></tr>
<tr><td>-er → -ère</td><td style="font-weight:400"><i>fier → fière ; boulanger → boulangère</i></td></tr>
<tr><td>-eux → -euse</td><td style="font-weight:400"><i>heureux → heureuse</i></td></tr>
<tr><td>-if → -ive</td><td style="font-weight:400"><i>sportif → sportive</i></td></tr>
<tr><td>-en, -el, -on → consonne doublée + e</td><td style="font-weight:400"><i>ancien → ancienne ; cruel → cruelle ; bon → bonne</i></td></tr>
</table></div>
<h3>Le pluriel <span class="chip gn">CM1</span> <span class="chip gn">6e</span></h3>
<div class="tw"><table>
<tr><th>Règle</th><th>Exemples</th></tr>
<tr><td>on ajoute -s</td><td style="font-weight:400"><i>un arbre → des arbres</i></td></tr>
<tr><td>-s, -x, -z : pas de changement</td><td style="font-weight:400"><i>un gros nez → des gros nez</i></td></tr>
<tr><td>-eau, -au, -eu → -x</td><td style="font-weight:400"><i>un bateau → des bateaux ; un jeu → des jeux</i> (sauf <i>pneus, bleus</i>)</td></tr>
<tr><td>-al → -aux</td><td style="font-weight:400"><i>un cheval → des chevaux</i> (sauf <i>bals, festivals, carnavals</i>)</td></tr>
<tr><td>sept noms en -ou → -oux</td><td style="font-weight:400"><i>bijou, caillou, chou, genou, hibou, joujou, pou</i></td></tr>
</table></div>
<h3>Nom ou verbe ? <span class="chip gn">CM1</span></h3>
<div class="trap"><b>Attention aux mots qui se ressemblent.</b> <i>une élève, des élèves</i> : <i>élève</i> est un nom (avec un déterminant), il prend <b>-s</b> au pluriel. <i>il élève, elles élèvent</i> : <i>élève</i> est un verbe (avec un sujet), il prend <b>-nt</b> à la 3<sup>e</sup> personne du pluriel.</div>`},

  { titre:'Module 4 · Sujet, verbe, compléments', court:'Groupe verbal', cls:'gv', steps:[

  { id:'c3-gv-c1', type:'cours', titre:'Le sujet, le verbe et ses compléments',
    sub:'Identifier les constituants de la phrase simple.',
    html:`
<p class="lead">La phrase simple contient au moins deux groupes : le <b>groupe sujet</b> (GS) et le <b>groupe verbal</b> (GV). On peut y ajouter un ou plusieurs <b>compléments circonstanciels</b>.</p>
<div class="obs"><span class="lbl">Exemple</span><i>[Le soir], <span class="gn-b">le petit chaperon</span> [traverse la forêt].</i> → complément circonstanciel + groupe sujet + groupe verbal.</div>
<h3>Trouver le verbe conjugué <span class="chip gv">CM1</span></h3>
<p>Le verbe conjugué change quand on change le temps (<i>il traverse → il traversait</i>) et on peut l’encadrer par <i>ne… pas</i> (<i>il ne traverse pas</i>). On retrouve son infinitif : <i>traverser</i>.</p>
<h3>Trouver le sujet <span class="chip gv">CM1</span> <span class="chip gv">CM2</span></h3>
<ul>
<li>On pose la question « qui est-ce qui ? » ou on encadre par « c’est… qui » : <i>C’est le petit chaperon qui traverse.</i></li>
<li>Le sujet peut être un <b>pronom</b> (<i>Elle traverse</i>), un <b>groupe nominal</b> (<i>La petite fille traverse</i>), <b>plusieurs noms</b> (<i>Lucie et Tom traversent</i>).</li>
<li><span class="chip gv">CM2</span> Le sujet peut être <b>inversé</b>, placé après le verbe : <i>Au loin apparaît <b>le loup</b>.</i></li>
</ul>
<div class="rule gv"><b>L’accord sujet-verbe.</b> Le verbe s’accorde avec le nom noyau du sujet : <i>Le panier des enfants <b>est</b> plein</i> (c’est le panier qui est plein). Deux sujets coordonnés donnent un pluriel.</div>
<h3>Les pronoms personnels <span class="chip gv">CM1</span> <span class="chip gv">CM2</span></h3>
<div class="tw"><table>
<tr><th>Pronoms sujets</th><th>Pronoms compléments</th></tr>
<tr><td>je, tu, il, elle, on, nous, vous, ils, elles</td><td style="font-weight:400">me, te, le, la, l’, lui, nous, vous, les, leur, se, en, y</td></tr>
</table></div>
<p><i>Le loup mange la galette → <b>Il</b> <b>la</b> mange.</i> (<i>il</i> remplace le sujet, <i>la</i> remplace le complément)</p>
<h3>Les compléments du verbe <span class="chip gv">CM1</span> <span class="chip gv">CM2</span> <span class="chip gv">6e</span></h3>
<ul>
<li>Le <b>COD</b> (complément d’objet direct) suit le verbe <b>sans préposition</b> : <i>Elle cueille <b>des fleurs</b>.</i> On le remplace par <i>le, la, les</i>.</li>
<li>Le <b>COI</b> (complément d’objet indirect) est introduit par une <b>préposition</b> (<i>à, de</i>) : <i>Elle parle <b>au loup</b>.</i> On le remplace par <i>lui, leur</i>.</li>
<li>L’<b>attribut du sujet</b> suit un verbe d’état (<i>être, sembler, paraître, devenir, rester</i>) et dit comment est le sujet : <i>La forêt est <b>sombre</b>.</i></li>
</ul>
<div class="trap"><b>COD ou attribut ?</b> <span class="chip gv">6e</span> <i>Il devient <b>un chevalier</b></i> : lui et le chevalier sont la même personne → attribut du sujet. <i>Il rencontre <b>un chevalier</b></i> : deux personnes différentes → COD.</div>
<h3>Le complément circonstanciel <span class="chip gv">CM1</span> <span class="chip gv">CM2</span></h3>
<p>Il est <b>facultatif</b> : on peut le <b>supprimer</b> et le <b>déplacer</b>. <i>Le soir, elle rentre. → Elle rentre le soir. → Elle rentre.</i> Au CM2, on distingue trois valeurs :</p>
<div class="tw"><table>
<tr><th>Valeur</th><th>Question</th><th>Exemple</th></tr>
<tr><td>Lieu</td><td style="font-weight:400">où ?</td><td style="font-weight:400"><i>Elle se promène <b>dans la forêt</b>.</i></td></tr>
<tr><td>Temps</td><td style="font-weight:400">quand ?</td><td style="font-weight:400"><i><b>Un matin</b>, elle partit.</i></td></tr>
<tr><td>Cause</td><td style="font-weight:400">pourquoi ?</td><td style="font-weight:400"><i>Elle tremble <b>de peur</b>.</i></td></tr>
</table></div>`},

  { titre:'Module 5 · Conjuguer', court:'Conjugaison', cls:'gv', steps:[

  { id:'c3-cj-c1', type:'cours', titre:'Radical, marque de temps, marque de personne',
    sub:'Comprendre comment se construit une forme verbale aux temps simples.',
    html:`
<p class="lead">Un verbe conjugué se compose d’un <b>radical</b> et d’une <b>terminaison</b>. La terminaison contient souvent deux marques : la <b>marque de temps</b> et la <b>marque de personne</b>.</p>
<div class="obs"><span class="lbl">Exemple</span><i>nous chant<b>i</b><u>ons</u></i> : radical <i>chant-</i>, marque de l’imparfait <b>-i-</b>, marque de personne <u>-ons</u>.</div>
<h3>Les trois groupes</h3>
<ul>
<li>1<sup>er</sup> groupe : verbes en <i>-er</i> (sauf <i>aller</i>) : <i>chanter</i>.</li>
<li>2<sup>e</sup> groupe : verbes en <i>-ir</i> qui font <i>-issons</i> : <i>finir, nous finissons</i>.</li>
<li>3<sup>e</sup> groupe : tous les autres : <i>faire, aller, dire, venir, pouvoir, voir, vouloir, prendre…</i></li>
</ul>
<h3>Les marques de temps <span class="chip gv">CM1</span> <span class="chip gv">6e</span></h3>
<div class="tw"><table>
<tr><th>Temps</th><th>Marque de temps</th><th>Exemple</th></tr>
<tr><td>Présent</td><td style="font-weight:400">aucune</td><td style="font-weight:400"><i>je chante, nous chantons</i></td></tr>
<tr><td>Imparfait</td><td style="font-weight:400">-ai- (je, tu, il, ils), -i- (nous, vous)</td><td style="font-weight:400"><i>je chantais, nous chantions</i></td></tr>
<tr><td>Futur</td><td style="font-weight:400">-r-</td><td style="font-weight:400"><i>je chanterai, nous chanterons</i></td></tr>
<tr><td>Conditionnel présent <span class="chip gv">6e</span></td><td style="font-weight:400">-r- + -ai- / -i-</td><td style="font-weight:400"><i>je chanterais, nous chanterions</i></td></tr>
</table></div>
<h3>Les marques de personne</h3>
<div class="tw"><table>
<tr><th>Personne</th><th>Marques fréquentes</th></tr>
<tr><td>je</td><td style="font-weight:400">-e, -s, -x, -ai</td></tr>
<tr><td>tu</td><td style="font-weight:400">-s, -x</td></tr>
<tr><td>il, elle, on</td><td style="font-weight:400">-e, -t, -d, -a</td></tr>
<tr><td>nous</td><td style="font-weight:400">-ons</td></tr>
<tr><td>vous</td><td style="font-weight:400">-ez</td></tr>
<tr><td>ils, elles</td><td style="font-weight:400">-nt</td></tr>
</table></div>
<div class="rule gv"><b>Futur ou conditionnel ?</b> <i>je chanterai / je chanterais</i> se prononcent presque pareil. Passez à <i>nous</i> : <i>nous chanterons</i> (futur) ; <i>nous chanterions</i> (conditionnel).</div>
<h3>Les verbes du 1<sup>er</sup> groupe dont le radical change <span class="chip gv">CM1</span></h3>
<div class="tw"><table>
<tr><th>Verbes</th><th>Ce qui change</th><th>Exemples</th></tr>
<tr><td>-cer</td><td style="font-weight:400">ç devant a, o</td><td style="font-weight:400"><i>nous commençons, il commençait</i></td></tr>
<tr><td>-ger</td><td style="font-weight:400">ge devant a, o</td><td style="font-weight:400"><i>nous mangeons, il mangeait</i></td></tr>
<tr><td>-yer</td><td style="font-weight:400">y → i devant un e muet</td><td style="font-weight:400"><i>il nettoie, ils essuient</i></td></tr>
<tr><td>appeler, jeter</td><td style="font-weight:400">consonne doublée devant un e muet</td><td style="font-weight:400"><i>j’appelle, je jette</i></td></tr>
<tr><td>acheter, lever, céder</td><td style="font-weight:400">accent grave devant un e muet</td><td style="font-weight:400"><i>j’achète, je lève, je cède</i></td></tr>
</table></div>`},

  { id:'c3-cj-e1', type:'exos', titre:'Identifier et conjuguer aux temps simples',
    exos:[
    { kind:'choice', titre:'Quel temps ?', consigne:'À quel temps le verbe est-il conjugué ? Cherchez la marque de temps.', options:['présent','imparfait','futur','conditionnel présent'],

  { id:'c3-cj-c2', type:'cours', titre:'Temps composés, passé simple, impératif, valeurs',
    sub:'Passé composé et plus-que-parfait, accord du participe passé, passé simple, impératif présent, valeurs des temps.',
    html:`
<h3>Les temps composés <span class="chip gv">CM1</span> <span class="chip gv">CM2</span></h3>
<p>Un temps composé est formé de <b>deux parties</b> : l’<b>auxiliaire</b> <i>être</i> ou <i>avoir</i>, conjugué, et le <b>participe passé</b> du verbe.</p>
<div class="tw"><table>
<tr><th>Temps</th><th>Auxiliaire</th><th>Exemples</th></tr>
<tr><td>Passé composé</td><td style="font-weight:400">au présent</td><td style="font-weight:400"><i>j’ai chanté, elle est partie</i></td></tr>
<tr><td>Plus-que-parfait <span class="chip gv">CM2</span></td><td style="font-weight:400">à l’imparfait</td><td style="font-weight:400"><i>j’avais chanté, elle était partie</i></td></tr>
</table></div>
<p>À la forme négative, <i>ne… pas</i> encadre l’<b>auxiliaire</b> : <i>Il <b>n’</b>a <b>pas</b> chanté. Elle <b>n’</b>était <b>pas</b> partie.</i></p>
<h3>L’accord du participe passé <span class="chip gv">CM1</span> <span class="chip gv">CM2</span> <span class="chip gv">6e</span></h3>
<ul>
<li>Avec <b>être</b>, il s’accorde avec le <b>sujet</b> : <i>Elles sont parties.</i></li>
<li>Avec <b>avoir</b>, il ne s’accorde pas avec le sujet : <i>Elles ont chanté.</i></li>
<li>Avec <b>avoir</b>, il s’accorde avec le <b>COD placé avant</b> le verbe, par exemple un pronom personnel : <i>Ces fleurs, je <b>les</b> ai cueilli<b>es</b>.</i></li>
</ul>
<h3>Le passé simple <span class="chip gv">CM2</span></h3>
<div class="tw"><table>
<tr><th></th><th>chanter</th><th>finir</th><th>être</th><th>avoir</th></tr>
<tr><td>il, elle</td><td style="font-weight:400">chanta</td><td style="font-weight:400">finit</td><td style="font-weight:400">fut</td><td style="font-weight:400">eut</td></tr>
<tr><td>ils, elles</td><td style="font-weight:400">chantèrent</td><td style="font-weight:400">finirent</td><td style="font-weight:400">furent</td><td style="font-weight:400">eurent</td></tr>
</table></div>
<p>Autres verbes à connaître : <i>il fit, il alla, il dit, il vint, il put, il vit, il voulut, il prit</i>.</p>
<h3>L’impératif présent <span class="chip gv">6e</span></h3>
<p>Il n’a que trois personnes et pas de sujet exprimé : <i>chante, chantons, chantez ; finis, finissons, finissez ; fais, faisons, faites</i>.</p>
<div class="trap"><b>Attention.</b> Les verbes en <i>-er</i> ne prennent pas de <i>-s</i> à la 2<sup>e</sup> personne du singulier de l’impératif : <i>Chante ! Mange ! Va !</i></div>
<h3>Les valeurs des temps <span class="chip gv">6e</span></h3>
<div class="rule gv">Il ne faut pas confondre le <b>temps chronologique</b> (passé, présent, futur : quand se passe l’action) et le <b>temps verbal</b> (présent, imparfait, passé simple… : le nom de la forme). Dans <i>Je pars demain</i>, le verbe est au présent, mais l’action est future.</div>
<ul>
<li>Le <b>présent</b> peut exprimer ce qui se passe maintenant (<i>Je lis</i>), une habitude (<i>Chaque soir, je lis</i>) ou une vérité générale (<i>La Terre tourne autour du Soleil</i>).</li>
<li>Dans un récit, le <b>passé simple</b> raconte les actions principales ; l’<b>imparfait</b> décrit le décor et ce qui dure : <i>Il pleuvait. Soudain, le loup surgit.</i></li>
</ul>`},

  { id:'c3-pc-c1', type:'cours', titre:'Proposition, juxtaposition, coordination, subordination',
    sub:'Programme de CM2 et de 6e.',
    html:`
<h3>Phrase simple, phrase complexe <span class="chip ph">CM2</span></h3>
<p>Pour savoir si une phrase est simple ou complexe, on <b>compte les verbes conjugués</b>.</p>
<ul>
<li>Une <b>phrase simple</b> contient <b>un seul</b> verbe conjugué : <i>Le loup frappe à la porte.</i></li>
<li>Une <b>phrase complexe</b> en contient <b>plusieurs</b> : <i>Le loup frappe à la porte, mais personne n’ouvre.</i></li>
</ul>
<div class="trap"><b>Attention.</b> Un temps composé compte pour un seul verbe (<i>il <u>a frappé</u></i>). Un infinitif seul ne compte pas (<i>il veut <u>entrer</u></i>).</div>
<h3>La proposition <span class="chip ph">6e</span></h3>
<p>Une <b>proposition</b> est un groupe de mots organisé autour d’un verbe conjugué. Une phrase complexe contient donc plusieurs propositions.</p>
<h3>Relier les propositions <span class="chip ph">6e</span></h3>
<div class="tw"><table>
<tr><th>Relation</th><th>Ce qui relie</th><th>Exemple</th></tr>
<tr><td>Juxtaposition</td><td style="font-weight:400">un signe de ponctuation (virgule, point-virgule, deux-points)</td><td style="font-weight:400"><i>Le vent souffle, la maison tremble.</i></td></tr>
<tr><td>Coordination</td><td style="font-weight:400">une conjonction de coordination : <i>mais, ou, et, or, ni, car</i></td><td style="font-weight:400"><i>Le loup souffle, mais la maison résiste.</i></td></tr>
<tr><td>Subordination</td><td style="font-weight:400">une conjonction de subordination : <i>quand, lorsque, parce que, puisque, comme, si, que…</i></td><td style="font-weight:400"><i>La maison résiste parce qu’elle est en briques.</i></td></tr>
</table></div>
<div class="rule ph"><b>Coordination ou subordination ?</b> La conjonction de <b>coordination</b> relie deux propositions de même niveau : chacune pourrait former une phrase seule. La conjonction de <b>subordination</b> introduit une proposition qui dépend d’une autre : <i>parce qu’elle est en briques</i> ne peut pas former une phrase seule.</div>
<p class="src">Le mot <i>donc</i>, souvent ajouté à la liste des conjonctions de coordination, est classé parmi les adverbes par la <i>Terminologie grammaticale</i> : on peut dire <i>et donc</i>.</p>`},

    sub:'La dérivation et les familles de mots.',
    html:`
<p class="lead">Beaucoup de mots sont fabriqués à partir d’autres mots. Savoir les décomposer aide à comprendre un mot inconnu et à l’écrire correctement.</p>
<h3>Le radical et les affixes <span class="chip fm">5e</span></h3>
<ul>
<li>Le <b>radical</b> (ou base) porte le sens principal du mot : <i>terre</i> dans <i>terrain, enterrer, terrestre</i>.</li>
<li>Le <b>préfixe</b> se place <b>avant</b> le radical : <i><u>re</u>faire, <u>dé</u>faire</i>.</li>
<li>Le <b>suffixe</b> se place <b>après</b> le radical : <i>lent<u>ement</u>, lav<u>age</u></i>.</li>
</ul>
<p>Former un mot en ajoutant un préfixe ou un suffixe, c’est la <b>dérivation</b>. Le mot obtenu est un <b>mot dérivé</b>.</p>
<div class="obs"><span class="lbl">Exemple</span><i>in- + <b>vis</b> + -ible → invisible</i> : préfixe <i>in-</i> (le contraire), radical <i>vis</i> (voir), suffixe <i>-ible</i> (qu’on peut).</div>
<div class="rule fm"><b>Ce que change chaque affixe.</b> Le <b>préfixe</b> modifie le sens mais garde la classe du mot : <i>faire</i> et <i>défaire</i> sont deux verbes. Le <b>suffixe</b> change souvent la classe : <i>lent</i> (adjectif) → <i>lentement</i> (adverbe) ; <i>laver</i> (verbe) → <i>lavage</i> (nom).</div>
<h3>Quelques préfixes et suffixes</h3>
<div class="tw"><table>
<tr><th>Préfixe</th><th>Sens</th><th>Exemples</th></tr>
<tr><td>in-, im-, il-, ir-</td><td style="font-weight:400">le contraire</td><td style="font-weight:400"><i>inutile, impossible, illisible, irréel</i></td></tr>
<tr><td>dé-, dés-</td><td style="font-weight:400">l’action inverse</td><td style="font-weight:400"><i>défaire, désobéir</i></td></tr>
<tr><td>re-, ré-</td><td style="font-weight:400">la répétition</td><td style="font-weight:400"><i>relire, réécrire</i></td></tr>
<tr><td>pré-</td><td style="font-weight:400">avant</td><td style="font-weight:400"><i>préhistoire, prévoir</i></td></tr>
<tr><td>mé-, més-</td><td style="font-weight:400">mal</td><td style="font-weight:400"><i>mécontent, mésentente</i></td></tr>
</table></div>
<div class="tw"><table>
<tr><th>Suffixe</th><th>Sens ou rôle</th><th>Exemples</th></tr>
<tr><td>-eur, -euse</td><td style="font-weight:400">celui ou celle qui fait l’action (nom)</td><td style="font-weight:400"><i>chanteur, nageuse</i></td></tr>
<tr><td>-able, -ible</td><td style="font-weight:400">qu’on peut… (adjectif)</td><td style="font-weight:400"><i>lavable, lisible</i></td></tr>
<tr><td>-ette, -et</td><td style="font-weight:400">petit (diminutif)</td><td style="font-weight:400"><i>maisonnette, garçonnet</i></td></tr>
<tr><td>-ment</td><td style="font-weight:400">forme des adverbes à partir d’adjectifs</td><td style="font-weight:400"><i>doucement, rapidement</i></td></tr>
<tr><td>-age, -tion</td><td style="font-weight:400">l’action (nom)</td><td style="font-weight:400"><i>lavage, création</i></td></tr>
</table></div>
<div class="trap"><b>Orthographe.</b> Le préfixe <i>in-</i> devient <i>im-</i> devant <i>m, b, p</i> (<i>immobile, imbuvable, impossible</i>), <i>il-</i> devant <i>l</i> (<i>illégal</i>) et <i>ir-</i> devant <i>r</i> (<i>irréel</i>) : d’où les consonnes doubles.</div>
<h3>La famille de mots <span class="chip fm">5e</span></h3>
<p>Les mots formés sur le même radical forment une <b>famille</b> : <i>dent, dentiste, dentier, édenté, dentition</i>. Le radical peut changer de forme : <i>mer, marin, maritime</i> ; <i>œil, oculaire</i>.</p>
<div class="trap"><b>Attention aux faux amis.</b> <i>Chaton</i> (petit chat) n’a rien à voir avec <i>château</i>, ni <i>merci</i> avec <i>mer</i> : une ressemblance de forme ne suffit pas. Pour vérifier, on cherche un sens commun.</div>`},

  { id:'co-fm-c2', type:'cours', titre:'Composition, emprunt et autres procédés',
    sub:'Mots composés, éléments grecs et latins, mots raccourcis, sigles, emprunts.',
    html:`
<p class="lead">La dérivation n’est pas le seul moyen de créer des mots. On peut aussi assembler des mots, les raccourcir ou les emprunter à d’autres langues.</p>
<h3>La composition <span class="chip fm">5e</span></h3>
<p>Un <b>mot composé</b> est formé de deux mots (ou plus) qui existent seuls :</p>
<ul>
<li>soudés : <i>portefeuille, gendarme</i> ;</li>
<li>avec un trait d’union : <i>porte-monnaie, chou-fleur, arc-en-ciel</i> ;</li>
<li>séparés : <i>pomme de terre, salle à manger</i>.</li>
</ul>
<h3>Les éléments grecs et latins <span class="chip fm">4e</span> <span class="chip fm">3e</span></h3>
<p>Beaucoup de mots savants sont formés d’éléments venus du grec ou du latin, qui n’existent pas seuls en français : <i>télé + phone</i> = « voix venue de loin ».</p>
<div class="tw"><table>
<tr><th>Élément</th><th>Sens</th><th>Exemples</th></tr>
<tr><td>télé-</td><td style="font-weight:400">loin</td><td style="font-weight:400"><i>téléphone, télescope</i></td></tr>
<tr><td>-phone, phon-</td><td style="font-weight:400">voix, son</td><td style="font-weight:400"><i>microphone, phonétique</i></td></tr>
<tr><td>-graphe, -graphie</td><td style="font-weight:400">écrire</td><td style="font-weight:400"><i>autographe, orthographe</i></td></tr>
<tr><td>bio-</td><td style="font-weight:400">vie</td><td style="font-weight:400"><i>biologie, biographie</i></td></tr>
<tr><td>-logie</td><td style="font-weight:400">étude, science</td><td style="font-weight:400"><i>géologie, zoologie</i></td></tr>
<tr><td>géo-</td><td style="font-weight:400">terre</td><td style="font-weight:400"><i>géographie</i></td></tr>
<tr><td>chrono-</td><td style="font-weight:400">temps</td><td style="font-weight:400"><i>chronomètre, chronologie</i></td></tr>
<tr><td>hydro-</td><td style="font-weight:400">eau</td><td style="font-weight:400"><i>hydravion</i></td></tr>
<tr><td>micro-</td><td style="font-weight:400">petit</td><td style="font-weight:400"><i>microscope</i></td></tr>
</table></div>
<h3>D’autres façons de créer des mots <span class="chip fm">4e</span></h3>
<div class="tw"><table>
<tr><th>Procédé</th><th>Principe</th><th>Exemples</th></tr>
<tr><td>Le mot raccourci (troncation)</td><td style="font-weight:400">on coupe une partie du mot</td><td style="font-weight:400"><i>vélo</i> (vélocipède), <i>ciné</i>, <i>prof</i></td></tr>
<tr><td>Le sigle</td><td style="font-weight:400">on garde les initiales</td><td style="font-weight:400"><i>SNCF, CDI</i></td></tr>
<tr><td>Le mot-valise</td><td style="font-weight:400">on fond deux mots en un</td><td style="font-weight:400"><i>courriel</i> (courrier + électronique)</td></tr>
<tr><td>L’emprunt</td><td style="font-weight:400">on prend un mot à une autre langue</td><td style="font-weight:400"><i>pizza</i> (italien), <i>football</i> (anglais), <i>algèbre</i> (arabe)</td></tr>
<tr><td>Le changement de classe</td><td style="font-weight:400">un mot passe dans une autre classe sans changer de forme</td><td style="font-weight:400"><i>le dîner, le rire, le beau</i></td></tr>
</table></div>
<div class="rule fm"><b>Pour comprendre un mot inconnu.</b> Cherchez le radical, puis les préfixes, suffixes ou éléments grecs et latins : <i>chronophage</i> = <i>chrono</i> (temps) + <i>phage</i> (qui mange) → qui « mange » le temps.</div>`},

  { id:'co-gn-c1', type:'cours', titre:'Le groupe nominal et son noyau',
    sub:'Rappel des acquis de 6e, à maîtriser dès la 5e.',
    html:`
<p class="lead">Pour analyser un mot, on se pose deux questions : <b>quelle est sa nature ?</b> (ce qu’il est : nom, adjectif, verbe…) et <b>quelle est sa fonction ?</b> (le rôle qu’il joue dans la phrase : sujet, épithète…).</p>
<h3>La composition du GN</h3>
<p>Le groupe nominal est formé le plus souvent d’un <b>déterminant</b> et d’un <b>nom</b> : <i>le chat</i>. Le nom est le <b>noyau</b> du groupe. Il peut être complété par des mots qui apportent des précisions sur lui, les <b>expansions du nom</b> :</p>
<ul>
<li>un adjectif : <i>le <b>petit</b> chat <b>noir</b></i> ;</li>
<li>un groupe nominal prépositionnel (GNP), c’est-à-dire un GN introduit par une préposition : <i>le chat <b>de mon voisin</b></i>.</li>
</ul>
<div class="obs"><span class="lbl">Observation</span>
<i>le petit chat noir de mon voisin</i> : trois informations sont données sur le nom noyau <i>chat</i>. Il est petit, il est noir, il appartient à mon voisin.</div>
<h3>Trois manipulations pour repérer le GN</h3>
<div class="tw"><table>
<tr><th>Manipulation</th><th>Ce qu’elle montre</th><th>Exemple</th></tr>
<tr><td>Réduire</td><td style="font-weight:400">les expansions peuvent être supprimées ; il reste le noyau et son déterminant</td><td style="font-weight:400"><i>un petit chat noir → un chat</i></td></tr>
<tr><td>Développer</td><td style="font-weight:400">on peut ajouter des expansions autour du noyau</td><td style="font-weight:400"><i>le chat → le chat noir → le petit chat noir de mon voisin</i></td></tr>
<tr><td>Remplacer par un pronom</td><td style="font-weight:400">tout le GN est remplacé d’un coup : c’est la preuve qu’il forme un bloc</td><td style="font-weight:400"><i>Le petit chat noir a sauté sur le mur → <b>Il</b> a sauté sur le mur.</i></td></tr>
</table></div>
<h3>Le nom noyau commande</h3>
<p>Le nom porte un <b>genre</b> (masculin ou féminin) et un <b>nombre</b> (singulier ou pluriel). Il les transmet au déterminant et à l’adjectif : c’est le <b>donneur d’accord</b>. Dans <i>une grande maison</i>, <i>maison</i> est le donneur d’accord ; <i>une</i> et <i>grande</i> s’accordent avec lui.</p>
<h3>Le GN dans la phrase</h3>
<p>Un GN peut occuper dans la phrase différentes fonctions : sujet, COD, COI, attribut du sujet, complément circonstanciel. Vous les étudierez dans le module 3.</p>`},

  { id:'co-gn-c2', type:'cours', titre:'Les déterminants',
    sub:'Repères de 5e : article partitif, déterminants interrogatifs, exclamatifs, indéfinis et numéraux.',
    html:`
<p class="lead">Le déterminant se place avant le nom. Il indique son genre et son nombre et permet de l’employer dans une phrase. Il est en principe obligatoire devant le nom commun.</p>
<div class="tw"><table>
<tr><th>Déterminant</th><th>Formes</th><th>Exemple</th></tr>
<tr><td>Article défini</td><td style="font-weight:400">le, la, l’, les ; contractés : au, aux, du, des</td><td style="font-weight:400"><i>la plage, au bord de l’eau</i></td></tr>
<tr><td>Article indéfini</td><td style="font-weight:400">un, une, des</td><td style="font-weight:400"><i>une vague, des mouettes</i></td></tr>
<tr><td>Article partitif</td><td style="font-weight:400">du, de la, de l’ : une quantité qu’on ne compte pas</td><td style="font-weight:400"><i>boire de l’eau, manger du pain</i></td></tr>
<tr><td>Possessif</td><td style="font-weight:400">mon, ton, son, notre, votre, leur, mes, ses, leurs…</td><td style="font-weight:400"><i>ses pieds</i></td></tr>
<tr><td>Démonstratif</td><td style="font-weight:400">ce, cet, cette, ces</td><td style="font-weight:400"><i>cette île, cet arbre</i></td></tr>
<tr><td>Indéfini</td><td style="font-weight:400">chaque, plusieurs, quelques, aucun, tout, certains…</td><td style="font-weight:400"><i>chaque matin, quelques jours</i></td></tr>
<tr><td>Numéral</td><td style="font-weight:400">un, deux, trois, vingt, cent, mille…</td><td style="font-weight:400"><i>trois coquillages</i></td></tr>
<tr><td>Interrogatif, exclamatif</td><td style="font-weight:400">quel, quelle, quels, quelles</td><td style="font-weight:400"><i>Quel jour sommes-nous ? Quelle tempête !</i></td></tr>
</table></div>
<h3>Ne pas confondre</h3>
<div class="trap"><b>Article ou pronom ?</b> <i>le, la, les</i> devant un <b>nom</b> sont des articles (<i>je mange <b>la</b> pomme</i>) ; devant un <b>verbe</b>, ce sont des pronoms personnels (<i>je <b>la</b> mange</i>).</div>
<div class="trap"><b>Partitif ou contracté ?</b> <i>du</i> est un article partitif quand il indique une quantité (<i>il mange <b>du</b> pain</i>) ; c’est un article défini contracté (<i>de + le</i>) quand il signifie « appartenant à » ou « venant de » (<i>le chien <b>du</b> voisin</i>). Test : remplacez par un nom féminin. <i>le chien de la voisine</i> → <i>du</i> = <i>de + le</i>.</div>
<div class="rule gn"><b>Test du déterminant.</b> Un déterminant est toujours suivi d’un nom, parfois précédé d’un adjectif (<i>quelques <b>petits</b> crabes</i>). Un pronom, lui, remplace un nom ou un GN.</div>`},

  { id:'co-gn-c3', type:'cours', titre:'Les expansions du nom',
    sub:'Épithète et complément du nom (rappel), relative (5e), apposition (4e).',
    html:`
<h3>L’épithète</h3>
<p>L’adjectif <b>épithète</b> se place juste avant ou juste après le nom, à l’intérieur du GN : <i>le <b>petit</b> chat</i>, <i>un chat <b>blanc</b></i>. On peut le supprimer : <i>Olga a un chat blanc → Olga a un chat.</i></p>
<div class="trap"><b>Épithète ou attribut ?</b> Dans <i>Le chat est blanc</i>, <i>blanc</i> est placé après le verbe <i>être</i> : il est <b>attribut du sujet</b>. On ne peut pas le supprimer : *<i>Le chat est.</i></div>
<h3>Le complément du nom</h3>
<p>C’est le plus souvent un GN introduit par une préposition (<i>de, à, en, pour, sans…</i>), placé après le nom : <i>l’école <b>de mon quartier</b>, des patins <b>à roulettes</b>, une règle <b>en plastique</b>, le train <b>pour Paris</b></i>. Il exprime l’appartenance, la matière, le lieu, la destination…</p>
<div class="rule gn"><b>Complément du nom ou complément circonstanciel ?</b> Le complément du nom ne peut pas être déplacé : <i>J’ai trouvé une photo de sa famille</i> → *<i>De sa famille, j’ai trouvé une photo.</i> Le complément circonstanciel, lui, se déplace : <i>Nous nous sommes amusés dans la forêt → Dans la forêt, nous nous sommes amusés.</i></div>
<h3>La proposition subordonnée relative <span class="chip gn">5e</span></h3>
<p>Elle complète un nom, appelé l’<b>antécédent</b>. Elle commence par un <b>pronom relatif</b> (<i>qui, que, dont, où, lequel…</i>) qui reprend cet antécédent.</p>
<div class="obs"><span class="lbl">Exemple</span><i>une reine <b>qui cousait devant une fenêtre</b></i> (Grimm) : la relative complète l’antécédent <i>reine</i> ; <i>qui</i> reprend <i>reine</i>.</div>
<h3>L’apposition <span class="chip gn">4e</span></h3>
<p>Un adjectif, un participe ou un GN peut être <b>détaché</b> du nom par une virgule : il est alors <b>apposé</b>. Il ajoute une information sans faire partie du GN.</p>
<ul>
<li><i>Robinson, <b>épuisé</b>, resta couché sur le sable.</i> (adjectif apposé)</li>
<li><i>Vendredi, <b>le compagnon de Robinson</b>, apprit vite.</i> (GN apposé)</li>
</ul>
<h3>Méthode</h3>
<ol>
<li>De quel nom le mot ou le groupe dépend-il ?</li>
<li>Est-il détaché par une virgule ? → <b>apposition</b>.</li>
<li>Commence-t-il par un pronom relatif ? → <b>proposition relative</b>.</li>
<li>Commence-t-il par une préposition ? → <b>complément du nom</b>. Sinon, c’est un adjectif <b>épithète</b>.</li>
</ol>`},

  { id:'co-gn-c4', type:'cours', titre:'Les accords dans le GN',
    sub:'La chaîne d’accords, du cas simple (5e) au GN complexe (4e, 3e).',
    html:`
<h3>La chaîne d’accords</h3>
<p>Dans le GN, le <b>nom</b> est le donneur d’accord. Le déterminant et l’adjectif prennent son genre et son nombre : <i>la petite table → les petites tables</i>. Ces mots forment une <b>chaîne d’accords</b>.</p>
<div class="rule gn"><b>Méthode de relecture.</b> 1. Repérez le nom noyau. 2. Trouvez son genre et son nombre. 3. Vérifiez chaque déterminant et chaque adjectif qui s’y rapporte, même s’il est loin du nom. Pour un adjectif éloigné, demandez-vous : « qui est-ce qui est… ? »</div>
<p>Beaucoup de marques ne s’entendent pas à l’oral (<i>bleu, bleue, bleus, bleues</i>) : il faut les vérifier à l’écrit.</p>
<h3>Féminin et pluriel : les formes particulières</h3>
<div class="tw"><table>
<tr><th>Cas</th><th>Règle</th><th>Exemple</th></tr>
<tr><td>Féminin</td><td style="font-weight:400">souvent <i>-e</i>, mais aussi <i>-eux → -euse, -if → -ive, -er → -ère, -on → -onne</i></td><td style="font-weight:400"><i>heureux / heureuse, vif / vive, fier / fière</i></td></tr>
<tr><td>Pluriel en -x</td><td style="font-weight:400"><i>-al → -aux</i> (sauf <i>bals, festivals, carnavals</i>) ; <i>-eau → -eaux</i> ; sept noms en <i>-ou</i> prennent un <i>x</i></td><td style="font-weight:400"><i>des chevaux, des bateaux, des cailloux</i></td></tr>
<tr><td>Adjectifs en -s, -x</td><td style="font-weight:400">pas de changement au pluriel</td><td style="font-weight:400"><i>des gants gris, des enfants heureux</i></td></tr>
<tr><td>ce / cet</td><td style="font-weight:400"><i>cet</i> devant un nom masculin commençant par une voyelle ou un h muet</td><td style="font-weight:400"><i>cet arbre, cet homme</i></td></tr>
<tr><td>beau, nouveau, vieux</td><td style="font-weight:400"><i>bel, nouvel, vieil</i> devant un nom masculin singulier commençant par une voyelle</td><td style="font-weight:400"><i>un bel arbre, un vieil homme</i></td></tr>
<tr><td>Plusieurs noms</td><td style="font-weight:400">adjectif au pluriel ; masculin si les genres sont différents</td><td style="font-weight:400"><i>une robe et un chapeau noirs</i></td></tr>
<tr><td>Couleurs</td><td style="font-weight:400">adjectif simple : accord ; nom de fruit ou de chose (<i>marron, orange</i>) ou couleur en deux mots : invariable</td><td style="font-weight:400"><i>des yeux bleus / des yeux marron, des robes bleu clair</i></td></tr>
</table></div>
<h3>Le GN complexe <span class="chip gn">4e · 3e</span></h3>
<ul>
<li>L’adjectif ou le participe <b>apposé</b> s’accorde avec le nom dont il est détaché : <i>Les naufragés, <b>épuisés</b>, dormaient.</i></li>
<li>Dans un GN qui contient une relative, le pronom relatif transmet l’accord de son antécédent : <i>les vagues qui sont <b>venues</b></i> (<i>qui</i> = <i>les vagues</i>).</li>
<li>Un participe qui se rapporte à plusieurs noms se met au pluriel, au masculin si les genres sont mêlés : <i>de poissons morts, de coquillages brisés et d’algues noires <b>rejetés</b> par les flots</i> (Tournier).</li>
<li>Attention aux GN enchâssés : dans <i>la plage jonchée de poissons morts</i>, <i>jonchée</i> s’accorde avec <i>plage</i>, <i>morts</i> avec <i>poissons</i>.</li>
</ul>`},

  { titre:'Module 3 · Le groupe verbal', court:'Groupe verbal', cls:'gv', steps:[

  { id:'co-gv-c1', type:'cours', titre:'Le sujet et le groupe verbal',
    sub:'Repérer le sujet même éloigné ou inversé (5e, 4e) ; reconnaître COD, COI, attribut.',
    html:`
<h3>Le sujet et le verbe</h3>
<p>La phrase simple se compose d’un <b>groupe sujet</b> (GS) et d’un <b>groupe verbal</b> (GV). Le sujet est le <b>donneur d’accord</b> du verbe : <i>Le chat miaule / Les chats miaulent.</i></p>
<div class="tw"><table>
<tr><th>Pour trouver le sujet</th><th>Exemple</th></tr>
<tr><td>Poser la question « qui est-ce qui ? » ou « qu’est-ce qui ? » devant le verbe</td><td style="font-weight:400"><i>Une vague déferla</i> → Qu’est-ce qui déferla ? une vague.</td></tr>
<tr><td>Encadrer par « c’est… qui »</td><td style="font-weight:400"><i>C’est une vague qui déferla.</i></td></tr>
<tr><td>Remplacer par un pronom (<i>il, elle, ils, elles</i>)</td><td style="font-weight:400"><i>Elle déferla.</i></td></tr>
</table></div>
<div class="trap"><b>Pièges</b> <span class="chip gv">5e · 4e</span>
<ul style="margin:6px 0 0">
<li>Le sujet peut être <b>séparé du verbe</b> par un complément ou un pronom : <i>Les enfants du village <b>les</b> regardent.</i> (le sujet est <i>les enfants du village</i>, pas <i>les</i>)</li>
<li>Le sujet peut être <b>éloigné</b> : <i>Le cri des mouettes qui tournoient au-dessus des vagues <b>réveille</b> Robinson.</i> (le noyau du sujet est <i>cri</i>)</li>
<li>Le sujet peut être <b>inversé</b>, placé après le verbe : <i>Sur la plage <b>dormait</b> un naufragé.</i></li>
</ul></div>
<h3>Les formes du groupe verbal</h3>
<p>Le GV contient le verbe et ses compléments. Test : on peut le remplacer par un seul verbe ou par « le faire » (<i>Léo donne un cadeau à son ami → Léo parle</i>).</p>
<div class="tw"><table>
<tr><th>Structure</th><th>Exemple</th></tr>
<tr><td>Verbe seul</td><td style="font-weight:400"><i>Le facteur travaille.</i></td></tr>
<tr><td>Verbe + COD</td><td style="font-weight:400"><i>Le facteur distribue le courrier.</i></td></tr>
<tr><td>Verbe + COI</td><td style="font-weight:400"><i>Le facteur parle à sa collègue. Le facteur va à Paris.</i></td></tr>
<tr><td>Verbe + COD + COI</td><td style="font-weight:400"><i>Le facteur donne une lettre à ma voisine.</i></td></tr>
<tr><td>Verbe + COI + COI</td><td style="font-weight:400"><i>Le facteur parle de ses vacances à sa collègue.</i></td></tr>
<tr><td>Verbe attributif + attribut du sujet</td><td style="font-weight:400"><i>Le chat est blanc. Jean est médecin.</i></td></tr>
</table></div>
<h3>Reconnaître chaque complément</h3>
<ul>
<li><b>COD</b> : construit sans préposition ; question « qui est-ce que ? » ou « qu’est-ce que ? » ; remplaçable par <i>le, la, les, l’</i>. <i>Julie regarde l’école → Julie la regarde.</i></li>
<li><b>COI</b> : construit avec une préposition (<i>à, de</i>) ; question « à qui ? de quoi ? » ; remplaçable par <i>lui, leur, y, en</i>. <i>Noam parle à sa sœur → Noam lui parle.</i></li>
<li><b>Attribut du sujet</b> : après un verbe attributif (<i>être, sembler, paraître, devenir, rester, avoir l’air…</i>) ; il donne une caractéristique du sujet ; on ne peut pas le supprimer (*<i>Nicolas reste</i>).</li>
</ul>
<div class="rule gv"><b>COD ou attribut ?</b> Avec un COD, il y a deux éléments distincts : <i>Jean mange un gâteau</i> (Jean et le gâteau). Avec un attribut, il n’y en a qu’un : <i>Jean est médecin</i> (Jean est le médecin). Évitez la question « quoi ? », qui fonctionne pour les deux (<i>Il est quoi ? Il mange quoi ?</i>).</div>
<h3>L’attribut du COD <span class="chip gv">4e</span></h3>
<p>Après des verbes comme <i>trouver, juger, rendre, nommer, élire</i>, un adjectif ou un GN donne une caractéristique du COD : <i>Robinson trouve l’île <b>accueillante</b>.</i> Il s’accorde avec le COD.</p>`},

  { id:'co-gv-c2', type:'cours', titre:'Le complément circonstanciel',
    sub:'Lieu, temps, cause (acquis) ; moyen, manière, but (5e) ; conséquence (4e).',
    html:`
<p class="lead">Le complément circonstanciel (CC) n’est pas lié au verbe seul : il apporte une information complémentaire sur l’ensemble de la phrase [sujet + groupe verbal].</p>
<h3>Trois propriétés</h3>
<ul>
<li>Il peut être <b>supprimé</b> : <i>À Marseille, il fait beau → Il fait beau.</i></li>
<li>Il peut être <b>déplacé</b> : <i>Le lundi, Tom joue au foot → Tom joue au foot le lundi.</i></li>
<li>Il peut avoir plusieurs <b>natures</b> : GN (<i>le lundi</i>), GN prépositionnel (<i>en France</i>), adverbe (<i>souvent</i>), proposition subordonnée (<i>quand le chat est fatigué</i>), gérondif (<i>en courant</i>).</li>
</ul>
<div class="trap"><b>COI ou CC ?</b> Le COI est appelé par le sens du verbe et ne se déplace pas : <i>Zoé va <b>à Paris</b></i> (COI). Le CC est facultatif : <i>Zoé travaille <b>à Paris</b></i> → <i>À Paris, Zoé travaille.</i></div>
<h3>Les valeurs</h3>
<div class="tw"><table>
<tr><th>Valeur</th><th>Question</th><th>Exemple</th></tr>
<tr><td>Lieu</td><td style="font-weight:400">où ?</td><td style="font-weight:400"><i>Des mouettes tournoyaient <b>dans le ciel</b>.</i></td></tr>
<tr><td>Temps</td><td style="font-weight:400">quand ?</td><td style="font-weight:400"><i><b>Après la tempête</b>, le ciel redevint bleu.</i></td></tr>
<tr><td>Cause</td><td style="font-weight:400">pourquoi ? (origine)</td><td style="font-weight:400"><i>Il tremblait <b>de froid</b>.</i></td></tr>
<tr><td>Moyen <span class="chip gv">5e</span></td><td style="font-weight:400">avec quoi ?</td><td style="font-weight:400"><i>Il coupa la corde <b>avec un couteau</b>.</i></td></tr>
<tr><td>Manière <span class="chip gv">5e</span></td><td style="font-weight:400">comment ?</td><td style="font-weight:400"><i>Robinson s’assit <b>avec effort</b>.</i></td></tr>
<tr><td>But <span class="chip gv">5e</span></td><td style="font-weight:400">dans quel but ?</td><td style="font-weight:400"><i>Il alluma un feu <b>pour se réchauffer</b>.</i></td></tr>
<tr><td>Conséquence <span class="chip gv">4e</span></td><td style="font-weight:400">avec quel résultat ?</td><td style="font-weight:400"><i>Il était si las <b>qu’il s’endormit sur le sable</b>.</i></td></tr>
</table></div>
<div class="rule gv"><b>Cause ou but ?</b> La cause est ce qui a provoqué l’action (avant) ; le but est ce que l’on cherche à obtenir (après). <i>Il alluma un feu <b>parce qu’il avait froid</b></i> (cause) / <i><b>pour se réchauffer</b></i> (but).</div>`},

  { id:'co-gv-c3', type:'cours', titre:'Temps du discours, temps du récit',
    sub:'Valeurs des temps, premier plan et arrière-plan (5e) ; accompli et non accompli (4e).',
    html:`
<p class="lead">Un temps du verbe n’a pas de valeur fixe : il prend son sens par rapport aux autres verbes du texte. On distingue deux systèmes.</p>
<h3>Le discours : on parle à partir de maintenant</h3>
<div class="tw"><table>
<tr><th>Passé</th><th>Présent</th><th>Futur</th></tr>
<tr><td style="font-weight:400">imparfait / passé composé<br><i>Hier, je marchais / j’ai marché.</i></td><td style="font-weight:400">présent<br><i>En ce moment, je marche.</i></td><td style="font-weight:400">futur<br><i>Demain, je marcherai.</i></td></tr>
</table></div>
<h3>Le récit : l’histoire a son propre repère</h3>
<div class="tw"><table>
<tr><th>Passé du récit</th><th>Présent du récit</th><th>Futur du récit</th></tr>
<tr><td style="font-weight:400">plus-que-parfait<br><i>Il ne savait pas qu’elle avait pris l’avion.</i></td><td style="font-weight:400">passé simple, imparfait<br><i>Il affirma… ; il disait…</i></td><td style="font-weight:400">conditionnel<br><i>…qu’elle viendrait le lendemain.</i></td></tr>
</table></div>
<h3>Premier plan, arrière-plan <span class="chip gv">5e</span></h3>
<p>Dans le récit, le <b>passé simple</b> exprime les actions principales, souvent brèves, qui font avancer l’histoire : c’est le <b>premier plan</b>. L’<b>imparfait</b> exprime le décor, les descriptions, ce qui dure : c’est l’<b>arrière-plan</b>.</p>
<div class="obs"><span class="lbl">Observation</span>${ROB}<p style="margin:8px 0 0">Premier plan : <i>reprit, déferla, vint, se laissa, s’assit, ressentit</i>. Arrière-plan : <i>était couché, tournoyaient, était jonchée</i>.</p></div>
<h3>Les valeurs du présent et des hypothèses</h3>
<ul>
<li>Présent d’<b>actualité</b> : <i>Ce matin, je travaille.</i> ; de <b>répétition</b> : <i>Chaque jour, nous avons une leçon de français.</i> ; de <b>vérité générale</b> : <i>Les chats aiment le poisson.</i></li>
<li>Hypothèse : <i>Si tu travailles, tu auras de bonnes notes</i> (si + présent → futur) ; <i>Si tu travaillais, tu aurais de bonnes notes</i> (si + imparfait → conditionnel). Jamais de conditionnel après <i>si</i>.</li>
</ul>
<h3>Accompli, non accompli <span class="chip gv">4e</span></h3>
<p>Les temps <b>composés</b> (auxiliaire + participe passé) présentent l’action comme <b>accomplie</b>, terminée : <i>il a mangé, il avait mangé</i>. Les temps <b>simples</b> la présentent comme <b>non accomplie</b>, en cours : <i>il mange, il mangeait</i>. Le passé simple présente l’action comme <b>bornée</b> (avec un début et une fin) ; l’imparfait comme <b>non bornée</b>.</p>
<div class="rule gv"><b>Futur ou conditionnel ?</b> <i>je viendrai / je viendrais</i> se prononcent souvent de la même façon. Test : passez à <i>nous</i>. <i>nous viendrons</i> → futur ; <i>nous viendrions</i> → conditionnel.</div>`},

  { id:'co-gv-c4', type:'cours', titre:'Voix passive et participe passé',
    sub:'Accord avec être et avec avoir (5e) ; COD placé avant (4e) ; voix passive (4e) ; COD pronom relatif (3e).',
    html:`
<h3>Le participe passé employé avec être <span class="chip gv">5e</span></h3>
<p>Il s’accorde avec le sujet, comme un attribut : <i>Elle est <b>partie</b>. Les naufragés sont <b>arrivés</b>.</i></p>
<h3>Le participe passé employé avec avoir</h3>
<ul>
<li><span class="chip gv">5e</span> Il ne s’accorde <b>pas avec le sujet</b>. Si le COD est placé <b>après</b> le verbe, il ne s’accorde pas : <i>Elles ont <b>ramassé</b> des coquillages.</i></li>
<li><span class="chip gv">4e</span> Si le COD est placé <b>avant</b> le verbe, notamment un pronom personnel (<i>le, la, les, l’</i>), le participe s’accorde avec lui : <i>Ces coquillages, elles les ont <b>ramassés</b>.</i></li>
<li><span class="chip gv">3e</span> Même règle quand le COD est le pronom relatif <i>que</i> : <i>Les coquillages <b>qu’</b>elles ont <b>ramassés</b> sont brisés.</i> (<i>que</i> reprend <i>coquillages</i>)</li>
</ul>
<div class="rule gv"><b>Méthode.</b> 1. Quel est l’auxiliaire ? 2. Avec <i>être</i> : accord avec le sujet. 3. Avec <i>avoir</i> : cherchez le COD (« qu’est-ce que… ? »). Est-il placé avant ? Si oui, accord avec lui ; sinon, pas d’accord.</div>
<h3>La voix passive <span class="chip gv">4e</span></h3>
<p>À la voix active, le sujet fait l’action : <i>La tempête <b>a détruit</b> le navire.</i> À la voix passive, le sujet subit l’action : <i>Le navire <b>a été détruit</b> par la tempête.</i></p>
<ul>
<li>Le COD de la phrase active devient sujet de la phrase passive.</li>
<li>Le sujet de la phrase active devient <b>complément d’agent</b>, introduit par <i>par</i> (parfois <i>de</i> : <i>aimé de tous</i>).</li>
<li>Le verbe se construit avec <i>être</i>, conjugué au temps du verbe actif, + participe passé accordé avec le sujet : <i>La plage <b>est couverte</b> d’algues.</i></li>
</ul>
<div class="trap"><b>Ne pas confondre.</b> <i>Elle est partie</i> : verbe <i>partir</i> au passé composé, voix active (on ne peut pas ajouter « par quelqu’un »). <i>Elle est suivie</i> : verbe <i>suivre</i> au présent, voix passive (<i>par un chien</i>).</div>
<p><span class="chip gv">3e</span> Le passif permet de mettre en valeur celui qui subit l’action, ou de taire celui qui la fait : <i>Le navire a été détruit</i> (on ne dit pas par qui).</p>`},

  { titre:'Module 4 · La phrase', court:'Phrase', cls:'ph', steps:[

  { id:'co-ph-c1', type:'cours', titre:'Qu’est-ce qu’une phrase ?',
    sub:'Phrase verbale ou non verbale, simple ou complexe, et les types de phrases.',
    html:`
<p class="lead">Une phrase a un sens complet. À l’écrit, elle commence par une <b>majuscule</b> et se termine par un <b>point</b> : point final, point d’interrogation, point d’exclamation ou points de suspension.</p>
<h3>Phrase verbale, phrase non verbale <span class="chip ph">5e</span></h3>
<ul>
<li>La <b>phrase verbale</b> contient au moins un verbe conjugué : <i>Robinson explore l’île.</i> <i>Taisez-vous !</i></li>
<li>La <b>phrase non verbale</b> ne contient pas de verbe conjugué : <i>Silence ! Quelle tempête ! Attention, peinture fraîche.</i></li>
</ul>
<h3>Les types de phrases <span class="chip ph">5e</span></h3>
<div class="tw"><table>
<tr><th>Type</th><th>Elle sert à…</th><th>Exemple</th></tr>
<tr><td>Déclarative</td><td style="font-weight:400">raconter, décrire, affirmer</td><td style="font-weight:400"><i>Le navire a fait naufrage.</i></td></tr>
<tr><td>Interrogative</td><td style="font-weight:400">poser une question</td><td style="font-weight:400"><i>Où sommes-nous ?</i></td></tr>
<tr><td>Impérative (injonctive)</td><td style="font-weight:400">donner un ordre, un conseil</td><td style="font-weight:400"><i>Construis un abri.</i></td></tr>
</table></div>
<p>L’exclamation exprime une émotion forte ; elle s’ajoute à ces types : <i>Comme la mer est belle !</i></p>
<h3>Phrase simple, phrase complexe <span class="chip ph">4e</span></h3>
<p>Une <b>proposition</b> est un groupe de mots organisé autour d’un verbe conjugué.</p>
<ul>
<li>La <b>phrase simple</b> contient <b>un seul</b> verbe conjugué, donc une seule proposition : <i>Robinson construit un radeau.</i></li>
<li>La <b>phrase complexe</b> contient <b>plusieurs</b> verbes conjugués, donc plusieurs propositions : <i>Robinson construit un radeau, mais il ne peut pas le mettre à l’eau.</i></li>
</ul>
<div class="rule ph"><b>Méthode.</b> Soulignez les verbes conjugués et comptez-les : autant de verbes conjugués, autant de propositions. Un verbe à un temps composé compte pour un seul verbe : <i>il <u>a construit</u></i>. Un infinitif seul ne compte pas : <i>il veut <u>partir</u></i> reste une phrase simple.</div>
<div class="trap"><b>Attention.</b> Une phrase longue n’est pas forcément complexe : <i>Pendant toute la matinée, sous un soleil brûlant, Robinson a ramassé du bois sur la plage.</i> ne contient qu’un verbe conjugué.</div>`},
