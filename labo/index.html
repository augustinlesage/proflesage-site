  { id:'co-ph-c2', type:'cours', titre:'Relier les propositions',
    sub:'Juxtaposition, coordination, subordination.',
    html:`
<p class="lead">Dans une phrase complexe, les propositions peuvent être reliées de trois façons.</p>
<div class="tw"><table>
<tr><th>Relation</th><th>Ce qui relie</th><th>Exemple</th></tr>
<tr><td>Juxtaposition <span class="chip ph">4e</span></td><td style="font-weight:400">un signe de ponctuation (virgule, point-virgule, deux-points)</td><td style="font-weight:400"><i>Le vent souffle, la mer se déchaîne.</i></td></tr>
<tr><td>Coordination <span class="chip ph">4e</span></td><td style="font-weight:400">une conjonction de coordination : <i>mais, ou, et, or, ni, car</i></td><td style="font-weight:400"><i>Il a faim, mais il n’a rien à manger.</i></td></tr>
<tr><td>Subordination <span class="chip ph">4e</span> <span class="chip ph">3e</span></td><td style="font-weight:400">un mot subordonnant : <i>qui, que, quand, parce que, si…</i></td><td style="font-weight:400"><i>Il s’abrite parce qu’il pleut.</i></td></tr>
</table></div>
<h3>Indépendantes, principale, subordonnée</h3>
<ul>
<li>Juxtaposées ou coordonnées, les propositions sont <b>indépendantes</b> : chacune pourrait former une phrase seule. <i>Il a faim. Il n’a rien à manger.</i></li>
<li>Dans la subordination, la <b>subordonnée</b> ne peut pas exister seule : elle dépend de la <b>principale</b>. <i>Il s’abrite</i> (principale) <i>parce qu’il pleut</i> (subordonnée).</li>
</ul>
<div class="trap"><b>Attention à « donc ».</b> On apprend souvent la liste « mais, ou, et, donc, or, ni, car ». Mais <i>donc</i> n’est pas une conjonction de coordination : c’est un <b>adverbe</b>. La preuve : on peut dire <i>et donc</i>, et on peut le déplacer (<i>Il a révisé ; il a donc réussi</i>). Même chose pour <i>puis, ensuite, alors</i>.</div>
<div class="rule ph"><b>Pour écrire.</b> La juxtaposition donne un rythme rapide ; la coordination et la subordination expliquent le lien entre les idées (opposition, cause, conséquence…).</div>`},

        ['Il a révisé et il a donc réussi.','coordination','Les propositions sont coordonnées par <i>et</i> ; <i>donc</i> est un adverbe.'],
        ['Je connais l’homme qui a construit cette cabane.','subordination','<i>qui</i> introduit une proposition relative.'],

  { id:'co-ph-c3', type:'cours', titre:'Les propositions subordonnées',
    sub:'Relative, complétive, circonstancielle : reconnaître et nommer.',
    html:`
<p class="lead">Une proposition subordonnée commence par un <b>mot subordonnant</b> et dépend de la principale. Pour l’analyser, on la place entre crochets, puis on cherche sa nature.</p>
<h3>Trois subordonnées à connaître</h3>
<div class="tw"><table>
<tr><th>Nature</th><th>Introduite par</th><th>Rôle</th><th>Exemple</th></tr>
<tr><td>Relative <span class="chip ph">5e</span></td><td style="font-weight:400">un pronom relatif : <i>qui, que, dont, où</i></td><td style="font-weight:400">complète un nom (l’antécédent)</td><td style="font-weight:400"><i>la cabane [qu’il a construite]</i></td></tr>
<tr><td>Complétive <span class="chip ph">3e</span></td><td style="font-weight:400">la conjonction <i>que</i></td><td style="font-weight:400">le plus souvent COD du verbe</td><td style="font-weight:400"><i>Il pense [que l’île est déserte].</i></td></tr>
<tr><td>Circonstancielle <span class="chip ph">3e</span></td><td style="font-weight:400">une conjonction : <i>quand, lorsque, parce que, puisque, pour que, si, bien que…</i></td><td style="font-weight:400">complément circonstanciel de la phrase</td><td style="font-weight:400"><i>[Quand la nuit tombe], il allume un feu.</i></td></tr>
</table></div>
<p>La relative a été étudiée dans le module « Le groupe nominal » : c’est une expansion du nom.</p>
<h3>Les valeurs de la circonstancielle <span class="chip ph">3e</span></h3>
<div class="tw"><table>
<tr><th>Valeur</th><th>Mots subordonnants</th><th>Exemple</th></tr>
<tr><td>Temps</td><td style="font-weight:400"><i>quand, lorsque, pendant que, avant que, dès que</i></td><td style="font-weight:400"><i>Lorsque le jour se lève, il part pêcher.</i></td></tr>
<tr><td>Cause</td><td style="font-weight:400"><i>parce que, puisque, comme</i></td><td style="font-weight:400"><i>Il reste à l’abri parce qu’il pleut.</i></td></tr>
<tr><td>But</td><td style="font-weight:400"><i>pour que, afin que</i></td><td style="font-weight:400"><i>Il allume un feu pour qu’un navire le voie.</i></td></tr>
<tr><td>Conséquence</td><td style="font-weight:400"><i>si bien que, si… que</i></td><td style="font-weight:400"><i>Il pleut si fort qu’on ne voit rien.</i></td></tr>
<tr><td>Condition</td><td style="font-weight:400"><i>si</i></td><td style="font-weight:400"><i>S’il trouve du bois, il fera un radeau.</i></td></tr>
<tr><td>Opposition (concession)</td><td style="font-weight:400"><i>bien que, quoique</i></td><td style="font-weight:400"><i>Bien qu’il soit seul, il garde courage.</i></td></tr>
</table></div>
<div class="trap"><b>« que » : relatif ou conjonction ?</b> Regardez ce qu’il y a juste avant.
<br>Un <b>nom</b> que <i>que</i> reprend → pronom relatif : <i>la cabane [qu’il a construite]</i> (= il a construit la cabane).
<br>Un <b>verbe</b> → conjonction, complétive : <i>Il pense [que l’île est déserte].</i></div>`},

  { id:'co-ph-c4', type:'cours', titre:'Poser une question, rapporter une question',
    sub:'Interrogation totale ou partielle, directe ou indirecte.',
    html:`
<p class="lead">On peut poser une question directement (<i>Viens-tu ?</i>) ou la rapporter dans une autre phrase (<i>Il me demande si je viens.</i>).</p>
<h3>Interrogation totale, interrogation partielle <span class="chip ph">5e</span></h3>
<ul>
<li><b>Totale</b> : on répond par <i>oui</i> ou <i>non</i>. <i>As-tu vu le navire ?</i></li>
<li><b>Partielle</b> : la question porte sur un élément ; elle commence par un mot interrogatif (<i>qui, que, quoi, quel, où, quand, comment, pourquoi, combien</i>). <i>Où as-tu vu le navire ?</i></li>
</ul>
<h3>Trois façons de poser la question <span class="chip ph">5e</span></h3>
<div class="tw"><table>
<tr><th>Construction</th><th>Exemple</th><th>Niveau de langue</th></tr>
<tr><td>Intonation (point d’interrogation)</td><td style="font-weight:400"><i>Tu viens ?</i></td><td style="font-weight:400">familier ou courant, à l’oral</td></tr>
<tr><td><i>Est-ce que</i></td><td style="font-weight:400"><i>Est-ce que tu viens ?</i></td><td style="font-weight:400">courant</td></tr>
<tr><td>Inversion du sujet</td><td style="font-weight:400"><i>Viens-tu ?</i></td><td style="font-weight:400">soutenu, à l’écrit</td></tr>
</table></div>
<h3>L’interrogation indirecte <span class="chip ph">4e</span></h3>
<p>Quand on rapporte une question après un verbe comme <i>demander, se demander, savoir, ignorer</i>, elle devient une <b>subordonnée interrogative indirecte</b>.</p>
<div class="rule ph"><b>Ce qui change.</b>
<br>Plus de point d’interrogation, plus d’inversion, plus de <i>est-ce que</i>.
<br>Question totale → <i>si</i> : <i>Est-ce que tu viens ?</i> → <i>Il me demande si je viens.</i>
<br><i>Qu’est-ce que</i> → <i>ce que</i> : <i>Qu’est-ce que tu cherches ?</i> → <i>Il me demande ce que je cherche.</i>
<br>Les autres mots interrogatifs restent : <i>Où vas-tu ?</i> → <i>Il me demande où je vais.</i></div>
<p>Si le verbe introducteur est au passé, les temps changent : <i>Il me demanda si je venais.</i> (présent → imparfait).</p>
<div class="trap"><b>Erreurs fréquentes.</b> <i>*Il me demande qu’est-ce que je cherche</i> → <i>ce que je cherche</i>. <i>*Il me demande où vas-tu</i> → <i>où je vais</i>.</div>`},

  { id:'co-ph-c5', type:'cours', titre:'Bien ponctuer ses phrases',
    sub:'Les signes de ponctuation et la virgule.',
    html:`
<p class="lead">La ponctuation aide le lecteur à comprendre comment la phrase est construite. Une virgule mal placée peut couper ce qui va ensemble.</p>
<h3>Les signes de ponctuation <span class="chip ph">5e</span></h3>
<div class="tw"><table>
<tr><th>Signe</th><th>À quoi il sert</th><th>Exemple</th></tr>
<tr><td>Point <b>.</b> <b>?</b> <b>!</b></td><td style="font-weight:400">terminer la phrase</td><td style="font-weight:400"><i>Il part. Part-il ? Pars !</i></td></tr>
<tr><td>Virgule <b>,</b></td><td style="font-weight:400">séparer des éléments, détacher un complément</td><td style="font-weight:400"><i>Le soir, il pêche.</i></td></tr>
<tr><td>Point-virgule <b>;</b></td><td style="font-weight:400">séparer deux propositions liées par le sens</td><td style="font-weight:400"><i>Le vent tombe ; la mer se calme.</i></td></tr>
<tr><td>Deux-points <b>:</b></td><td style="font-weight:400">annoncer une explication, une liste, des paroles</td><td style="font-weight:400"><i>Il a tout perdu : son navire, ses amis.</i></td></tr>
<tr><td>Guillemets et tirets</td><td style="font-weight:400">encadrer des paroles ; signaler, dans un dialogue, que la personne qui parle change</td><td style="font-weight:400"><i>— Qui es-tu ? — Vendredi.</i></td></tr>
</table></div>
<h3>La virgule <span class="chip ph">4e</span> <span class="chip ph">3e</span></h3>
<div class="rule ph"><b>Règle d’or.</b> On ne met <b>jamais</b> de virgule entre le sujet et le verbe, ni entre le verbe et son COD.
<br><i>*Le jeune marin, regarde la mer.</i> → <i>Le jeune marin regarde la mer.</i></div>
<p>On met une virgule :</p>
<ul>
<li>dans une énumération, sauf devant le dernier <i>et</i> : <i>Il ramasse du bois, des coquillages et des fruits.</i></li>
<li>après un complément circonstanciel placé en tête : <i>Le lendemain, il explora l’île.</i></li>
<li>devant <i>mais</i> et <i>car</i> : <i>Il est fatigué, mais il continue.</i></li>
<li>autour d’une apposition ou d’une apostrophe : <i>Vendredi, son compagnon, l’aide. Robinson, viens !</i></li>
</ul>`},

  { titre:'Module 1 · Le nom et les articles', court:'Nom et articles', cls:'gn', steps:[

  { id:'fle-n-c1', type:'cours', titre:'Masculin, féminin, articles',
    sub:'Chaque nom a un genre : on l’apprend avec son article.',
    html:`
<p class="lead">En français, chaque nom est <b>masculin</b> ou <b>féminin</b>, même pour les objets : <i>le livre</i> (masculin), <i>la table</i> (féminin). Apprenez toujours un nom <b>avec son article</b>.</p>
<h3>Les articles <span class="chip gn">A1</span></h3>
<div class="tw"><table>
<tr><th></th><th>Masculin</th><th>Féminin</th><th>Pluriel</th></tr>
<tr><td>Article défini (une chose précise, connue)</td><td style="font-weight:400">le livre, l’arbre</td><td style="font-weight:400">la table, l’école</td><td style="font-weight:400">les livres, les écoles</td></tr>
<tr><td>Article indéfini (une chose quelconque)</td><td style="font-weight:400">un livre</td><td style="font-weight:400">une table</td><td style="font-weight:400">des livres</td></tr>
<tr><td>Article partitif (une quantité qu’on ne compte pas)</td><td style="font-weight:400">du pain, de l’eau</td><td style="font-weight:400">de la soupe, de l’eau</td><td style="font-weight:400">—</td></tr>
</table></div>
<p><i>le</i> et <i>la</i> deviennent <b>l’</b> devant une voyelle ou un <i>h</i> muet : <i>l’ami, l’école, l’heure</i>.</p>
<div class="obs"><span class="lbl">Exemples</span><i>J’ai <b>un</b> chat. <b>Le</b> chat de Sami est noir. Je bois <b>du</b> lait et <b>de l’</b>eau.</i></div>
<h3>Les articles contractés <span class="chip gn">A1</span></h3>
<div class="rule gn"><i>à + le = <b>au</b></i> (je vais au marché) · <i>à + les = <b>aux</b></i> · <i>de + le = <b>du</b></i> (je viens du stade) · <i>de + les = <b>des</b></i>. Mais <i>à la, à l’, de la, de l’</i> ne changent pas.</div>
<h3>Le pluriel <span class="chip gn">A1</span></h3>
<p>À l’écrit, on ajoute en général <b>-s</b> : <i>un stylo → des stylos</i>. À l’oral, on n’entend pas le <i>-s</i> : c’est l’article (<i>le / les</i>) qui indique le pluriel. Quelques pluriels en <i>-x</i> : <i>un bateau → des bateaux ; un cheval → des chevaux</i>.</p>
<h3>Les déterminants possessifs et démonstratifs <span class="chip gn">A1</span> <span class="chip gn">A2</span></h3>
<div class="tw"><table>
<tr><th>Possesseur</th><th>Masculin</th><th>Féminin</th><th>Pluriel</th></tr>
<tr><td>je</td><td style="font-weight:400">mon frère</td><td style="font-weight:400">ma sœur</td><td style="font-weight:400">mes parents</td></tr>
<tr><td>tu</td><td style="font-weight:400">ton frère</td><td style="font-weight:400">ta sœur</td><td style="font-weight:400">tes parents</td></tr>
<tr><td>il, elle</td><td style="font-weight:400">son frère</td><td style="font-weight:400">sa sœur</td><td style="font-weight:400">ses parents</td></tr>
<tr><td>nous / vous / ils</td><td style="font-weight:400" colspan="2">notre / votre / leur</td><td style="font-weight:400">nos / vos / leurs</td></tr>
</table></div>
<div class="trap"><b>Attention.</b> Devant un nom féminin qui commence par une voyelle, on dit <i>mon, ton, son</i> : <i>mon amie, son école</i>. Et <i>son / sa</i> s’accorde avec la chose possédée, pas avec le possesseur : <i>Paul aime <b>sa</b> mère ; Léa aime <b>son</b> père.</i></div>
<p>Démonstratifs : <i>ce livre, cet ami</i> (masculin devant une voyelle), <i>cette table, ces enfants</i>.</p>`},

  { id:'fle-n-c2', type:'cours', titre:'L’adjectif : accord et place',
    sub:'L’adjectif s’accorde avec le nom et se place le plus souvent après lui.',
    html:`
<h3>L’accord <span class="chip gn">A1</span></h3>
<p>L’adjectif prend le genre et le nombre du nom : <i>un petit garçon, une petite fille, des petits garçons, des petites filles</i>.</p>
<div class="tw"><table>
<tr><th>Masculin</th><th>Féminin</th></tr>
<tr><td>grand, petit, content</td><td style="font-weight:400">grande, petite, contente (on entend la consonne finale)</td></tr>
<tr><td>jeune, rouge, facile</td><td style="font-weight:400">jeune, rouge, facile (déjà en -e)</td></tr>
<tr><td>heureux, sportif, gentil</td><td style="font-weight:400">heureuse, sportive, gentille</td></tr>
<tr><td>beau, nouveau, vieux, blanc</td><td style="font-weight:400">belle, nouvelle, vieille, blanche</td></tr>
</table></div>
<h3>La place <span class="chip gn">A1</span> <span class="chip gn">A2</span></h3>
<ul>
<li>En général, l’adjectif se place <b>après</b> le nom : <i>un pull rouge, une table ronde, un livre intéressant</i>. Les couleurs et les nationalités sont toujours après : <i>une voiture française</i>.</li>
<li>Quelques adjectifs courts et fréquents se placent <b>avant</b> : <i>grand, petit, bon, mauvais, beau, joli, jeune, vieux, nouveau</i>. <i>Une petite maison, un bon repas.</i></li>
</ul>
<div class="rule gn"><i>beau, nouveau, vieux</i> deviennent <b>bel, nouvel, vieil</b> devant un nom masculin qui commence par une voyelle : <i>un bel arbre, un nouvel ami, un vieil homme</i>.</div>`},

  { titre:'Module 2 · Le présent et la négation', court:'Présent', cls:'gv', steps:[

  { id:'fle-p-c1', type:'cours', titre:'Les pronoms sujets et le présent',
    sub:'Être, avoir, aller, faire, et les verbes en -er.',
    html:`
<h3>Les pronoms sujets <span class="chip gv">A1</span></h3>
<div class="tw"><table>
<tr><th>Singulier</th><th>Pluriel</th></tr>
<tr><td>je (j’ devant une voyelle)</td><td style="font-weight:400">nous</td></tr>
<tr><td>tu</td><td style="font-weight:400">vous</td></tr>
<tr><td>il, elle, on</td><td style="font-weight:400">ils, elles</td></tr>
</table></div>
<div class="rule gv"><b>tu ou vous ?</b> On dit <b>tu</b> à un ami, à un enfant, à quelqu’un de sa famille. On dit <b>vous</b> à un adulte qu’on ne connaît pas bien, au professeur, ou à plusieurs personnes. <b>on</b> veut souvent dire <i>nous</i> à l’oral : <i>On va au parc</i> ; le verbe se conjugue comme avec <i>il</i>.</div>
<h3>Quatre verbes essentiels <span class="chip gv">A1</span></h3>
<div class="tw"><table>
<tr><th></th><th>être</th><th>avoir</th><th>aller</th><th>faire</th></tr>
<tr><td>je / j’</td><td style="font-weight:400">suis</td><td style="font-weight:400">ai</td><td style="font-weight:400">vais</td><td style="font-weight:400">fais</td></tr>
<tr><td>tu</td><td style="font-weight:400">es</td><td style="font-weight:400">as</td><td style="font-weight:400">vas</td><td style="font-weight:400">fais</td></tr>
<tr><td>il, elle, on</td><td style="font-weight:400">est</td><td style="font-weight:400">a</td><td style="font-weight:400">va</td><td style="font-weight:400">fait</td></tr>
<tr><td>nous</td><td style="font-weight:400">sommes</td><td style="font-weight:400">avons</td><td style="font-weight:400">allons</td><td style="font-weight:400">faisons</td></tr>
<tr><td>vous</td><td style="font-weight:400">êtes</td><td style="font-weight:400">avez</td><td style="font-weight:400">allez</td><td style="font-weight:400">faites</td></tr>
<tr><td>ils, elles</td><td style="font-weight:400">sont</td><td style="font-weight:400">ont</td><td style="font-weight:400">vont</td><td style="font-weight:400">font</td></tr>
</table></div>
<div class="trap"><b>Attention à l’âge.</b> En français, on utilise <b>avoir</b> : <i>J’<b>ai</b> douze ans.</i> (et non <i>*je suis douze ans</i>). Même chose pour <i>avoir faim, avoir soif, avoir froid, avoir peur</i>.</div>
<h3>Les verbes en -er <span class="chip gv">A1</span></h3>
<p>On enlève <i>-er</i> et on ajoute : <b>-e, -es, -e, -ons, -ez, -ent</b>. <i>parler : je parle, tu parles, il parle, nous parlons, vous parlez, ils parlent</i>.</p>
<p>À l’oral, <i>parle, parles, parlent</i> se prononcent de la même façon : le <i>-ent</i> ne se prononce pas.</p>
<h3>Quelques verbes utiles <span class="chip gv">A2</span></h3>
<ul>
<li><i>venir</i> : je viens, tu viens, il vient, nous venons, vous venez, ils viennent</li>
<li><i>prendre</i> : je prends, tu prends, il prend, nous prenons, vous prenez, ils prennent</li>
<li><i>pouvoir</i> : je peux, tu peux, il peut, nous pouvons, vous pouvez, ils peuvent</li>
<li><i>vouloir</i> : je veux, tu veux, il veut, nous voulons, vous voulez, ils veulent</li>
<li><i>finir</i> : je finis, tu finis, il finit, nous finissons, vous finissez, ils finissent</li>
</ul>
<h3>Il y a <span class="chip gv">A1</span></h3>
<p><i>Il y a</i> sert à dire qu’une chose existe : <i>Il y a un tableau dans la classe. Il y a des élèves dans la cour.</i> Il ne change pas au pluriel.</p>`},

  { id:'fle-p-c2', type:'cours', titre:'La négation',
    sub:'ne… pas, et les autres négations.',
    html:`
<h3>ne… pas <span class="chip gv">A1</span></h3>
<p><b>ne</b> se place avant le verbe, <b>pas</b> après : <i>Je <b>ne</b> parle <b>pas</b> anglais.</i> Devant une voyelle, <i>ne</i> devient <b>n’</b> : <i>Il <b>n’</b>aime <b>pas</b> le lait.</i></p>
<div class="trap"><b>À l’oral</b>, on entend souvent <i>Je parle pas</i>, sans <i>ne</i>. À l’écrit et à l’école, il faut écrire <i>ne</i>.</div>
<h3>pas de <span class="chip gv">A1</span></h3>
<div class="rule gv">Après la négation, <i>un, une, des, du, de la</i> deviennent <b>de</b> (ou <b>d’</b>) : <i>J’ai <b>un</b> chien → Je n’ai pas <b>de</b> chien. Je mange <b>du</b> pain → Je ne mange pas <b>de</b> pain. Il a <b>des</b> amis → Il n’a pas <b>d’</b>amis.</i> Mais avec <i>être</i>, on garde l’article : <i>Ce n’est pas un chien.</i></div>
<h3>Les autres négations <span class="chip gv">A2</span></h3>
<div class="tw"><table>
<tr><th>Négation</th><th>Sens</th><th>Exemple</th></tr>
<tr><td>ne… jamais</td><td style="font-weight:400">à aucun moment</td><td style="font-weight:400"><i>Il ne mange jamais de viande.</i></td></tr>
<tr><td>ne… plus</td><td style="font-weight:400">ce n’est plus vrai maintenant</td><td style="font-weight:400"><i>Je n’habite plus au Maroc.</i></td></tr>
<tr><td>ne… rien</td><td style="font-weight:400">aucune chose</td><td style="font-weight:400"><i>Je ne comprends rien.</i></td></tr>
<tr><td>ne… personne</td><td style="font-weight:400">aucune personne</td><td style="font-weight:400"><i>Je ne connais personne.</i></td></tr>
</table></div>
<h3>Répondre oui, non, si <span class="chip gv">A1</span></h3>
<p>À une question <b>négative</b>, on répond <b>si</b> pour dire « oui » : <i>— Tu ne viens pas ? — <b>Si</b>, je viens !</i></p>`},

  { titre:'Module 3 · Poser des questions', court:'Questions', cls:'ph', steps:[

  { id:'fle-q-c1', type:'cours', titre:'Les questions',
    sub:'Trois façons de poser une question, et les mots interrogatifs.',
    html:`
<h3>Trois façons de demander <span class="chip ph">A1</span> <span class="chip ph">A2</span></h3>
<div class="tw"><table>
<tr><th>Façon</th><th>Exemple</th><th>Quand ?</th></tr>
<tr><td>Intonation (la voix monte)</td><td style="font-weight:400"><i>Tu viens ?</i></td><td style="font-weight:400">à l’oral, avec des proches</td></tr>
<tr><td>Est-ce que</td><td style="font-weight:400"><i>Est-ce que tu viens ?</i></td><td style="font-weight:400">à l’oral et à l’écrit, partout</td></tr>
<tr><td>Inversion du sujet</td><td style="font-weight:400"><i>Viens-tu ?</i></td><td style="font-weight:400">à l’écrit, langue soignée</td></tr>
</table></div>
<h3>Les mots interrogatifs <span class="chip ph">A1</span></h3>
<div class="tw"><table>
<tr><th>Mot</th><th>On demande…</th><th>Exemple</th></tr>
<tr><td>qui</td><td style="font-weight:400">une personne</td><td style="font-weight:400"><i>Qui est-ce ?</i></td></tr>
<tr><td>que / qu’est-ce que / quoi</td><td style="font-weight:400">une chose</td><td style="font-weight:400"><i>Qu’est-ce que tu fais ? Tu fais quoi ?</i></td></tr>
<tr><td>où</td><td style="font-weight:400">le lieu</td><td style="font-weight:400"><i>Où habites-tu ?</i></td></tr>
<tr><td>quand</td><td style="font-weight:400">le moment</td><td style="font-weight:400"><i>Quand est-ce que tu pars ?</i></td></tr>
<tr><td>comment</td><td style="font-weight:400">la manière</td><td style="font-weight:400"><i>Comment tu t’appelles ?</i></td></tr>
<tr><td>pourquoi</td><td style="font-weight:400">la cause (réponse : <i>parce que…</i>)</td><td style="font-weight:400"><i>Pourquoi es-tu en retard ?</i></td></tr>
<tr><td>combien</td><td style="font-weight:400">la quantité, le prix</td><td style="font-weight:400"><i>Combien ça coûte ?</i></td></tr>
<tr><td>quel, quelle, quels, quelles</td><td style="font-weight:400">un choix, une précision (accord avec le nom)</td><td style="font-weight:400"><i>Quel âge as-tu ? Quelle heure est-il ?</i></td></tr>
</table></div>
<div class="trap"><b>À l’oral</b>, on place souvent le mot interrogatif à la fin : <i>Tu habites où ?</i> C’est correct à l’oral familier ; à l’écrit, on préfère <i>Où habites-tu ?</i> ou <i>Où est-ce que tu habites ?</i></div>`},

  { titre:'Module 4 · Le passé et le futur', court:'Passé et futur', cls:'gv', steps:[

  { id:'fle-t-c1', type:'cours', titre:'Le passé composé',
    sub:'Raconter ce qu’on a fait.',
    html:`
<p class="lead">Le passé composé sert à raconter une action terminée : <i>Hier, j’<b>ai mangé</b> au restaurant.</i></p>
<h3>La formation <span class="chip gv">A1</span> <span class="chip gv">A2</span></h3>
<p><b>auxiliaire avoir ou être au présent + participe passé</b>. La plupart des verbes se conjuguent avec <b>avoir</b> : <i>j’ai parlé, tu as fini, il a pris</i>.</p>
<h3>Le participe passé</h3>
<div class="tw"><table>
<tr><th>Verbes</th><th>Participe</th><th>Exemples</th></tr>
<tr><td>en -er</td><td style="font-weight:400">-é</td><td style="font-weight:400"><i>parler → parlé ; aller → allé</i></td></tr>
<tr><td>en -ir (finir)</td><td style="font-weight:400">-i</td><td style="font-weight:400"><i>finir → fini ; partir → parti</i></td></tr>
<tr><td>irréguliers à apprendre</td><td style="font-weight:400"></td><td style="font-weight:400"><i>être → été ; avoir → eu ; faire → fait ; prendre → pris ; mettre → mis ; voir → vu ; lire → lu ; boire → bu ; venir → venu ; écrire → écrit ; dire → dit</i></td></tr>
</table></div>
<h3>Les verbes avec être <span class="chip gv">A2</span></h3>
<div class="rule gv">Se conjuguent avec <b>être</b> : surtout des verbes de mouvement ou de changement d’état : <i>aller, venir, arriver, partir, entrer, sortir, monter, descendre, tomber, rester, naître, mourir, revenir, devenir, passer (par)</i>, et tous les <b>verbes pronominaux</b> (<i>se lever, s’habiller</i>). Avec <i>être</i>, le participe passé <b>s’accorde avec le sujet</b> : <i>Elle est parti<b>e</b>. Ils sont arrivé<b>s</b>. Nous nous sommes levé<b>s</b>.</i></div>
<h3>La négation</h3>
<p><i>ne… pas</i> encadre l’auxiliaire : <i>Je <b>n’</b>ai <b>pas</b> mangé. Elle <b>n’</b>est <b>pas</b> venue.</i></p>`},

  { id:'fle-t-c2', type:'cours', titre:'L’imparfait, le futur proche et le futur',
    sub:'Décrire le passé, parler de l’avenir.',
    html:`
<h3>L’imparfait <span class="chip gv">A2</span></h3>
<p>On prend le radical de <i>nous</i> au présent et on ajoute <b>-ais, -ais, -ait, -ions, -iez, -aient</b> : <i>nous parlons → je parlais ; nous finissons → je finissais ; nous faisons → je faisais</i>. Seul <i>être</i> est irrégulier : <i>j’étais</i>.</p>
<h3>Passé composé ou imparfait ? <span class="chip gv">A2</span> <span class="chip gv">B1</span></h3>
<div class="tw"><table>
<tr><th>Imparfait</th><th>Passé composé</th></tr>
<tr><td style="font-weight:400">description, décor : <i>Il faisait beau. J’étais fatigué.</i></td><td style="font-weight:400">une action terminée : <i>Je suis sorti.</i></td></tr>
<tr><td style="font-weight:400">une habitude : <i>Avant, je jouais au cricket tous les jours.</i></td><td style="font-weight:400">une action unique : <i>Hier, j’ai joué au cricket.</i></td></tr>
<tr><td style="font-weight:400">une action en cours : <i>Je dormais…</i></td><td style="font-weight:400">… qui est interrompue : <i>… quand le téléphone a sonné.</i></td></tr>
</table></div>
<h3>Le futur proche et le passé récent <span class="chip gv">A1</span></h3>
<ul>
<li><b>aller au présent + infinitif</b> = une action bientôt : <i>Je <b>vais manger</b>. Il <b>va pleuvoir</b>.</i></li>
<li><b>venir de au présent + infinitif</b> = une action qui vient de se passer : <i>Je <b>viens de manger</b>.</i></li>
</ul>
<h3>Le futur simple <span class="chip gv">A2</span> <span class="chip gv">B1</span></h3>
<p>On ajoute <b>-ai, -as, -a, -ons, -ez, -ont</b> à l’infinitif : <i>parler → je parlerai ; finir → tu finiras</i> (<i>prendre → je prendrai</i> : on enlève le <i>e</i> final). Radicaux irréguliers : <i>être → je serai ; avoir → j’aurai ; aller → j’irai ; faire → je ferai ; venir → je viendrai ; pouvoir → je pourrai ; voir → je verrai</i>.</p>`},

  { titre:'Module 5 · Pronoms et prépositions', court:'Pronoms, lieux', cls:'gn', steps:[

  { id:'fle-pr-c1', type:'cours', titre:'Les pronoms compléments ; lieux et temps',
    sub:'Remplacer un nom ; dire où et quand.',
    html:`
<h3>Les pronoms compléments <span class="chip gn">A2</span></h3>
<div class="tw"><table>
<tr><th>Pronom</th><th>Il remplace…</th><th>Exemple</th></tr>
<tr><td>le, la, l’, les</td><td style="font-weight:400">un complément sans préposition (une personne ou une chose)</td><td style="font-weight:400"><i>Je regarde <b>le film</b> → Je <b>le</b> regarde.</i></td></tr>
<tr><td>lui, leur</td><td style="font-weight:400">à + une personne</td><td style="font-weight:400"><i>Je parle <b>à Sami</b> → Je <b>lui</b> parle.</i></td></tr>
<tr><td>y</td><td style="font-weight:400">un lieu (à, dans, en…)</td><td style="font-weight:400"><i>Je vais <b>à Paris</b> → J’<b>y</b> vais.</i></td></tr>
<tr><td>en</td><td style="font-weight:400">de + une chose ; une quantité</td><td style="font-weight:400"><i>Je mange <b>des pommes</b> → J’<b>en</b> mange.</i></td></tr>
</table></div>
<div class="rule gn"><b>La place.</b> Le pronom complément se place <b>avant</b> le verbe conjugué : <i>Je <b>le</b> regarde. Je ne <b>le</b> regarde pas.</i> Avec un infinitif, il se place devant l’infinitif : <i>Je vais <b>le</b> regarder.</i> À l’impératif affirmatif, il se place après, avec un trait d’union : <i>Regarde-<b>le</b> !</i></div>
<h3>Les prépositions de lieu <span class="chip gn">A1</span> <span class="chip gn">A2</span></h3>
<div class="tw"><table>
<tr><th>Avec…</th><th>Préposition</th><th>Exemple</th></tr>
<tr><td>une ville</td><td style="font-weight:400">à</td><td style="font-weight:400"><i>J’habite à Orléans, à Kiev.</i></td></tr>
<tr><td>un pays féminin (souvent en -e)</td><td style="font-weight:400">en</td><td style="font-weight:400"><i>en France, en Ukraine, en Algérie</i></td></tr>
<tr><td>un pays masculin</td><td style="font-weight:400">au</td><td style="font-weight:400"><i>au Maroc, au Portugal, au Sénégal</i></td></tr>

    sub:'Pour suivre en classe dans toutes les disciplines (FLS).',
    html:`
<p class="lead">À l’école, beaucoup de phrases sont des <b>consignes</b>. Elles sont souvent à l’<b>impératif</b> (avec <i>vous</i>) ou à l’<b>infinitif</b>.</p>
<h3>Les verbes des consignes <span class="chip fm">A1</span> <span class="chip fm">A2</span></h3>
<div class="tw"><table>
<tr><th>Consigne</th><th>Ce qu’il faut faire</th></tr>
<tr><td>Lisez / Lire</td><td style="font-weight:400">lire le texte</td></tr>
<tr><td>Soulignez</td><td style="font-weight:400">tirer un trait sous les mots</td></tr>
<tr><td>Entourez</td><td style="font-weight:400">faire un cercle autour des mots</td></tr>
<tr><td>Cochez</td><td style="font-weight:400">mettre une croix dans la case ☐ → ☒</td></tr>
<tr><td>Complétez</td><td style="font-weight:400">écrire ce qui manque</td></tr>
<tr><td>Reliez</td><td style="font-weight:400">tracer un trait entre deux éléments</td></tr>
<tr><td>Recopiez</td><td style="font-weight:400">écrire la même chose dans son cahier</td></tr>
<tr><td>Classez</td><td style="font-weight:400">ranger dans des groupes</td></tr>
<tr><td>Justifiez</td><td style="font-weight:400">expliquer pourquoi, avec <i>parce que</i></td></tr>
</table></div>
<h3>L’impératif <span class="chip fm">A1</span></h3>
<p>Il donne un ordre, sans sujet : <i>Écoute ! Écoutez ! Écoutons !</i> Pour les verbes en <i>-er</i>, pas de <i>-s</i> avec <i>tu</i> : <i>Ouvre ton livre.</i> Négation : <i>Ne parlez pas.</i></p>
<h3>Relier ses idées <span class="chip fm">A2</span> <span class="chip fm">B1</span></h3>
<div class="tw"><table>
<tr><th>Pour…</th><th>Mots</th><th>Exemple</th></tr>
<tr><td>ajouter</td><td style="font-weight:400">et, aussi</td><td style="font-weight:400"><i>J’aime lire et dessiner.</i></td></tr>
<tr><td>ordonner</td><td style="font-weight:400">d’abord, ensuite, puis, enfin</td><td style="font-weight:400"><i>D’abord, je lis ; ensuite, je réponds.</i></td></tr>
<tr><td>opposer</td><td style="font-weight:400">mais</td><td style="font-weight:400"><i>C’est difficile, mais j’essaie.</i></td></tr>
<tr><td>donner la cause</td><td style="font-weight:400">parce que, car</td><td style="font-weight:400"><i>Je suis absent parce que je suis malade.</i></td></tr>
<tr><td>donner la conséquence</td><td style="font-weight:400">donc, alors</td><td style="font-weight:400"><i>Il pleut, donc je prends un parapluie.</i></td></tr>
<tr><td>exprimer le but</td><td style="font-weight:400">pour + infinitif</td><td style="font-weight:400"><i>Je révise pour réussir.</i></td></tr>
</table></div>
<div class="rule fm"><b>Demander de l’aide en classe.</b> <i>Je n’ai pas compris. Pouvez-vous répéter, s’il vous plaît ? Comment dit-on… en français ? Qu’est-ce que ça veut dire ?</i></div>`},

<section><h2>Les manipulations</h2>
<p class="memo-lead">Pour analyser un mot ou un groupe, on le <b>transforme</b> et on observe ce qui se passe.</p>
<div class="tw"><table>
<tr><th>Manipulation</th><th>Pour repérer</th><th>Exemple</th><th>Après la manipulation</th></tr>
<tr><td>Supprimer</td><td>un complément <b>facultatif</b> (épithète, complément circonstanciel)</td><td><i class="ct">Le chat <em class="fx">noir</em> dort <em class="fx">au soleil</em>.</i></td><td><i class="ct">Le chat dort.</i></td></tr>

<tr><td>Questionner</td><td>« <b>qui est-ce qui ?</b> » (sujet), « <b>qu’est-ce que ?</b> » (COD), « <b>à qui ? de quoi ?</b> » (COI) ; éviter « quoi ? »</td><td><i class="ct">Julie regarde <em class="fx">la mer</em>.</i></td><td><i class="ct"><em class="fx">Qu’est-ce que</em> Julie regarde ? → <em class="fx">la mer</em></i></td></tr>
</table></div></section>

<section><h2>Les natures des mots</h2>
<div class="tw"><table>
<tr><th>Nature</th><th>Comment la reconnaître</th><th>Exemple</th></tr>
<tr><td>Nom</td><td>désigne <b>un être, un objet, une action, une idée</b></td><td><i class="ct">un <em class="fx">chat</em>, la <em class="fx">peur</em>, <em class="fx">Paris</em></i></td></tr>

<tr><td>Adjectif</td><td><b>précise le nom</b> et s’accorde avec lui</td><td><i class="ct">une robe <em class="fx">rouge</em></i></td></tr>
<tr><td>Pronom</td><td><b>remplace</b> un nom ou un groupe nominal</td><td><i class="ct">Léa chante → <em class="fx">elle</em> chante</i></td></tr>

<p class="memo-note">Mots <b>variables</b> : nom, déterminant, adjectif, pronom, verbe. Mots <b>invariables</b> : adverbe, préposition, conjonction, interjection.</p></section>

<section><h2>Les fonctions dans le groupe nominal</h2>
<p class="memo-lead">Ces compléments se <b>suppriment</b> : la phrase reste correcte.</p>
<div class="tw"><table>
<tr><th>Fonction</th><th>Comment la reconnaître</th><th>Exemple</th><th>Sans le complément</th></tr>

<section><h2>Les fonctions autour du verbe</h2>
<div class="tw"><table>
<tr><th>Fonction</th><th>Manipulation</th><th>Exemple</th><th>Après la manipulation</th></tr>
<tr><td>Sujet</td><td>encadrer par <b>c’est… qui</b></td><td><i class="ct">Le soleil brille.</i></td><td><i class="ct"><em class="fx">C’est</em> le soleil <em class="fx">qui</em> brille.</i></td></tr>

<tr><td>COI</td><td>remplacer par <b>lui, leur, en, y</b></td><td><i class="ct">Je parle <em class="fx">à Léo</em>.</i></td><td><i class="ct">Je <em class="fx">lui</em> parle.</i></td></tr>
<tr><td>Attribut du sujet</td><td>après un <b>verbe d’état</b> ; on ne peut <b>pas le supprimer</b></td><td><i class="ct">Le ciel est <em class="fx">gris</em>.</i></td><td><span class="err">*Le ciel est.</span></td></tr>

<p class="memo-note">L’astérisque <span class="err">*</span> signale une phrase incorrecte.</p></section>

<section><h2>Le participe passé</h2>

<tr><td>Employé seul</td><td>s’accorde comme <b>un adjectif</b></td><td><i class="ct">des fleurs fan<em class="fx">ées</em></i></td></tr>
<tr><td>Avec être</td><td>s’accorde avec <b>le sujet</b></td><td><i class="ct">Elles sont part<em class="fx">ies</em>.</i></td></tr>
<tr><td>Avec avoir</td><td><b>pas d’accord</b> avec le sujet</td><td><i class="ct">Elles ont mang<em class="fx">é</em>.</i></td></tr>
<tr><td>Avec avoir, COD placé avant</td><td>s’accorde avec <b>le COD</b></td><td><i class="ct">Les pommes <em class="fx">que</em> j’ai mang<em class="fx">ées</em>.</i></td></tr>
<tr><td>Verbe pronominal</td><td>s’accorde en général avec <b>le sujet</b></td><td><i class="ct">Elles se sont lev<em class="fx">ées</em>.</i></td></tr>
<tr><td>Verbe pronominal, COD placé après</td><td><b>pas d’accord</b></td><td><i class="ct">Elles se sont lav<em class="fx">é</em> les mains.</i></td></tr>
</table></div>
<p class="memo-lead"><b>Toujours invariables</b> :</p>
<div class="tw tw-petit"><table>
<tr><th>Cas</th><th>Exemple</th></tr>
<tr><td><i class="ct">fait</i> + infinitif</td><td><i class="ct">Elles se sont <em class="fx">fait</em> gronder.</i></td></tr>
<tr><td>participe précédé de <i class="ct">en</i></td><td><i class="ct">Des pommes, j’<em class="fx">en</em> ai <em class="fx">mangé</em>.</i></td></tr>
<tr><td>verbe impersonnel</td><td><i class="ct">les orages qu’il y a <em class="fx">eu</em></i></td></tr>
<tr><td>complément de durée, de prix, de poids</td><td><i class="ct">les trois heures que j’ai <em class="fx">dormi</em> ; les dix euros que ce livre a <em class="fx">couté</em></i></td></tr>
<tr><td>pronom neutre <i class="ct">le</i> (= cela)</td><td><i class="ct">Elle est plus grande que je ne <em class="fx">l’</em>avais <em class="fx">pensé</em>.</i></td></tr>
</table></div></section>

<section><h2>La concordance des temps</h2>
<p class="memo-lead">Quand le verbe principal passe au <b>passé</b>, le verbe de la subordonnée change aussi.</p>
<div class="tw"><table>
<tr><th>Rapport</th><th>Système du présent</th><th>Système du passé</th></tr>
<tr><td>Simultanéité</td><td><b>présent</b><br><i class="ct">Je sais qu’il <em class="fx">vient</em>.</i></td><td><b>imparfait</b><br><i class="ct">Je savais qu’il <em class="fx">venait</em>.</i></td></tr>
<tr><td>Antériorité</td><td><b>passé composé</b><br><i class="ct">Je sais qu’il <em class="fx">est venu</em>.</i></td><td><b>plus-que-parfait</b><br><i class="ct">Je savais qu’il <em class="fx">était venu</em>.</i></td></tr>
<tr><td>Antériorité immédiate</td><td><b>passé composé</b><br><i class="ct">Il sort dès qu’il <em class="fx">a fini</em>.</i></td><td><b>passé antérieur</b><br><i class="ct">Il sortit dès qu’il <em class="fx">eut fini</em>.</i></td></tr>
<tr><td>Postériorité</td><td><b>futur</b><br><i class="ct">Je sais qu’il <em class="fx">viendra</em>.</i></td><td><b>conditionnel présent</b><br><i class="ct">Je savais qu’il <em class="fx">viendrait</em>.</i></td></tr>
<tr><td>Antériorité à un futur</td><td><b>futur antérieur</b><br><i class="ct">Je sais qu’il <em class="fx">sera parti</em>.</i></td><td><b>conditionnel passé</b><br><i class="ct">Je savais qu’il <em class="fx">serait parti</em>.</i></td></tr>
<tr><td>Habitude</td><td><b>présent</b><br><i class="ct">Il dit qu’il <em class="fx">se lève</em> tôt chaque matin.</i></td><td><b>imparfait itératif</b><br><i class="ct">Il disait qu’il <em class="fx">se levait</em> tôt chaque matin.</i></td></tr>
</table></div>
<p class="memo-note">Les indications de temps changent aussi : <i class="ct"><em class="fx">aujourd’hui</em> → <em class="fx">ce jour-là</em> ; <em class="fx">hier</em> → <em class="fx">la veille</em> ; <em class="fx">demain</em> → <em class="fx">le lendemain</em> ; <em class="fx">ici</em> → <em class="fx">là</em></i>.</p></section>

<section><h2>Les accords difficiles</h2>
<div class="tw"><table>
<tr><th>Cas</th><th>Règle</th><th>Exemple</th></tr>
<tr><td>Couleur exprimée par un adjectif</td><td><b>s’accorde</b></td><td><i class="ct">des robes vert<em class="fx">es</em></i></td></tr>
<tr><td>Couleur exprimée par un nom</td><td><b>invariable</b> (sauf <i class="ct">rose, mauve, fauve</i>)</td><td><i class="ct">des robes <em class="fx">marron</em></i></td></tr>
<tr><td>Couleur composée</td><td><b>invariable</b></td><td><i class="ct">des yeux <em class="fx">bleu clair</em></i></td></tr>
<tr><td>vingt, cent</td><td>prennent un <b>s</b> s’ils sont multipliés et à la fin du nombre</td><td><i class="ct">quatre-vingt<em class="fx">s</em> ; deux cent<em class="fx">s</em> ; mais deux <em class="fx">cent</em> dix</i></td></tr>
<tr><td>mille</td><td>toujours <b>invariable</b></td><td><i class="ct">trois <em class="fx">mille</em></i></td></tr>
<tr><td>demi</td><td><b>invariable</b> devant le nom ; accord en genre après</td><td><i class="ct">une <em class="fx">demi</em>-heure ; une heure et demi<em class="fx">e</em></i></td></tr>
<tr><td>Adjectif employé comme adverbe</td><td><b>invariable</b></td><td><i class="ct">Ces livres coûtent <em class="fx">cher</em>.</i></td></tr>
</table></div></section>

<section><h2>La phrase</h2>
<div class="tw"><table>
<tr><th>Notion</th><th>Comment la reconnaître</th><th>Exemple</th></tr>
<tr><td>Phrase non verbale</td><td><b>aucun</b> verbe conjugué</td><td><i class="ct">Silence !</i></td></tr>
<tr><td>Phrase simple</td><td><b>un seul</b> verbe conjugué</td><td><i class="ct">Le chien <em class="fx">aboie</em>.</i></td></tr>
<tr><td>Phrase complexe</td><td><b>plusieurs</b> verbes conjugués, donc plusieurs propositions</td><td><i class="ct">Le chien <em class="fx">aboie</em> quand le facteur <em class="fx">arrive</em>.</i></td></tr>
<tr><td>Juxtaposition</td><td>propositions séparées par <b>une virgule, un point-virgule, deux-points</b></td><td><i class="ct">Il pleut<em class="fx">,</em> je reste.</i></td></tr>
<tr><td>Coordination</td><td><b>mais, ou, et, or, ni, car</b></td><td><i class="ct">Il pleut <em class="fx">mais</em> je sors.</i></td></tr>
<tr><td>Subordination</td><td>un <b>mot subordonnant</b> : <i class="ct">qui, que, quand, parce que…</i></td><td><i class="ct">Je reste <em class="fx">parce qu’</em>il pleut.</i></td></tr>
</table></div></section>

<section><h2>Les propositions subordonnées</h2>
<div class="tw"><table>
<tr><th>Subordonnée</th><th>Introduite par</th><th>Exemple</th></tr>
<tr><td>Relative</td><td>un <b>pronom relatif</b> : <i class="ct">qui, que, dont, où</i></td><td><i class="ct">Le livre <em class="fx">que</em> je lis est drôle.</i></td></tr>
<tr><td>Conjonctive complétive</td><td><b>que</b>, après un verbe</td><td><i class="ct">Je pense <em class="fx">qu’</em>il viendra.</i></td></tr>
<tr><td>Conjonctive circonstancielle</td><td><b>quand, parce que, pour que, si…</b></td><td><i class="ct">Je sors <em class="fx">quand</em> il fait beau.</i></td></tr>
<tr><td>Interrogative indirecte</td><td><b>si, qui, où, quand…</b> après <i class="ct">demander, savoir</i></td><td><i class="ct">Je me demande <em class="fx">s’</em>il viendra.</i></td></tr>
<tr><td>Participiale</td><td>un <b>participe</b> avec son <b>propre sujet</b> ; souvent <b>CC</b></td><td><i class="ct"><em class="fx">Le soleil couché</em>, nous rentrons.</i></td></tr>
<tr><td>Infinitive</td><td>un <b>infinitif</b> avec son <b>propre sujet</b>, après un verbe de perception (<i class="ct">voir, entendre, sentir…</i>) ; <b>COD</b></td><td><i class="ct">J’entends <em class="fx">les oiseaux chanter</em>.</i></td></tr>
</table></div></section>

<section><h2>L’interrogation indirecte</h2>
<p class="memo-lead">On garde la question, mais <b>sans point d’interrogation</b> et <b>sans inversion</b> du sujet.</p>
<div class="tw"><table>
<tr><th>Question directe</th><th>Transformée en question indirecte</th></tr>
<tr><td><i class="ct">« Viens-tu ? »</i></td><td><i class="ct">Il demande <em class="fx">si</em> tu viens.</i></td></tr>
<tr><td><i class="ct">« Qu’est-ce que tu fais ? »</i></td><td><i class="ct">Il demande <em class="fx">ce que</em> tu fais.</i></td></tr>
<tr><td><i class="ct">« Qu’est-ce qui se passe ? »</i></td><td><i class="ct">Il demande <em class="fx">ce qui</em> se passe.</i></td></tr>
<tr><td><i class="ct">« Où vas-tu ? »</i></td><td><i class="ct">Il demande <em class="fx">où</em> tu vas.</i></td></tr>
</table></div></section>

<section><h2>Les marques du temps (cycle 3)</h2>
<div class="tw"><table>
<tr><th>Temps</th><th>Marque</th><th>Exemple</th></tr>
<tr><td>Présent</td><td><b>aucune</b> marque de temps</td><td><i class="ct">je chante, nous chantons</i></td></tr>
<tr><td>Imparfait</td><td><b>-ai-</b> ou <b>-i-</b></td><td><i class="ct">je chant<em class="fx">ai</em>s, nous chant<em class="fx">i</em>ons</i></td></tr>
<tr><td>Futur</td><td><b>-r-</b></td><td><i class="ct">je chante<em class="fx">r</em>ai</i></td></tr>
<tr><td>Conditionnel présent</td><td><b>-r-</b> + <b>-ai-</b> ou <b>-i-</b></td><td><i class="ct">je chante<em class="fx">rai</em>s</i></td></tr>
<tr><td>Passé composé</td><td>auxiliaire <b>au présent</b> + participe passé</td><td><i class="ct">j’<em class="fx">ai</em> chanté</i></td></tr>
<tr><td>Plus-que-parfait</td><td>auxiliaire <b>à l’imparfait</b> + participe passé</td><td><i class="ct">j’<em class="fx">avais</em> chanté</i></td></tr>
</table></div>
<p class="memo-note">Marques de <b>personne</b> : <b>-e, -s, -x</b> (je) ; <b>-s, -x</b> (tu) ; <b>-e, -t, -d, -a</b> (il) ; <b>-ons</b> (nous) ; <b>-ez</b> (vous) ; <b>-nt</b> (ils).</p></section>

<section><h2>FLE · FLS : l’essentiel</h2>
<div class="tw"><table>
<tr><th>Point</th><th>Exemple</th></tr>
<tr><td>Les articles</td><td><i class="ct"><em class="fx">le</em> chat, <em class="fx">une</em> pomme, <em class="fx">du</em> pain</i></td></tr>
<tr><td>Après la négation : <b>de</b></td><td><i class="ct">J’ai <em class="fx">un</em> chien. → Je n’ai pas <em class="fx">de</em> chien.</i></td></tr>
<tr><td>L’âge, la faim : <b>avoir</b></td><td><i class="ct">J’<em class="fx">ai</em> douze ans. J’<em class="fx">ai</em> faim.</i></td></tr>
<tr><td>Passé composé avec <b>être</b> : <i class="ct">aller, venir, partir, arriver…</i></td><td><i class="ct">Elle <em class="fx">est</em> partie.</i></td></tr>
<tr><td>Les lieux : <b>à</b> + ville, <b>en</b> ou <b>au</b> + pays</td><td><i class="ct">J’habite <em class="fx">à</em> Paris, <em class="fx">en</em> France, <em class="fx">au</em> Maroc.</i></td></tr>
</table></div></section>

<section><h2>La négation</h2>
<div class="tw"><table>
<tr><th>Négation</th><th>À la forme négative</th><th>À la forme affirmative</th></tr>
<tr><td>Négation totale</td><td><i class="ct">Il <em class="fx">ne</em> mange <em class="fx">pas</em>.</i></td><td><i class="ct">Il mange.</i></td></tr>
<tr><td>Négation partielle</td><td><i class="ct">Il <em class="fx">ne</em> vient <em class="fx">jamais</em>.</i><br><i class="ct">Il <em class="fx">n’</em>a <em class="fx">plus</em> faim.</i><br><i class="ct">Il <em class="fx">ne</em> voit <em class="fx">personne</em>.</i><br><i class="ct">Il <em class="fx">ne</em> voit <em class="fx">rien</em>.</i></td><td><i class="ct">Il vient <em class="fx">toujours</em>.</i><br><i class="ct">Il a <em class="fx">encore</em> faim.</i><br><i class="ct">Il voit <em class="fx">quelqu’un</em>.</i><br><i class="ct">Il voit <em class="fx">quelque chose</em>.</i></td></tr>
<tr><td>Négation lexicale</td><td><i class="ct">C’est <em class="fx">il</em>lisible.</i></td><td><i class="ct">C’est <em class="fx">lisible</em>.</i></td></tr>
</table></div>
<p class="memo-note"><b>Totale</b> : toute la phrase est niée (<i class="ct">ne… pas</i>). <b>Partielle</b> : seulement une partie (<i class="ct">ne… jamais, plus, personne, rien, aucun</i>). <b>Lexicale</b> : un préfixe suffit (<i class="ct"><em class="fx">in</em>connu, <em class="fx">mé</em>content</i>).</p>
<p class="memo-note">Pas des négations : la <b>restriction</b> <i class="ct">Il <em class="fx">ne</em> lit <em class="fx">que</em> des BD.</i> (il lit <b>seulement</b> des BD) et le <b><i>ne</i> explétif</b> <i class="ct">Je crains qu’il <em class="fx">ne</em> vienne.</i> (il peut venir).</p></section>

<section><h2>La formation des mots</h2>
<div class="tw"><table>
<tr><th>Procédé</th><th>Principe</th><th>Mot de départ</th><th>Mot formé</th></tr>
<tr><td>Dérivation préfixale</td><td>on ajoute un <b>préfixe</b></td><td><i class="ct">faire</i></td><td><i class="ct"><em class="fx">dé</em>faire</i></td></tr>
<tr><td>Dérivation suffixale</td><td>on ajoute un <b>suffixe</b></td><td><i class="ct">lent</i></td><td><i class="ct">lente<em class="fx">ment</em></i></td></tr>
<tr><td>Dérivation parasynthétique</td><td>préfixe et suffixe ajoutés <b>ensemble</b></td><td><i class="ct">col</i></td><td><i class="ct"><em class="fx">en</em>col<em class="fx">ure</em></i></td></tr>
<tr><td>Dérivation régressive</td><td>on <b>enlève</b> la fin</td><td><i class="ct">refuser</i></td><td><i class="ct"><em class="fx">refus</em></i></td></tr>
<tr><td>Conversion</td><td>le mot <b>change de classe</b>, pas de forme</td><td><i class="ct">rire (verbe)</i></td><td><i class="ct"><em class="fx">le</em> rire (nom)</i></td></tr>
<tr><td>Composition</td><td>on <b>assemble</b> deux mots</td><td><i class="ct">chou + fleur</i></td><td><i class="ct">chou-fleur</i></td></tr>
<tr><td>Troncation</td><td>on <b>raccourcit</b> le mot</td><td><i class="ct">métropolitain</i></td><td><i class="ct">métro</i></td></tr>
<tr><td>Siglaison</td><td>on garde les <b>initiales</b></td><td><i class="ct">Société nationale des chemins de fer français</i></td><td><i class="ct">SNCF</i></td></tr>
<tr><td>Mot-valise</td><td>on <b>fusionne</b> deux mots</td><td><i class="ct">courrier + électronique</i></td><td><i class="ct">courriel</i></td></tr>
<tr><td>Emprunt</td><td>on prend un mot <b>étranger</b></td><td><i class="ct"><i>pizza</i> (italien)</i></td><td><i class="ct">une pizza</i></td></tr>
<tr><td>Calque</td><td>on <b>traduit</b> mot à mot</td><td><i class="ct"><i>skyscraper</i> (anglais)</i></td><td><i class="ct">gratte-ciel</i></td></tr>
</table></div>
<p class="memo-note">Le préfixe <i class="ct">in-</i> devient <i class="ct"><em class="fx">im</em>-</i> devant <b>m, b, p</b> (<i class="ct"><em class="fx">im</em>possible</i>), <i class="ct"><em class="fx">il</em>-</i> devant <b>l</b>, <i class="ct"><em class="fx">ir</em>-</i> devant <b>r</b>.</p>
<p class="memo-note">La désinence de l’infinitif (<i class="ct">-er, -ir</i>) <b>n’est pas considérée comme un suffixe</b>.</p></section>

    if (m && ech(m[1])) { const e = ech(m[1]); return { id, e, niveau: null, k: 7, c: EXPERT, notions: 'Les quatre niveaux mélangés, de la 6ᵉ à la 3ᵉ', nom: 'Expert', nomComplet: 'Expert de ' + e.nom.toLowerCase(), n: 20, seuil: 16 }; }

  }
  const ids = (e, n) => COULEURS.map(c => `${e}-${n}-${c[0]}`);
  const etat = id => (C[id] && C[id].etat) || '';
  const obtenue = id => etat(id) === 'reussie' || etat(id) === 'validee';
  const compte = (e, n) => ids(e, n).filter(obtenue).length;
  const dispo = id => !!BANQUES[id];
  function prochaine(n) {
    let best = null;
    for (const e of ['conjugaison', 'grammaire', 'orthographe', 'homophones', 'vocabulaire']) {
      const id = ids(e, n).find(x => !obtenue(x));
      if (id && dispo(id)) return ceinture(id);

  }

  /* ===================== Banques de questions ===================== */
  /* Conjugaison 6ᵉ : questions fabriquées à partir des tables de conjugaison (verbes sans particularité orthographique). */
  const PERS = [['je'], ['tu'], ['il', 'elle'], ['nous'], ['vous'], ['ils', 'elles']];
  const ER = ['chanter', 'parler', 'jouer', 'regarder', 'aimer', 'danser', 'marcher', 'porter', 'donner', 'écouter', 'travailler', 'arriver', 'trouver', 'penser', 'habiter', 'rester', 'chercher', 'entrer', 'tomber', 'demander', 'montrer', 'raconter'];

    finir: ['finis', 'finis', 'finit', 'finissons', 'finissez', 'finissent'], partir: ['pars', 'pars', 'part', 'partons', 'partez', 'partent']

  const IRR = ['aller', 'faire', 'dire', 'venir', 'pouvoir', 'vouloir', 'prendre', 'voir', 'savoir', 'devoir', 'finir', 'partir'];

  const PP = { être: 'été', avoir: 'eu', faire: 'fait', dire: 'dit', pouvoir: 'pu', vouloir: 'voulu', prendre: 'pris', voir: 'vu', savoir: 'su', devoir: 'dû', finir: 'fini', aller: 'allé', venir: 'venu', partir: 'parti' };
  const AVEC_ETRE = ['aller', 'venir', 'partir', 'arriver', 'entrer', 'tomber', 'rester'];
  const T_PRES = ['e', 'es', 'e', 'ons', 'ez', 'ent'], T_IMP = ['ais', 'ais', 'ait', 'ions', 'iez', 'aient'], T_FUT = ['ai', 'as', 'a', 'ons', 'ez', 'ont'];
  const present = v => PRES[v] || T_PRES.map(t => v.slice(0, -2) + t);
  const imparfait = v => { const r = v === 'être' ? 'ét' : present(v)[3].replace(/ons$/, ''); return T_IMP.map(t => r + t); };

  /* Passé composé : formes admises pour chaque personne (accord avec être selon le pronom ; je/tu/nous/vous : les deux genres) */
  function passeCompose(v, pron) {

      if (!etre) return [aux[i] + ' ' + p];

      return pl ? [aux[i] + ' ' + p + 's', aux[i] + ' ' + p + 'es'].concat(i === 4 ? [aux[i] + ' ' + p, aux[i] + ' ' + p + 'e'] : []) : [aux[i] + ' ' + p, aux[i] + ' ' + p + 'e'];

  const elide = (pron, forme) => pron === 'je' && /^[aeéèêiouyh]/i.test(forme) ? 'j’' : pron + ' ';

  const tableau = (v, t) => { const f = t === 'pc' ? passeCompose(v, 'il').map(x => x[0]) : TEMPS[t][1](v); return PERS.map((p, i) => elide(p[0], f[i]) + f[i]).join(', '); };
  const REGLE = {

    imparfait: v => `À l’imparfait, on part du radical de <i>nous</i> au présent${v === 'être' ? ' (sauf <i>être</i>, radical <i>ét-</i>)' : ''} et on ajoute <b>-ais, -ais, -ait, -ions, -iez, -aient</b>${NB}: ${tableau(v, 'imparfait')}.`,

        return `<h4 class="bg-h bg-sous">${esc(c)} <span>${k}/${l.length}</span></h4>` + grille(l.map(b => { const g = eus[b.id]; return g ? it(g, true, g.date, g.n) : it(b, false); })); }).join('');
      const T = (K.trophees || []).length ? K.trophees : Object.values(tro);
      if (T.length) h += `<h4 class="bg-h bg-sous">Trophées du Cahier <span>${T.filter(b => tro[b.id]).length}/${T.length}</span></h4>` + grille(T.map(b => it(tro[b.id] || b, !!tro[b.id], '', 0)));
    } else if (C && (C.badges || []).length + (C.trophees || []).length) {
      /* Cahier pas encore mis à jour (pas de catalogue) : seulement les badges obtenus */
      const cats = [...new Set(C.badges.map(b => b.cat || 'Badges'))];
      h += `<h3 class="bg-h pp-h">Badges du Cahier de suivi <span>${C.dif}${NB}différent${C.dif > 1 ? 's' : ''}${resume}</span></h3>`;
      h += grille(cats.flatMap(c => C.badges.filter(b => (b.cat || 'Badges') === c).map(b => it(b, true, b.date, b.n))).concat((C.trophees || []).map(b => it(b, true, '', 0))));
    } else h += `<h3 class="bg-h pp-h">Badges du Cahier de suivi</h3><p class="small">Pas encore de badge du Cahier de suivi ici. Ils apparaîtront quand ton professeur t’en donnera.</p>`;
    z.innerHTML = `<p class="small pp-leg">Les badges en couleur sont obtenus${NB}; les gris sont encore à gagner.</p>` + h;
  }
  /* ---------- démarrage ---------- */
  function demarrer() {
    LABO.start(); entete();
    if (!compte) return;
    document.addEventListener('labo:vue', ev => { if (ev.detail === 'badges') remplirBadges(); });
    if (location.hash === '#badges') remplirBadges();
    window.addEventListener('labo-save', bientot);
    window.addEventListener('focus', bientot);
    window.addEventListener('pageshow', bientot);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') envoyer(true); });
    setInterval(envoyer, 15000);
    appel('charger', { jeton: compte.jeton }).then(d => { appliquer(d.etat); pastille('ok'); envoyer(); })
      .catch(err => { if (err.status === 401) deconnexion(true); else pastille('horsligne'); });
  }
  function start() {
    if (!API) return LABO.start();
    let invite = false; try { invite = sessionStorage.getItem('labo.invite') === '1'; } catch (e) { }
    if (compte || invite) return demarrer();
    const L = lire(KL) || {};
    if (L.dys) document.documentElement.classList.add('dys');
    if (L.theme) document.documentElement.setAttribute('data-theme', L.theme);
    etapeClasse();
  }
  /* Page des flashcards : envoi discret des scores */
  function satellite() {
    if (!API || !compte) return;
    dernier = ''; /* premier envoi à chaque ouverture : les séries faites avant la connexion partent aussi */
    /* progression faite sur un autre appareil : on la récupère, puis on recharge une fois pour que l'appli la montre */
    appel('charger', { jeton: compte.jeton }).then(d => {
      const avant = JSON.stringify(lire(KF) || {}); appliquer(d.etat);
      let fait = false; try { fait = sessionStorage.getItem('labo.recharge') === '1'; } catch (e) { }
      if (JSON.stringify(lire(KF) || {}) !== avant && !fait) { try { sessionStorage.setItem('labo.recharge', '1'); } catch (e) { } location.reload(); }
      else envoyer();
    }).catch(err => { if (err.status === 401) { localStorage.removeItem(KC); } });
    setInterval(envoyer, 5000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') envoyer(true); });
    window.addEventListener('pagehide', () => envoyer(true));
  }
  return { start, satellite, deconnexion };
})();

LABO_SYNC.start();
</script>
