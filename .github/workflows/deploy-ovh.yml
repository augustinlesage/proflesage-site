# Publie le site sur l'hébergement OVH (dossier www) par FTP à chaque envoi sur main.
# Secrets à créer dans Settings → Secrets and variables → Actions :
#   FTP_SERVER (ex. ftp.cluster0XX.hosting.ovh.net), FTP_USERNAME, FTP_PASSWORD
name: Publier sur OVH

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ovh
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Envoi FTP vers www/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: ./www/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
